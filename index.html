<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ML Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Nunito:wght@500;600;700;800&family=Noto+Sans+Telugu:wght@400;600;700&family=Playfair+Display:wght@600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
/* Layout idea: a playful journey. Home is a map of 24 level cards led by Bolt the robot; each level is one calm scroll: imagine, play, go deeper, real world. */
:root{
  --bg:#F3F6FF;--panel:#FFFFFF;--ink:#1B2340;--muted:#55608A;--line:#D3DAF0;--grid:#E2E8F7;
  --accent:#3447E8;--accent-ink:#FFFFFF;--warn:#B85F00;--ok:#0B8F63;--bad:#D6336C;
  --c0:#3D5AFE;--c1:#F26B0F;--c2:#0E9384;
  --sun:#FFC83D;--sunbg:#FFF0BD;--coral:#FF6B57;--coralbg:#FFE0D9;--mint:#19B88F;--mintbg:#D3F4E8;--sky:#3D8BFF;--skybg:#D8E7FF;
  --head:'Fredoka','Trebuchet MS',system-ui,sans-serif;--body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1226;--panel:#171D3A;--ink:#ECEFFF;--muted:#A3ADD3;--line:#2C3668;--grid:#222B55;
  --accent:#92A5FF;--accent-ink:#0E1226;--warn:#FFB454;--ok:#3DD9A0;--bad:#FF7BA8;
  --c0:#7C93FF;--c1:#FF9A4D;--c2:#3DD9C0;
  --sunbg:#3B3214;--coralbg:#43211F;--mintbg:#133A33;--skybg:#19305F;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1226;--panel:#171D3A;--ink:#ECEFFF;--muted:#A3ADD3;--line:#2C3668;--grid:#222B55;
  --accent:#92A5FF;--accent-ink:#0E1226;--warn:#FFB454;--ok:#3DD9A0;--bad:#FF7BA8;
  --c0:#7C93FF;--c1:#FF9A4D;--c2:#3DD9C0;
  --sunbg:#3B3214;--coralbg:#43211F;--mintbg:#133A33;--skybg:#19305F;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:500 17px/1.6 var(--body);-webkit-text-size-adjust:100%;overflow-x:hidden}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:0 120px;position:relative}
h1,h2,h3{font-family:var(--head);font-weight:600;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(36px,8.5vw,62px)}
h2{font-size:clamp(24px,5vw,31px);margin-bottom:12px}
h3{font-size:20px}
p{margin:0 0 12px;max-width:66ch}
a{color:var(--accent);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-block:10px 8px;border-bottom:2px solid var(--line);margin-bottom:18px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font:600 24px var(--head);min-height:44px}
.brand svg{width:34px;height:40px}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:99px;background:var(--panel);border:2px solid var(--line);font:700 14px var(--body);color:var(--ink);text-decoration:none}
.pill svg{width:18px;height:18px}
.snav{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.snav::-webkit-scrollbar{display:none}
.snav button{flex:none;min-height:40px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:700 14px var(--body);cursor:pointer}
.snav button:hover{border-color:var(--t,var(--accent))}

/* star icon */
.st{fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linejoin:round}
.st.on{fill:var(--sun);stroke:var(--ink)}

/* hero */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:center;padding-block:14px 8px}
.hero>*{min-width:0}
.lede{font-size:19px;color:var(--muted);margin-top:12px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.mascot{display:grid;justify-items:center;gap:6px;position:relative}
.mascot .bolt{width:min(100%,250px);height:auto}
.bubble{position:relative;background:var(--panel);border:3px solid var(--ink);border-radius:20px;padding:10px 14px;font:700 16px/1.35 var(--body);max-width:260px;text-align:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-13px;width:20px;height:20px;background:var(--panel);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.shape{position:absolute;pointer-events:none;opacity:.55;animation:drift 9s ease-in-out infinite}
.shape.a{width:26px;height:26px;border-radius:50%;background:var(--sun);top:6%;right:46%}
.shape.b{width:20px;height:20px;background:var(--coral);border-radius:5px;top:70%;left:-4px;animation-delay:-3s}
.shape.c{width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:22px solid var(--mint);top:8%;right:2%;animation-delay:-5s}
.shape.d{width:16px;height:16px;border-radius:50%;background:var(--sky);bottom:4%;right:40%;animation-delay:-7s}
.trail{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;align-items:center}
.trail i{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);background:var(--panel)}
.trail i.on{background:var(--sun)}
.trailnote{font:700 14px var(--body);color:var(--muted);margin:6px 0 0}

/* buttons */
.btn{min-height:46px;padding:0 20px;border-radius:99px;border:3px solid var(--ink);background:var(--panel);color:var(--ink);font:700 16px var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--sun);color:#1B2340}
.btn.on{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.55;cursor:default}
.btn.small{min-height:40px;padding:0 14px;font-size:14px;box-shadow:0 3px 0 var(--ink)}

/* sections */
.sec{margin-top:44px;scroll-margin-top:130px}
.kick{font:700 13px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px}
.lvl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:14px;border-radius:22px;background:var(--panel);border:3px solid var(--line);color:var(--ink);text-decoration:none;font-weight:500;transition:transform .15s,border-color .15s;min-width:0}
.lvl:hover{transform:translateY(-4px) rotate(-.5deg);border-color:var(--t)}
.lvl .num{width:48px;height:48px;border-radius:16px;background:var(--tb);border:3px solid var(--ink);display:grid;place-items:center;font:600 24px var(--head)}
.lvl .lt{display:grid;gap:0;min-width:0}
.lvl .lt b{font:600 19px/1.15 var(--head)}
.lvl .lt i{font-style:normal;font-size:13px;color:var(--muted);font-weight:700}
.lvl p{grid-column:1/-1;font-size:15px;color:var(--muted);margin:6px 0 0;line-height:1.45}
.lvl .tag{grid-column:1/-1;display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.chip{font:700 12px var(--body);padding:3px 10px;border-radius:99px;background:var(--grid);color:var(--ink)}
.chip.done{background:var(--mintbg);color:var(--ink)}
.lvl svg{width:22px;height:22px;margin-left:auto}
.pocket{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:14px}
.pk{background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:14px;min-width:0}
.pk h3{font-size:18px;margin-bottom:4px}
.pk p{font-size:15px;color:var(--muted);margin:0 0 8px}
.pk .chips{display:flex;gap:6px;flex-wrap:wrap}
.pk a.chip{text-decoration:none;background:var(--skybg);color:var(--ink);min-height:30px;display:inline-flex;align-items:center}
.quizcta{margin-top:44px;padding:20px;border-radius:26px;background:var(--sunbg);border:3px solid var(--ink);display:grid;gap:10px;justify-items:start}
.foot{margin-top:40px;color:var(--muted);font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* lesson */
.crumb{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;font-weight:800}
.lhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;margin-top:6px}
.lbadge{display:inline-flex;gap:8px;align-items:center;font:700 14px var(--body);background:var(--tb);border:3px solid var(--ink);border-radius:99px;padding:4px 14px;margin-bottom:10px}
.lsub{font:700 16px var(--body);color:var(--muted);margin:8px 0 0}
.lhook{font-size:19px;margin:10px 0 0}
.lhead .bolt{width:110px;height:auto}
.callout{background:var(--tb,var(--skybg));border:3px solid var(--ink);border-radius:20px;padding:14px 16px;margin:16px 0}
.callout ul{margin:8px 0 0;padding-left:22px}
.callout>:last-child{margin-bottom:0}
.kid h3{margin:0 0 6px}
.kid ul,.kid ol{padding-left:22px;margin:0 0 12px;max-width:66ch}
.look{color:var(--muted);font-size:16px;margin:0 0 12px}
ol.tries{list-style:none;counter-reset:t;padding:0;margin:14px 0 0;display:grid;gap:8px;max-width:66ch}
ol.tries li{counter-increment:t;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start}
ol.tries li::before{content:counter(t);width:34px;height:34px;border-radius:50%;background:var(--tb,var(--sunbg));border:3px solid var(--ink);display:grid;place-items:center;font:600 17px var(--head)}
details.deep{border:3px solid var(--line);border-radius:20px;background:var(--panel);padding:0 16px}
details.deep[open]{border-color:var(--ink)}
details.deep>summary{cursor:pointer;min-height:56px;display:flex;align-items:center;gap:10px;font:600 20px var(--head);list-style:none}
details.deep>summary::-webkit-details-marker{display:none}
details.deep>summary::before{content:"+";display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sun);color:#1B2340;border:3px solid var(--ink);font:700 20px/1 var(--head)}
details.deep[open]>summary::before{content:"-"}
.deepbody{padding:4px 0 18px}
.deepbody h2{font-size:24px;margin:26px 0 8px}
.deepbody h2:first-child{margin-top:8px}
.deepbody ul,.deepbody ol{padding-left:22px;margin:0 0 14px;max-width:66ch}
.deepbody li{margin-bottom:6px}
.deepbody code,.prose code{font:500 .88em var(--mono);background:var(--grid);border-radius:6px;padding:1px 5px}
.math{font:500 14px/1.65 var(--mono);background:var(--grid);border-radius:14px;padding:10px 14px;margin:0 0 14px;overflow-x:auto;white-space:pre}
.eg{border:2px solid var(--line);border-radius:14px;padding:8px 12px;margin:0 0 14px;overflow-x:auto;background:var(--bg)}
.eg table{border-collapse:collapse;font:500 14px/1.5 var(--mono)}
.eg th,.eg td{padding:4px 16px 4px 0;text-align:left;vertical-align:top;white-space:nowrap}
.eg th{color:var(--muted);font-weight:700}
dl.terms{margin:0}dl.terms dt{font-weight:800;margin-top:10px}dl.terms dd{margin:2px 0 0;color:var(--muted)}
.vs{display:grid;gap:12px;margin-top:12px}
.vsrow{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:stretch}
.vsrow>*{min-width:0}
.vsrow .area{font:600 18px/1.2 var(--head);padding-top:10px}
.vsrow .then,.vsrow .now{border-radius:16px;padding:10px 12px;font-size:15px;line-height:1.45;border:2px solid var(--line);background:var(--panel)}
.vsrow .now{background:var(--tb);border-color:var(--ink)}
.vsrow .lab{display:block;font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.vsnote{font-size:14px;color:var(--muted);margin-top:12px}
.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.words div{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.45}
.words b{display:block;font:600 17px var(--head)}
.done{margin-top:44px;padding:20px;border-radius:26px;background:var(--tb);border:3px solid var(--ink);display:grid;gap:12px;justify-items:start}
.done .row2{display:flex;gap:10px;flex-wrap:wrap}

/* demos (shared) */
.stage{background:var(--panel);border:3px solid var(--line);border-radius:20px;overflow:hidden}
.stage.pad{padding:14px 16px}
canvas.cv{display:block;width:100%;touch-action:manipulation}
.ctl{display:grid;gap:14px;margin:14px 0}
.row{display:flex;flex-wrap:wrap;gap:10px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.sl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:center;font-size:15px;font-weight:700}
.sl span{color:var(--muted)}
.sl output{font:600 14px var(--mono)}
.sl input{grid-column:1/-1;width:100%;accent-color:var(--accent);height:36px;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:12px 0}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 10px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.stat b{font:600 15px var(--mono);overflow-wrap:anywhere}
.task{border:3px dashed var(--warn);border-radius:20px;padding:14px 16px;margin-top:18px;background:var(--panel)}
.task h3{margin-bottom:4px}
.task .btn{margin-top:8px}
.res{margin:10px 0 0;font-size:15px;font-weight:700}
.res.ok{color:var(--ok)}
.res.no{color:var(--muted)}
.fb{font-size:15px;max-width:66ch}
.report{display:flex;align-items:center;gap:12px;margin:12px 0;font-weight:800}
.meter{flex:1;height:20px;border-radius:99px;background:var(--grid);overflow:hidden;border:2px solid var(--line)}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s}
.report b{min-width:104px;text-align:right}
.cm{width:100%;border-collapse:collapse;font-size:14px}
.cm td,.cm th{border:2px solid var(--line);padding:8px;text-align:center;font-weight:700}
.cm td{font-family:var(--mono)}
.cm .g{background:var(--mintbg)}.cm .r{background:var(--coralbg)}
.story{font:600 24px/1.35 var(--head);min-height:66px;margin:0 0 8px}
.caret{animation:caret 1s steps(1) infinite;color:var(--accent)}
.cands{display:grid;gap:8px}
.cand{position:relative;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:48px;padding:10px 14px;border-radius:14px;border:3px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;overflow:hidden;font:700 16px var(--body);text-align:left}
.cand:hover{border-color:var(--ink)}
.cand .bar{position:absolute;left:0;top:0;bottom:0;background:var(--skybg);z-index:0}
.cand .w,.cand .pc{position:relative;z-index:1}
.kernwrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:15px}
.kern{display:inline-grid;gap:4px;font:600 15px var(--mono)}
.kern span{display:flex;gap:4px}
.kern b{min-width:44px;text-align:center;padding:4px 6px;border-radius:8px;background:var(--panel);border:2px solid var(--line)}

/* code lab (reused) */
.prose p,.prose li{max-width:66ch}
.prose ol{padding-left:22px}
.prose h2{font-size:22px;margin:16px 0 8px}
textarea.ed{display:block;width:100%;font:500 15px/1.5 var(--mono);background:var(--bg);color:var(--ink);border:3px solid var(--line);border-radius:14px;padding:12px;white-space:pre;overflow:auto;resize:vertical;tab-size:2}
pre.out{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px;font:500 14px/1.5 var(--mono);min-height:56px;max-height:340px;overflow:auto;white-space:pre-wrap;margin:8px 0 0}
pre.code{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px;overflow-x:auto;font:500 13px/1.55 var(--mono);margin:0}
.plots{margin-top:10px}
.codelab details{border-top:2px solid var(--line);padding:6px 0}
.codelab summary{cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center}

/* quiz */
.track{position:relative;height:16px;border-radius:99px;background:var(--grid);border:2px solid var(--line);margin:30px 0 20px}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--mint);transition:width .4s}
.track .rider{position:absolute;top:-30px;width:34px;transform:translateX(-50%);transition:left .4s}
.qcard{background:var(--panel);border:3px solid var(--ink);border-radius:24px;padding:18px}
.qcard h2{font-size:clamp(21px,4.6vw,27px);margin:6px 0 14px;max-width:30em}
.opts{display:grid;gap:10px}
.opt{text-align:left;min-height:50px;padding:10px 16px;border-radius:16px;border:3px solid var(--line);background:var(--bg);color:var(--ink);font:700 16px/1.4 var(--body);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--mintbg)}
.opt.wrong{border-color:var(--bad);background:var(--coralbg)}
.opt:disabled{cursor:default}
.explain{margin:14px 0 0;padding:12px 14px;border-radius:16px;background:var(--tb,var(--skybg));font-size:16px}
.result{text-align:center;display:grid;gap:12px;justify-items:center}
.result .big{font:600 clamp(44px,12vw,80px)/1 var(--head)}
.result .stars{display:flex;gap:8px}
.result .stars svg{width:48px;height:48px}
.missed{display:grid;gap:8px;justify-items:start;text-align:left;width:100%;max-width:520px}
.next{padding-left:20px;margin:0;text-align:left;max-width:520px}
.next li{margin-bottom:6px}

/* helper bolt (fixed) */
.helper{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:8px;z-index:20;max-width:calc(100vw - 24px);pointer-events:none}
.helper .say{pointer-events:none;background:var(--panel);border:3px solid var(--ink);border-radius:18px 18px 4px 18px;padding:8px 12px;font:700 15px/1.35 var(--body);max-width:240px;opacity:0;transform:translateY(8px) scale(.96);transition:opacity .25s,transform .25s}
.helper .say.on{opacity:1;transform:none}
.helper button{pointer-events:auto;border:0;background:none;padding:0;cursor:pointer;width:64px;min-height:44px;flex:none}
.helper button .bolt{width:64px;height:auto;display:block}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

/* mascot */
.bolt{overflow:visible}
.bolt .float{animation:bob 3s ease-in-out infinite}
.bolt .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.bolt .wave{transform-box:view-box;transform-origin:108px 110px;animation:wave 1.8s ease-in-out infinite}
.bolt .ant{animation:glow 2s ease-in-out infinite}
.bolt[data-mood="happy"] .m-oops{display:none}
.bolt[data-mood="oops"] .m-happy{display:none}
.bolt.cheer .wave{animation-duration:.45s}
.bolt.cheer .float{animation:hop .5s ease-in-out 3}
.bolt.nod .float{animation:shake .5s ease-in-out 1}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-58deg)}}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(10px,-14px) rotate(25deg)}}
@keyframes caret{0%,50%{opacity:1}51%,100%{opacity:0}}
@media (max-width:640px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .mascot{order:-1}.mascot .bolt{width:min(60%,190px)}
  .vsrow{grid-template-columns:minmax(0,1fr)}
