const DERIV={
gd:`<h3>Worked derivation: one weight, by hand</h3>
<p>Fit y = w x to two points, (1, 2) and (2, 3), with the loss L(w) = (1/2) * mean of (w x - y)^2.</p>
<div class="math">L(w) = (1/4) [ (w - 2)^2 + (2w - 3)^2 ]
dL/dw = (1/4) [ 2(w - 2) + 4(2w - 3) ] = (1/4)(10w - 16) = 2.5 w - 4
best w: 2.5 w - 4 = 0  ->  w = 1.6</div>
<p>Take learning rate 0.2 and start at w = 0. The update is w = w - 0.2 * (2.5 w - 4) = 0.5 w + 0.8.</p>
<div class="math">step 1:  w = 0.8      (distance to 1.6: 0.8)
step 2:  w = 1.2      (0.4)
step 3:  w = 1.4      (0.2)</div>
<p>The distance halves every step because the factor is 1 - lr * 2.5 = 0.5. With lr = 0.8 the factor would be -1 and the weight would bounce forever; above that it diverges. That is the stability limit for a quadratic loss: lr < 2 / curvature.</p>`,
logreg:`<h3>Worked derivation: the gradient of logistic loss</h3>
<div class="math">p = sigmoid(z) = 1 / (1 + e^-z),   sigmoid'(z) = p (1 - p)
L = -[ y ln p + (1 - y) ln(1 - p) ]
dL/dp = -y/p + (1 - y)/(1 - p)
dL/dz = dL/dp * p (1 - p) = -y (1 - p) + (1 - y) p = p - y</div>
<p>The messy terms cancel and the gradient is simply "prediction minus truth". Then dL/dw = (p - y) x and dL/db = p - y.</p>
<p><b>Numbers.</b> x = 2, w = 0.5, b = 0, y = 1. Then z = 1, p = 0.731 and dL/dz = -0.269. The weight gradient is -0.269 * 2 = -0.538, so with learning rate 0.5 the new weight is 0.5 + 0.269 = 0.769. The prediction for this example rises to sigmoid(1.54) = 0.82.</p>`,
reg:`<h3>Worked derivation: ridge shrinks, lasso zeroes</h3>
<p>One weight, data (1, 2) and (2, 3), so sum(xy) = 8 and sum(x^2) = 5.</p>
<div class="math">ridge:  J(w) = sum (y - w x)^2 + lambda w^2
dJ/dw = -2 sum x (y - w x) + 2 lambda w = 0
w = sum(xy) / ( sum(x^2) + lambda ) = 8 / (5 + lambda)</div>
<p>lambda = 0 gives 1.6, lambda = 5 gives 0.8, lambda = 15 gives 0.4. The weight shrinks by the factor 5 / (5 + lambda) but is never exactly zero.</p>
<div class="math">lasso:  J(w) = (1/2) sum (y - w x)^2 + lambda |w|
solution:  w = sign(r) * max(0, |r| - lambda) / sum(x^2),   r = sum(xy) = 8</div>
<p>With lambda = 3: w = (8 - 3) / 5 = 1.0. With lambda = 8 or more, w = 0 exactly. The kink in |w| at zero is what lets lasso land on zero.</p>`,
bp:`<h3>Worked derivation: backprop on a two-weight chain</h3>
<p>Network: a = w1 x, z = w2 a, loss L = (1/2)(z - y)^2. Take x = 1, w1 = 2, w2 = 3, y = 5.</p>
<div class="math">forward:   a = 2,  z = 6,  L = 0.5
backward:  dL/dz  = z - y = 1
           dL/dw2 = dL/dz * a  = 1 * 2 = 2
           dL/da  = dL/dz * w2 = 1 * 3 = 3
           dL/dw1 = dL/da * x  = 3 * 1 = 3</div>
<p><b>Check by nudging.</b> Set w1 = 2.001. Then a = 2.001, z = 6.003 and L = 0.5 * 1.003^2 = 0.503005. The change is 0.003005, so the slope is 3.005, which matches 3. This is the gradient check from the demo.</p>
<p>With a tanh in the middle, a = tanh(w1 x), the only change is one extra factor: dL/dw1 = dL/da * (1 - a^2) * x.</p>`,
info:`<h3>Worked derivation: the softmax cross-entropy gradient</h3>
<div class="math">p_i = e^(z_i) / sum_j e^(z_j)          dp_i/dz_j = p_i (delta_ij - p_j)
L = -ln p_k                            (k is the true class)
dL/dz_j = -(1/p_k) * p_k (delta_kj - p_j) = p_j - delta_kj</div>
<p><b>Numbers.</b> Scores z = (2, 1, 0): e^2 = 7.389, e^1 = 2.718, e^0 = 1, sum = 11.107. So p = (0.665, 0.245, 0.090). If class 0 is correct, L = -ln 0.665 = 0.408 and the gradient is p minus the one-hot truth = (-0.335, 0.245, 0.090).</p>
<p>The wrong classes are pushed down in proportion to the probability they were given, and the right class is pushed up by exactly the missing probability. If the model were certain and right, the gradient would be zero.</p>`,
attn:`<h3>Worked derivation: one attention head with numbers</h3>
<p>One query q = (1, 0). Two keys k1 = (1, 0), k2 = (0, 1). Two values v1 = (10, 0), v2 = (0, 10). Key size d = 2.</p>
<div class="math">scores = ( q.k1, q.k2 ) / sqrt(2) = (0.707, 0)
softmax: e^0.707 = 2.028 and e^0 = 1, so weights = (0.670, 0.330)
output = 0.670 * v1 + 0.330 * v2 = (6.70, 3.30)</div>
<p>Without the scaling the scores would be (1, 0) and the weights (0.731, 0.269): sharper.</p>
<p><b>Why divide by the square root of d?</b> If the entries of q and k are independent with variance 1, then q.k is a sum of d products and has variance d. Dividing by sqrt(d) restores variance 1, which keeps softmax from saturating (one weight near 1, gradients near 0) as the head size grows.</p>`,
pca:`<h3>Worked derivation: the first principal component</h3>
<p>Four centred points: (2, 2), (-2, -2), (1, -1), (-1, 1).</p>
<div class="math">C = (1/4) sum x x^T = [ 2.5  1.5 ; 1.5  2.5 ]</div>
<p>Maximise the variance w^T C w along a unit direction w. With a Lagrange multiplier for |w| = 1, setting the derivative to zero gives C w = lambda w, so w is an eigenvector and lambda is the variance along it.</p>
<div class="math">det(C - lambda I) = (2.5 - lambda)^2 - 1.5^2 = 0   ->   lambda = 4 or 1
lambda = 4:  w = (1, 1)/sqrt(2)      lambda = 1:  w = (1, -1)/sqrt(2)</div>
<p>The first component explains 4 / (4 + 1) = 80% of the variance. Projecting (2, 2) onto it gives 2.83, and (1, -1) gives 0.</p>`,
nb:`<h3>Worked derivation: Naive Bayes on one email</h3>
<p>Prior P(spam) = 0.4. Word chances: P(free | spam) = 0.5, P(free | ham) = 0.05, P(meeting | spam) = 0.05, P(meeting | ham) = 0.3. The email contains "free" and "meeting".</p>
<div class="math">score(spam) = 0.4 * 0.5 * 0.05 = 0.0100
score(ham)  = 0.6 * 0.05 * 0.3 = 0.0090
P(spam | words) = 0.0100 / (0.0100 + 0.0090) = 0.526</div>
<p>The "naive" step is multiplying word chances as if words were independent given the class. It is false, but the ranking of classes is often still right. In code, add logs instead of multiplying, and add a small count (smoothing) so an unseen word does not give zero.</p>`
};

hint:'Make an array of sums and counts per centre. Find the nearest centre for each point with Math.hypot, add the point to it, then divide.',solution:'function kmeansStep(points, centers) {\n  const sum = centers.map(() => [0, 0]), cnt = centers.map(() => 0);\n  for (const p of points) {\n    let best = 0, bd = Infinity;\n    centers.forEach((c, i) => {\n      const d = Math.hypot(p[0] - c[0], p[1] - c[1]);\n      if (d < bd) { bd = d; best = i; }\n    });\n    sum[best][0] += p[0]; sum[best][1] += p[1]; cnt[best]++;\n  }\n  return centers.map((c, i) => (cnt[i] ? [sum[i][0] / cnt[i], sum[i][1] / cnt[i]] : c));\n}'},

const OLD={"gd":{"learn":"<h2>The idea in plain words<\/h2>\n<p>Picture yourself blindfolded on a hillside, trying to reach the valley floor. You cannot see the valley, but you can feel which way the ground tilts under your feet. So you take a small step downhill, feel the tilt again, and repeat. That is gradient descent.<\/p>\n<div class=\"callout\"><b>Machine learning in one sentence.<\/b> Choose a model with adjustable settings, define one number that says how wrong it is (the <b>loss<\/b>), then keep adjusting the settings to make that number smaller.<\/div>\n<p>In the demo the model is a straight line with two settings: its slope <b>w<\/b> and its height <b>b<\/b>. The loss measures how far the line is from the dots. Every possible (w, b) pair is a spot on the hillside, and the loss is the height at that spot.<\/p>\n\n<h2>A worked example by hand<\/h2>\n<p>Three points on the line y = 2x: (1, 2), (2, 4), (3, 6). The model is ŷ = w·x. We start at w = 0 with a learning rate of 0.05.<\/p>\n<div class=\"eg\"><table>\n<tr><th>step<\/th><th>w<\/th><th>errors ŷ − y<\/th><th>loss<\/th><th>gradient<\/th><th>new w<\/th><\/tr>\n<tr><td>0<\/td><td>0.000<\/td><td>−2, −4, −6<\/td><td>18.67<\/td><td>−18.67<\/td><td>0.933<\/td><\/tr>\n<tr><td>1<\/td><td>0.933<\/td><td>−1.07, −2.13, −3.20<\/td><td>5.31<\/td><td>−9.96<\/td><td>1.431<\/td><\/tr>\n<tr><td>2<\/td><td>1.431<\/td><td>−0.57, −1.14, −1.71<\/td><td>1.51<\/td><td>−5.31<\/td><td>1.697<\/td><\/tr>\n<\/table><\/div>\n<p>w is climbing toward the true value 2. Notice the gradient roughly halves each step. Near the bottom of a valley the ground is flat, so the steps shrink by themselves.<\/p>\n<p>Check step 0 yourself: the gradient is 2 × mean(error × x) = 2 × mean(−2, −8, −18) = −18.67. Then new w = 0 − 0.05 × (−18.67) = 0.933.<\/p>\n\n<h2>The math, symbol by symbol<\/h2>\n<div class=\"math\">ŷ = w·x + b                    the prediction\nloss = (1/n) Σ (ŷ − y)²        mean squared error (MSE)\n∂loss/∂w = (2/n) Σ (ŷ − y)·x\n∂loss/∂b = (2/n) Σ (ŷ − y)\nw ← w − lr · ∂loss/∂w          the update<\/div>\n<ul>\n<li><b>Why square the error?<\/b> It makes every error positive so they cannot cancel, and it punishes big misses much more than small ones.<\/li>\n<li><b>What is the gradient?<\/b> The answer to \"if I nudge w up a tiny bit, how much does the loss change?\" A negative gradient means increasing w helps.<\/li>\n<li><b>Why the minus sign?<\/b> The gradient points uphill. We want downhill.<\/li>\n<li><b>Why does x appear in the w gradient but not the b gradient?<\/b> b is added directly. w is multiplied by x, so a point with big x makes w matter more.<\/li>\n<\/ul>\n\n<h2>Choosing the learning rate<\/h2>\n<ul>\n<li><b>Too small:<\/b> it works, but takes forever.<\/li>\n<li><b>About right:<\/b> fast, smooth decline.<\/li>\n<li><b>Too large:<\/b> each step jumps past the valley and lands higher on the other side. The loss grows, and soon becomes NaN.<\/li>\n<\/ul>\n<p>For a bowl-shaped loss like this one there is an exact limit: gradient descent converges only if <b>lr &lt; 2 / λmax<\/b>, where λmax is the steepest curvature of the bowl. In this demo λmax is about 16.7, so the limit is about 0.12. That is why the slider blows up right there.<\/p>\n\n<h2>Going deeper<\/h2>\n<ul>\n<li><b>Feature scaling.<\/b> If one feature ranges 0 to 1 and another 0 to 100,000, the bowl becomes a long narrow canyon. The rate must be tiny to avoid bouncing off the steep walls, so progress along the flat floor is painfully slow. Standardising features (mean 0, spread 1) rounds the bowl.<\/li>\n<li><b>Batch, stochastic and mini-batch.<\/b> This demo uses all the data for every step (batch). Stochastic gradient descent uses one example, mini-batch uses a small group such as 32 to 256. Mini-batches are noisier but far cheaper per step, and they are the default in deep learning.<\/li>\n<li><b>Closed form.<\/b> Linear regression has an exact answer, w = (XᵀX)⁻¹Xᵀy, which is the dashed line. We still learn gradient descent because it works for models that have no exact answer, like neural networks.<\/li>\n<li><b>Convex or not.<\/b> Linear regression's loss is a single bowl, so descent finds the true minimum. Neural network losses are bumpy landscapes, where descent finds a good valley, not necessarily the best one.<\/li>\n<li><b>Loss choice.<\/b> MSE is very sensitive to outliers. Mean absolute error and Huber loss are gentler.<\/li>\n<li><b>Better optimisers.<\/b> Momentum keeps a running average of past gradients so you roll through flat spots. Adam also scales the step per weight.<\/li>\n<\/ul>\n\n<h2>Common mistakes<\/h2>\n<ul>\n<li>Not plotting the loss. A healthy loss curve falls smoothly. Zig-zags mean the rate is too high, a flat line means it is too low or you have a bug.<\/li>\n<li>Scaling the training data one way and the test data another. Compute scaling numbers on training data only and reuse them.<\/li>\n<li>Judging a model by its loss alone. Loss is what the optimiser needs, a metric like RMSE or R² is what people understand.<\/li>\n<\/ul>\n\n<h2>Key takeaways<\/h2>\n<ul><li>Training means minimising a loss.<\/li><li>The gradient says which way is uphill, so we step the other way.<\/li><li>The learning rate is the most important setting, and scaled features make it easier to choose.<\/li><\/ul>\n\n<h2>Key terms<\/h2>\n<dl class=\"terms\"><dt>Loss<\/dt><dd>One number measuring how wrong the model is.<\/dd><dt>Gradient<\/dt><dd>The direction and steepness of increase of the loss.<\/dd><dt>Learning rate<\/dt><dd>The step size multiplier.<\/dd><dt>Epoch<\/dt><dd>One pass through all the training data.<\/dd><dt>Convergence<\/dt><dd>When steps stop making the loss meaningfully smaller.<\/dd><dt>Convex<\/dt><dd>A loss with a single valley and no other dips.<\/dd><\/dl>","js":"// Linear regression trained by gradient descent, from scratch.\nseed(7);\nconst n = 30;\nconst X = range(n).map(() => -5 + 10 * rand());\nconst y = X.map(x => 1.5 * x + 2 + 1.8 * randn());   // true line: w=1.5, b=2, plus noise\n\nlet w = -1.5, b = -6;      // a bad starting guess\nconst lr = 0.03;           // learning rate: try 0.005, 0.1, 0.13\nconst losses = [];\n\nfor (let step = 0; step < 200; step++) {\n  const err = X.map((x, i) => w * x + b - y[i]);     // prediction minus truth\n  losses.push(mean(err.map(e => e * e)));            // mean squared error\n  const gw = 2 * mean(err.map((e, i) => e * X[i]));  // slope of loss along w\n  const gb = 2 * mean(err);                          // slope of loss along b\n  w -= lr * gw;                                      // step downhill\n  b -= lr * gb;\n}\n\nprint(\"learned w =\", w, \" (true 1.5)\");\nprint(\"learned b =\", b, \" (true 2)\");\nprint(\"final loss =\", losses[losses.length - 1]);\nplot({ title: \"loss at each step (log scale)\", logy: true, series: [{ name: \"MSE\", y: losses }] });\n","py":"import numpy as np\n\nX = np.random.uniform(-5, 5, 30)\ny = 1.5 * X + 2 + np.random.randn(30) * 1.8\n\nw, b, lr = -1.5, -6.0, 0.03\nfor step in range(200):\n    err = w * X + b - y\n    w -= lr * 2 * np.mean(err * X)\n    b -= lr * 2 * np.mean(err)\n\nprint(w, b)   # close to 1.5 and 2","edits":["Change <code>lr<\/code> to 0.005, then 0.1, then 0.13. Predict the outcome first.","Change the starting <code>w<\/code> and <code>b<\/code>. Does the final answer change?","Replace the squared error with absolute error (gradient = sign of error) and add a few outliers to the data.","Count how many steps it takes for the loss to get within 1% of its final value, at each learning rate."],"build":"<p>Predict median house value with scikit-learn's California housing dataset. Standardise the features, implement gradient descent from scratch, and compare your RMSE with <code>LinearRegression<\/code>. Plot loss for three learning rates and explain what you see.<\/p>","interview":[["Derive the gradient of MSE for linear regression.","With L = (1/n)Σ(wx + b − y)², the derivative with respect to w is (2/n)Σ(ŷ − y)x, and with respect to b it is (2/n)Σ(ŷ − y). Apply the chain rule: the derivative of the square is 2 × error, times the derivative of the error with respect to the parameter."],["Why does feature scaling speed up gradient descent?","Unequal scales make the loss surface a long narrow valley, so one learning rate cannot suit every direction. Scaling makes the surface more circular so all weights converge at similar speeds."],["Batch versus stochastic gradient descent?","Batch uses all the data per step: smooth but expensive. Stochastic uses one example: cheap but noisy. Mini-batch is the compromise used in practice, and it maps well onto GPUs."]],"exp":["Press <b>Play<\/b> with the default rate. The red errors shrink and the loss curve drops fast, then flattens.","Press <b>Reset<\/b>, set the rate to 0.005, and play. Same destination, far more steps.","Reset and push the rate above 0.12. The loss explodes because each step overshoots the valley.","Reset and use <b>One step<\/b> repeatedly. Notice the steps shrink as the line nears the dashed one. You never changed the rate: the slope itself is getting flatter."],"look":"The dots are data. The blue line is the model's current guess, the dashed grey line is the best line possible, and the red segments are the errors. The lower chart shows the loss after every step."},"logreg":{"learn":"<h2>The idea in plain words<\/h2>\n<p>Linear regression predicts a number. But often the question is yes or no: spam or not, will the customer leave or stay? We need an answer between 0 and 1 that we can read as a probability.<\/p>\n<p>Logistic regression does it in two steps. First it adds up evidence: <b>z = w₁x₁ + w₂x₂ + b<\/b>. Positive z favours \"yes\", negative z favours \"no\", and the bigger it is, the stronger the evidence. Then it squashes z into a probability with the <b>sigmoid<\/b> curve, an S-shape that maps any number to between 0 and 1.<\/p>\n<div class=\"callout\"><b>Mental model.<\/b> The score z is a see-saw. The sigmoid turns its tilt into a probability. z = 0 is perfectly balanced, so p = 0.5.<\/div>\n\n<h2>A worked example by hand<\/h2>\n<p>A toy spam filter with two features: x₁ = number of links, x₂ = 1 if the email contains \"free\". Suppose training gave w₁ = 0.8, w₂ = 1.5, b = −2.<\/p>\n<div class=\"eg\"><table>\n<tr><th>email<\/th><th>z<\/th><th>p(spam)<\/th><\/tr>\n<tr><td>0 links, no \"free\"<\/td><td>−2.0<\/td><td>0.119<\/td><\/tr>\n<tr><td>2 links, contains \"free\"<\/td><td>1.6 + 1.5 − 2 = 1.1<\/td><td>0.750<\/td><\/tr>\n<\/table><\/div>\n<p>Now the loss. If the second email really is spam (y = 1) the loss is −ln(0.75) = 0.29, which is small. If it was not spam (y = 0) the loss is −ln(0.25) = 1.39. If the model had said 0.99 and been wrong, the loss would be −ln(0.01) = 4.6. Confident mistakes cost a lot, and that is what we want.<\/p>\n\n<h2>The math, symbol by symbol<\/h2>\n<div class=\"math\">z = w·x + b\np = σ(z) = 1 / (1 + e^(−z))\nloss = −[ y·ln(p) + (1 − y)·ln(1 − p) ]     \"log-loss\"\n∂loss/∂w = (p − y)·x                        the gradient<\/div>\n<ul>\n<li><b>Log-odds.<\/b> Rearranging gives z = ln( p / (1 − p) ). So z is the log of the odds. Each extra unit of x₁ adds w₁ to the log-odds, or multiplies the odds by e^w₁. A weight of 0.7 roughly doubles the odds (e^0.7 ≈ 2.0).<\/li>\n<li><b>Why log-loss?<\/b> Suppose labels are coin flips with probability p. The log-loss is exactly the negative log of the probability the model assigned to what actually happened. Minimising it is <b>maximum likelihood<\/b> estimation.<\/li>\n<li><b>Why not squared error?<\/b> With a sigmoid it makes a bumpy surface with flat regions where confident wrong answers barely get corrected. Log-loss gives a bowl-shaped loss and the gradient stays strong when the model is wrong.<\/li>\n<li><b>The gradient is (p − y)·x.<\/b> Prediction minus truth, times the input. It has the same shape as linear regression, which is no accident.<\/li>\n<\/ul>\n\n<h2>The decision boundary<\/h2>\n<p>The boundary is where z = 0. With two features that is a straight line, with three a flat plane. Logistic regression can only separate classes with a flat boundary. To bend it you add features (such as x₁² or x₁·x₂) or use a more flexible model.<\/p>\n<p>The 0.5 cutoff is a choice, not a law. You can flag anything above 0.2 if missing a positive is expensive. Module 7 explores that trade-off.<\/p>\n\n<h2>Going deeper<\/h2>\n<ul>\n<li><b>Regularisation.<\/b> If the classes can be perfectly separated, the weights grow forever, chasing ever more confident predictions. An L2 penalty on the weights (added to the loss) stops that and reduces overfitting.<\/li>\n<li><b>More than two classes.<\/b> Softmax generalises the sigmoid: it turns one score per class into probabilities that sum to 1. The final layer of most neural classifiers is softmax.<\/li>\n<li><b>Calibration.<\/b> Logistic regression usually gives trustworthy probabilities. Saying \"70%\" should mean 70 of every 100 such cases are positive. Many other models need extra calibration.<\/li>\n<li><b>Bayes error.<\/b> When classes overlap, some points are inherently ambiguous. No model can score above that ceiling, so more training will not fix it.<\/li>\n<li><b>Interpretability.<\/b> The weights tell a story, which is why logistic regression remains standard in credit scoring and medicine.<\/li>\n<\/ul>\n\n<h2>Common mistakes<\/h2>\n<ul>\n<li>Reading a probability as certainty. 0.8 still means wrong one time in five.<\/li>\n<li>Using accuracy on imbalanced data. See module 7.<\/li>\n<li>Leaving features unscaled. Optimisation gets slow and regularisation treats features unfairly.<\/li>\n<li>Data leakage: a feature that secretly contains the answer (such as \"refund issued\" when predicting churn) gives fantastic training scores and useless real ones.<\/li>\n<\/ul>\n\n<h2>Key takeaways<\/h2>\n<ul><li>Score first, then squash into a probability.<\/li><li>Train with log-loss, whose gradient is just (p − y)·x.<\/li><li>The boundary is straight, and the threshold is your decision.<\/li><\/ul>\n\n<h2>Key terms<\/h2>\n<dl class=\"terms\"><dt>Sigmoid<\/dt><dd>The S-shaped function that maps any number to between 0 and 1.<\/dd><dt>Log-odds<\/dt><dd>ln(p / (1 − p)), the quantity that is a straight-line function of the features.<\/dd><dt>Decision boundary<\/dt><dd>Where the model switches its answer.<\/dd><dt>Maximum likelihood<\/dt><dd>Choosing weights that make the observed data most probable.<\/dd><dt>Bayes error<\/dt><dd>The lowest error any model could get on this data.<\/dd><\/dl>","js":"// Logistic regression trained by gradient descent.\nseed(2);\nconst pts = [];\nfor (let c = 0; c < 2; c++) for (let i = 0; i < 50; i++) {\n  const s = c ? 1 : -1;\n  pts.push({ x1: s * 1.6 + 1.1 * randn(), x2: s * 0.96 + 1.1 * randn(), y: c });\n}\n\nlet w1 = 0, w2 = 0, b = 0;\nconst lr = 0.5;            // try 0.05 and 2\nconst losses = [];\n\nfor (let step = 0; step < 300; step++) {\n  let g1 = 0, g2 = 0, gb = 0, L = 0;\n  for (const p of pts) {\n    const q = sigmoid(w1 * p.x1 + w2 * p.x2 + b);    // predicted probability\n    const e = q - p.y;                               // the whole gradient story: p - y\n    g1 += e * p.x1; g2 += e * p.x2; gb += e;\n    L -= p.y ? Math.log(q + 1e-9) : Math.log(1 - q + 1e-9);\n  }\n  const n = pts.length;\n  w1 -= lr * g1 / n; w2 -= lr * g2 / n; b -= lr * gb / n;\n  losses.push(L / n);\n}\n\nconst THRESHOLD = 0.5;     // try 0.2 and 0.8, then watch precision and recall\nlet TP = 0, FP = 0, FN = 0, TN = 0;\nfor (const p of pts) {\n  const flag = sigmoid(w1 * p.x1 + w2 * p.x2 + b) >= THRESHOLD;\n  if (flag && p.y) TP++; else if (flag) FP++; else if (p.y) FN++; else TN++;\n}\nprint(\"weights:\", w1, w2, \"bias:\", b);\nprint(\"accuracy :\", (TP + TN) / pts.length);\nprint(\"precision:\", TP / Math.max(1, TP + FP));\nprint(\"recall   :\", TP / Math.max(1, TP + FN));\nplot({ title: \"log-loss at each step\", series: [{ name: \"log-loss\", y: losses }] });\n","py":"import numpy as np\n\ndef sigmoid(z):\n    return 1 / (1 + np.exp(-z))\n\nw, b, lr = np.zeros(2), 0.0, 0.5\nfor _ in range(500):\n    p = sigmoid(X @ w + b)          # X: (n, 2), y: (n,)\n    w -= lr * X.T @ (p - y) / len(y)\n    b -= lr * np.mean(p - y)","edits":["Change <code>lr<\/code> to 0.05 and 2 and compare the log-loss curve.","Change <code>THRESHOLD<\/code> to 0.2, then 0.8. Which of precision and recall rises each time?","Change the separation (the 1.6 and 0.96 in the data) to make the classes overlap. What accuracy can you reach?","Add an L2 penalty: subtract <code>lr * 0.1 * w1<\/code> from the weight update. What happens to the weights?"],"build":"<p>Use scikit-learn's breast cancer dataset. Implement logistic regression in NumPy, report log-loss and ROC-AUC, and compare with <code>LogisticRegression<\/code>. Then remove feature scaling and note what breaks.<\/p>","interview":[["Why does logistic regression use log-loss instead of MSE?","Log-loss is the negative log-likelihood for a Bernoulli model, so minimising it is maximum likelihood. It is convex for logistic regression, and its gradient (p − y)x stays large when the model is confidently wrong, unlike MSE through a sigmoid."],["How do you interpret a weight?","Holding other features fixed, a one-unit increase in the feature adds the weight to the log-odds, i.e. multiplies the odds by e^weight."],["What happens if the classes are perfectly separable?","The likelihood keeps improving as the weights grow, so unregularised training never converges to finite weights. L2 regularisation fixes this."]],"exp":["Press <b>Play<\/b>. The line starts undefined (all weights are zero), then swings into place as the loss falls.","Drag <b>Class separation<\/b> down to 0.5, press <b>Reset weights<\/b> and play. Accuracy stalls well below 100% however long you train. That ceiling is the Bayes error.","Try a learning rate of 2, then 0.05. Compare how quickly the accuracy settles.","Press <b>New data<\/b> a few times. Accuracy changes a little each time. That is sampling noise, and it is why one test score never tells the whole story."],"look":"Blue circles and orange squares are two classes. The background shading is the model's predicted probability of the orange class, and the black line marks exactly 50/50."},"knn":{"learn":"<h2>The idea in plain words<\/h2>\n<p>\"You are like the people who live nearest you.\" To label a new point, kNN finds the <b>k<\/b> most similar examples it has stored and lets them vote. It does not learn any rules in advance. The stored data <i>is<\/i> the model, which is why it is called a <b>lazy learner<\/b>.<\/p>\n<div class=\"callout\"><b>Two decisions define kNN.<\/b> How to measure closeness (the distance), and how many neighbours to ask (k).<\/div>\n\n<h2>A worked example by hand<\/h2>\n<p>A new fruit must be classified using k = 5. Its five nearest neighbours in the data:<\/p>\n<div class=\"eg\"><table>\n<tr><th>neighbour<\/th><th>distance<\/th><th>label<\/th><\/tr>\n<tr><td>1<\/td><td>0.4<\/td><td>apple<\/td><\/tr><tr><td>2<\/td><td>0.6<\/td><td>pear<\/td><\/tr><tr><td>3<\/td><td>0.7<\/td><td>apple<\/td><\/tr><tr><td>4<\/td><td>1.1<\/td><td>pear<\/td><\/tr><tr><td>5<\/td><td>1.3<\/td><td>pear<\/td><\/tr>\n<\/table><\/div>\n<p>Plain vote: 3 pears against 2 apples, so the answer is <b>pear<\/b>. With <b>distance weighting<\/b> (each vote counts 1/distance) apples get 1/0.4 + 1/0.7 = 3.9 and pears get 1/0.6 + 1/1.1 + 1/1.3 = 3.3. Now the answer is <b>apple<\/b>. The choice of voting scheme can change the prediction.<\/p>\n\n<h2>The math, symbol by symbol<\/h2>\n<div class=\"math\">distance(a, b) = √( Σ (aᵢ − bᵢ)² )       Euclidean\nprediction = most common label among the k nearest\nregression version = average of their values<\/div>\n<ul>\n<li><b>Other distances.<\/b> Manhattan (sum of absolute differences) is more robust to outliers. Cosine distance compares direction and is standard for text and embeddings.<\/li>\n<li><b>k is the complexity dial.<\/b> k = 1 fits every quirk of the training data: zero training error, high variance. k = n always answers with the majority class: high bias.<\/li>\n<li><b>The training error at k = 1 is 0<\/b> when scoring on the training set, because each point is its own nearest neighbour. That is why you must evaluate on held-out data.<\/li>\n<\/ul>\n\n<h2>Going deeper<\/h2>\n<ul>\n<li><b>The curse of dimensionality.<\/b> In hundreds of dimensions, distances between random points become almost equal, so \"nearest\" loses meaning. kNN works well in low dimensions, or on learned embeddings, and poorly on raw high-dimensional data.<\/li>\n<li><b>Feature scaling is essential.<\/b> A feature in dollars swamps one in years. Irrelevant features also add noise to every distance.<\/li>\n<li><b>A famous guarantee.<\/b> As the amount of data grows, the 1-nearest-neighbour error is at most twice the best possible error (Cover and Hart). Simple and surprisingly strong.<\/li>\n<li><b>Speed.<\/b> Brute force compares the query with all n points: O(n·d). KD-trees help in low dimensions. At scale, approximate nearest neighbour indexes (HNSW graphs, IVF, product quantisation, libraries such as FAISS) trade a little accuracy for huge speed-ups.<\/li>\n<li><b>Choosing k.<\/b> Use cross-validation over a range of k. For two classes prefer odd k to avoid ties.<\/li>\n<\/ul>\n\n<h2>Common mistakes<\/h2>\n<ul>\n<li>Forgetting to scale features, or fitting the scaler on all data before splitting. Fit it on training data only, otherwise information from the test set leaks in.<\/li>\n<li>Tuning k on the test set.<\/li>\n<li>Applying it to sparse, very high-dimensional data without reducing dimensions first.<\/li>\n<\/ul>\n\n<h2>Key takeaways<\/h2>\n<ul><li>No training, but every prediction searches the data.<\/li><li>Small k means wiggly and noisy, large k means smooth and blurry.<\/li><li>Scale your features and mind the dimensions.<\/li><\/ul>\n\n<h2>Key terms<\/h2>\n<dl class=\"terms\"><dt>Lazy learner<\/dt><dd>A model that does all its work at prediction time.<\/dd><dt>Hyperparameter<\/dt><dd>A setting you choose before training, like k. It is not learned from data.<\/dd><dt>Curse of dimensionality<\/dt><dd>Distances lose meaning as features multiply.<\/dd><dt>Embedding<\/dt><dd>A vector representing an item so that similar items are close.<\/dd><dt>ANN<\/dt><dd>Approximate nearest neighbour search.<\/dd><\/dl>","js":"// k-nearest neighbours: train vs test accuracy for different k.\nseed(11);\nconst centers = [[-2.2, -1.3], [2.3, -1.5], [0, 2.4]];\nconst NOISE = 1.25;        // try 0.6 (easy) and 2.0 (very overlapping)\nfunction makeSet(n) {\n  const d = [];\n  centers.forEach((c, k) => { for (let i = 0; i < n; i++) d.push({ x: c[0] + NOISE * randn(), y: c[1] + NOISE * randn(), k }); });\n  return d;\n}\nconst train = makeSet(25), test = makeSet(20);\n\nfunction predict(px, py, k) {\n  const nearest = train\n    .map(p => ({ k: p.k, d: (p.x - px) ** 2 + (p.y - py) ** 2 }))\n    .sort((a, b) => a.d - b.d)\n    .slice(0, k);\n  const votes = [0, 0, 0];\n  nearest.forEach(n => votes[n.k]++);\n  return votes.indexOf(Math.max(...votes));\n}\n\nconst ks = [1, 3, 5, 7, 9, 11, 15, 21, 31];\nconst trainAcc = ks.map(k => mean(train.map(p => predict(p.x, p.y, k) === p.k ? 1 : 0)));\nconst testAcc  = ks.map(k => mean(test.map(p => predict(p.x, p.y, k) === p.k ? 1 : 0)));\n\nprint(\"k        :\", ks);\nprint(\"train acc:\", trainAcc);\nprint(\"test acc :\", testAcc);\nprint(\"Why is train accuracy exactly 1 when k = 1?\");\nplot({ title: \"accuracy vs k\", x: ks, series: [{ name: \"train\", y: trainAcc }, { name: \"test\", y: testAcc }] });\n","py":"from sklearn.neighbors import KNeighborsClassifier\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.pipeline import make_pipeline\n\nmodel = make_pipeline(StandardScaler(), KNeighborsClassifier(n_neighbors=7))\nmodel.fit(X_train, y_train)\nprint(model.score(X_test, y_test))","edits":["Change <code>NOISE<\/code> to 0.6, then 2.0. Which k values win in each case?","Change <code>ks<\/code> to include 1, 2, 4, 6 and see how even k values create ties.","Add distance weighting: count each neighbour as <code>1 / (distance + 0.001)<\/code> instead of 1.","Add a junk feature (random noise) to every point and see how accuracy changes."],"build":"<p>Load scikit-learn's digits dataset. Tune k with cross-validation and plot accuracy against k. Repeat with and without <code>StandardScaler<\/code>, then time predictions as the dataset grows.<\/p>","interview":[["Why is kNN sensitive to feature scale?","Distance adds squared differences across features, so a feature with a larger numeric range dominates. Standardise features first."],["What is the curse of dimensionality?","As dimensions grow, data becomes sparse and pairwise distances concentrate, so the nearest and farthest neighbours are almost equally far away. Nearest-neighbour search stops being meaningful."],["How would you serve kNN over 100 million vectors?","Use an approximate index such as HNSW or IVF with product quantisation (for example FAISS), possibly sharded, accepting a small recall loss for large speed-ups."]],"exp":["Set <b>k = 1<\/b> with regions on. The map is jagged islands: each single point claims its own territory, including noisy ones.","Slide k up to 25. Regions become smooth and the small islands vanish.","Drag the query point along a border between two clusters. Watch the votes split and the answer flip.","Turn regions off, drag the query somewhere, and predict the answer before looking at the tiles."],"look":"Circles, squares and triangles are three classes. Drag the large circle. The dashed ring holds its k nearest neighbours, thin lines connect to them, and they vote. The pale background shows what class every spot on the map would get."},"kmeans":{"learn":"<h2>The idea in plain words<\/h2>\n<p>Suppose you must open K pizza shops so customers travel as little as possible. Start with K random spots. Each customer goes to the nearest shop. Then each shop moves to the centre of its customers. Customers re-pick their nearest shop, and the shops move again. Repeat until nobody switches. That is k-means.<\/p>\n<p>There are no labels here. The algorithm finds groups purely from how close points are to each other. This is <b>unsupervised learning<\/b>.<\/p>\n\n<h2>A worked example by hand<\/h2>\n<p>One-dimensional data: 1, 2, 3, 10, 11, 12. Choose K = 2 and start with centroids at 1 and 2.<\/p>\n<div class=\"eg\"><table>\n<tr><th>round<\/th><th>assignment<\/th><th>new centroids<\/th><\/tr>\n<tr><td>1<\/td><td>{1} → A, {2, 3, 10, 11, 12} → B<\/td><td>A = 1, B = 7.6<\/td><\/tr>\n<tr><td>2<\/td><td>{1, 2, 3} → A, {10, 11, 12} → B<\/td><td>A = 2, B = 11<\/td><\/tr>\n<tr><td>3<\/td><td>no change, so we stop<\/td><td>inertia = 2 + 2 = 4<\/td><\/tr>\n<\/table><\/div>\n<p>The bad start (both centroids among the left points) still ended in the sensible answer. With other starts, especially with several groups, it may not.<\/p>\n\n<h2>The math, symbol by symbol<\/h2>\n<div class=\"math\">inertia = Σ over clusters j  Σ over points x in j  ‖x − μⱼ‖²\n\nassign:  each x → the centroid μⱼ nearest to it\nupdate:  μⱼ ← mean of the points assigned to j<\/div>\n<ul>\n<li><b>Inertia<\/b> is the total squared distance from each point to its centroid. Small means tight clusters.<\/li>\n<li><b>Why it converges.<\/b> Given the centroids, assigning each point to its nearest one cannot raise inertia. Given the assignment, the mean is the point that minimises squared distance, so moving the centroid there cannot raise it either. Inertia only goes down, and there are finitely many assignments, so it stops.<\/li>\n<li><b>But only to a local minimum.<\/b> Different starts can settle in different solutions, some clearly worse.<\/li>\n<\/ul>\n\n<h2>Choosing K<\/h2>\n<ul>\n<li><b>Elbow method.<\/b> Plot best inertia against K. It always falls, but the drop is steep until the right K and gentle afterwards. The bend is your candidate.<\/li>\n<li><b>Silhouette score.<\/b> For each point compare a = average distance to its own cluster with b = average distance to the nearest other cluster. s = (b − a) / max(a, b). Near +1 means well placed, near 0 means on the border, negative means probably in the wrong cluster.<\/li>\n<li><b>Ask what you will do with the clusters.<\/b> If marketing can only run four campaigns, K is really 4.<\/li>\n<\/ul>\n\n<h2>Going deeper<\/h2>\n<ul>\n<li><b>k-means++<\/b> chooses starting centroids with probability proportional to squared distance from those already chosen. That spreads them out and gives better, more stable results. It is the default in scikit-learn.<\/li>\n<li><b>Restarts.<\/b> Run several times and keep the lowest inertia. Try the code lab with 1 and then 10 restarts.<\/li>\n<li><b>Assumptions.<\/b> k-means likes round, similar-sized clusters. It struggles with long curved shapes, very different sizes or densities, and outliers, which drag centroids. Alternatives: Gaussian mixture models (soft assignments), DBSCAN (density-based, finds odd shapes and noise), hierarchical clustering.<\/li>\n<li><b>Scale.<\/b> Cost per iteration is about n·K·d. Mini-batch k-means handles millions of points.<\/li>\n<li><b>Scale your features.<\/b> Distance drives everything, so a feature in large units dominates.<\/li>\n<\/ul>\n\n<h2>Common mistakes<\/h2>\n<ul>\n<li>Treating clusters as truth. They are a way of summarising data, not a discovery of nature. Check that the segments make sense to people who know the domain.<\/li>\n<li>Picking K only by minimum inertia (which always says \"as many as possible\").<\/li>\n<li>Not checking stability. If clusters change wildly between seeds, they are not robust.<\/li>\n<\/ul>\n\n<h2>Key takeaways<\/h2>\n<ul><li>Alternate assigning points and moving centres.<\/li><li>It always converges, but to a local minimum. Restart several times.<\/li><li>Use the elbow and silhouette to choose K, then sanity-check with domain knowledge.<\/li><\/ul>\n\n<h2>Key terms<\/h2>\n<dl class=\"terms\"><dt>Centroid<\/dt><dd>The mean position of a cluster.<\/dd><dt>Inertia<\/dt><dd>Total squared distance from points to their centroids.<\/dd><dt>Local minimum<\/dt><dd>A solution that cannot be improved by small changes, but is not the best overall.<\/dd><dt>Silhouette<\/dt><dd>A score of how well each point fits its cluster.<\/dd><dt>Unsupervised<\/dt><dd>Learning without labelled answers.<\/dd><\/dl>","js":"// k-means from scratch, with random restarts and an elbow curve.\nseed(5);\nconst pts = [];\n[[-3, -2], [3, -2.5], [-2.5, 2.5], [3.2, 2.2]].forEach(c => {\n  for (let i = 0; i < 40; i++) pts.push([c[0] + 0.85 * randn(), c[1] + 0.85 * randn()]);\n});\nconst d2 = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2;\n\nfunction kmeans(k) {\n  const idx = new Set();\n  while (idx.size < k) idx.add(Math.floor(rand() * pts.length));\n  let cent = [...idx].map(i => [...pts[i]]);              // random starting centroids\n  const asg = new Array(pts.length).fill(-1);\n  for (let it = 0; it < 50; it++) {\n    let changed = false;\n    pts.forEach((p, i) => {                               // step 1: assign\n      let best = 0;\n      cent.forEach((c, j) => { if (d2(p, c) < d2(p, cent[best])) best = j; });\n      if (best !== asg[i]) { asg[i] = best; changed = true; }\n    });\n    if (!changed) break;\n    cent = cent.map((c, j) => {                           // step 2: move to the mean\n      const m = pts.filter((_, i) => asg[i] === j);\n      return m.length ? [mean(m.map(p => p[0])), mean(m.map(p => p[1]))] : c;\n    });\n  }\n  return sum(pts.map((p, i) => d2(p, cent[asg[i]])));     // inertia\n}\n\nconst RESTARTS = 1;        // try 10, and compare the numbers\nconst ks = range(8).map(i => i + 1);\nconst inertia = ks.map(k => Math.min(...range(RESTARTS).map(() => kmeans(k))));\nks.forEach((k, i) => print(\"K =\", k, \" inertia =\", inertia[i]));\nplot({ title: \"elbow curve: inertia vs K\", x: ks, series: [{ name: \"inertia\", y: inertia }] });\n","py":"from sklearn.cluster import KMeans\n\nkm = KMeans(n_clusters=4, n_init=10, random_state=0).fit(X)\nprint(km.inertia_)\nprint(km.labels_[:10])","edits":["Change <code>RESTARTS<\/code> from 1 to 10 and compare the inertia at K = 7 and 8.","Change the cluster centres or spread (0.85) to make the groups overlap. Does the elbow disappear?","Print the cluster sizes for K = 4.","Try starting the centroids smartly: pick the first at random, then each next point farthest from the chosen ones (a simple cousin of k-means++)."],"build":"<p>Take an online retail transactions dataset, build recency, frequency and monetary features, scale them, and choose K with the elbow and silhouette score. Give each segment a plain-English name and check that a marketer would agree.<\/p>","interview":[["Does k-means always converge? To the global optimum?","It always converges because each step cannot increase inertia and there are finitely many assignments. It reaches a local optimum only, which is why we use k-means++ and multiple restarts."],["How do you choose K?","Elbow curve and silhouette score for a first estimate, stability across seeds, and business usefulness. There is no single correct answer."],["When would you not use k-means?","With non-spherical clusters, very different cluster sizes or densities, heavy outliers, or categorical data. Consider GMM, DBSCAN, or hierarchical clustering."]],"exp":["Leave K = 3 and press <b>One step<\/b> repeatedly. Steps alternate between <i>assign points<\/i> and <i>move centroids<\/i>.","Press <b>Re-initialise<\/b> a few times and let it converge. The final inertia changes, compare it with \"best for this K\". Bad starts get stuck.","Set K = 4 and run. Match the elbow in the lower chart.","Set K = 8. Inertia is lower, but the clusters are meaningless splits of real groups. Lower inertia is not the same as better clusters."],"look":"Each cross is a centroid (the centre of a group). Points take the colour and shape of their nearest centroid, and grey means \"not assigned yet\". The lower chart shows the best inertia achievable for each K, the elbow curve."},"biasvar":{"learn":"<h2>The idea in plain words<\/h2>\n<p>A student can prepare for an exam in two bad ways. One skims and learns nothing useful (too simple). The other memorises last year's exact questions and answers, quirks and typos included, then fails when the questions change (too flexible). ML models do both.<\/p>\n<div class=\"callout\"><b>The goal of ML is not to fit the training data. It is to do well on data the model has never seen.<\/b> Training error can always be pushed to zero by memorising. Test error is the honest score.<\/div>\n\n<h2>Bias and variance, with an archery picture<\/h2>\n<ul>\n<li><b>Bias<\/b> is being consistently off target. A straight line cannot capture a sine wave however much data you give it. Every shot lands in the same wrong place.<\/li>\n<li><b>Variance<\/b> is being scattered. A wiggly model fits whatever sample it saw, so a different sample gives a very different curve. The shots are all over the target.<\/li>\n<li><b>Noise<\/b> is randomness in the data itself. No model can predict it.<\/li>\n<\/ul>\n<div class=\"math\">expected test error = bias² + variance + noise<\/div>\n<p>In this demo the noise has a standard deviation of 0.25, so the noise term is 0.25² = 0.0625. That is the lowest test error any model can reach. Look at your best test error: it will not go below about 0.06.<\/p>\n\n<h2>What you can measure<\/h2>\n<div class=\"eg\"><table>\n<tr><th>train error<\/th><th>test error<\/th><th>diagnosis<\/th><\/tr>\n<tr><td>high<\/td><td>high, similar<\/td><td>underfitting (bias). Use a more flexible model or better features.<\/td><\/tr>\n<tr><td>low<\/td><td>much higher<\/td><td>overfitting (variance). More data, simpler model, regularise.<\/td><\/tr>\n<tr><td>low<\/td><td>low, similar<\/td><td>good fit.<\/td><\/tr>\n<\/table><\/div>\n<p>The gap between training and test error is the tell. A <b>learning curve<\/b> plots both errors against the training set size. If they converge at a high value you are underfitting and more data will not help. If a big gap slowly closes as you add data, you are overfitting and more data will help.<\/p>\n\n<h2>Regularisation: a leash on flexibility<\/h2>\n<p>Ridge regression adds λ × (sum of squared weights) to the loss. Big weights are what produce wild wiggles, so the penalty keeps the curve smooth. λ = 0 means no leash, and a huge λ flattens the curve (underfitting). The best λ is found by validation. In the demo you can even fit degree 12 and keep it well behaved.<\/p>\n\n<h2>Going deeper<\/h2>\n<ul>\n<li><b>Three datasets.<\/b> Train to fit, validation to choose settings (degree, λ, k), test to report the final honest score, used once. If you tune on the test set, it stops being honest.<\/li>\n<li><b>Cross-validation.<\/b> Split data into folds, train on all but one, validate on the held-out fold, rotate, then average. It gives a more reliable estimate when data is scarce.<\/li>\n<li><b>Other cures for variance.<\/b> L1 (drives weights to zero, selecting features), dropout and early stopping in neural nets, data augmentation, and ensembles. Bagging (random forests) averages many high-variance models to cut variance, whereas boosting builds many weak models in sequence to cut bias.<\/li>\n<li><b>Modern twist.<\/b> Very large neural networks can show <i>double descent<\/i>: test error rises near the point where the model can just memorise the data, then falls again as the model grows further. The classic U-curve is the right starting intuition, not the whole story.<\/li>\n<li><b>Data leakage.<\/b> Information from the future or from the test set sneaking into training. It produces beautiful validation scores and terrible reality.<\/li>\n<\/ul>\n\n<h2>Common mistakes<\/h2>\n<ul>\n<li>Celebrating high training accuracy.<\/li>\n<li>Choosing settings by looking at the test set.<\/li>\n<li>Random-splitting time-ordered data. Predicting the future needs a time-based split.<\/li>\n<li>Splitting after preprocessing that used all the data.<\/li>\n<\/ul>\n\n<h2>Key takeaways<\/h2>\n<ul><li>Training error always falls with complexity, test error is U-shaped.<\/li><li>Diagnose by comparing training and test error.<\/li><li>Regularise, get more data, or simplify. Never tune on the test set.<\/li><\/ul>\n\n<h2>Key terms<\/h2>\n<dl class=\"terms\"><dt>Underfitting<\/dt><dd>Too simple to capture the pattern.<\/dd><dt>Overfitting<\/dt><dd>Memorised noise in the training set.<\/dd><dt>Regularisation<\/dt><dd>A penalty that discourages complexity.<\/dd><dt>Validation set<\/dt><dd>Held-out data used to choose settings.<\/dd><dt>Cross-validation<\/dt><dd>Rotating which fold is held out to get a steadier estimate.<\/dd><dt>Irreducible error<\/dt><dd>Noise no model can remove.<\/dd><\/dl>","js":"// Polynomial regression: watch training error fall while test error turns around.\nseed(3);\nconst f = x => Math.sin(2 * Math.PI * x);                 // the hidden truth\nconst NOISE = 0.25;                                       // noise floor for test MSE is NOISE^2\nconst make = n => range(n).map(() => { const x = rand(); return [x, f(x) + NOISE * randn()]; });\nconst train = make(15), test = make(200);                 // try 40 training points\n\nconst feat = (x, d) => range(d + 1).map(i => Math.pow(2 * x - 1, i));\nfunction fit(d, lambda) {\n  const A = range(d + 1).map(() => zeros(d + 1)), r = zeros(d + 1);\n  for (const [x, y] of train) {\n    const p = feat(x, d);\n    for (let i = 0; i <= d; i++) { r[i] += p[i] * y; for (let j = 0; j <= d; j++) A[i][j] += p[i] * p[j]; }\n  }\n  for (let i = 1; i <= d; i++) A[i][i] += lambda;         // ridge penalty\n  for (let i = 0; i <= d; i++) A[i][i] += 1e-9;\n  return solve(A, r);\n}\nconst mse = (th, D) => mean(D.map(([x, y]) => (dot(feat(x, th.length - 1), th) - y) ** 2));\n\nconst LAMBDA = 0;          // try 0.001 then 0.1\nconst degs = range(12).map(i => i + 1);\nconst tr = [], te = [];\nfor (const d of degs) { const th = fit(d, LAMBDA); tr.push(mse(th, train)); te.push(mse(th, test)); }\n\ndegs.forEach((d, i) => print(\"degree\", d, \" train\", tr[i], \" test\", te[i]));\nplot({ title: \"error vs degree (log scale)\", logy: true, x: degs, series: [{ name: \"train\", y: tr }, { name: \"test\", y: te }] });\n","py":"from sklearn.preprocessing import PolynomialFeatures\nfrom sklearn.linear_model import Ridge\nfrom sklearn.pipeline import make_pipeline\n\nmodel = make_pipeline(PolynomialFeatures(9), Ridge(alpha=1e-3))\nmodel.fit(X_train, y_train)\nprint(model.score(X_train, y_train), model.score(X_test, y_test))","edits":["Change <code>LAMBDA<\/code> to 0.001, then 0.1. How does the degree-10 test error change?","Change <code>train<\/code> from 15 to 40 points. Where does the best degree move?","Change <code>NOISE<\/code> to 0.5. What is the new floor for test error?","Change the true function <code>f<\/code> to a straight line. Which degree wins now?"],"build":"<p>On any tabular dataset, plot learning curves (error against training set size) and a validation curve for a decision tree's <code>max_depth<\/code>. Mark where it starts to overfit, then show how pruning or a random forest moves that point.<\/p>","interview":[["Explain the bias-variance trade-off.","Expected test error decomposes into bias² (systematic error from too-simple assumptions), variance (sensitivity to the particular training sample) and irreducible noise. Making a model more flexible lowers bias but raises variance, so you look for the best balance."],["Your model has 99% train and 70% validation accuracy. What do you do?","It is overfitting. Get more data, simplify the model, add regularisation or dropout, use early stopping, remove leaky or noisy features, and check the split is sound. Then compare learning curves."],["Why keep a separate test set?","Validation scores are used to make choices, so they become optimistically biased. A final untouched test set gives an unbiased estimate of real-world performance."]],"exp":["Set the degree to 1. The line is too stiff: both errors are high. This is <b>underfitting<\/b> (high bias).","Degree 3 or 4 follows the true curve nicely. Test error hits its low point.","Degree 12 passes near every dark dot but swings wildly between them. Training error keeps falling while test error explodes: <b>overfitting<\/b> (high variance).","At degree 12, raise <b>Regularisation strength<\/b> to 10^-2. The curve calms down and test error recovers.","Press <b>New training sample<\/b> many times. Degree 1 barely moves (stable but wrong), degree 12 changes drastically each time (unstable). That instability is variance."],"look":"Dark dots are the 15 training points. Faint orange dots are 200 unseen test points. The dashed line is the true pattern and the blue curve is your model. The lower chart plots training error (blue) and test error (orange) for every degree, on a log scale."},"nn":{"learn":"<h2>The idea in plain words<\/h2>\n<p>A single neuron does something very simple: multiply each input by a weight, add them up, add a bias, and pass the result through a bend (an <b>activation function<\/b>). That is just logistic regression with a different bend. The power comes from stacking them. Each layer builds new features out of the previous layer's features, like an assembly line where early workers spot edges and later ones spot faces.<\/p>\n<div class=\"callout\"><b>Why the bend matters.<\/b> Without an activation function, stacking layers is pointless: a linear function of a linear function is still linear. The bend is what lets the network draw curved boundaries.<\/div>\n\n<h2>A worked example by hand<\/h2>\n<p>XOR is true when exactly one input is 1. No straight line separates its classes, but two hidden units with ReLU (max(0, z)) solve it. Take h₁ = ReLU(x₁ + x₂), h₂ = ReLU(x₁ + x₂ − 1), output = h₁ − 2·h₂.<\/p>\n<div class=\"eg\"><table>\n<tr><th>x₁, x₂<\/th><th>h₁<\/th><th>h₂<\/th><th>output<\/th><\/tr>\n<tr><td>0, 0<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr>\n<tr><td>1, 0<\/td><td>1<\/td><td>0<\/td><td>1<\/td><\/tr>\n<tr><td>0, 1<\/td><td>1<\/td><td>0<\/td><td>1<\/td><\/tr>\n<tr><td>1, 1<\/td><td>2<\/td><td>1<\/td><td>0<\/td><\/tr>\n<\/table><\/div>\n<p>The hidden layer re-describes the data so that a straight cut now works. Training a network is just finding weights like these automatically.<\/p>\n\n<h2>The math, symbol by symbol<\/h2>\n<div class=\"math\">forward:   a⁽ˡ⁾ = f( W⁽ˡ⁾ · a⁽ˡ⁻¹⁾ + b⁽ˡ⁾ )\nloss:      binary cross-entropy, same as log-loss\nbackward:  δ⁽ᴸ⁾ = p − y                       (output layer, sigmoid + log-loss)\n           δ⁽ˡ⁾ = ( W⁽ˡ⁺¹⁾ᵀ · δ⁽ˡ⁺¹⁾ ) ⊙ f′(z⁽ˡ⁾)\n           ∂loss/∂W⁽ˡ⁾ = δ⁽ˡ⁾ · a⁽ˡ⁻¹⁾ᵀ<\/div>\n<ul>\n<li><b>Forward pass:<\/b> feed the input through layer after layer to get a prediction.<\/li>\n<li><b>Backpropagation<\/b> is the chain rule applied efficiently. The error signal δ starts at the output as (prediction − truth) and is passed backward, each layer multiplying by its weights and by the slope of its activation. One backward pass gives the gradient for every weight.<\/li>\n<li>Then gradient descent (here Adam) updates every weight, exactly as in module 1.<\/li>\n<\/ul>\n<p>Open the Code lab: it contains a complete two-layer network with the forward and backward passes written out line by line.<\/p>\n\n<h2>Going deeper<\/h2>\n<ul>\n<li><b>Activation functions.<\/b> Sigmoid and tanh squash values and their slopes shrink toward zero when saturated, so gradients vanish in deep stacks. ReLU (and variants such as GELU) keeps a healthy slope for positive inputs and is the modern default.<\/li>\n<li><b>Initialisation.<\/b> If all weights start equal, all neurons stay identical. If they start too large or too small, signals blow up or die. Xavier and He initialisation choose the scale from layer sizes.<\/li>\n<li><b>Optimisers.<\/b> Plain SGD, SGD with momentum, and Adam, which adapts the step for each weight. Adam is the common default.<\/li>\n<li><b>Capacity.<\/b> A wide enough single hidden layer can approximate any smooth function (universal approximation), but deep networks can represent complicated functions with far fewer units by reusing intermediate features.<\/li>\n<li><b>Regularisation.<\/b> Weight decay (L2), dropout (randomly silencing units during training), early stopping when validation loss turns up, and more data or augmentation.<\/li>\n<li><b>Architectures.<\/b> Convolutional networks for images, recurrent and transformer networks for sequences. They are the same idea with structure suited to the data.<\/li>\n<\/ul>\n\n<h2>Debugging a network: a practical routine<\/h2>\n<ul>\n<li><b>Check the initial loss.<\/b> A balanced binary classifier that outputs about 0.5 should start near ln 2 = 0.693. If it starts far from that, something is wrong.<\/li>\n<li><b>Overfit a tiny batch first.<\/b> Train on 10 examples. If the loss cannot reach almost zero, you have a bug.<\/li>\n<li><b>Tune the learning rate first.<\/b> It is the most important hyperparameter.<\/li>\n<li><b>Watch train and test curves together.<\/b> Test loss rising while training loss falls means overfitting: stop earlier or regularise.<\/li>\n<\/ul>\n\n<h2>Common mistakes<\/h2>\n<ul>\n<li>Unscaled inputs. The demo divides coordinates by 3 for this reason.<\/li>\n<li>Judging by training accuracy on a small dataset.<\/li>\n<li>Making the network bigger as the first response to any problem.<\/li>\n<li>Changing several things at once so you cannot tell what helped.<\/li>\n<\/ul>\n\n<h2>Key takeaways<\/h2>\n<ul><li>Neuron = weighted sum + bend. Network = layers of neurons.<\/li><li>Backprop = the chain rule, giving every weight's gradient in one backward pass.<\/li><li>More capacity fits more shapes, and also overfits sooner. Always watch held-out data.<\/li><\/ul>\n\n<h2>Key terms<\/h2>\n<dl class=\"terms\"><dt>Activation function<\/dt><dd>The bend applied after each weighted sum (tanh, ReLU, sigmoid).<\/dd><dt>Backpropagation<\/dt><dd>Computing all gradients by passing error signals backward.<\/dd><dt>Hidden layer<\/dt><dd>A layer between input and output.<\/dd><dt>Adam<\/dt><dd>An optimiser that adapts the step size per weight.<\/dd><dt>Dropout<\/dt><dd>Randomly disabling units during training to reduce overfitting.<\/dd><dt>Vanishing gradient<\/dt><dd>Gradients shrinking to almost nothing in deep stacks.<\/dd><\/dl>","js":"// A tiny neural network (2 inputs -> H tanh units -> 1 sigmoid), with backprop written out.\nseed(1);\nconst data = [];\nfor (let i = 0; i < 200; i++) {                           // points inside vs outside a circle\n  const c = i % 2, a = rand() * 6.2832, r = c ? rand() * 1.4 : 2.4 + rand() * 1.2;\n  data.push({ x: [r * Math.cos(a) / 3, r * Math.sin(a) / 3], y: c });\n}\nconst H = 6;               // hidden units: try 1, 2, 12\nconst lr = 1.0, EPOCHS = 1500;\nlet W1 = range(H).map(() => [0.7 * randn(), 0.7 * randn()]), b1 = zeros(H);\nlet W2 = range(H).map(() => 0.7 * randn()), b2 = 0;\nconst losses = [];\n\nfor (let ep = 0; ep < EPOCHS; ep++) {\n  const gW1 = range(H).map(() => [0, 0]), gb1 = zeros(H), gW2 = zeros(H);\n  let gb2 = 0, L = 0;\n  for (const { x, y } of data) {\n    const h = W1.map((w, j) => Math.tanh(w[0] * x[0] + w[1] * x[1] + b1[j]));   // forward\n    const p = sigmoid(dot(W2, h) + b2);\n    L -= y ? Math.log(p + 1e-9) : Math.log(1 - p + 1e-9);\n    const d2 = p - y;                                                           // backward\n    for (let j = 0; j < H; j++) {\n      gW2[j] += d2 * h[j];\n      const dh = d2 * W2[j] * (1 - h[j] * h[j]);      // chain rule through tanh\n      gW1[j][0] += dh * x[0]; gW1[j][1] += dh * x[1]; gb1[j] += dh;\n    }\n    gb2 += d2;\n  }\n  const n = data.length;\n  for (let j = 0; j < H; j++) {\n    W2[j] -= lr * gW2[j] / n; b1[j] -= lr * gb1[j] / n;\n    W1[j][0] -= lr * gW1[j][0] / n; W1[j][1] -= lr * gW1[j][1] / n;\n  }\n  b2 -= lr * gb2 / n;\n  losses.push(L / n);\n}\n\nconst acc = mean(data.map(({ x, y }) => {\n  const h = W1.map((w, j) => Math.tanh(w[0] * x[0] + w[1] * x[1] + b1[j]));\n  return (sigmoid(dot(W2, h) + b2) > 0.5) === (y === 1) ? 1 : 0;\n}));\nprint(\"first loss:\", losses[0], \"(a coin-flip model scores 0.693)\");\nprint(\"last loss :\", losses[losses.length - 1]);\nprint(\"accuracy  :\", acc);\nplot({ title: \"loss per epoch\", series: [{ name: \"log-loss\", y: losses }] });\n","py":"import torch, torch.nn as nn\n\nnet = nn.Sequential(nn.Linear(2, 8), nn.Tanh(),\n                    nn.Linear(8, 8), nn.Tanh(),\n                    nn.Linear(8, 1))\nopt = torch.optim.Adam(net.parameters(), lr=0.03)\nloss_fn = nn.BCEWithLogitsLoss()\n\nfor epoch in range(1000):          # X: (n, 2) float, y: (n,) float\n    opt.zero_grad()\n    loss = loss_fn(net(X).squeeze(1), y)\n    loss.backward()\n    opt.step()","edits":["Change <code>H<\/code> to 1, 2, then 12. What is the smallest hidden layer that solves the circle?","Change the learning rate to 0.05 and to 3. What happens to the loss curve?","Replace <code>Math.tanh<\/code> (and its derivative <code>1 - h*h<\/code>) with a ReLU: <code>Math.max(0, z)<\/code>, derivative 1 if z &gt; 0 else 0.","Add a held-out set of 100 new points and print test accuracy."],"build":"<p>Train a small MLP on Fashion-MNIST with PyTorch. Track test accuracy, then add dropout and weight decay and compare. Plot training and validation loss per epoch and mark where overfitting begins.<\/p>","interview":[["Why do we need non-linear activations?","Without them a stack of linear layers collapses into one linear map, so depth adds no expressive power."],["Explain backpropagation.","It applies the chain rule from the loss back through the network. Each layer receives the gradient with respect to its output, computes gradients for its own weights and passes the gradient for its input to the previous layer. One backward pass costs about as much as a forward pass."],["What is the vanishing gradient problem and how is it mitigated?","Saturating activations such as sigmoid have tiny slopes, so multiplying many of them shrinks gradients toward zero in deep networks. Mitigations: ReLU-style activations, good initialisation, normalisation layers and residual connections."]],"exp":["Choose <b>Circle<\/b> and press Play. A straight line could never separate this, but the network learns a ring within seconds.","Set neurons to 2 and layers to 1, reset, and train on Circle. Compare with 8 neurons. Capacity matters.","Try <b>XOR<\/b>, the classic problem a single line cannot solve.","Try <b>Spiral<\/b>. It needs more neurons or layers and more epochs. Watch the test accuracy, not just the training accuracy.","Raise the learning rate to 0.1 and watch the loss get jumpy. Lower it to 0.005 and watch it crawl."],"look":"Each dot is a training example (filled) or a held-out test example (hollow). The background colour shows what the network predicts at every location. Press Play and watch the boundary bend to separate the two classes."},"metrics":{"learn":"<h2>The idea in plain words<\/h2>\n<p>Think of airport security. A strict scanner catches almost every threat but stops thousands of innocent passengers. A relaxed one lets people flow but might miss something dangerous. There is no free lunch: pick where to sit on that dial. In ML the dial is the <b>threshold<\/b> on the model's score.<\/p>\n<div class=\"callout\"><b>Why accuracy lies.<\/b> If 2% of transactions are fraud, a model that always says \"legit\" is 98% accurate and catches nothing. Accuracy hides what you care about when one class is rare.<\/div>\n\n<h2>A worked example by hand<\/h2>\n<p>10,000 transactions, 200 of them fraud. The model flags 300 transactions, and 150 of those really are fraud.<\/p>\n<div class=\"eg\"><table>\n<tr><th><\/th><th>flagged<\/th><th>not flagged<\/th><\/tr>\n<tr><th>fraud (200)<\/th><td>TP = 150<\/td><td>FN = 50<\/td><\/tr>\n<tr><th>legit (9,800)<\/th><td>FP = 150<\/td><td>TN = 9,650<\/td><\/tr>\n<\/table><\/div>\n<ul>\n<li><b>Accuracy<\/b> = (150 + 9,650) / 10,000 = 98%. Sounds great, but the do-nothing model also scores 98%.<\/li>\n<li><b>Precision<\/b> = TP / (TP + FP) = 150 / 300 = 50%. Half the alerts are real.<\/li>\n<li><b>Recall<\/b> = TP / (TP + FN) = 150 / 200 = 75%. Three quarters of fraud is caught.<\/li>\n<li><b>F1<\/b> = 2·P·R / (P + R) = 0.60, the harmonic mean, which is low if either is low.<\/li>\n<li><b>Money:<\/b> at $200 per missed fraud and $5 per false alarm, this model costs 50 × 200 + 150 × 5 = $10,750. Doing nothing costs 200 × 200 = $40,000.<\/li>\n<\/ul>\n\n<h2>The math, symbol by symbol<\/h2>\n<div class=\"math\">precision = TP / (TP + FP)     \"when I raise an alarm, how often am I right?\"\nrecall    = TP / (TP + FN)     \"of the real cases, how many did I catch?\"\ncost      = FN · cost_miss + FP · cost_false_alarm<\/div>\n<p>Raising the threshold flags fewer items, so precision usually rises and recall falls. Lowering it does the reverse.<\/p>\n\n<h2>Why precision depends on how rare fraud is<\/h2>\n<p>In the demo, at threshold 0.50 the model catches about 84% of fraud (recall) and wrongly flags about 9% of legitimate transactions. With 2% fraud, per 10,000 transactions that is about 168 real catches and about 890 false alarms: precision of only 16%. At 10% fraud the same model has about 840 real catches against about 820 false alarms, so precision is about 51%. Nothing about the model changed. This is Bayes' rule at work, and it is why rare-event models surprise people.<\/p>\n\n<h2>Choosing the threshold<\/h2>\n<p>The best threshold depends on costs, not on a rule of thumb. If the model outputs a well-calibrated probability p, flag a transaction whenever the expected cost of ignoring it exceeds the cost of reviewing it:<\/p>\n<div class=\"math\">flag if  p · cost_miss  ≥  (1 − p) · cost_false_alarm\ni.e.     p ≥ cost_false_alarm / (cost_false_alarm + cost_miss)\nexample: 5 / (5 + 200) ≈ 0.024<\/div>\n<p>With those costs you would flag anything with a 2.4% chance of being fraud. The demo's scores are not calibrated probabilities, so the cheapest threshold on the slider is different. But the lesson holds: when misses are far costlier than false alarms, the best cutoff is low.<\/p>\n\n<h2>Going deeper<\/h2>\n<ul>\n<li><b>ROC and PR curves.<\/b> The ROC curve plots recall against the false-positive rate across all thresholds, and AUC summarises it. On very imbalanced data the precision-recall curve is more revealing, because ROC-AUC can look great while precision is terrible.<\/li>\n<li><b>Capacity limits.<\/b> Analysts can only review so many alerts a day. Often the real constraint is \"precision in the top 500 alerts\", not a threshold.<\/li>\n<li><b>F-beta.<\/b> F1 weights precision and recall equally. F2 favours recall, and F0.5 favours precision.<\/li>\n<li><b>Multi-class.<\/b> Compute precision and recall per class, then average (macro treats classes equally, micro pools all examples).<\/li>\n<li><b>Calibration.<\/b> Check that a predicted 0.3 really means 30%. If it does not, recalibrate (Platt scaling or isotonic regression) before using cost-based thresholds.<\/li>\n<li><b>Drift.<\/b> Fraudsters adapt. Track precision and recall in production and retrain.<\/li>\n<\/ul>\n\n<h2>Common mistakes<\/h2>\n<ul>\n<li>Reporting accuracy for imbalanced problems.<\/li>\n<li>Choosing the threshold on the test set. Choose it on validation data.<\/li>\n<li>Ignoring the base rate when interpreting precision.<\/li>\n<li>Forgetting that labels may be delayed or incomplete. Confirmed fraud is only what was caught.<\/li>\n<\/ul>\n\n<h2>Key takeaways<\/h2>\n<ul><li>Use precision and recall, not accuracy, for rare events.<\/li><li>The threshold trades one for the other, and costs should set it.<\/li><li>Precision depends on the base rate, so an impressive model can still produce mostly false alarms.<\/li><\/ul>\n\n<h2>Key terms<\/h2>\n<dl class=\"terms\"><dt>True / false positive<\/dt><dd>A flagged case that is / is not really positive.<\/dd><dt>False negative<\/dt><dd>A real case the model missed.<\/dd><dt>Threshold<\/dt><dd>The score above which we act.<\/dd><dt>Base rate<\/dt><dd>How common the positive class is.<\/dd><dt>ROC-AUC<\/dt><dd>The area under the recall versus false-positive-rate curve.<\/dd><dt>Calibration<\/dt><dd>Whether predicted probabilities match observed frequencies.<\/dd><\/dl>","js":"// Fraud detection: sweep the threshold and find the cheapest one.\nseed(21);\nconst N = 10000, RATE = 0.02;       // try 0.005 and 0.10\nconst COST_MISS = 200, COST_FALSE_ALARM = 5;   // try 50 and 500\nconst data = range(N).map(() => {\n  const fraud = rand() < RATE;\n  const s = (fraud ? 0.65 : 0.30) + 0.15 * randn();          // the model's score\n  return { s: Math.min(1, Math.max(0, s)), fraud };\n});\n\nfunction evaluate(t) {\n  let TP = 0, FP = 0, FN = 0, TN = 0;\n  for (const d of data) {\n    const flag = d.s >= t;\n    if (flag && d.fraud) TP++; else if (flag) FP++; else if (d.fraud) FN++; else TN++;\n  }\n  return { t, TP, FP, FN, precision: TP / Math.max(1, TP + FP), recall: TP / Math.max(1, TP + FN),\n           cost: FN * COST_MISS + FP * COST_FALSE_ALARM };\n}\n\nconst ts = range(19).map(i => 0.05 * (i + 1));\nconst res = ts.map(evaluate);\nres.forEach(r => print(\"t =\", r.t, \" precision\", r.precision, \" recall\", r.recall, \" cost\", r.cost));\nconst best = res.reduce((a, b) => (b.cost < a.cost ? b : a));\nprint(\"cheapest threshold:\", best.t, \"with cost\", best.cost);\nprint(\"always predicting legit costs\", sum(data.map(d => d.fraud ? COST_MISS : 0)));\nplot({ title: \"total cost vs threshold\", x: ts, series: [{ name: \"cost\", y: res.map(r => r.cost) }] });\n","py":"from sklearn.metrics import precision_score, recall_score, confusion_matrix\n\npred = (scores >= 0.5).astype(int)\nprint(confusion_matrix(y_true, pred))\nprint(precision_score(y_true, pred), recall_score(y_true, pred))","edits":["Change <code>RATE<\/code> to 0.005, then 0.10 and compare the cheapest threshold.","Change <code>COST_MISS<\/code> to 50 and then 500. Which way does the best threshold move?","Make the model better: change 0.65 to 0.75 (fraud scores shift right). How does the cheapest cost change?","Add an F1 column to the printout."],"build":"<p>Use the public credit card fraud dataset (about 0.17% fraud). Train logistic regression, plot the precision-recall curve, and choose a threshold from explicit cost assumptions. Explain why ROC-AUC looks flattering on this dataset.<\/p>","interview":[["Why is accuracy a bad metric for imbalanced data?","A trivial classifier that always predicts the majority class scores very high while being useless. Precision, recall, F1 and PR-AUC focus on the rare class."],["How would you choose a classification threshold?","On validation data, using the business costs of false positives and false negatives (or a capacity constraint such as reviewing N alerts a day), ideally with calibrated probabilities. Then confirm on the test set."],["With 1% positives, recall 90% and FPR 5%, what is the precision?","Per 10,000 cases: 100 positives, so TP = 90; 9,900 negatives, so FP = 495. Precision = 90 / 585 ≈ 15%."]],"exp":["At threshold 0.50 with 2% fraud, look at <b>precision<\/b>. Most alerts are false alarms even though the model looks strong.","Slide the threshold to 0.80. Precision climbs, but recall collapses: most fraud gets through.","Raise the fraud share to 10% and go back to 0.50. Same model, but precision jumps. Precision depends on how common the thing is.","Raise the cost of a missed fraud to $500. The cheapest threshold moves left, because misses now hurt more."],"look":"Top chart: how the model scores legitimate transactions (blue) and fraudulent ones (orange). They overlap, so no threshold is perfect. Everything to the right of the black line gets flagged. The table shows outcomes for every 10,000 transactions, and the lower chart shows total cost at each threshold."}};

/* quiz */
let QS={list:null,set:'all',i:0,score:0,missed:[],answered:false,done:false};
const QSETS=[['all','Everything'],['0','Beginner stage'],['1','Intermediate stage'],['2','Advanced stage']];

function viewQuiz(app,h){
  CUR=null;app.innerHTML='';if(h==='quiz'&&QS.set==='review')QS={list:null,set:'all',i:0,score:0,missed:[],answered:false,done:false};if(h==='review'&&(QS.set!=='review'||!QS.list||QS.done)){QS={list:dueList(),set:'review',i:0,score:0,missed:[],answered:false,done:false}}

  const holder=el('div',{});w.append(holder);app.append(w);

  const choose=()=>{const sets=el('div',{class:'opts'},QSETS.map(([k,t])=>{const n=qList(k).length,b=(P.qb||{})[k];return el('button',{class:'opt',type:'button',disabled:n?null:'disabled',onclick:()=>{QS={list:qList(k),set:k,i:0,score:0,missed:[],answered:false,done:false};draw();window.scrollTo(0,0)}},t+': '+n+' questions'+(b!=null?'   (best '+b+')':''))}));
    holder.append(el('div',{class:'qcard'},el('p',{class:'kick'},'Quizzes'),el('h2',{},'How much do you want to try?'),el('p',{style:'margin:0 0 12px;color:var(--muted)'},'Each question comes with an explanation. Questions follow the learning path.'),sets))};
  const question=()=>{
    const q=QS.list[QS.i],L=LESSONS.find(x=>x.id===q.lvl),pct=QS.i/QS.list.length*100;
    const ex=el('p',{class:'explain',hidden:'hidden'}),nb=btn(QS.i===QS.list.length-1?'See my results':'Next question',()=>{QS.i++;QS.answered=false;if(QS.i>=QS.list.length){QS.done=true;P.qb=P.qb||{};if(QS.set!=='review')P.qb[QS.set]=Math.max(P.qb[QS.set]||0,QS.score);saveP();refreshStars()}draw();window.scrollTo(0,0);if(QS.done)celebrate(QS.score/QS.list.length>=.65?'Amazing work! Look at that score!':'Great effort! Every try makes you better.','cheer',innerWidth/2,innerHeight*.3)},'primary');nb.hidden=true;
    const opts=el('div',{class:'opts'},q.o.map((t,j)=>el('button',{class:'opt',type:'button',onclick:e=>{
      if(QS.answered)return;QS.answered=true;const ok=j===q.a;if(ok)QS.score++;else QS.missed.push(q.lvl);srsUpdate(q,ok);
      [...opts.children].forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('right');else if(k===j)b.classList.add('wrong')});
      ex.textContent=(ok?'Correct! ':'Not quite. ')+q.w;ex.hidden=false;nb.hidden=false;
      if(ok){const r=e.currentTarget.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2,55);if(helper)helper.say(pick(YAY),'cheer',3500)}else if(helper)helper.say(pick(OOPS),'oops',4500)}},t)));
    holder.append(el('div',{class:'track'},el('div',{class:'fill',style:'width:'+pct+'%'}),el('div',{class:'rider',style:'left:'+(4+pct*.92)+'%',html:boltSVG()})),
      el('div',{class:'qcard'},el('p',{class:'kick'},'Question '+(QS.i+1)+' of '+QS.list.length+(L?'  |  Level '+L.n+': '+L.title:'  |  Interview: '+(q.topic||''))),el('h2',{},q.q),opts,ex,el('div',{style:'margin-top:14px'},nb)));
  };
  const result=()=>{
    const s=QS.score,n=QS.list.length,rt=s/n,title=rt>=.85?'Machine Learning Champion':rt>=.65?'Super Learner':rt>=.45?'Robot Trainer':'Curious Explorer',st=rt>=.85?3:rt>=.6?2:1;
    const miss=[...new Set(QS.missed)].map(id=>LESSONS.find(x=>x.id===id));
    holder.append(el('div',{class:'qcard result'},el('div',{html:boltSVG('cheer')+''}),el('p',{class:'kick'},'Your result'),el('div',{class:'big'},s+' / '+n),el('h2',{style:'margin:0'},title),
      el('div',{class:'stars',html:[1,2,3].map(k=>starIcon(k<=st)).join('')}),
      el('p',{style:'margin:0'},rt>=.85?'Wow! You really understand how machines learn.':rt>=.65?'Very strong. A little review and you will be a champion.':rt>=.45?'Good start. The levels below will help with the ones you missed.':'Every expert started here. Replay the demos and try again, you will improve fast.'),
      miss.length?el('div',{class:'missed'},el('h3',{},'Worth another look'),miss.map(L=>el('a',{class:'btn small',href:'#level-'+L.id},'Level '+L.n+': '+L.title))):el('p',{style:'margin:0;font-weight:800'},'No misses. Perfect round!'),
      el('div',{class:'row'},btn('Choose another quiz',()=>{QS={list:null,set:'all',i:0,score:0,missed:[],answered:false,done:false};draw();window.scrollTo(0,0)},'primary'),el('a',{class:'btn',href:'#'},'Back to the map')),
      el('div',{class:'missed'},el('h3',{},'Where to go next'),el('ol',{class:'next'},['Learn Python and the scikit-learn library, then rebuild the models from these levels on real data.','Pick up the maths in this order: probability, linear algebra, then a little calculus.','Practise on small public datasets and write down what you find, including what went wrong.','Try PyTorch and build the neural network from level '+num('nn')+' yourself, then explore attention and retrieval (levels '+num('attn')+' and '+num('rag')+') with a small open model.','Before sharing a project, test it on each group of people it affects and write a short model card.'].map(t=>el('li',{},t))))));
  };
  draw();
  if(helper&&route.last!==route.prev&&!QS.done)helper.say('Quiz time! Take your time, there is no rush.','happy',4500);

/* router */
function route(){if(!CU)return;
  cleanup();document.documentElement.dataset.mode=P.mode;const h=location.hash.replace(/^#/,''),app=$('#app');mountHelper();
  const L=h.startsWith('level-')?LESSONS.find(x=>'level-'+x.id===h):null;

  if(L)viewLesson(app,L);else if(h==='quiz'||h==='review')viewQuiz(app,h);else if(h==='certificate')viewCertificate(app);else if(h==='design')viewDesign(app);else if(h.startsWith('design-'))viewDesign(app,h.slice(7));else if(h==='projects')viewProjects(app);else if(h.startsWith('project-'))viewProjects(app,h.slice(8));else if(h==='interview')viewInterview(app);else if(h==='build')viewBuild(app);else if(h==='python')viewPlay(app);else if(h.startsWith('build-'))viewBuild(app,h.slice(6));else viewHome(app);
