<tr><td>equalised odds</td><td>Equal true positive <i>and</i> false positive rates.</td></tr>
<tr><td>calibration</td><td>When the model says 70%, is it right about 70% of the time in every group?</td></tr>
</table></div>
<h2>Why you cannot have everything</h2>
<p>When the groups have different base rates (in the toy, 70% of A and 50% of B would repay), several of these ideas cannot all be true at the same time except in special cases. Equalising good applicants, as in the task, still leaves different overall approval rates. Choosing a fairness definition is therefore a <b>human decision</b> about values, law and harm. It cannot be settled by maths alone.</p>
<h2>What teams do about it</h2>
<ol><li><b>Check the data</b> for coverage and label quality, and document where it came from.</li>
<li><b>Measure by group</b> instead of reporting one overall number.</li>
<li><b>Adjust</b> in one of three places: the data (re-balance or fix labels), the training (add a fairness penalty), or the decision (group-aware cut-offs, as in the demo, where that is legal and appropriate).</li>
<li><b>Keep humans in the loop</b> for high-stakes decisions, with a way to appeal.</li>
<li><b>Monitor after launch</b> (level 14), because drift can reintroduce gaps.</li></ol>
<h2>Explaining a model</h2>
<p>People affected by a decision may be owed a reason, and builders need to debug their models.</p>
<ul><li><b>Simple models</b> such as small trees and linear models can be read directly.</li>
<li><b>Feature importance</b> ranks which inputs matter most overall.</li>
<li><b>Local explanations</b> such as SHAP and LIME estimate how much each feature pushed one particular decision up or down.</li>
<li><b>Counterfactuals</b> say what would need to change to get a different result: "approved if income were X higher".</li>
<li>Explanations are approximations. They can be misleading if over-trusted.</li></ul>
<h2>Paperwork that helps</h2>
<p>A <b>model card</b> says what a model is for, what data trained it, how it performs for different groups, and where it should not be used. A <b>datasheet</b> does the same for a dataset. Laws and standards such as the EU AI Act and risk frameworks are making this kind of documentation and testing a requirement in more places.</p>`,
then:[['Checking for bias','Rarely tested. Only overall accuracy was reported.','Per-group results, audits and fairness toolkits are common practice for high-stakes systems.'],['Explaining decisions','"The computer said no."','Tools like SHAP, counterfactual explanations and reason codes help explain individual decisions. Some laws require explanations.'],['Rules','Few rules specific to automated decisions.','Regulation such as the EU AI Act sets duties by risk level. Standards bodies publish risk frameworks.'],['Documentation','Models passed around with no description.','Model cards and datasheets describe purpose, data, limits and tests.'],['Who decides','Developers alone.','Impacted people, domain experts, lawyers and ethicists are increasingly involved in choosing what fair means for a product.']],
words:[['Bias','A systematic, unfair difference in how groups are treated or measured.'],['Proxy','A harmless-looking column that secretly stands for a sensitive one.'],['Demographic parity','Equal approval rates for all groups.'],['Equal opportunity','Equal approval rates among people who would truly succeed.'],['Base rate','How common the thing is in a group before the model looks.'],['Explainability','Giving a reason that a person can understand for a model\'s answer.'],['Model card','A short document about what a model is for and where it is weak.']]}
];

const LF=[
{id:'feat',title:'Choosing and shaping the clues',sub:'Feature engineering and scaling',tint:'sun',
hook:'A model can only learn from the clues you give it. Picking and preparing them is often worth more than picking a fancier model.',
kid:`<p>Imagine guessing whether a customer will be happy. You could look at their shoe size, or at how long they waited for help. One of those is a much better clue. Choosing and shaping clues is called <b>feature engineering</b>.</p>
<p>Shaping matters too. If one clue is measured in thousands (income) and another in tiny numbers (age gap), the big numbers shout over the small ones. <b>Scaling</b> puts every clue on the same footing so each one gets a fair say.</p>
<div class="callout"><b>Beware the cheat clue.</b> Some clues secretly contain the answer, like a "refund issued" column when you are predicting unhappy customers. The model looks brilliant in testing and useless in real life. This is called <b>leakage</b>.</div>`,
look:`Switch clues on and off, choose how to scale them, and watch the accuracy of a simple neighbour-voting model. One clue is a cheat: it is only known after the outcome. Another is pure noise.`,
tries:['Turn on every clue one at a time and watch the accuracy after each.','Add the <b>noise</b> clue. Does it help? It usually hurts a little, because neighbours become distracted.','Switch the scaling between None and Standardise. Big-number clues stop drowning out small ones.','Turn on the leaky <b>refund issued</b> clue. Accuracy jumps, and that jump is a warning, not a win.'],
deep:`<h2>Why scaling matters</h2>
<p>Distance-based methods (neighbours, clustering, many kernels) and gradient-based methods (neural networks, linear models) are sensitive to the size of numbers. Trees are not, because they only compare a value with a threshold.</p>
<div class="math">standardise:  z = (x - mean) / spread
squash:       x' = (x - min) / (max - min)</div>
<p>Compute the mean and spread on the <b>training</b> data only, then reuse them on new data. Using the test data to compute them leaks information.</p>
<h2>Making better clues</h2>
<ul><li><b>Combine</b>: price per square metre is more informative than price and area separately.</li>
<li><b>Split dates</b>: day of week, hour, is-holiday.</li>
<li><b>Encode categories</b>: one-hot columns for a handful of values, or learned embeddings (level [[embed]]) for thousands.</li>
<li><b>Handle skew</b>: take the log of money-like values.</li>
<li><b>Handle missing values</b>: fill them in, and add a "was missing" flag, because missing often carries meaning.</li></ul>
<h2>Leakage</h2>
<p>Ask of every feature: <i>will I know this at the moment I must make the prediction?</i> If not, drop it. Leaks also hide in how data is split (the same customer in both train and test) and in time (using next week's data to predict this week).</p>`,
then:[['Tabular business data','Hand-crafted columns by an analyst.','Still hand-crafted and still decisive. Gradient-boosted trees on well-made features remain a strong default for tables.'],['Text','Word counts.','Learned embeddings from large language models replace most hand-made text features.'],['Images','Hand-made edge and corner detectors.','Networks learn their own features from pixels.'],['Reuse across teams','Everyone rebuilt the same columns.','Feature stores keep one trusted definition of each feature for training and serving.'],['Safety checks','Spotted by luck.','Teams review features for leakage and test on time-ordered splits.']],
words:[['Feature','One measurable clue about an example.'],['Scaling','Rewriting numbers so clues have comparable size.'],['Standardise','Shift to mean 0 and spread 1.'],['One-hot','Turn a category into yes/no columns.'],['Leakage','A feature that secretly contains the answer or the future.'],['Feature store','A shared place where trusted features are defined once.']]},

{id:'cv',title:'Testing fairly, many times',sub:'Cross-validation and model selection',tint:'sky',
hook:'One test can be lucky or unlucky. Testing on several different slices gives a score you can trust.',
kid:`<p>A single spelling test might happen to contain only words you know. To judge fairly, you take several tests with different words and average the marks.</p>
<p><b>Cross-validation</b> does this for models. Split the data into pieces called <b>folds</b>. Train on all but one fold and test on the held-out fold. Do that once for each fold, then average. You also see how much the score <i>wobbles</i>, which tells you how far to trust it.</p>
<div class="callout"><b>Never choose by the final exam.</b> Choose settings (like how many neighbours to ask) using cross-validation, and use the untouched test set once, at the very end.</div>`,
look:`A neighbour-voting model has a setting k, the number of neighbours that vote. The blue line is the cross-validation score for each k. The orange line is a big hidden test set, which you normally would not have.`,
tries:['Move <b>k</b> and read the cross-validation score and its wobble.','Press <b>Shuffle the folds</b>. The blue line moves a little. That wobble is real uncertainty.','Increase the number of folds. Scores get less biased but cost more compute.','Compare the blue peak with the orange peak. They rarely match exactly, but they are close.'],
deep:`<h2>The recipe</h2>
<ol><li>Hold out a final test set and do not touch it.</li><li>Split the rest into K folds.</li><li>For each setting you want to compare, train K times, each time leaving one fold out, and average the K scores.</li><li>Pick the best setting, retrain on all non-test data, and score once on the test set.</li></ol>
<div class="math">CV score = (1/K) * sum over folds of  score(model trained without fold i, on fold i)</div>
<h2>Choosing K</h2>
<ul><li>K = 5 or 10 is the common default.</li><li>Leave-one-out (K = n) has low bias but is expensive and noisy.</li></ul>
<h2>Variants you will need</h2>
<ul><li><b>Stratified</b> folds keep the class mix the same in every fold, important for rare classes.</li><li><b>Grouped</b> folds keep all rows of one person or device together, to avoid leakage.</li><li><b>Time-series</b> splits always train on the past and test on the future (level [[ts]]).</li></ul>
<h2>The trap</h2>
<p>If you try hundreds of settings and report the best CV score, that score is optimistic, because you picked the lucky one. The untouched test set (or nested cross-validation) gives the honest number.</p>`,
then:[['Comparing models','One train/test split and hope.','Repeated or nested cross-validation, with confidence intervals.'],['Tuning settings','Grid search by hand.','Automated search (random, Bayesian) scored by cross-validation.'],['Big models','Too expensive to repeat.','Often one validation split, because training is costly, with careful held-out sets.'],['Leaderboards','Public scores overfit.','Hidden test sets and private leaderboards guard against overfitting to the public one.'],['Clinical models','A single hospital.','External validation at other sites before trusting results.']],
words:[['Fold','One slice of the data held out in turn.'],['Cross-validation','Averaging scores from several train/hold-out rounds.'],['Hyperparameter','A setting you choose before training, like k.'],['Stratified','Folds that keep the same class mix.'],['Nested CV','Cross-validation inside cross-validation to give an honest estimate after tuning.'],['Validation set','Data used to choose settings, kept apart from the final test.']]},

{id:'reg',title:'Keeping models humble',sub:'Regularisation: L1 and L2',tint:'coral',
hook:'A penalty on big weights stops a model from over-trusting any one clue. One kind of penalty can even switch useless clues off.',
kid:`<p>Imagine a team where one loud player makes every decision. That is risky. A good coach says: <i>"share the work, nobody gets too important unless they really earn it"</i>.</p>
<p><b>Regularisation</b> is that coach. We add a small cost for large weights. The model must now balance <i>fitting the data</i> against <i>staying simple</i>.</p>
<p>There are two famous coaches. <b>L2</b> shrinks every weight gently towards zero. <b>L1</b> is stricter: it can push weak weights all the way to exactly zero, which removes those clues entirely.</p>`,
look:`The map shows the two weights. The blue rings are the error: the bullseye is the best fit. The green shape is the allowed region set by the penalty. The dot is where the two meet. Turn the penalty up and watch it slide.`,
tries:['Start with penalty 0. The dot sits at the bullseye, the best fit.','Raise the penalty with <b>L2</b>. Both weights shrink smoothly but never hit zero.','Switch to <b>L1</b> and raise it. The weak weight snaps to exactly zero.','Look at the lower chart: L1 paths drop to zero and stay, L2 paths only approach it.'],
deep:`<h2>The new objective</h2>
<div class="math">minimise   error(w)  +  lambda * penalty(w)
L2 (ridge):   penalty = sum of w squared
L1 (lasso):   penalty = sum of |w|</div>
<p>lambda is the strength. Zero means no penalty; very large means every weight is pushed to zero.</p>
<h2>Why L1 gives exact zeros</h2>
<p>The L1 region is a diamond with sharp corners on the axes. The error rings usually touch it at a corner, where one weight is exactly zero. The L2 region is a smooth disc with no corners, so the touching point is almost never on an axis.</p>
<h2>Where else you meet it</h2>
<ul><li><b>Weight decay</b> in neural networks is L2 regularisation.</li><li><b>Dropout</b> randomly silences neurons during training, a different way of keeping a network from leaning on any one part.</li><li><b>Early stopping</b> halts training when the validation score stops improving.</li><li>Tree depth limits and minimum leaf size are regularisation too.</li></ul>
<h2>Choosing lambda</h2>
<p>Use cross-validation (level [[cv]]). Scale features first (level [[feat]]), because the penalty treats all weights alike.</p>`,
then:[['Linear models','Plain least squares with many columns.','Ridge, lasso and elastic net are the standard.'],['Neural networks','Small nets, early stopping.','Weight decay (usually inside AdamW), dropout and data augmentation.'],['Feature selection','Manual pruning.','L1 as an automatic selector for sparse problems.'],['Large language models','n/a','Weight decay, dropout in some designs, and huge, diverse data as the main guard against overfitting.'],['Bayesian view','A separate field.','Penalties correspond to prior beliefs about the weights.']],
words:[['Regularisation','Any trick that discourages a model from being too complex.'],['L2 / ridge','A penalty on squared weights. Shrinks smoothly.'],['L1 / lasso','A penalty on absolute weights. Can set weights exactly to zero.'],['Lambda','The strength of the penalty.'],['Weight decay','L2 regularisation applied during neural network training.'],['Sparse','Mostly zeros.']]},

{id:'ts',title:'Predicting what comes next in time',sub:'Time series and forecasting',tint:'mint',
hook:'Sales, weather and traffic have trends and seasons. A good forecast uses them and is judged only on the future.',
kid:`<p>Ice cream sells more every summer, and a little more each year. If you know both the <b>trend</b> (growing over the years) and the <b>season</b> (peaks every summer), you can guess next July pretty well.</p>
<p>Forecasting has one strict rule: <b>no peeking at the future</b>. You learn from the past and are judged on what comes after. That is why you cannot shuffle time-series data like flash cards.</p>
<div class="callout"><b>Always beat the lazy guess.</b> The simplest forecast is "same as last year". If a fancy model cannot beat that, it is not worth using.</div>`,
look:`The line is monthly sales. The model learns from the first ten years and forecasts the last two. Try simple methods first, then ones that learn trend and season.`,
tries:['Choose <b>Same as last month</b>. Easy, but it misses the yearly wave.','Choose <b>Same as last year</b>. This is the seasonal baseline to beat.','Try <b>Moving average</b> and change its window. It smooths, but lags behind a trend.','Try <b>Smoothing with trend and season</b> and tune the sliders.'],
deep:`<h2>The parts of a series</h2>
<div class="math">value(t) = trend(t) + season(t) + noise(t)      (additive)
value(t) = trend(t) * season(t) * noise(t)      (multiplicative)</div>
<h2>Classic methods</h2>
<ul><li><b>Naive and seasonal naive</b>: repeat the last value, or the value one season ago.</li>
<li><b>Moving average</b>: the mean of the last few points.</li>
<li><b>Exponential smoothing</b>: a weighted mean where recent points count more. Alpha sets how fast old weight fades.</li>
<li><b>Holt-Winters</b>: smoothing for level, trend and season together.</li>
<li><b>ARIMA</b>: models the next value from past values and past errors.</li></ul>
<h2>Modern methods</h2>
<p>Gradient-boosted trees on lag features, recurrent and transformer networks (levels [[rnn]] and [[attn]]) and pretrained forecasting models. Many benchmarks show that well-tuned simple methods remain hard to beat on small series.</p>
<h2>Evaluating fairly</h2>
<ul><li>Split by time. Train on the past, test on the future. Use rolling-origin evaluation for several tests.</li><li>Measure with MAE or MAPE, and always compare with the seasonal-naive baseline.</li><li>Watch for events the history cannot know: holidays, promotions, a pandemic.</li></ul>`,
then:[['Retail demand','Spreadsheets and rules of thumb.','Models per product with price, promotion and weather features, often boosted trees or neural nets.'],['Energy','Fixed load tables.','Forecasts of demand and solar and wind output guide grids hour by hour.'],['Weather','Physics only.','Physics simulations plus learned models that run far faster.'],['Finance','Linear and ARIMA models.','Used with great caution: markets react to forecasts, and signals fade.'],['Operations','Static capacity plans.','Forecasts drive staffing, servers and inventory.']],
words:[['Trend','The long-term direction.'],['Seasonality','A pattern that repeats on a calendar.'],['Baseline','A simple forecast every model must beat.'],['Exponential smoothing','A weighted average that favours recent values.'],['MAE','Mean absolute error: the typical size of a miss.'],['Rolling origin','Repeating forecast tests at several points in time.']]},

{id:'anom',title:'Spotting the odd one out',sub:'Anomaly detection',tint:'coral',
hook:'Fraud, broken machines and cyber attacks are rare. Instead of learning what they look like, learn what normal looks like and flag what is far from it.',
kid:`<p>Imagine a class photo where everyone stands in neat rows, but one kid is standing on the roof. You do not need to know any rules about roofs. They are simply <b>far from everyone else</b>.</p>
<p>That is <b>anomaly detection</b>. It is useful because the bad cases are so rare and varied that you cannot collect enough examples to teach a normal classifier.</p>
<div class="callout"><b>Two ways to be wrong.</b> Flag too much and people get annoying false alarms. Flag too little and you miss the real problems. Precision and recall (level [[metrics]]) tell you which is happening.</div>`,
look:`The cloud is normal behaviour. Real oddballs are marked with a ring only when you check. Pick a method, then choose what fraction of points to flag.`,
tries:['Use <b>per-feature z-score</b>. It checks each axis alone and misses oddballs that sit in the "empty" space between axes.','Switch to <b>Mahalanobis distance</b>. It knows the cloud is tilted.','Try <b>Isolation forest</b>. It cuts the space at random along the axes, so on this tilted cloud it does worse than Mahalanobis. Every method has blind spots.','Change the flag percentage. More flags catch more oddballs but lower precision.'],
deep:`<h2>Methods, from simple to flexible</h2>
<ul><li><b>Z-score</b>: how many standard deviations a value is from the mean, one feature at a time.</li>
<li><b>Mahalanobis distance</b>: the same idea in many dimensions, accounting for correlation.</li>
<li><b>Isolation forest</b>: build random trees. Anomalies are isolated with fewer cuts, so their average path length is short.</li>
<li><b>Reconstruction error</b>: train an autoencoder (level [[gen]]) on normal data; weird inputs rebuild badly.</li>
<li><b>Density and distance</b>: points in sparse regions, or far from their neighbours.</li></ul>
<div class="math">Mahalanobis:  d(x) = sqrt( (x - mean)^T * Cov^-1 * (x - mean) )</div>
<h2>Why it is hard</h2>
<ul><li>Labels are scarce, so evaluation is hard.</li><li>"Normal" drifts over time (level [[ops]]).</li><li>The cost of a miss and a false alarm are rarely equal; set the threshold from the business cost.</li></ul>`,
then:[['Card fraud','Fixed rules like "amount over limit".','Learned risk scores per transaction, combined with rules and human review.'],['Factories','Alarms at fixed levels.','Sensor models flag unusual vibration and heat before failure.'],['Security','Known-bad signatures.','Behaviour baselines flag unusual logins and traffic.'],['Servers','Static thresholds.','Metrics are modelled with seasonality so only real surprises raise alerts.'],['Healthcare','Manual review.','Screening models highlight unusual scans or signals for clinicians.']],
words:[['Anomaly','An example unlike normal behaviour.'],['Z-score','Distance from the mean in standard deviations.'],['Mahalanobis distance','Distance that accounts for how features move together.'],['Isolation forest','A method that finds points easy to cut off from the rest.'],['False alarm','A normal point wrongly flagged.'],['Threshold','The cut-off that decides what to flag.']]},

{id:'opt',title:'Smarter ways to roll downhill',sub:'Optimisers: momentum, RMSprop, Adam',tint:'sky',
hook:'Plain gradient descent zig-zags in narrow valleys. Better optimisers remember where they were heading and adapt their step to each direction.',
kid:`<p>Picture a ball rolling down a long, narrow canyon. The walls are steep, the floor is almost flat. Plain steps bounce from wall to wall and barely move along the floor.</p>
<p>A smarter ball has <b>momentum</b>: it keeps some of its speed, so the side-to-side bounces cancel while the forward motion builds up. Other methods like <b>RMSprop</b> and <b>Adam</b> also give each direction its own step size: small where it is steep, big where it is flat.</p>`,
look:`Tap the map to choose a start. Pick an optimiser and press Play. Dark means low loss. The green X is the lowest point.`,
tries:['Run <b>plain gradient descent</b> on the long valley. Raise the learning rate until it starts bouncing.','Switch to <b>Momentum</b>. It rolls along the floor much faster.','Try <b>RMSprop</b> and <b>Adam</b>. They adapt step sizes without a lot of tuning.','Switch to the <b>banana valley</b> and tap different starts.'],
deep:`<h2>The updates</h2>
<div class="math">SGD:        w = w - lr * g
Momentum:   v = beta*v - lr*g ;  w = w + v
RMSprop:    s = 0.9*s + 0.1*g^2 ;  w = w - lr * g / (sqrt(s) + eps)
Adam:       m = b1*m + (1-b1)*g ;  s = b2*s + (1-b2)*g^2
            w = w - lr * m_hat / (sqrt(s_hat) + eps)</div>
<h2>What each one fixes</h2>
<ul><li><b>Momentum</b> smooths noisy directions and speeds up consistent ones.</li><li><b>RMSprop</b> divides by a running size of the gradient, so each parameter gets its own scale.</li><li><b>Adam</b> combines both, with bias correction for the early steps.</li></ul>
<h2>In practice</h2>
<ul><li>AdamW (Adam with decoupled weight decay) is the default for transformers.</li><li>SGD with momentum is still common for image models.</li><li>Learning-rate schedules matter as much as the optimiser: warm up, then decay.</li><li>Gradient clipping prevents rare huge steps from wrecking training.</li></ul>
<p>The loss surfaces of real networks have millions of dimensions, and this two-dimensional toy only shows the flavour.</p>`,
then:[['Vision models','SGD with hand-tuned schedules.','SGD with momentum or AdamW with cosine schedules.'],['Language models','n/a','AdamW with warm-up, decay and gradient clipping.'],['Memory use','Optimiser state was small.','Adam stores two extra numbers per weight, so large runs use memory-saving variants or sharding.'],['Tuning','Grid search.','Learning-rate range tests and automated search.'],['New ideas','Few choices.','Many variants (Lion, Adafactor, Muon and others) trade memory for speed.']],
words:[['Learning rate','How big each step is.'],['Momentum','Keeping part of the previous step.'],['RMSprop','Dividing steps by a running size of recent gradients.'],['Adam','Momentum plus RMSprop-style scaling.'],['Schedule','A plan for changing the learning rate over time.'],['Gradient clipping','Capping the size of a step.']]}
];

const LG=[
{id:'info',title:'Measuring surprise',sub:'Entropy, cross-entropy and KL divergence',tint:'sun',
hook:'Information theory gives us one number for how surprising the world is, and another for how much a wrong guess costs. It is the maths behind most classification losses.',
kid:`<p>If I tell you "the sun rose today", you learn almost nothing. If I tell you "it snowed in the desert", you learn a lot. <b>Surprise</b> is how unlikely something is. Rare things carry more information.</p>
<p><b>Entropy</b> is the average surprise of a source. A fair coin is the most surprising kind of coin. A coin that always lands heads has zero surprise.</p>
<p>Now suppose you guess the odds wrongly. You will be more surprised than you should be. The extra surprise is the price of your wrong beliefs, and training a model means shrinking that price.</p>`,
look:`The light bars are the real chances of four kinds of weather. The strong bars are the model's guess, made from four score sliders. The numbers show surprise, in bits.`,
tries:['Press <b>All equal</b>. The model knows nothing, so it wastes bits.','Press <b>Confidently wrong</b>. The wasted bits shoot up. Being sure and wrong is expensive.','Move one slider at a time until its bar matches the light bar.','Watch cross-entropy never drop below the entropy of the truth.'],
deep:`<h2>Three quantities</h2>
<div class="math">surprise of an event:   -log2 p(x)               (bits)
entropy:               H(p)    = - sum p(x) log2 p(x)
cross-entropy:         H(p,q)  = - sum p(x) log2 q(x)
KL divergence:         KL(p||q) = H(p,q) - H(p)  >= 0</div>
<p>Entropy is the best possible average cost when you know the true odds p. Cross-entropy is your average cost when you believe odds q but the world follows p. KL is the penalty for being wrong, and it is zero only if q equals p.</p>
<h2>Why classifiers use cross-entropy</h2>
<p>With one-hot labels, cross-entropy reduces to -log of the probability the model gave the correct class. Minimising it is the same as maximum likelihood (level [[logreg]]). With softmax outputs its gradient is simply (prediction minus truth), which is why it trains smoothly.</p>
<h2>Where else it appears</h2>
<ul><li><b>Perplexity</b> for language models is 2 to the cross-entropy: the effective number of equally likely next words.</li><li><b>KL terms</b> in generative models (level [[gen]]) and in reinforcement learning from feedback keep a model near a reference.</li><li><b>Mutual information</b> measures how much one variable tells you about another, used in feature selection.</li><li><b>Decision trees</b> choose splits by information gain, the drop in entropy (level [[trees]]).</li></ul>`,
then:[['Classifiers','Squared error on labels.','Cross-entropy is the default loss.'],['Language models','n-gram counts.','Trained by cross-entropy on next-word prediction; quality is reported as perplexity.'],['Compression','Hand-designed codecs.','Learned compressors treat prediction and compression as the same problem.'],['Distillation','n/a','A small model copies a large one by matching its probabilities with a KL loss.'],['Tuning chat models','n/a','A KL penalty keeps the tuned model close to the original.']],
words:[['Bit','The information in one fair yes/no outcome.'],['Entropy','Average surprise of a source.'],['Cross-entropy','Average surprise when using the wrong odds.'],['KL divergence','The extra bits wasted by wrong odds.'],['Perplexity','How many equally likely choices the model feels it has.'],['Information gain','How much a split reduces entropy.']]},

{id:'bp',title:'How a network learns from its mistakes',sub:'Backpropagation',tint:'coral',
hook:'Backpropagation passes blame backwards through a network so every weight learns how to change. It is a careful use of the chain rule.',
kid:`<p>A relay team loses a race. Who was slow? You work backwards from the finish line: the last runner was a bit slow, but the third runner handed over the baton badly, which made everything later slower.</p>
<p>A network makes an answer by passing numbers <b>forward</b> through layers. If the answer is wrong, we pass <b>blame backwards</b>. Each weight finds out how much it contributed to the error and nudges itself in the direction that helps.</p>
<div class="callout"><b>Proof it works.</b> The demo checks its blame by nudging a weight a tiny bit and measuring the change in error. Both numbers agree.</div>`,
look:`A tiny network learns XOR, a pattern that no straight line can split. The table shows one example moving forward and the blame moving backward. Pick a corner to inspect.`,
tries:['Press <b>One step</b> a few times and watch the loss and the colours move.','Pick another corner (A to D) and compare the blame numbers.','Press <b>Play</b> and watch the background bend into a shape that separates the corners.','If it gets stuck, press <b>New random start</b>.'],
deep:`<h2>The chain rule</h2>
<p>If the loss L depends on z, which depends on h, which depends on w, then the effect of w on L is the product of the links.</p>
<div class="math">dL/dw = dL/dz * dz/dh * dh/dw</div>
<h2>For a small network</h2>
<div class="math">forward:   h = tanh(W1 x + b1)       z = W2 . h + b2       p = sigmoid(z)
loss:      L = -[y log p + (1-y) log(1-p)]
backward:  dL/dz   = p - y
           dL/dW2  = (p - y) * h
           dL/dh   = (p - y) * W2
           dL/dpre = dL/dh * (1 - h^2)       (derivative of tanh)
           dL/dW1  = dL/dpre * x</div>
<h2>Why it is efficient</h2>
<p>Backprop computes the gradient for all weights in about the cost of two forward passes, by reusing the blame from later layers. Computing each weight's effect separately would be millions of times slower.</p>
<h2>What can go wrong</h2>
<ul><li><b>Vanishing gradients</b>: blame shrinks as it travels back through many layers (level [[rnn]]).</li><li><b>Exploding gradients</b>: blame grows; clip it.</li><li><b>Dead units</b>: ReLU neurons stuck at zero stop learning.</li><li><b>Bad initial weights</b>: all zeros makes every neuron identical, so none can specialise.</li></ul>
<p>Modern frameworks do this automatically (automatic differentiation). You write the forward pass; the backward pass is derived for you. Gradient-checking by finite differences is still the best way to test custom code.</p>`,
then:[['Writing training code','Derive and code gradients by hand.','Automatic differentiation in PyTorch and JAX does it.'],['Training scale','One machine.','Thousands of accelerators, with gradients combined across them every step.'],['Memory','Store all activations.','Gradient checkpointing recomputes some to save memory.'],['Debugging','Guess.','Gradient checks, norm monitoring and loss-curve inspection.'],['Beyond backprop','The only way.','Still the workhorse; alternatives remain research topics.']],
words:[['Forward pass','Computing the answer from the input.'],['Backward pass','Computing how the error depends on each weight.'],['Chain rule','The calculus rule for effects that pass through steps.'],['Gradient','The list of nudges that would reduce the error.'],['Autodiff','Software that derives the backward pass for you.'],['Gradient check','Comparing backprop with a tiny-nudge estimate.']]},

{id:'rnn',title:'Remembering across a sequence',sub:'Recurrent networks, LSTM and vanishing gradients',tint:'mint',
hook:'Before attention, networks read text one word at a time and carried a memory forward. Their memory faded for a reason you can calculate.',
kid:`<p>Whisper a message down a line of children. By the end it is quiet and muddled. Each person passes on a little less of it.</p>
<p>A <b>recurrent network</b> reads one word at a time and passes a memory to the next step. When we teach it, the blame travels backwards through every step, and at each step it is multiplied by a number. Multiply by 0.8 thirty times and almost nothing is left.</p>
<p>A <b>gated</b> cell (like an LSTM) learns to hold the memory almost unchanged, a factor near 1, unless there is a good reason to change it.</p>`,
look:`The chart is drawn on a log scale: every grid line is ten times smaller than the one above. The red line is a plain cell and the green line a gated cell. The vertical line marks the sequence length.`,
tries:['Leave the plain factor at 0.8 and move T. The gradient collapses.','Raise the factor above 1. Now it <b>explodes</b> instead.','Move the gated cell\'s forget gate to 0.99 and see the memory survive.','Find the knife-edge factor near 1.0 for the plain cell.'],
deep:`<h2>The recurrence</h2>
<div class="math">h_t = tanh( W_h h_(t-1) + W_x x_t + b )</div>
<p>The same weights are reused at every step. During backpropagation through time, the gradient to step 1 involves the product of T Jacobians.</p>
<div class="math">dL/dh_1  ~  product over t of ( W_h^T * diag(tanh') )  ~  factor^T</div>
<p>If the typical factor is below 1, the gradient vanishes; above 1, it explodes. Clipping fixes explosions, but vanishing needs a design change.</p>
<h2>Gated cells</h2>
<ul><li><b>LSTM</b> keeps a cell state updated additively, controlled by forget, input and output gates. The additive path lets gradients flow almost unchanged.</li><li><b>GRU</b> is a lighter version with two gates.</li></ul>
<div class="math">c_t = f_t * c_(t-1) + i_t * candidate_t      (f near 1 keeps memory)</div>
<h2>Why attention took over</h2>
<p>Recurrent models must process steps in order, which is slow on GPUs, and still struggle with very long links. Attention (level [[attn]]) connects any two positions directly. Recurrence is not dead: state-space models and linear-attention variants bring back a cheap fixed-size memory for very long inputs.</p>`,
then:[['Speech and text','RNNs and LSTMs were the standard.','Transformers dominate; recurrent ideas live on in efficient long-sequence models.'],['Sensors and time series','LSTM forecasting.','Often boosted trees or small transformers; GRUs still used on small devices.'],['Translation','Encoder-decoder LSTMs.','Transformers.'],['Very long inputs','Impossible.','State-space and hybrid models target millions of tokens at low cost.'],['Control','Recurrent policies for memory.','Still used where a small memory state is enough.']],
words:[['Recurrent','Reusing the same step again and again over a sequence.'],['Hidden state','The memory passed from one step to the next.'],['Vanishing gradient','Blame that shrinks to nothing over many steps.'],['Exploding gradient','Blame that grows without bound.'],['LSTM / GRU','Gated cells designed to keep gradients alive.'],['Gate','A learned number between 0 and 1 that controls how much passes through.']]},

{id:'ft',title:'Teaching a big model a new trick cheaply',sub:'Fine-tuning and LoRA',tint:'sky',
hook:'Retraining a giant model is expensive. Often the change you need is small and simple, so you can learn just a thin patch.',
kid:`<p>You have a huge cookbook. You want it to cook your family's favourite dishes. You do not rewrite every page. You stick a few small notes on the pages that matter.</p>
<p><b>Fine-tuning</b> adapts a pretrained model to your job. <b>LoRA</b> does it cheaply: keep the big weights frozen and train two thin matrices whose product is the change. If the change is simple enough, a very small patch captures most of it.</p>`,
look:`The left grid is a weight matrix. The middle grid is a copy made from only a few parts (its rank). The bars on the right show how important each part is. Keep the tall ones.`,
tries:['Start at rank 1 and increase it one at a time. The copy gets closer.','Look at the bars: a few tall ones and a long tail of short ones.','Watch the numbers-to-store count. Rank 4 needs far fewer than the full grid.','Press <b>New matrix</b> and see how the answer changes.'],
deep:`<h2>The low-rank idea</h2>
<p>A matrix of size d by d can be approximated by a product of a d by r matrix and an r by d matrix. The best approximation comes from the singular value decomposition (SVD): keep the r largest singular values.</p>
<div class="math">W (d x d) ~ B (d x r) * A (r x d)
parameters:  d*d   becomes   2*d*r</div>
<h2>LoRA</h2>
<div class="math">W_new = W_frozen + (alpha / r) * B * A</div>
<p>Only A and B are trained. For a 4096 by 4096 layer and r = 8, that is about 65,000 numbers instead of 16.8 million. The adapters can be swapped or merged into the original weights after training.</p>
<h2>Other ways to adapt a model</h2>
<ul><li><b>Full fine-tuning</b>: best quality for large shifts, but expensive and needs a copy per task.</li><li><b>Prompting and retrieval</b> (level [[rag]]): no training at all, often enough.</li><li><b>Instruction tuning and preference tuning</b>: teach format, tone and helpfulness using examples and human or AI feedback.</li><li><b>QLoRA</b>: LoRA on top of a quantised base model (level [[quant]]).</li></ul>
<h2>Cautions</h2>
<p>Fine-tuning can cause forgetting of general skills, can bake in biases from the small dataset, and cannot reliably add lots of new facts. Check with held-out tests (level [[cv]]).</p>`,
then:[['Company assistants','Train a model from scratch.','Start from a general model; add retrieval first, fine-tune only if needed.'],['Image generation','Retrain everything.','Small adapters teach a style or a character.'],['Many customers','One model per customer.','One base model with swappable per-customer adapters.'],['Hardware','Needs a data centre.','LoRA-style methods fit large models onto a few GPUs.'],['Sharing','Whole checkpoints.','Small adapter files are shared and merged.']],
words:[['Fine-tuning','Continuing training of a pretrained model on your task.'],['Rank','How many independent patterns a matrix has.'],['SVD','A way to split a matrix into ranked parts.'],['LoRA','Training two thin matrices instead of the whole weight matrix.'],['Adapter','A small trained add-on to a frozen model.'],['Catastrophic forgetting','Losing old skills while learning new ones.']]},

{id:'quant',title:'Making big models small',sub:'Quantisation and efficiency',tint:'sun',
hook:'Large models are mostly big tables of numbers. Rounding those numbers to fewer bits makes them smaller and faster, as long as you round carefully.',
kid:`<p>Suppose you write a measurement as 3.14159265. You could write 3.14 instead and nobody would mind much. With fewer digits you need less paper.</p>
<p><b>Quantisation</b> does the same to a model's numbers. Instead of 16 bits per weight, use 8 or 4. The model takes a quarter of the space and can run on a phone.</p>
<div class="callout"><b>The trap is the biggest number.</b> All numbers in a group share one scale set by the largest. One giant weight makes all the others round badly. Splitting weights into small groups keeps the quiet ones accurate.</div>`,
look:`Each pair of bars is one weight: the original and the squeezed version. Choose how many bits and how big the groups are. Outliers are a few unusually large weights, which real models have.`,
tries:['Lower the bits from 8 to 2 and watch the error climb.','With one scale for all and outliers on, even 8 bits has noticeable error. Why?','Switch to groups of 64, then 16. The error falls, but the scales add to the cost.','Turn outliers off to see how much easier life is without them.'],
deep:`<h2>The basic recipe</h2>
<div class="math">scale = max|w| / (2^(bits-1) - 1)
q = round( w / scale )               (a small integer)
w_hat = q * scale                    (what the model uses)</div>
<p>The rounding error per weight is at most half a step. A bigger step (fewer bits, or a bigger max) means more error.</p>
<h2>Cost of the scales</h2>
<p>Each group stores one scale, usually 16 bits. With groups of g weights, the cost per weight is bits + 16/g. Groups of 64 at 4 bits cost 4.25 bits per weight.</p>
<h2>Where to quantise</h2>
<ul><li><b>Weights only</b>: easiest, big memory savings, now routine for chat models.</li><li><b>Weights and activations</b>: faster maths, harder because activations have outliers.</li><li><b>The key-value cache</b> of long chats can be compressed too.</li><li><b>Quantisation-aware training</b> simulates rounding during training for better quality at very low bits.</li></ul>
<h2>Other efficiency tools</h2>
<ul><li><b>Pruning</b>: remove unimportant weights.</li><li><b>Distillation</b>: teach a small model to copy a large one (level [[info]]).</li><li><b>Mixture of experts</b>: only a part of the network runs for each token.</li><li><b>Speculative decoding</b>: a small model drafts, the large model checks.</li></ul>
<p>Always re-test on your own tasks after quantising. Average benchmarks can hide losses in reasoning, rare languages or long inputs.</p>`,
then:[['Running chat models','Cloud GPUs only.','4-bit and 8-bit versions run on laptops and phones.'],['Serving cost','Full 16-bit weights.','Quantised weights and caches cut cost and speed up responses.'],['Edge devices','Tiny models only.','Distilled and quantised models run on-device for privacy and speed.'],['Training','32-bit numbers.','16-bit and 8-bit formats with careful scaling.'],['Quality checks','Accuracy only.','Compare outputs on your tasks before and after.']],
words:[['Quantisation','Storing numbers with fewer bits.'],['Scale','The number that maps integers back to real values.'],['Outlier','A value far larger than the rest.'],['Group size','How many weights share one scale.'],['Pruning','Removing weights that matter little.'],['Distillation','Training a small model to imitate a big one.']]},

{id:'causal',title:'Correlation is not the same as cause',sub:'Causal thinking and experiments',tint:'coral',
hook:'A model can find that two things move together. Deciding whether one makes the other happen needs a different kind of thinking.',
kid:`<p>Ice cream sales and sunburn go up together. Does ice cream cause sunburn? No: sunny weather causes both. Sunshine is a hidden <b>confounder</b>.</p>
<p>Here is a trickier case. A drug really helps everyone. But doctors give it mostly to very sick people, who recover less often anyway. Compare everyone who got the drug with everyone who did not, and the drug can look harmful!</p>
<p>The cure is to compare like with like, or better, to <b>flip a coin</b> to decide who gets the drug. Then sickness cannot sneak into the choice.</p>`,
look:`The drug adds 10 points to recovery for everyone. The slider controls how strongly sicker patients are chosen to receive it. Pick how to analyse the same data.`,
tries:['Set the slider to 0 and compare averages. The estimate matches the truth.','Slide towards 100%. The average comparison turns negative, a reversal called Simpson\'s paradox.','Choose <b>Compare within severity</b>. The truth returns.','Choose <b>Randomise</b> and the problem disappears at any slider setting.'],
deep:`<h2>Two questions</h2>
<ul><li><b>Prediction</b>: given what I see, what will happen? Correlation is enough.</li><li><b>Intervention</b>: what happens if I <i>do</i> something? That needs cause.</li></ul>
<h2>Confounders</h2>
<p>A confounder influences both the treatment and the outcome. Ignoring it biases the comparison. Fixes:</p>
<ul><li><b>Randomised experiments</b> (A/B tests) break the link between the confounder and the treatment.</li><li><b>Adjustment</b>: compare within groups with the same value of the confounder, then combine.</li><li><b>Matching and weighting</b>: pair similar people, or weight them to look alike.</li><li><b>Natural experiments</b>: use accidents of timing or rules that act like random assignment.</li></ul>
<div class="math">effect = average over groups g of ( outcome_treated(g) - outcome_untreated(g) ) * share(g)</div>
<h2>Cautions</h2>
<ul><li>Adjusting for the wrong variable (one the treatment causes) can add bias.</li><li>You can only adjust for what you measured. Hidden confounders remain.</li><li>Draw the story first, as a diagram of arrows, before choosing what to adjust for.</li></ul>
<h2>Why it matters for ML</h2>
<p>A model trained on past decisions learns the biases of whoever made them. Policies built on predictions alone (who to treat, whom to call, what to show) need experiments or causal methods. Uplift modelling and off-policy evaluation estimate the effect of an action instead of an outcome.</p>`,
then:[['Product changes','Launch and compare before and after.','Randomised A/B tests are the standard, with guardrail metrics.'],['Medicine','Observational studies.','Randomised trials remain the gold standard; careful causal methods fill the gaps.'],['Marketing','Target people who buy anyway.','Uplift models target people the message actually changes.'],['Recommendations','Optimise clicks.','Teams test whether a recommendation caused the purchase.'],['Policy and economics','Correlations.','Natural experiments and causal graphs.']],
words:[['Confounder','A hidden factor that affects both treatment and outcome.'],['Simpson\'s paradox','A trend that reverses when groups are combined.'],['Randomisation','Assigning treatment by chance.'],['A/B test','A randomised experiment comparing two versions.'],['Adjustment','Comparing within matching groups.'],['Counterfactual','What would have happened if we had acted differently.']]}
];

const LH=[
{id:'prob',title:'Chance, evidence and surprise',sub:'Probability, Bayes and statistics for ML',tint:'sky',
hook:'Machine learning is mostly careful reasoning under uncertainty. Bayes\' rule tells you how much a new clue should change your mind.',
kid:`<p>Suppose 1 child in 100 has a rare sniffle-bug, and a test says "positive" for a sick child 9 times out of 10, but also wrongly says "positive" for 1 healthy child in 10. Your test comes back positive. How worried should you be?</p>
<p>Imagine 1000 children. About <b>10</b> are sick and 9 of them test positive. Of the <b>990</b> healthy children, 99 also test positive by mistake. So among everyone who tested positive (108), only 9 are really sick. That is less than <b>1 in 10</b>.</p>
<div class="callout"><b>The surprise:</b> a good test does not mean a positive result is probably right. When the thing you look for is rare, most alarms are false alarms.</div>`,
look:`A thousand people, drawn as dots. Red dots are sick. A ring marks a positive test. Change how common the illness is and how good the test is, and watch the real chance of being sick.`,
tries:['Leave the settings alone and read the chance. It is surprisingly low.','Raise how common the illness is. A positive result means much more.','Press <b>Test positive again</b> a few times. Each new positive adds evidence.','Raise the test quality towards 99.9% and compare.'],
deep:`<h2>Bayes' rule</h2>
<div class="math">P(sick | positive) = P(positive | sick) * P(sick) / P(positive)
P(positive) = P(pos | sick) P(sick) + P(pos | healthy) P(healthy)</div>
<p>In odds form it is even easier to remember: <b>posterior odds = prior odds x likelihood ratio</b>. Each independent positive result multiplies the odds by sensitivity / (1 - specificity).</p>
<h2>Why this matters for ML</h2>
<ul><li><b>Base rates.</b> A fraud model with 99% accuracy on 0.1% fraud still raises mostly false alarms (level [[metrics]]).</li>
<li><b>Naive Bayes</b> classifiers apply this rule directly (level [[nb]]).</li>
<li><b>Training as likelihood.</b> Maximum likelihood picks the parameters that make the data least surprising (level [[info]]).</li>
<li><b>Regularisation</b> is a prior belief that weights are small (level [[reg]]).</li></ul>
<h2>Statistics you will use constantly</h2>
<ul><li><b>Distributions</b>: normal for averages and noise, binomial for counts of yes/no, Poisson for events over time.</li>
<li><b>Sampling</b>: an average from n examples varies by about sigma / sqrt(n). Four times the data halves the uncertainty.</li>
<li><b>Confidence intervals</b>: a range that, over many repeats, would contain the true value a stated share of the time.</li>
<li><b>Hypothesis tests and p-values</b>: how surprising your result would be if nothing were going on. A small p-value is not the chance you are right.</li>
<li><b>Multiple comparisons</b>: test 20 ideas and one will look significant by luck.</li></ul>`,
then:[['Medical screening','One test result treated as a verdict.','Doctors weigh base rates, repeat tests and combine evidence.'],['Spam filters','Hand-written rules.','Probabilistic models combine many weak clues, then neural models learn richer ones.'],['A/B tests','Compare averages by eye.','Pre-planned tests with confidence intervals and corrections for many looks.'],['Forecasts','A single number.','Probabilities and intervals, such as a 30% chance of rain.'],['Model outputs','Hard yes/no.','Calibrated probabilities so that "70%" is right about 70% of the time.']],
words:[['Prior','What you believed before seeing the evidence.'],['Posterior','What you believe after.'],['Likelihood ratio','How much more likely the evidence is if the idea is true.'],['Base rate','How common something is overall.'],['Confidence interval','A range that quantifies the uncertainty in an estimate.'],['p-value','How surprising the data would be if there were no real effect.']]},

{id:'deploy',title:'From notebook to real product',sub:'Deployment, serving and monitoring',tint:'mint',
hook:'A model that works in a notebook is the start. Real users need it fast, cheap, reliable and watched.',
kid:`<p>A great pizza recipe is not a pizza restaurant. A restaurant needs ovens (servers), a way to cook many pizzas at once (batching), enough staff for the lunch rush, and someone checking that the pizzas stay good.</p>
<p><b>Deploying</b> a model is the same. People send requests, and each one needs an answer quickly. Cooking several together is cheaper but makes each wait a little longer. More servers cost more money. A smaller model (level [[quant]]) is faster and cheaper.</p>`,
look:`Bars show how fast the answers come (latency), how busy the servers are, how much they can handle, and what it costs. The dashed line is the speed limit you promised users.`,
tries:['Raise the traffic until the servers are overloaded.','Increase the batch size. Capacity rises, but waiting rises too.','Add servers until the busy meter drops. Watch the cost.','Switch to the quantised model and see both speed and cost improve.'],
deep:`<h2>The deployment loop</h2>
<ol><li><b>Package</b> the model with its exact data preparation, so training and serving agree.</li><li><b>Serve</b> it: online (answers in milliseconds), batch (overnight jobs) or on-device.</li><li><b>Release safely</b>: shadow mode, canary (a small share of traffic), then full rollout with an easy rollback.</li><li><b>Monitor</b> latency, errors, input drift and quality (level [[ops]]).</li><li><b>Retrain</b> on a schedule or when monitors say so, and repeat.</li></ol>
<h2>Numbers to know</h2>
<ul><li><b>p50 / p95 / p99 latency</b>: the speed 50%, 95% or 99% of requests beat. Users feel the slow tail, so p95 and p99 matter more than the average.</li><li><b>Throughput</b>: requests per second the system can finish.</li><li><b>Utilisation</b>: how busy a server is. Queues grow sharply as utilisation approaches 100%, so leave headroom.</li></ul>
<div class="math">latency ~ compute time + waiting for the batch + queue time
queue time grows like 1 / (1 - utilisation)</div>
<h2>Common failures</h2>
<ul><li>Training-serving skew: a feature computed differently in production.</li><li>Silent drift: inputs change and accuracy falls with no error message.</li><li>Feedback loops: the model's choices change the data it later learns from.</li></ul>
<h2>Language models in production</h2>
<p>Add caching, response streaming, request batching across users, quantised weights (level [[quant]]), retrieval (level [[rag]]), safety filters and cost tracking per request.</p>`,
then:[['Release','Copy the model file to a server.','Containers, versioned model registries, canary rollouts and rollback.'],['Scaling','Buy big servers.','Autoscaling on demand, with GPUs shared across many requests.'],['Monitoring','Check by hand now and then.','Dashboards and alerts for latency, drift and quality.'],['Cost','An afterthought.','Cost per request is tracked and optimised with smaller models and caching.'],['Ownership','Data scientist hands over code.','Shared practice called MLOps between data, engineering and operations teams.']],
words:[['Latency','How long one request takes.'],['p95','The latency that 95% of requests beat.'],['Throughput','Requests finished per second.'],['Canary release','Sending a small share of traffic to a new version first.'],['Training-serving skew','A mismatch between how data is prepared in training and in production.'],['MLOps','The practice of running machine learning reliably in production.']]},

{id:'tfm',title:'A transformer, one step at a time',sub:'Building a tiny transformer from scratch',tint:'sun',
hook:'Take the pieces apart: embeddings, a position signal, scores, a mask and softmax. A language model is just these, repeated.',
kid:`<p>Earlier you saw that words look at other words. Now let's open the box and follow the numbers. Each word is a little arrow (a vector). Two words that point the same way score high: they match.</p>
<p>The scores become percentages. And there is one important rule for a text-writing model: when it predicts the next word, it must not <b>peek ahead</b>. A <b>mask</b> hides the future, like covering the rest of the page with your hand.</p>
<p>A word's position also matters, because "dog bites man" and "man bites dog" use the same words. So we add a small <b>position signal</b> to each word.</p>`,
look:`The grid shows how each word (row) shares its attention across words (columns). Pick a word and move its arrow with the sliders. Turn the mask and position signal on and off.`,
tries:['With the mask on, look at the first row. The first word can only see itself.','Select a word and move it. Watch its row and the other rows change.','Turn the mask off. Now every word sees the future too.','Add the position signal. The same words now score differently depending on where they sit.'],
deep:`<h2>The recipe, in order</h2>
<ol><li><b>Tokens to vectors</b>: look up an embedding for each token (level [[embed]]).</li><li><b>Add position</b>: a fixed or learned signal tells the model where each token is.</li><li><b>Project</b>: multiply by learned matrices to get a query, key and value for each token.</li><li><b>Score</b>: dot product of each query with each key, divided by the square root of the key size.</li><li><b>Mask</b>: set scores for future positions to minus infinity, so softmax gives them zero.</li><li><b>Softmax</b>: each row becomes percentages that add up to 100.</li><li><b>Mix</b>: take the weighted sum of the value vectors.</li><li><b>Feed-forward</b>: a small neural network at each position.</li><li><b>Repeat</b> in many layers, with residual shortcuts and normalisation, then predict the next-token probabilities.</li></ol>
<div class="math">scores = Q K^T / sqrt(d_k)      masked: scores[i][j] = -infinity for j > i
A = softmax(scores)              output = A V
sinusoidal position: PE(pos, 2i) = sin(pos / 10000^(2i/d))</div>
<h2>Training</h2>
<p>Feed text and ask the model to predict each next token. The loss is cross-entropy (level [[info]]), the gradients come from backpropagation (level [[bp]]) and the updates from AdamW (level [[opt]]). Because of the mask, one pass over a sentence gives a training example for every position at once.</p>
<h2>Generating</h2>
<p>Predict a probability for the next token, pick one (greedy, or sampled with a temperature and top-p), append it, and repeat. A key-value cache stores the keys and values of earlier tokens so they are not recomputed.</p>`,
then:[['Building one','A research project.','A few hundred lines in a modern framework. Many people write a tiny one to learn.'],['Position','Fixed sine waves.','Rotary and relative schemes that extend to long inputs.'],['Attention cost','Grows with the square of the length.','Sparse, sliding-window, and memory-efficient kernels make long inputs affordable.'],['Generation speed','Recompute everything each token.','Key-value caches and speculative decoding.'],['Variants','Only text.','The same blocks process images, audio and video.']],
words:[['Embedding','A vector standing for a token.'],['Query, key, value','The three roles each token plays in attention.'],['Mask','A rule that blocks some attention links, such as the future.'],['Positional encoding','A signal that tells the model where each token is.'],['Residual connection','A shortcut that adds a layer\'s input to its output.'],['KV cache','Stored keys and values reused while generating.']]},

{id:'agent',title:'Assistants that use tools',sub:'Agents, tool use and reliability',tint:'coral',
hook:'An agent is a language model that can plan, call tools and look at the results. Its biggest challenge is that small mistakes multiply.',
kid:`<p>A chat assistant that only talks can be wrong about maths and facts. An <b>agent</b> can also use tools: a calculator for sums, a search for facts, a notebook for memory. It makes a plan, uses a tool, reads what came back, and decides what to do next.</p>
<p>Here is the catch. Imagine a four-step task where each step works 90% of the time. All four work only about 66% of the time (0.9 times 0.9 times 0.9 times 0.9). Long chains make small mistakes add up.</p>`,
look:`A four-step task: look up a fact, do some maths, look up another fact, do more maths. Switch tools and checking on and off and see how often the whole task comes out right.`,
tries:['Start with no tools. The chance of getting all four steps right is low.','Turn on the <b>Calculator</b>. Maths steps become reliable.','Turn on <b>Search</b>. Fact steps become reliable too.','Turn on <b>Check each result</b>. It catches some slips but costs extra steps.'],
deep:`<h2>The agent loop</h2>
<ol><li><b>Observe</b> the goal and what has happened so far.</li><li><b>Think</b>: decide the next action.</li><li><b>Act</b>: call a tool with arguments (search, code, database, browser, file).</li><li><b>Read</b> the tool's result and update the plan.</li><li>Stop when done, or when a budget or safety rule says stop.</li></ol>
<div class="math">P(task succeeds) = product over steps of P(step succeeds)
0.95 ^ 4 = 0.81     0.95 ^ 10 = 0.60     0.99 ^ 10 = 0.90</div>
<h2>What makes agents work</h2>
<ul><li><b>Good tools</b>: clear names, narrow functions, helpful error messages.</li><li><b>Retrieval</b> for facts (level [[rag]]) and code execution for exact calculation.</li><li><b>Checking</b>: verify results, run tests, or ask a second model or a person.</li><li><b>Limits</b>: step budgets, spending caps and permission checks for risky actions.</li><li><b>Memory</b>: notes and summaries so long tasks do not overflow the context window.</li></ul>
<h2>Evaluating agents</h2>
<p>Test whole tasks, not single answers. Measure success rate, cost, steps and failure kinds (wrong tool, bad arguments, loops, giving up too early), then fix the most common failure first. Keep a human in the loop for actions that cannot be undone, and watch for prompt injection, where text in a web page or file tries to give the agent new orders.</p>`,
then:[['Coding help','Autocomplete a line.','Agents read a codebase, edit files, run tests and propose a change for review.'],['Customer support','Scripted bots.','Assistants look up orders, apply policy and hand off to people.'],['Research','Manual searching.','Agents search, read and summarise, and their output still needs checking.'],['Computer use','Fixed macros.','Models look at a screen and click and type, with permission prompts for risky steps.'],['Safety','Rules in code.','Sandboxes, permission scopes, logs and human approval for important actions.']],
words:[['Agent','A model that plans and acts through tools.'],['Tool call','A request from the model to run a function.'],['Context window','The text the model can see at once.'],['Prompt injection','Hidden instructions in content that try to redirect the agent.'],['Step budget','A limit on how many actions an agent may take.'],['Human in the loop','A person approves important actions.']]}
];

/* ============ Pro notes: equations, practice, pitfalls, self-check ============ */
const PRO={
start:`<h3>Formal setting</h3>
<p>Supervised learning assumes examples (x, y) drawn independently from an unknown distribution D. We pick a model class F and a loss L, and search for f in F that minimises the <b>expected risk</b> E[L(f(x), y)]. We can only measure the <b>empirical risk</b> on a sample, so generalisation is the gap between the two.</p>
<div class="math">R(f)     = E_(x,y)~D [ L(f(x), y) ]        (what we want)
R_hat(f) = (1/n) sum_i L(f(x_i), y_i)       (what we can compute)
ERM:  f_hat = argmin over f in F of R_hat(f)</div>
<h3>In practice</h3>
<ul><li>Fix the evaluation protocol before modelling: metric, split, and what "good enough" means for the product.</li>
<li>Always build a trivial baseline first (majority class, last value, linear model). It tells you whether the problem has signal.</li>
<li>The i.i.d. assumption is the first thing to break in production. Ask whether tomorrow's data looks like yesterday's.</li></ul>
<h3>Common pitfalls</h3>
<ul><li>Choosing the model class before understanding the data.</li><li>Reporting a number without saying which data it was measured on.</li></ul>
<h3>Check yourself</h3>
<ol><li>Why can empirical risk be an optimistic estimate of expected risk?</li><li>Give one example each of a supervised, unsupervised and reinforcement problem in a product you use.</li></ol>`,

data:`<h3>Splits and leakage</h3>
<p>Use three roles: <b>train</b> to fit parameters, <b>validation</b> to choose hyperparameters and models, <b>test</b> once at the end. Leakage happens whenever information from outside the training period or training rows reaches the model.</p>
<div class="math">Common leaks:
- scaling or imputing with statistics from the full dataset
- duplicate or near-duplicate rows on both sides of a split
- features that only exist after the label is known
- random split of time-ordered data (use a forward split)
- same person / device / document in train and test (split by group)</div>
<h3>In practice</h3>
<ul><li>Fit every preprocessing step inside the training fold only (use a pipeline object).</li>
<li>Stratify for imbalanced classification so each split keeps the class ratio.</li>
<li>Label noise sets a ceiling on accuracy. Estimate it by checking inter-annotator agreement.</li></ul>
<h3>Common pitfalls</h3>
<ul><li>Tuning on the test set "just a little". The estimate is no longer unbiased.</li><li>Trusting a random split when production predicts the future.</li></ul>
<h3>Check yourself</h3>
<ol><li>A model scores 99% on a random split of daily sales data. Why might it fail next month?</li><li>How would you split data for patients with several visits each?</li></ol>`,

gd:`<h3>Update rules</h3>
<div class="math">theta <- theta - lr * grad L(theta)                    (full-batch)
theta <- theta - lr * grad L_B(theta),  B a mini-batch  (stochastic)
For L = (1/n) sum (w x + b - y)^2:
  dL/dw = (2/n) sum (w x + b - y) x
  dL/db = (2/n) sum (w x + b - y)</div>
<p>For a quadratic with largest curvature (Hessian eigenvalue) lambda_max, gradient descent converges only if lr &lt; 2 / lambda_max, and the best fixed rate gives a convergence speed set by the <b>condition number</b> lambda_max / lambda_min. Badly scaled features make the condition number large and training slow.</p>
<h3>In practice</h3>
<ul><li>Standardise inputs. It often changes training time more than any other single choice.</li>
<li>Watch the loss curve on a log scale. Divergence, plateau and noise each have different fixes.</li>
<li>Mini-batches trade gradient noise for speed. Noise can help escape sharp minima.</li></ul>
<h3>Common pitfalls</h3>
<ul><li>Comparing learning rates without fixing the random seed and number of steps.</li><li>Forgetting that a lower training loss is not the goal. Validation loss is.</li></ul>
<h3>Check yourself</h3>
<ol><li>Why does the step shrink near the minimum even with a fixed learning rate?</li><li>What happens to the best learning rate if you multiply a feature by 100?</li></ol>`,

logreg:`<h3>Model and loss</h3>
<div class="math">p(y=1 | x) = sigmoid(w.x + b) = 1 / (1 + exp(-(w.x + b)))
log-loss = -(1/n) sum [ y log p + (1-y) log(1-p) ]
gradient wrt w = (1/n) sum (p_i - y_i) x_i</div>
<p>The gradient has the same shape as in linear regression: prediction minus target, times input. Log-loss is the negative log likelihood of a Bernoulli model, so training is maximum likelihood estimation. The loss is convex, so there is a single global optimum (when it exists).</p>
<h3>In practice</h3>
<ul><li>Each weight is a change in <b>log-odds</b> per unit of its feature. exp(w) is an odds ratio, which is easy to explain.</li>
<li>Perfectly separable data sends weights to infinity. Add L2 regularisation (see level [[reg]]).</li>
<li>The decision threshold of 0.5 is a choice. Pick it from costs (see level [[metrics]]).</li>
<li>Check calibration. A model can rank well and still output poor probabilities.</li></ul>
<h3>Common pitfalls</h3>
<ul><li>Reading weights as importance when features are on different scales or correlated.</li><li>Using accuracy on imbalanced data.</li></ul>
<h3>Check yourself</h3>
<ol><li>If w = 0.7 for a feature, by what factor do the odds change per unit increase?</li><li>Why does cross-entropy punish a confident wrong answer so heavily?</li></ol>`,

knn:`<h3>Method</h3>
<div class="math">predict(x) = majority label (or mean value) among the k training points closest to x
distance (Euclidean): d(a,b) = sqrt( sum_j (a_j - b_j)^2 )</div>
<p>kNN is a <b>non-parametric</b>, lazy learner: training is just storing data and all the work happens at prediction time. With k = 1 the training error is zero and the model has high variance. Larger k smooths the boundary and increases bias.</p>
<h3>In practice</h3>
<ul><li>Scale features first, or distance is dominated by the largest-valued column.</li>
<li>In high dimensions distances concentrate, so the nearest and farthest neighbour look equally far. Reduce dimensions or learn an embedding.</li>
<li>Prediction cost is O(n d) naively. For large n use approximate nearest neighbour indexes (HNSW, IVF, product quantisation).</li>
<li>Weighting votes by 1/distance and using odd k for two classes avoid ties.</li></ul>
<h3>Common pitfalls</h3>
<ul><li>Picking k on the training set (k = 1 always wins there).</li><li>Mixing categorical and numeric features with no thought about the distance.</li></ul>
<h3>Check yourself</h3>
<ol><li>Which has higher bias, k = 1 or k = 25?</li><li>Why is kNN a poor fit for 5,000 raw features and 200 examples?</li></ol>`,

trees:`<h3>How a split is chosen</h3>
<div class="math">Gini(node)    = 1 - sum_c p_c^2
Entropy(node) = - sum_c p_c log2 p_c
gain(split)   = impurity(parent) - (n_L/n) impurity(L) - (n_R/n) impurity(R)</div>
<p>Greedy search picks the feature and threshold with the largest gain at each node, then recurses. This is fast but not globally optimal. Deep trees have low bias and high variance.</p>
<h3>Forests</h3>
<ul><li><b>Bagging</b>: train each tree on a bootstrap sample. Averaging B roughly independent trees divides variance by about B.</li>
<li><b>Random forest</b>: also consider only a random subset of features at each split, which decorrelates trees.</li>
<li>Out-of-bag samples (those left out of a tree's bootstrap) give a free validation estimate.</li></ul>
<h3>In practice</h3>
<ul><li>Trees need no scaling and handle mixed feature types, but cannot extrapolate beyond the training range.</li>
<li>Impurity-based feature importance is biased towards high-cardinality features. Prefer permutation importance.</li>
<li>Limit depth or min samples per leaf to control overfitting.</li></ul>
<h3>Common pitfalls</h3>
<ul><li>Treating a single deep tree as stable. Small data changes can reshape it.</li><li>Using ID-like columns, which allow perfect memorising.</li></ul>
<h3>Check yourself</h3>
<ol><li>Why does a random forest use a random feature subset at each split?</li><li>Compute the Gini impurity of a node with 30 positives and 10 negatives.</li></ol>`,

kmeans:`<h3>Objective</h3>
<div class="math">minimise  sum_k sum_(x in cluster k) |x - mu_k|^2       (inertia / WCSS)
Lloyd's algorithm: assign each point to nearest centroid,
                   set each centroid to its cluster mean, repeat</div>
<p>Each step cannot increase the objective, so the algorithm converges, but only to a <b>local</b> minimum. The result depends on initialisation, so use k-means++ seeding and several restarts.</p>
<h3>Choosing and checking K</h3>
<ul><li><b>Elbow</b>: plot inertia against K and look for the bend. It is often ambiguous.</li>
<li><b>Silhouette</b>: for each point, s = (b - a) / max(a, b), where a is the mean distance to its own cluster and b the mean distance to the nearest other cluster. Higher is better.</li>
<li>Judge clusters by whether they are useful and stable, not only by a score.</li></ul>
<h3>Limits</h3>
<ul><li>Assumes roughly round, similar-sized clusters. For other shapes try DBSCAN or Gaussian mixture models.</li>
<li>Sensitive to scale and outliers. Standardise first.</li>
<li>Distances weaken in many dimensions. Reduce with PCA (level [[pca]]) before clustering.</li></ul>
<h3>Check yourself</h3>
<ol><li>Why does inertia always decrease as K increases?</li><li>When would a Gaussian mixture beat k-means?</li></ol>`,

nb:`<h3>Model</h3>
<div class="math">log P(c | x) = log P(c) + sum_j log P(x_j | c) + constant
predict argmax over c</div>
<p>The conditional independence assumption turns a joint over d features into d one-dimensional distributions, so parameters grow linearly with d rather than exponentially. Variants: <b>Bernoulli</b> (word present or absent), <b>multinomial</b> (word counts), <b>Gaussian</b> (continuous features).</p>
<h3>In practice</h3>
<ul><li>Use additive (Laplace) smoothing: P(w | c) = (count + alpha) / (total + alpha V).</li>
<li>Work in log space to avoid underflow.</li>
<li>Probabilities are typically overconfident because correlated features are double counted. Calibrate (Platt or isotonic) if you need real probabilities.</li>
<li>It is a fast, strong baseline for text with little data.</li></ul>
<h3>Common pitfalls</h3>
<ul><li>Zero counts without smoothing.</li><li>Feeding strongly correlated features and trusting the probability.</li></ul>
<h3>Check yourself</h3>
<ol><li>Why does naive Bayes need far fewer examples than a full joint model?</li><li>What does alpha = 1 do to a word never seen in a class?</li></ol>`,

biasvar:`<h3>Decomposition</h3>
<p>For squared error and a fixed input x, with y = f(x) + noise (variance sigma^2), the expected test error over training sets is:</p>
<div class="math">E[(y - f_hat(x))^2] = Bias[f_hat(x)]^2 + Var[f_hat(x)] + sigma^2
bias:     how far the average model is from the truth
variance: how much the model changes between training sets
sigma^2:  irreducible noise, a floor no model can beat</div>
<h3>In practice</h3>
<ul><li>High training error and similar validation error: <b>high bias</b>. Use a richer model or better features.</li>
<li>Low training error and much higher validation error: <b>high variance</b>. Get more data, simplify, regularise or ensemble.</li>
<li><b>Learning curves</b> (error against training set size) separate the two cases at a glance.</li>
<li>Modern over-parameterised networks can show "double descent": test error falls again past the interpolation point. The classic U-curve is a guide, not a law.</li></ul>
<h3>Common pitfalls</h3>
<ul><li>Adding data to a high-bias model. It will not help much.</li><li>Choosing complexity by training error.</li></ul>
<h3>Check yourself</h3>
<ol><li>What does a large and persistent gap between train and validation curves suggest?</li><li>Why can't bias and variance both be driven to zero by choosing a clever model?</li></ol>`,

metrics:`<h3>Definitions</h3>
<div class="math">precision = TP / (TP + FP)        recall (TPR) = TP / (TP + FN)
FPR = FP / (FP + TN)             F1 = 2PR / (P + R)
F_beta = (1 + b^2) P R / (b^2 P + R)
expected cost = c_FN * FN + c_FP * FP</div>
<ul><li><b>ROC curve</b>: TPR against FPR over all thresholds. AUC is the chance a random positive outranks a random negative.</li>
<li><b>PR curve</b> and average precision are more informative when positives are rare.</li>
<li><b>Calibration</b>: among cases scored 0.8, about 80% should be positive. Check with a reliability diagram or Brier score.</li></ul>
<h3>In practice</h3>
<ul><li>Choose the threshold from costs and base rates on validation data, not from 0.5.</li>
<li>Report confidence intervals (bootstrap). Small test sets make differences between models look bigger than they are.</li>
<li>For ranking and recommendation use precision at k, recall at k, MAP or NDCG. For regression use MAE, RMSE and error by segment.</li></ul>
<h3>Common pitfalls</h3>
<ul><li>Accuracy on a 1% positive class.</li><li>Comparing AUC across datasets with different base rates.</li></ul>
<h3>Check yourself</h3>
<ol><li>With 1% fraud, why can a model that flags nothing have 99% accuracy?</li><li>When would you favour F2 over F1?</li></ol>`,

svm:`<h3>Primal and dual</h3>
<div class="math">min over w,b,xi:  (1/2)|w|^2 + C sum xi_i
s.t.  y_i (w.x_i + b) >= 1 - xi_i,  xi_i >= 0

dual: max over alpha  sum alpha_i - (1/2) sum_ij alpha_i alpha_j y_i y_j k(x_i, x_j)
s.t.  0 <= alpha_i <= C,   sum alpha_i y_i = 0
prediction: sign( sum alpha_i y_i k(x_i, x) + b )</div>
<p>Only points with alpha_i &gt; 0 (support vectors) appear in the prediction. The hinge loss max(0, 1 - y f(x)) is the equivalent unconstrained view. Training a kernel SVM costs between O(n^2) and O(n^3), so it suits up to tens of thousands of rows.</p>
<h3>In practice</h3>
<ul><li>Standardise features. Tune C and gamma together on a log grid with cross-validation (level [[cv]]).</li>
<li>For large sparse text problems use a linear SVM (liblinear), which scales to millions of rows.</li>
<li>Use Platt scaling if you need probabilities.</li></ul>
<h3>Common pitfalls</h3>
<ul><li>A huge gamma with a huge C memorises training data.</li><li>Forgetting that the kernel matrix needs O(n^2) memory.</li></ul>
<h3>Check yourself</h3>
<ol><li>What does C control, and what happens as C goes to infinity?</li><li>Why can a kernel trick avoid computing high-dimensional features?</li></ol>`,

boost:`<h3>Gradient boosting as functional descent</h3>
<div class="math">F_0(x) = argmin_c sum L(y_i, c)
for m = 1..M:
   r_i = - dL(y_i, F)/dF  at F = F_(m-1)(x_i)      (pseudo-residuals)
   fit tree h_m to (x_i, r_i)
   F_m = F_(m-1) + eta * h_m</div>
<p>For squared error, r_i is the ordinary residual. For log-loss it is y - p. Libraries such as XGBoost add a second-order (Newton) step and a regulariser on tree complexity.</p>
<h3>Hyperparameters that matter</h3>
<ul><li><b>n_estimators and learning_rate</b>: trade off together. Use early stopping on a validation set.</li>
<li><b>max_depth / num_leaves, min_child_weight</b>: control interaction order and overfitting.</li>
<li><b>subsample, colsample</b>: row and column sampling add variance reduction.</li>
<li><b>L1/L2 on leaf weights</b>: regularise predictions.</li></ul>
<h3>In practice</h3>
<ul><li>Native handling of missing values and categories (LightGBM, CatBoost) saves preprocessing.</li>
<li>Use time-aware validation on temporal data to avoid leakage.</li>
<li>Explain with SHAP values rather than raw importances.</li></ul>
<h3>Check yourself</h3>
<ol><li>Why are shallow trees preferred as weak learners?</li><li>How does boosting differ from bagging in what it reduces?</li></ol>`,

pca:`<h3>Derivation sketch</h3>
<p>Given centred data X (n x d), the first principal direction w maximises the variance of the projection subject to unit length. The solution is the top eigenvector of the covariance matrix.</p>
<div class="math">C = (1/(n-1)) X^T X          C v_k = lambda_k v_k
explained variance ratio of component k = lambda_k / sum lambda
equivalent via SVD:  X = U S V^T,   lambda_k = s_k^2 / (n-1),  scores = U S</div>
<p>Keeping k components gives the best rank-k linear reconstruction in squared error (Eckart-Young theorem).</p>
<h3>In practice</h3>
<ul><li>Standardise columns unless they share units. PCA chases variance, so scale decides what matters.</li>
<li>Fit on training data only and reuse the same transform on validation and test.</li>
<li>For huge data use randomised or incremental PCA. For sparse text use truncated SVD.</li>
<li>For non-linear structure see kernel PCA, autoencoders, UMAP, t-SNE. Treat t-SNE and UMAP plots as qualitative: distances between far clusters are not reliable.</li></ul>
<h3>Common pitfalls</h3>
<ul><li>Assuming high variance means high predictive value for the label.</li><li>Interpreting components as single real-world factors.</li></ul>
<h3>Check yourself</h3>
<ol><li>Why must the data be centred before PCA?</li><li>If the first 3 of 50 components explain 92% of variance, what might you still lose?</li></ol>`,

nn:`<h3>Forward pass</h3>
<div class="math">h_l = activation( W_l h_(l-1) + b_l ),  h_0 = x
output (binary): p = sigmoid(w.h_L + b)
loss:            cross-entropy against the label</div>
<p>Without a non-linear activation, any stack of layers collapses to a single linear map. The <b>universal approximation theorem</b> says a wide enough single hidden layer can approximate any continuous function on a compact set, but it says nothing about how easy it is to learn.</p>
<h3>Choices that matter</h3>
<ul><li><b>Activation</b>: ReLU is the default for hidden layers. GELU and SiLU are common in transformers. Sigmoid and softmax belong on outputs.</li>
<li><b>Initialisation</b>: scale weights so activations keep a stable variance (He for ReLU, Xavier/Glorot for tanh).</li>
<li><b>Normalisation</b> (batch norm, layer norm) and <b>residual connections</b> make deep networks trainable.</li>
<li><b>Regularisation</b>: weight decay, dropout, early stopping, data augmentation (see level [[reg]]).</li></ul>
<h3>In practice</h3>
<ul><li>Overfit a tiny batch first. If the network cannot memorise 20 examples, there is a bug.</li>
<li>Standardise inputs and track train and validation curves every epoch.</li>
<li>For tables, boosted trees (level [[boost]]) often match or beat small neural networks. Try both.</li></ul>
<h3>Check yourself</h3>
<ol><li>Why can't a deep network of purely linear layers solve XOR?</li><li>What symptom suggests the learning rate is too high?</li></ol>`,

cnn:`<h3>The convolution</h3>
<div class="math">(I * K)[i, j] = sum_(a,b) I[i + a, j + b] * K[a, b]       (cross-correlation, as used in deep learning)
output size = floor((n + 2p - k) / s) + 1
parameters per conv layer = (k * k * C_in + 1) * C_out</div>
<p>Weight sharing means the same filter slides over the whole image, so a conv layer has far fewer parameters than a dense layer on the same input and is <b>translation equivariant</b>: shift the input and the feature map shifts too. Pooling or strides add some invariance and reduce resolution.</p>
<h3>Architecture ideas</h3>
<ul><li><b>Receptive field</b> grows with depth, so early layers see edges and later ones see parts and objects.</li>
<li><b>Residual connections</b> (ResNet) allow very deep networks. <b>1x1 convolutions</b> mix channels cheaply.</li>
