/* ---- Naive Bayes spam filter ---- */
function demoNB(root){
  const W=[['free',.40,.03],['winner',.30,.01],['prize',.25,.01],['click',.35,.08],['meeting',.02,.30],['tomorrow',.05,.25],['report',.03,.20],['lunch',.02,.15]];
  let prior=.4,gotSpam=false,gotHam=false;const on=new Set();
  const post=()=>{let ls=Math.log(prior),lh=Math.log(1-prior);W.forEach(([w,ps,ph])=>{if(on.has(w)){ls+=Math.log(ps);lh+=Math.log(ph)}else{ls+=Math.log(1-ps);lh+=Math.log(1-ph)}});return 1/(1+Math.exp(lh-ls))};
  const box=el('div',{class:'stage pad'});root.append(box);
  const chips=el('div',{class:'chipset'}),fill=el('i'),lab=el('span'),meter=el('div',{class:'meter'},fill,lab),ev=el('div',{class:'evlist'});
  const bs={};W.forEach(([w])=>{bs[w]=btn(w,()=>{on.has(w)?on.delete(w):on.add(w);upd()},'small');chips.append(bs[w])});
  box.append(el('p',{class:'kick',style:'margin:0 0 8px'},'Words in the email'),chips,el('p',{class:'kick',style:'margin:14px 0 6px'},'Bolt thinks the email is spam with chance'),meter,el('p',{class:'kick',style:'margin:14px 0 6px'},'Clues Bolt is using'),ev);
  const sV=stat('verdict'),sP=stat('chance of spam'),sPr=stat('before reading it');
  const upd=()=>{const p=post();W.forEach(([w])=>bs[w].classList.toggle('on',on.has(w)));
    fill.style.width=(p*100)+'%';lab.textContent=Math.round(p*100)+'% spam';
    if(p>=.9)gotSpam=true;if(p<=.1)gotHam=true;
    sV.set(p>=.5?'SPAM':'not spam');sP.set(Math.round(p*100)+'%');sPr.set(Math.round(prior*100)+'%');
    const rows=W.filter(([w])=>on.has(w)).map(([w,ps,ph])=>{const l=Math.log2(ps/ph);return '<div class="evrow"><b>'+w+'</b><span class="evbar"><i style="'+(l>=0?'left:50%;width:'+Math.min(50,l*7)+'%;background:var(--coral)':'right:50%;width:'+Math.min(50,-l*7)+'%;background:var(--mint)')+'"></i></span><span>'+(l>=0?'+':'')+l.toFixed(1)+'</span></div>'});
    ev.innerHTML=rows.length?rows.join('')+'<p class="vsnote" style="margin:6px 0 0">Right (orange) pushes towards spam. Left (green) pushes towards a normal email. Each number is how many times more likely the word is in spam, as a power of two.</p>':'<p class="vsnote" style="margin:0">No words picked yet. Words that are missing count as clues too, just small ones.</p>'};
  const s1=slider('How much of all mail is spam',5,90,1,prior*100,v=>v+'%',v=>{prior=v/100;upd()});
  root.append(stats(sV,sP,sPr),el('div',{class:'ctl'},s1.node,el('div',{class:'row'},btn('Clear the email',()=>{on.clear();upd()}))));
  upd();
  taskCard(root,'Build one email that Bolt is at least 90% sure is spam, and another that Bolt is at most 10% sure is spam. Then check.',()=>{
    if(gotSpam&&gotHam)return{ok:true,msg:'You made both. Spammy words multiply the odds up, ordinary words multiply them down.'};
    return{ok:false,msg:(gotSpam?'Spam email done. ':'Still need a 90% spam email. ')+(gotHam?'Normal email done.':'Still need a 10% or lower email.')}});
}

/* ---- Support vector machine ---- */
function demoSVM(root){
  let kind='blobs',kern='lin',Cexp=0,gam=.5,seed=1,tr,te,model,gotRing=false;
  const gen=()=>{const r=rng(seed*29+7),mk=n=>{const a=[];for(let i=0;i<n;i++){const c=i%2;let x,y;
      if(kind==='blobs'){x=(c?1.5:-1.5)+gauss(r)*1.05;y=(c?.4:-.4)+gauss(r)*1.05}
      else{const ang=r()*6.2832,rad=c?3.1+gauss(r)*.28:Math.abs(gauss(r))*1.0;x=rad*Math.cos(ang);y=rad*Math.sin(ang)*.8}
      a.push({x,y,c,t:c?1:-1})}return a};tr=mk(70);te=mk(100)};
  const k=(a,b)=>kern==='lin'?a.x*b.x+a.y*b.y:Math.exp(-gam*((a.x-b.x)**2+(a.y-b.y)**2));
  const train=()=>{const C=10**Cexp,n=tr.length,a=new Float64Array(n),K=tr.map(p=>Float64Array.from(tr,q=>k(p,q)));let b=0;const r=rng(5);
    const f=i=>{let s=b;for(let j=0;j<n;j++)if(a[j]>0)s+=a[j]*tr[j].t*K[i][j];return s};
    let pass=0,loops=0;
    while(pass<4&&loops<120){loops++;let ch=0;for(let i=0;i<n;i++){const Ei=f(i)-tr[i].t,yi=tr[i].t;
      if((yi*Ei<-1e-3&&a[i]<C)||(yi*Ei>1e-3&&a[i]>0)){let j=Math.floor(r()*(n-1));if(j>=i)j++;const Ej=f(j)-tr[j].t,yj=tr[j].t,ai=a[i],aj=a[j];let L,H;
        if(yi!==yj){L=Math.max(0,aj-ai);H=Math.min(C,C+aj-ai)}else{L=Math.max(0,ai+aj-C);H=Math.min(C,ai+aj)}
        if(L===H)continue;const eta=2*K[i][j]-K[i][i]-K[j][j];if(eta>=0)continue;let an=aj-yj*(Ei-Ej)/eta;an=Math.min(H,Math.max(L,an));if(Math.abs(an-aj)<1e-5)continue;
        a[j]=an;a[i]=ai+yi*yj*(aj-an);
        const b1=b-Ei-yi*(a[i]-ai)*K[i][i]-yj*(a[j]-aj)*K[i][j],b2=b-Ej-yi*(a[i]-ai)*K[i][j]-yj*(a[j]-aj)*K[j][j];
        b=a[i]>0&&a[i]<C?b1:a[j]>0&&a[j]<C?b2:(b1+b2)/2;ch++}}
      pass=ch===0?pass+1:0}
    const sv=[];for(let i=0;i<n;i++)if(a[i]>1e-6)sv.push({p:tr[i],w:a[i]*tr[i].t});
    model={sv,b,f:(x,y)=>{let s=b;const q={x,y};for(const v of sv)s+=v.w*k(v.p,q);return s}}};
  const acc=D=>D.filter(p=>(model.f(p.x,p.y)>0)===(p.t===1)).length/D.length;
  const box=el('div',{class:'stage'});root.append(box);const o=mkCanvas(.75);o.attach(box);
  const sTr=stat('practice score'),sTe=stat('test score'),sSV=stat('support vectors'),sK=stat('kind of line');
  const upd=()=>{const a=acc(tr),b=acc(te);sTr.set(Math.round(a*100)+'%');sTe.set(Math.round(b*100)+'%');sSV.set(model.sv.length);sK.set(kern==='lin'?'straight':'curvy');
    if(kind==='rings'&&kern==='rbf'&&b>=.95)gotRing=true};
  o.draw=()=>{if(!model)return;const C=colors(),{ctx,W,H}=o;ctx.clearRect(0,0,W,H);const v=mkView(o,-5,5,-3.75,3.75,0),nx=40,ny=30,cw=W/nx,ch=H/ny,c0=rgb(C.c0),c1=rgb(C.c1);
    for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){const f=model.f(v.ix((i+.5)*cw),v.iy((j+.5)*ch)),c=f>0?c1:c0;ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(.07+.3*Math.min(1,Math.abs(f)))+')';ctx.fillRect(i*cw,j*ch,cw+1,ch+1)}
    te.forEach(p=>marker(ctx,p.c,v.X(p.x),v.Y(p.y),3.2,null,p.c?C.c1:C.c0));
    tr.forEach(p=>marker(ctx,p.c,v.X(p.x),v.Y(p.y),5,p.c?C.c1:C.c0,C.panel));
    model.sv.forEach(s=>{ctx.beginPath();ctx.arc(v.X(s.p.x),v.Y(s.p.y),9,0,7);ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.stroke()});

  const stump=(xs,res)=>{let bs=1e18,bt=.5,bl=0,br=0;const n=xs.length;
    for(let i=1;i<n;i++){const t=(xs[i-1]+xs[i])/2;let sl=0,nl=0,sr=0,nr=0;for(let j=0;j<n;j++){if(xs[j]<=t){sl+=res[j];nl++}else{sr+=res[j];nr++}}const ml=sl/nl,mr=sr/nr;let s=0;for(let j=0;j<n;j++){const d=res[j]-(xs[j]<=t?ml:mr);s+=d*d}if(s<bs){bs=s;bt=t;bl=ml;br=mr}}
    return{t:bt,l:bl,r:br}};
  const pred=(m,x)=>{let s=mean0;for(let i=0;i<m;i++)s+=lr*(x<=stumps[i].t?stumps[i].l:stumps[i].r);return s};
  let mean0=0;

    trE=[];teE=[];best=1e9;for(let m=0;m<=MAXR;m++){trE[m]=tr.reduce((s,p)=>s+(pred(m,p[0])-p[1])**2,0)/tr.length;teE[m]=te.reduce((s,p)=>s+(pred(m,p[0])-p[1])**2,0)/te.length;best=Math.min(best,teE[m])}};
  const box=el('div',{class:'stage'});root.append(box);const o=mkCanvas(.62),ec=mkCanvas(.34);o.attach(box);ec.attach(box);

    ctx.strokeStyle=C.accent;ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=300;i++){const x=i/300,y=pred(rounds,x);i?ctx.lineTo(v.X(x),v.Y(y)):ctx.moveTo(v.X(x),v.Y(y))}ctx.stroke();
    tr.forEach(p=>{ctx.beginPath();ctx.arc(v.X(p[0]),v.Y(p[1]),4.5,0,7);ctx.fillStyle=C.ink;ctx.fill()});
    ctx.fillStyle=C.muted;ctx.font='12px '+css('--body');ctx.fillText('dots: data. blue: team. dashed: truth'+(showRes?'. red: to fix':''),10,H-10)};
  ec.draw=()=>{if(!stumps)return;const C=colors(),{ctx,W,H}=ec;ctx.clearRect(0,0,W,H);grid(ctx,W,H,C);const mx=Math.max(...trE,...teE),X=m=>28+m/MAXR*(W-48),Y=e=>H-22-(e/mx)*(H-44);

  const draw=()=>{o.draw();ec.draw();sR.set(rounds);sTr.set(trE[rounds].toFixed(3));sTe.set(teE[rounds].toFixed(3))};
  gen();calc();
  const s1=slider('Rounds (how many helpers have joined)',0,MAXR,1,rounds,v=>v,v=>{rounds=v;draw()});
  const s2=slider('Learning rate (how much each helper counts)',.05,1,.05,lr,v=>v.toFixed(2),v=>{lr=v;calc();draw()});

    curve=[];best=0;bestAng=0;for(let d=0;d<180;d++){const k=kept(d);curve.push(k);if(k>best){best=k;bestAng=d}}};

    pts.forEach(p=>{const d=p[0]*c+p[1]*s,qx=d*c,qy=d*s;ctx.strokeStyle=C.bad;ctx.globalAlpha=.4;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(v.X(p[0]),v.Y(p[1]));ctx.lineTo(v.X(qx),v.Y(qy));ctx.stroke();ctx.globalAlpha=1;
      ctx.beginPath();ctx.arc(v.X(p[0]),v.Y(p[1]),4,0,7);ctx.fillStyle=C.c0;ctx.fill();ctx.beginPath();ctx.arc(v.X(qx),v.Y(qy),3.2,0,7);ctx.fillStyle=C.c1;ctx.fill()});
    ctx.fillStyle=C.muted;ctx.font='12px '+css('--body');ctx.fillText('blue: data. orange: shadows. red: lost',10,H-10)};
  cc.draw=()=>{if(!curve)return;const C=colors(),{ctx,W,H}=cc;ctx.clearRect(0,0,W,H);grid(ctx,W,H,C);const X=d=>10+d/179*(W-20),Y=k=>H-22-k*(H-42);
    ctx.strokeStyle=C.accent;ctx.lineWidth=2.5;ctx.beginPath();curve.forEach((k,d)=>d?ctx.lineTo(X(d),Y(k)):ctx.moveTo(X(d),Y(k)));ctx.stroke();
    ctx.beginPath();ctx.arc(X(bestAng),Y(best),7,0,7);ctx.strokeStyle=C.ok;ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.arc(X(ang),Y(curve[ang]),5,0,7);ctx.fillStyle=C.ink;ctx.fill();
    ctx.font='12px '+css('--body');ctx.fillStyle=C.muted;ctx.fillText('information kept by angle. green ring: best',10,14);[0,45,90,135,179].forEach(d=>ctx.fillText(d+'°',X(d)-8,H-6))};
  const draw=()=>{o.draw();cc.draw();const k=curve[ang];sK.set(Math.round(k*100)+'%');sL.set(Math.round((1-k)*100)+'%');sB.set(bestAng+'°')};
  gen();
  const s1=slider('Angle of the black line',0,179,1,ang,v=>v+'°',v=>{ang=v;draw()});
  root.append(stats(sK,sL,sB),el('div',{class:'ctl'},s1.node,el('div',{class:'row'},btn('Let PCA find it',()=>{ang=bestAng;s1.set(ang);draw()},'primary'),btn('New cloud of dots',()=>{seed++;gen();draw()}))));draw();
  taskCard(root,'Turn the black line until the shadows keep at least 97% as much information as the best possible line. Then check. (Pressing the PCA button is cheating, but it is a good way to see the answer.)',()=>{
    return curve[ang]>=best*.97?{ok:true,msg:'You kept '+Math.round(curve[ang]*100)+'% of the information with one number per dot instead of two. That is dimensionality reduction.'}:{ok:false,msg:'You keep '+Math.round(curve[ang]*100)+'%, the best is '+Math.round(best*100)+'%. Line the black line up with the long direction of the cloud.'}});

    const arrow=(p,q,col,dash)=>{ctx.setLineDash(dash);ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(v.X(p[0]),v.Y(p[1]));ctx.lineTo(v.X(q[0]),v.Y(q[1]));ctx.stroke();ctx.setLineDash([]);

  const CARDS=['The robot club meets every Tuesday at 4 pm in room 12.','The school library opens at 8 am and closes at 5 pm on weekdays.','Lunch is served in the cafeteria from 11:30 to 12:30. Pizza day is Friday.','The science fair is on May 3. Projects must be signed up by April 20.','Students can borrow up to five books for two weeks.','The school bus leaves at 3:15 pm from the front gate.','Swimming lessons are on Thursdays in the gym pool.','To join the choir, talk to Ms. Rao in the music room.'];

/* ---- Recommender ---- */
function demoRec(root){
  const ITEMS=['Robot Pals','Star Trip','Mars Kids','Space Cats','Bake Off','Pizza Quest','Paint Party','Clay Town'],SCI=[0,1,2,3];
  const USERS=[['Ava',[5,5,4,0,1,2,0,1]],['Ben',[4,0,5,5,2,1,1,0]],['Cy',[5,4,0,4,0,2,1,2]],['Dee',[1,0,2,1,5,5,4,0]],['Eli',[0,1,1,2,4,0,5,5]],['Fay',[2,1,0,1,0,5,5,4]]];
  const you=new Array(8).fill(0);let nb=3,seenSci=false,seenFood=false;
  const mean=r=>{const v=r.filter(x=>x>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0};
  const sims=()=>{const my=mean(you);return USERS.map(([n,r])=>{const mu=mean(r);let s=0,a=0,b=0,c=0;for(let i=0;i<8;i++)if(you[i]>0&&r[i]>0){const x=you[i]-my,y=r[i]-mu;s+=x*y;a+=x*x;b+=y*y;c++}return{n,r,mu,sim:c>=2&&a>0&&b>0?s/Math.sqrt(a*b):0}})};
  const recs=()=>{const my=mean(you),S=sims().filter(x=>x.sim>0).sort((a,b)=>b.sim-a.sim).slice(0,nb),out=[];
    for(let i=0;i<8;i++)if(you[i]===0){let num=0,den=0;S.forEach(x=>{if(x.r[i]>0){num+=x.sim*(x.r[i]-x.mu);den+=x.sim}});if(den>0)out.push({i,p:Math.min(5,Math.max(1,my+num/den))})}
    return{S,out:out.sort((a,b)=>b.p-a.p)}};
  const box=el('div',{class:'stage pad'});root.append(box);const tbl=el('div',{style:'overflow-x:auto'}),out=el('div',{class:'attlist'});
  box.append(el('p',{class:'kick',style:'margin:0 0 8px'},'Ratings (tap the "You" row to rate: 1 to 5, tap again to cycle)'),tbl,el('p',{class:'kick',style:'margin:14px 0 6px'},'Bolt suggests for you'),out);
  const sSim=stat('most like you'),sTop=stat('top suggestion');
  const upd=()=>{
    let h='<table class="ratings"><tr><th></th>'+ITEMS.map(t=>'<th>'+t+'</th>').join('')+'</tr>';
    USERS.forEach(([n,r])=>{h+='<tr><th>'+n+'</th>'+r.map(v=>'<td class="r'+v+'">'+(v||'')+'</td>').join('')+'</tr>'});
    h+='<tr class="you"><th>You</th>'+you.map((v,i)=>'<td class="r'+v+'"><button type="button" data-i="'+i+'" aria-label="Rate '+ITEMS[i]+', now '+(v||'not rated')+'">'+(v||'+')+'</button></td>').join('')+'</tr></table>';
    tbl.innerHTML=h;tbl.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.i;you[i]=(you[i]+1)%6;upd()}));
    const R=recs();
    out.innerHTML=R.out.length?R.out.slice(0,3).map(x=>'<div class="attrow'+(x===R.out[0]?' top':'')+'"><b>'+ITEMS[x.i]+'</b><span class="evbar"><i style="left:0;width:'+(x.p/5*100)+'%;background:'+(x===R.out[0]?'var(--coral)':'var(--sky)')+'"></i></span><span>'+x.p.toFixed(1)+'</span></div>').join(''):'<p class="vsnote" style="margin:0">Rate at least two films, giving some a high score and some a low score, so Bolt can see your taste.</p>';
    if(R.out.length){const t=R.out[0].i;if(SCI.includes(t))seenSci=true;else seenFood=true}
    sSim.set(R.S.length?R.S[0].n:'-');sTop.set(R.out.length?ITEMS[R.out[0].i]:'-')};
  const sl=slider('Neighbours to listen to',1,6,1,nb,v=>v,v=>{nb=v;upd()});

    return seenSci&&seenFood?{ok:true,msg:'Bolt found people with a similar taste and borrowed their opinions. This idea, collaborative filtering, still sits inside many recommendation systems.'}:{ok:false,msg:(seenSci?'Space done. ':'Still need a space suggestion. ')+(seenFood?'Cooking/art done.':'Still need a cooking or art suggestion.')}});

/* ---- Image generation by denoising ---- */
function demoGen(root){
  const ART={heart:['............','..##....##..','.####..####.','.##########.','.##########.','.##########.','..########..','...######...','....####....','.....##.....','............','............'],
    star:['.....##.....','.....##.....','....####....','.##########.','..########..','...######...','...######...','..###..###..','..##....##..','.##......##.','............','............'],
    smiley:['...######...','..#......#..','.#..#..#..#.','.#........#.','.#........#.','.#.#....#.#.','.#..####..#.','..#......#..','...######...','............','............','............'],
    house:['.....##.....','....####....','...######...','..########..','.##########.','.##########.','.###....###.','.###....###.','.###....###.','.###....###.','............','............']};
  const KEYS=Object.keys(ART),N=144,P=KEYS.map(k=>Float64Array.from(ART[k].join(''),c=>c==='#'?1:-1));
  const NAME={heart:'heart',star:'star',smiley:'smiley',house:'house'};
  let prompt=-1,guide=2,steps=14,seed=1,frames=[],final=null,reveal=8,seen=new Set();
  const ab=t=>Math.min(.9999,Math.cos(t*Math.PI/2)**2);
  const x0hat=(x,a)=>{const lg=P.map((p,i)=>{let d=0;for(let j=0;j<N;j++)d+=x[j]*p[j];return Math.sqrt(a)*d/Math.max(1-a,1e-4)+(i===prompt?guide*3:0)});const m=Math.max(...lg),e=lg.map(v=>Math.exp(v-m)),s=e.reduce((u,v)=>u+v,0),o=new Float64Array(N);e.forEach((v,i)=>{for(let j=0;j<N;j++)o[j]+=v/s*P[i][j]});return o};
  const sample=()=>{const r=rng(seed*91+5);let x=Float64Array.from({length:N},()=>gauss(r));frames=[x.slice()];const snaps=[x.slice()];const all=[x.slice()];
    for(let k=0;k<steps;k++){const t0=1-k/steps,t1=1-(k+1)/steps,a0=t0>=1?0:ab(t0),a1=t1<=0?1:ab(t1);const h=x0hat(x,a0),nx=new Float64Array(N);
      for(let j=0;j<N;j++){const eps=a0<1e-6?x[j]:(x[j]-Math.sqrt(a0)*h[j])/Math.sqrt(1-a0);nx[j]=a1>=1?h[j]:Math.sqrt(a1)*h[j]+Math.sqrt(1-a1)*eps}
      x=nx;all.push(Float64Array.from(x))}
    frames=Array.from({length:8},(_,i)=>all[Math.round(i*steps/7)]);final=all[steps];
    let bi=0,bs=-9;P.forEach((p,i)=>{let d=0,nx=0;for(let j=0;j<N;j++){d+=final[j]*p[j];nx+=final[j]*final[j]}const c=d/(Math.sqrt(nx||1)*12);if(c>bs){bs=c;bi=i}});return{bi,bs}};
  let res=sample();
  const box=el('div',{class:'stage'});root.append(box);const o=mkCanvas(.26);o.attach(box);
  const sP=stat('Bolt painted'),sM=stat('match'),sSeen=stat('different pictures found');
  o.draw=()=>{const C=colors(),{ctx,W,H}=o;ctx.clearRect(0,0,W,H);const ik=rgb(C.ink),n=8,gap=6,cw=(W-gap*(n+1))/n,cell=cw/12,top=Math.max(4,(H-cw)/2);
    for(let f=0;f<n;f++){const x0=gap+f*(cw+gap);ctx.fillStyle=C.panel;ctx.fillRect(x0,top,cw,cw);if(f>=reveal)continue;const fr=frames[f];
      for(let i=0;i<12;i++)for(let j=0;j<12;j++){const v=Math.max(-1,Math.min(1,fr[i*12+j])),u=(v+1)/2;ctx.fillStyle='rgba('+ik[0]+','+ik[1]+','+ik[2]+','+(u*.92).toFixed(2)+')';ctx.fillRect(x0+j*cell,top+i*cell,cell+.5,cell+.5)}
      ctx.strokeStyle=C.line;ctx.lineWidth=1.5;ctx.strokeRect(x0,top,cw,cw)}
    ctx.fillStyle=C.muted;ctx.font='600 12px '+css('--body');ctx.fillText('pure noise',gap,12);const lbl='finished picture';ctx.fillText(lbl,W-gap-ctx.measureText(lbl).width,12)};
  const run=runner(()=>{reveal++;o.draw();if(reveal>=8){run.stop();stats_()}},3);
  const stats_=()=>{sP.set(NAME[KEYS[res.bi]]);sM.set(Math.round(Math.max(0,res.bs)*100)+'%');seen.add(res.bi);sSeen.set(seen.size+' of 4')};
  const gen=(fresh)=>{res=sample();reveal=0;o.draw();run.start();if(fresh)stats_()};
  const seg=(items,cur,set)=>{const d=el('div',{class:'seg'}),bs={};items.forEach(([kk,l])=>{bs[kk]=btn(l,()=>{set(+kk);Object.entries(bs).forEach(([x,b])=>b.classList.toggle('on',x==kk))},'small'+(kk==cur?' on':''));d.append(bs[kk])});return d};
  const s1=slider('Denoising steps',2,30,1,steps,v=>v,v=>{steps=v});
  const s2=slider('How hard the prompt pulls',0,5,.25,guide,v=>v.toFixed(2),v=>{guide=v});
  root.append(stats(sP,sM,sSeen),el('div',{class:'ctl'},el('div',{html:'<p class="kick" style="margin:0 0 6px">Prompt</p>'}),seg([[-1,'No prompt'],...KEYS.map((k,i)=>[i,k])],prompt,v=>{prompt=v}),s1.node,s2.node,el('div',{class:'row'},btn('Make a picture',()=>{gen(0)},'primary'),btn('New noise, then make',()=>{seed++;gen(0)}))));
  o.draw();reveal=8;o.draw();stats_();
  taskCard(root,'With "No prompt" selected, press "New noise, then make" until Bolt has painted at least 3 different pictures on its own. Then check.',()=>{
    return seen.size>=3?{ok:true,msg:'Same model, different random noise, different pictures. A prompt just tilts the choice. That is how diffusion models create new images.'}:{ok:false,msg:'So far '+seen.size+' different picture'+(seen.size===1?'':'s')+'. Keep pressing "New noise, then make" (prompt: none).'}});

/* ---- Fairness ---- */
function demoFair(root){
  const G=[{n:'Group A',share:.6,pos:.7,mp:.66,mn:.38},{n:'Group B',share:.4,pos:.5,mp:.56,mn:.32}],SD=.14;
  const erf=x=>{const t=1/(1+.3275911*Math.abs(x)),y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return x>=0?y:-y};

  let tA=.5,tB=.5,lock=true;
  const calc=(g,t)=>{const tpr=sf(t,g.mp),fpr=sf(t,g.mn),app=g.pos*tpr+(1-g.pos)*fpr,acc=g.pos*tpr+(1-g.pos)*(1-fpr);return{tpr,fpr,app,acc}};
  const all=()=>{const a=calc(G[0],tA),b=calc(G[1],lock?tA:tB);return{a,b,acc:G[0].share*a.acc+G[1].share*b.acc,gap:Math.abs(a.tpr-b.tpr),agap:Math.abs(a.app-b.app)}};
  const box=el('div',{class:'stage'});root.append(box);const o=mkCanvas(.62);o.attach(box);
  const sAA=stat('A approved'),sAB=stat('B approved'),sTA=stat('A good applicants approved'),sTB=stat('B good applicants approved'),sAc=stat('right decisions overall');
  const pdf=(x,m)=>Math.exp(-.5*((x-m)/SD)**2);
  o.draw=()=>{const C=colors(),{ctx,W,H}=o;ctx.clearRect(0,0,W,H);const h2=H/2,X=v=>10+v*(W-20),r=all();
    [[0,tA,G[0]],[1,lock?tA:tB,G[1]]].forEach(([k,t,g])=>{const y0=k*h2+h2-20,hh=h2-44;ctx.strokeStyle=C.line;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(10,y0+.5);ctx.lineTo(W-10,y0+.5);ctx.stroke();
      [[g.mn,1-g.pos,C.c0],[g.mp,g.pos,C.c1]].forEach(([m,wt,col])=>{const c=rgb(col);ctx.beginPath();ctx.moveTo(X(0),y0);for(let i=0;i<=100;i++){const v=i/100;ctx.lineTo(X(v),y0-pdf(v,m)*wt*hh*1.35)}ctx.lineTo(X(1),y0);ctx.closePath();ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+',.32)';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=2;ctx.stroke()});
      ctx.strokeStyle=C.ink;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(X(t),y0-hh-4);ctx.lineTo(X(t),y0);ctx.stroke();
      ctx.fillStyle=C.ink;ctx.font='700 12px '+css('--body');ctx.fillText(g.n+' (approved: right of the line)',12,k*h2+14)});
    ctx.font='12px '+css('--body');ctx.fillStyle=C.c1;ctx.fillText('would repay',12,H-6);ctx.fillStyle=C.c0;ctx.fillText('would not',100,H-6);ctx.fillStyle=C.muted;ctx.fillText('model score 0 to 1',W-120,H-6)};
  const pc=v=>Math.round(v*100)+'%';
  const draw=()=>{o.draw();const r=all();sAA.set(pc(r.a.app));sAB.set(pc(r.b.app));sTA.set(pc(r.a.tpr));sTB.set(pc(r.b.tpr));sAc.set(pc(r.acc))};
  const s1=slider('Cut-off for Group A',.2,.8,.01,tA,v=>v.toFixed(2),v=>{tA=v;if(lock){s2.set(v);tB=v}draw()});
  const s2=slider('Cut-off for Group B',.2,.8,.01,tB,v=>v.toFixed(2),v=>{tB=v;draw()});
  s2.inp.disabled=true;
  const tg=btn('One cut-off for everyone: on',()=>{lock=!lock;tg.textContent='One cut-off for everyone: '+(lock?'on':'off');s2.inp.disabled=lock;if(lock){tB=tA;s2.set(tA)}draw()});
  root.append(stats(sAA,sAB,sTA,sTB,sAc),el('div',{class:'ctl'},s1.node,s2.node,el('div',{class:'row'},tg)));draw();
  taskCard(root,'A loan model scores people from two groups. Make the chance that a person who would repay gets approved (the two "good applicants approved" tiles) within 3 points of each other, while keeping at least 80% right decisions overall. Then check.',()=>{
    const r=all();
    if(r.gap<=.03&&r.acc>=.80)return{ok:true,msg:'Gap '+Math.round(r.gap*100)+' points at '+pc(r.acc)+' correct. Notice the approval rates are still different. You cannot equalise every measure at once when the groups differ, so people must choose which fairness idea fits the job.'};

    ctx.fillStyle=C.muted;ctx.font='12px '+css('--body');ctx.fillText('black: past. orange: what really happened next. dashed blue: the forecast',10,H-8);ctx.fillText('shaded: the future',X(NT)+6,14);
    const m=mae(f),b=baseline();sM.set(m.toFixed(2));sB.set(b.toFixed(2));sR.set(m<b?Math.round((1-m/b)*100)+'% better':Math.round((m/b-1)*100)+'% worse')};
  const ctl=el('div',{class:'ctl'});const sP=slider('Window (days to average)',2,24,1,par,v=>v,v=>{par=v;o.draw()}),sA=slider('Alpha: how fast the level reacts',.05,1,.05,al,v=>v.toFixed(2),v=>{al=v;o.draw()}),sBe=slider('Beta: how fast the trend reacts',0,1,.05,be,v=>v.toFixed(2),v=>{be=v;o.draw()}),sG=slider('Gamma: how fast the season reacts',0,1,.05,ga,v=>v.toFixed(2),v=>{ga=v;o.draw()});

/* ---- Optimisers ---- */
function demoOpt(root){
  let surf='ravine',opt='sgd',lr=.05,mom=.9,sx=-4,sy=1.5,path=[],steps=0;
  const F={ravine:{f:(x,y)=>.5*(.1*x*x+25*y*y),g:(x,y)=>[.1*x,25*y],v:[-5,5,-2.2,2.2],s:[-4,1.5]},banana:{f:(x,y)=>(1-x)**2+10*(y-x*x)**2,g:(x,y)=>[-2*(1-x)-40*x*(y-x*x),20*(y-x*x)],v:[-2,2,-1,3],s:[-1.5,2]}};
  const sim=(n,s0)=>{const S=F[surf],P=[[s0[0],s0[1]]];let x=s0[0],y=s0[1],vx=0,vy=0,m1x=0,m1y=0,m2x=0,m2y=0,t=0;
    for(let i=0;i<n;i++){const g=S.g(x,y);t++;let dx,dy;
      if(opt==='sgd'){dx=-lr*g[0];dy=-lr*g[1]}
      else if(opt==='mom'){vx=mom*vx-lr*g[0];vy=mom*vy-lr*g[1];dx=vx;dy=vy}
      else if(opt==='rms'){m2x=.9*m2x+.1*g[0]*g[0];m2y=.9*m2y+.1*g[1]*g[1];dx=-lr*g[0]/(Math.sqrt(m2x)+1e-8);dy=-lr*g[1]/(Math.sqrt(m2y)+1e-8)}
      else{m1x=mom*m1x+(1-mom)*g[0];m1y=mom*m1y+(1-mom)*g[1];m2x=.999*m2x+.001*g[0]*g[0];m2y=.999*m2y+.001*g[1]*g[1];dx=-lr*(m1x/(1-mom**t))/(Math.sqrt(m2x/(1-.999**t))+1e-8);dy=-lr*(m1y/(1-mom**t))/(Math.sqrt(m2y/(1-.999**t))+1e-8)}
      x+=dx;y+=dy;if(!isFinite(x)||!isFinite(y)||Math.abs(x)>1e6||Math.abs(y)>1e6){P.push([NaN,NaN]);break}P.push([x,y])}return P};
  const lossAt=p=>isFinite(p[0])?F[surf].f(p[0],p[1]):Infinity;
  const box=el('div',{class:'stage'});root.append(box);const o=mkCanvas(.7);o.attach(box);o.c.style.touchAction='manipulation';
  const sS=stat('steps taken'),sL=stat('loss now'),sB=stat('lowest loss so far');
  const reset=()=>{path=[[sx,sy]];steps=0;o.draw()};
  const V=()=>{const S=F[surf].v;return mkView(o,S[0],S[1],S[2],S[3],6)};
  o.draw=()=>{const C=colors(),{ctx,W,H}=o,v=V(),S=F[surf],nx=44,ny=31,cw=W/nx,ch=H/ny,c1=rgb(C.c0);ctx.clearRect(0,0,W,H);
    for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){const l=S.f(v.ix((i+.5)*cw),v.iy((j+.5)*ch)),a=Math.max(.04,.5-Math.log10(1+l)*.2);ctx.fillStyle='rgba('+c1[0]+','+c1[1]+','+c1[2]+','+a.toFixed(3)+')';ctx.fillRect(i*cw,j*ch,cw+1,ch+1)}
    ctx.strokeStyle=C.c1;ctx.lineWidth=2.5;ctx.beginPath();path.forEach((p,i)=>{if(!isFinite(p[0]))return;i?ctx.lineTo(v.X(p[0]),v.Y(p[1])):ctx.moveTo(v.X(p[0]),v.Y(p[1]))});ctx.stroke();
    path.forEach(p=>{if(!isFinite(p[0]))return;ctx.beginPath();ctx.arc(v.X(p[0]),v.Y(p[1]),2.6,0,7);ctx.fillStyle=C.c1;ctx.fill()});
    const e=path[path.length-1];if(isFinite(e[0])){ctx.beginPath();ctx.arc(v.X(e[0]),v.Y(e[1]),8,0,7);ctx.fillStyle=C.ink;ctx.fill()}
    ctx.beginPath();ctx.arc(v.X(sx),v.Y(sy),6,0,7);ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.stroke();
    const mn=surf==='ravine'?[0,0]:[1,1];ctx.beginPath();ctx.moveTo(v.X(mn[0])-7,v.Y(mn[1])-7);ctx.lineTo(v.X(mn[0])+7,v.Y(mn[1])+7);ctx.moveTo(v.X(mn[0])+7,v.Y(mn[1])-7);ctx.lineTo(v.X(mn[0])-7,v.Y(mn[1])+7);ctx.strokeStyle=C.ok;ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle=C.muted;ctx.font='12px '+css('--body');ctx.fillText('tap the map to choose a start. green X: the lowest point',10,H-10);
    const l=lossAt(e);sS.set(steps);sL.set(isFinite(l)?l.toPrecision(3):'blew up');sB.set(Math.min(...path.map(lossAt)).toPrecision(3))};
  o.c.addEventListener('pointerdown',e=>{const rc=o.c.getBoundingClientRect(),v=V();sx=v.ix(e.clientX-rc.left);sy=v.iy(e.clientY-rc.top);reset()});
  const run=runner(()=>{const P=sim(steps+3,[sx,sy]);steps=Math.min(P.length-1,steps+3);path=P.slice(0,steps+1);o.draw();if(steps>=300||!isFinite(path[path.length-1][0]))run.stop()},12);
  const sl1=slider('Learning rate (step size)',.005,1,.005,lr,v=>v.toFixed(3),v=>{lr=v;run.stop();reset()}),sl2=slider('Momentum / memory (beta)',0,.99,.01,mom,v=>v.toFixed(2),v=>{mom=v;run.stop();reset()});
  const show=()=>{sl2.node.hidden=opt==='sgd'||opt==='rms'};
  root.append(stats(sS,sL,sB),el('div',{class:'ctl'},mkSeg([['ravine','Long narrow valley'],['banana','Banana valley']],surf,k=>{surf=k;sx=F[k].s[0];sy=F[k].s[1];run.stop();reset()}),mkSeg([['sgd','Plain gradient descent'],['mom','Momentum'],['rms','RMSprop'],['adam','Adam']],opt,k=>{opt=k;show();run.stop();reset()}),sl1.node,sl2.node,el('div',{class:'row'},run.btn,btn('Reset',()=>{run.stop();reset()}))));show();reset();

    const keep=surf;if(surf!=='ravine')return{ok:false,msg:'Switch to the long narrow valley.'};const P=sim(120,[-4,1.5]),ls=P.map(lossAt),b=Math.min(...ls);

}

/* ============ new demos, part 4: Backprop, Information, RNN gradients, LoRA, Quantisation, Causality ============ */

/* ---- Backpropagation on XOR ---- */
function demoBP(root){
  let seed=3,lr=.5,step=0,sel=1;const H=3,X=[[-1,-1],[-1,1],[1,-1],[1,1]],Y=[0,1,1,0];
  let W1,b1,W2,b2;
  const init=()=>{const r=rng(seed*7919);const g=()=>(r()-.5)*2;W1=Array.from({length:H},()=>[g()*1.5,g()*1.5]);b1=Array.from({length:H},()=>g()*.5);W2=Array.from({length:H},()=>g()*1.5);b2=0;step=0};
  const sg=z=>1/(1+Math.exp(-z));
  const fwd=x=>{const h=W1.map((w,j)=>Math.tanh(w[0]*x[0]+w[1]*x[1]+b1[j]));const z=h.reduce((s,v,j)=>s+v*W2[j],b2);return{h,z,p:sg(z)}};
  const lossAll=()=>X.reduce((s,x,i)=>{const p=Math.min(1-1e-9,Math.max(1e-9,fwd(x).p));return s-(Y[i]?Math.log(p):Math.log(1-p))},0)/4;
  const grads=(x,y)=>{const f=fwd(x),dz=f.p-y,gW2=f.h.map(v=>dz*v),dh=W2.map(w=>dz*w),dpre=dh.map((d,j)=>d*(1-f.h[j]*f.h[j]));return{f,dz,gW2,gb2:dz,dh,gW1:dpre.map(d=>[d*x[0],d*x[1]]),gb1:dpre}};
  const train=n=>{for(let k=0;k<n;k++){const G={W1:W1.map(()=>[0,0]),b1:W1.map(()=>0),W2:W2.map(()=>0),b2:0};X.forEach((x,i)=>{const g=grads(x,Y[i]);for(let j=0;j<H;j++){G.W1[j][0]+=g.gW1[j][0]/4;G.W1[j][1]+=g.gW1[j][1]/4;G.b1[j]+=g.gb1[j]/4;G.W2[j]+=g.gW2[j]/4}G.b2+=g.gb2/4});
    for(let j=0;j<H;j++){W1[j][0]-=lr*G.W1[j][0];W1[j][1]-=lr*G.W1[j][1];b1[j]-=lr*G.b1[j];W2[j]-=lr*G.W2[j]}b2-=lr*G.b2;step++}};
  init();
  const box=el('div',{class:'stage'});root.append(box);const o=mkCanvas(.62);o.attach(box);
  const sSt=stat('steps'),sLo=stat('loss'),sAc=stat('right answers');
  const tbl=el('div',{class:'evlist',style:'font-family:var(--mono);font-size:.85rem;line-height:1.6'});
  const upd=()=>{o.draw();const l=lossAll();sSt.set(step);sLo.set(l.toFixed(3));sAc.set(X.filter((x,i)=>(fwd(x).p>.5?1:0)===Y[i]).length+' / 4');
    const x=X[sel],g=grads(x,Y[sel]),f=g.f,eps=1e-5,old=W1[0][0];const L0=()=>{const p=fwd(x).p;return -(Y[sel]?Math.log(p):Math.log(1-p))};W1[0][0]=old+eps;const a=L0();W1[0][0]=old-eps;const b=L0();W1[0][0]=old;const num=(a-b)/(2*eps);
    tbl.innerHTML='<b>Forward</b> (input '+x.join(', ')+')<br>hidden = '+f.h.map(v=>v.toFixed(2)).join(', ')+'<br>answer p = '+f.p.toFixed(3)+' (wanted '+Y[sel]+')<br><b>Backward</b><br>blame at output = p - y = '+g.dz.toFixed(3)+'<br>blame passed to hidden = '+g.dh.map(v=>v.toFixed(3)).join(', ')+'<br><b>Gradient check</b> for first weight:<br>by backprop &nbsp;&nbsp;'+g.gW1[0][0].toExponential(3)+'<br>by nudging it '+num.toExponential(3)};
  o.draw=()=>{const C=colors(),{ctx,W,Hh=o.H}=o,Ht=o.H,n=36,cw=W/n,ch=Ht/n,a=rgb(C.c0),b=rgb(C.c1);ctx.clearRect(0,0,W,Ht);
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){const p=fwd([(i+.5)/n*3-1.5,1.5-(j+.5)/n*3]).p;const c=p>.5?b:a,al=.12+.5*Math.abs(p-.5)*2;ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+al.toFixed(2)+')';ctx.fillRect(i*cw,j*ch,cw+1,ch+1)}
    X.forEach((x,i)=>{const px=(x[0]+1.5)/3*W,py=(1.5-x[1])/3*Ht;marker(ctx,Y[i]?1:0,px,py,i===sel?11:8,Y[i]?C.c1:C.c0,C.ink);if(i===sel){ctx.beginPath();ctx.arc(px,py,16,0,7);ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.stroke()}});
    ctx.fillStyle=C.muted;ctx.font='12px '+css('--body');ctx.fillText('XOR: squares are 1, circles are 0',10,Ht-10)};
  const run=runner(()=>{train(20);upd();if(lossAll()<.01)run.stop()},20);
  const sl=slider('Learning rate',.05,2,.05,lr,v=>v.toFixed(2),v=>{lr=v});
  root.append(stats(sSt,sLo,sAc),el('div',{class:'ctl'},mkSeg([[0,'A'],[1,'B'],[2,'C'],[3,'D']],sel,k=>{sel=+k;upd()}),sl.node,el('div',{class:'row'},btn('One step',()=>{train(1);upd()}),run.btn,btn('New random start',()=>{run.stop();seed++;init();upd()}))),tbl);upd();
  taskCard(root,'Train the tiny network until the loss is below 0.05 so it gets all four XOR points right. Use Play, or step by hand. If it gets stuck, try a new random start. Then check.',()=>{const l=lossAll(),ok=X.every((x,i)=>(fwd(x).p>.5?1:0)===Y[i]);
    return l<.05&&ok?{ok:true,msg:'Loss '+l.toFixed(3)+'. Every point is right. No straight line can solve XOR, but the hidden layer bends the space, and backprop found the bend by passing blame backwards.'}:{ok:false,msg:'Loss is '+l.toFixed(3)+' and '+X.filter((x,i)=>(fwd(x).p>.5?1:0)===Y[i]).length+' of 4 are right. Keep training, or press New random start.'}});
}

/* ---- Information: entropy, cross-entropy, KL ---- */
function demoInfo(root){
  const P=[.5,.25,.15,.10],names=['sunny','cloudy','rainy','stormy'];let lg=[0,0,0,0];
  const sm=z=>{const m=Math.max(...z),e=z.map(v=>Math.exp(v-m)),s=e.reduce((a,b)=>a+b,0);return e.map(v=>v/s)};
  const log2=x=>Math.log(x)/Math.LN2;
  const Hp=()=>-P.reduce((s,p)=>s+p*log2(p),0),CE=()=>{const q=sm(lg);return -P.reduce((s,p,i)=>s+p*log2(Math.max(q[i],1e-12)),0)};
  const box=el('div',{class:'stage'});root.append(box);const o=mkCanvas(.5);o.attach(box);
  const sH=stat('entropy of the truth (bits)'),sC=stat('cross-entropy (bits)'),sK=stat('KL, the wasted bits');
  const upd=()=>{o.draw();sH.set(Hp().toFixed(3));sC.set(CE().toFixed(3));sK.set((CE()-Hp()).toFixed(3))};
  o.draw=()=>{const C=colors(),{ctx,W,H}=o,q=sm(lg);ctx.clearRect(0,0,W,H);const bw=W/4,base=H-26,mh=H-50;
    P.forEach((p,i)=>{const x=i*bw+bw*.12;ctx.fillStyle=C.c0;ctx.globalAlpha=.85;ctx.fillRect(x,base-p*mh/.6,bw*.34,p*mh/.6);ctx.globalAlpha=1;ctx.fillStyle=C.c1;ctx.fillRect(x+bw*.36,base-q[i]*mh/.6,bw*.34,q[i]*mh/.6);
      ctx.fillStyle=C.ink;ctx.font='12px '+css('--body');ctx.fillText(names[i],x,H-8);ctx.fillStyle=C.muted;ctx.fillText((q[i]*100).toFixed(0)+'%',x+bw*.36,base-q[i]*mh/.6-4)});
    ctx.fillStyle=C.c0;ctx.fillRect(8,6,10,10);ctx.fillStyle=C.ink;ctx.fillText('truth',22,15);ctx.fillStyle=C.c1;ctx.fillRect(74,6,10,10);ctx.fillStyle=C.ink;ctx.fillText('model guess',88,15)};
  const sls=names.map((n,i)=>slider('Model score for '+n,-3,3,.05,0,v=>v.toFixed(2),v=>{lg[i]=v;upd()}));
  root.append(stats(sH,sC,sK),el('div',{class:'ctl'},sls.map(s=>s.node),el('div',{class:'row'},btn('All equal',()=>{lg=[0,0,0,0];sls.forEach(s=>s.set(0));upd()}),btn('Confidently wrong',()=>{lg=[-3,-1,1,3];sls.forEach((s,i)=>s.set(lg[i]));upd()}))));upd();
  taskCard(root,'Tune the four scores until the wasted bits (KL) are below 0.01. The model\'s guess must match the truth. Then check.',()=>{const k=CE()-Hp();return k<.01?{ok:true,msg:'KL is '+k.toFixed(4)+' bits. Cross-entropy can never go below the entropy of the truth, and the gap between them is exactly what a wrong model wastes. This is why cross-entropy is the loss for classifiers.'}:{ok:false,msg:'KL is '+k.toFixed(3)+' bits. Make the guessed bars the same height as the truth bars.'}});
}

  const upd=()=>{o.draw();sP.set(fmt(Math.pow(w,T)));sG.set(fmt(Math.pow(f,T)))};
  o.draw=()=>{const C=colors(),{ctx,W,H}=o,pad=34,lo=-8,hi=6;ctx.clearRect(0,0,W,H);const X=t=>pad+t/60*(W-pad-8),Y=e=>10+(hi-Math.max(lo,Math.min(hi,e)))/(hi-lo)*(H-34);
    ctx.strokeStyle=C.grid;ctx.fillStyle=C.muted;ctx.font='11px '+css('--body');for(let e=lo;e<=hi;e+=2){ctx.beginPath();ctx.moveTo(pad,Y(e));ctx.lineTo(W-8,Y(e));ctx.stroke();ctx.fillText('1e'+e,0,Y(e)+4)}
    ctx.strokeStyle=C.ok;ctx.lineWidth=1.5;ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(pad,Y(0));ctx.lineTo(W-8,Y(0));ctx.stroke();ctx.setLineDash([]);
    const line=(b,col)=>{ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.beginPath();for(let t=0;t<=60;t++){const e=t*Math.log10(b);t?ctx.lineTo(X(t),Y(e)):ctx.moveTo(X(t),Y(e))}ctx.stroke()};
    line(w,C.bad);line(f,C.c1);ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(X(T),10);ctx.lineTo(X(T),H-24);ctx.stroke();
    ctx.fillStyle=C.ink;ctx.fillText('steps back in time',pad,H-6);ctx.fillStyle=C.bad;ctx.fillText('plain cell',W-150,22);ctx.fillStyle=C.c1;ctx.fillText('gated cell',W-80,22)};
  const s1=slider('Sequence length T',5,60,1,T,v=>v+' steps',v=>{T=v;upd()}),s2=slider('Plain cell: factor per step',.5,1.5,.01,w,v=>v.toFixed(2),v=>{w=v;upd()}),s3=slider('Gated cell: forget gate',.5,1,.005,f,v=>v.toFixed(3),v=>{f=v;upd()});

/* ---- LoRA: low-rank approximation ---- */
function demoFT(root){
  const N=24;let seed=5,r=2,sv=[],U,Vt,A;
  const gen=()=>{const R=rng(seed*131),g=()=>gauss(R);const sig=[10,6,3.5,2],us=sig.map(()=>Array.from({length:N},g)),vs=sig.map(()=>Array.from({length:N},g));
    const nrm=v=>{const s=Math.hypot(...v);return v.map(x=>x/s)};const u=us.map(nrm),v=vs.map(nrm);
    A=Array.from({length:N},(_,i)=>Array.from({length:N},(_,j)=>sig.reduce((s,sg,k)=>s+sg*u[k][i]*v[k][j],0)*Math.sqrt(N)/2+.06*g()));
    /* Jacobi eigen of A^T A */
    const M=Array.from({length:N},(_,i)=>Array.from({length:N},(_,j)=>{let s=0;for(let k=0;k<N;k++)s+=A[k][i]*A[k][j];return s}));
    const E=Array.from({length:N},(_,i)=>Array.from({length:N},(_,j)=>i===j?1:0));
    for(let sw=0;sw<60;sw++){let off=0;for(let p=0;p<N;p++)for(let q=p+1;q<N;q++){const a=M[p][q];off+=a*a;if(Math.abs(a)<1e-12)continue;const th=(M[q][q]-M[p][p])/(2*a),t=Math.sign(th||1)/(Math.abs(th)+Math.sqrt(th*th+1)),c=1/Math.sqrt(t*t+1),s=t*c;
      for(let k=0;k<N;k++){const kp=M[k][p],kq=M[k][q];M[k][p]=c*kp-s*kq;M[k][q]=s*kp+c*kq}for(let k=0;k<N;k++){const pk=M[p][k],qk=M[q][k];M[p][k]=c*pk-s*qk;M[q][k]=s*pk+c*qk}
      for(let k=0;k<N;k++){const kp=E[k][p],kq=E[k][q];E[k][p]=c*kp-s*kq;E[k][q]=s*kp+c*kq}}if(off<1e-18)break}
    const idx=[...Array(N).keys()].sort((a,b)=>M[b][b]-M[a][a]);sv=idx.map(i=>Math.sqrt(Math.max(0,M[i][i])));
    Vt=idx.map(i=>E.map(row=>row[i]));U=Vt.map((v,k)=>A.map(row=>row.reduce((s,x,j)=>s+x*v[j],0)/(sv[k]||1)))};
  const tot=()=>sv.reduce((s,x)=>s+x*x,0),err=k=>Math.sqrt(sv.slice(k).reduce((s,x)=>s+x*x,0)/tot());

  const relErr=q=>{let a=0,b=0;for(let i=0;i<N;i++){a+=(q[i]-Wt[i])**2;b+=Wt[i]**2}return Math.sqrt(a/b)};

  o.draw=()=>{const C=colors(),{ctx,W,H}=o,n=160,m=Math.max(...Wt.slice(0,n).map(Math.abs));ctx.clearRect(0,0,W,H);ctx.strokeStyle=C.line;ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();

/* ---- Causality: Simpson's paradox ---- */

    const tS=pdS*.5,tM=pdM*.5,uS=(1-pdS)*.5,uM=(1-pdM)*.5; /* shares of population */
    const rT=(tS*(base.S+TRUE)+tM*(base.M+TRUE))/(tS+tM),rU=(uS*base.S+uM*base.M)/(uS+uM);
    return{rT,rU,naive:rT-rU,adj:TRUE,tS:tS/(tS+tM),uS:uS/(uS+uM)}};
  const box=el('div',{class:'stage'});root.append(box);const o=mkCanvas(.5);o.attach(box);

  const upd=()=>{const r=calc(),e=est();if(mode==='naive'&&r.naive<0)saw=true;o.draw();sN.set((e>0?'+':'')+e.toFixed(1)+' points');sT.set('+'+TRUE+' points');sS.set((r.tS*100).toFixed(0)+'% vs '+(r.uS*100).toFixed(0)+'%')};
  o.draw=()=>{const C=colors(),{ctx,W,H}=o,r=calc();ctx.clearRect(0,0,W,H);const bw=W/4,base0=H-26,mh=H-50;

    bar(0,r.rU,C.c0,'no drug');bar(1,r.rT,C.c1,'drug');

    sub(0,base.S,C.c0,'severe, no drug');sub(1,base.S+TRUE,C.c1,'severe, drug');ctx.fillText('same-severity groups',2*bw+4,14)};

  taskCard(root,'First raise the slider until the plain average comparison makes the drug look harmful. Then fix the analysis, by comparing within severity or by randomising, until the estimate matches the true +10. Then check.',()=>{if(!saw)return{ok:false,msg:'First make "Just compare averages" show a negative number. Raise the slider.'};const e=est();return mode!=='naive'&&Math.abs(e-TRUE)<1?{ok:true,msg:'Estimate '+e.toFixed(1)+', the true effect. A model that only finds patterns would have learned "drug means worse outcome". Causal thinking asks who got the drug and why, then removes that bias by adjusting or randomising.'}:{ok:false,msg:mode==='naive'?'You have seen the paradox. Now pick a way to remove the bias.':'Estimate '+e.toFixed(1)+'. Not yet within 1 point of the truth.'}});

  o.draw=()=>{const C=colors(),{ctx,W,H}=o;if(H<80)return;const N=1000,cols=50,rows=20,cw=W/cols,ch=(H-34)/rows,sick=Math.max(1,Math.round(prev*N));ctx.clearRect(0,0,W,H);

      ctx.fill();ctx.globalAlpha=1;if(pos&&reps===0){ctx.strokeStyle=C.ink;ctx.lineWidth=1.6;ctx.stroke()}}
    ctx.fillStyle=C.ink;ctx.font='12px '+css('--body');ctx.fillText('1000 people. Red = sick. Ringed = tested positive.',4,H-12)};
  const s1=slider('How common the illness is',.001,.3,.001,prev,v=>(v*100).toFixed(1)+'%',v=>{prev=v;upd()}),s2=slider('Test catches the sick (sensitivity)',.5,.999,.001,sens,v=>(v*100).toFixed(1)+'%',v=>{sens=v;upd()}),s3=slider('Test clears the healthy (specificity)',.5,.999,.001,spec,v=>(v*100).toFixed(1)+'%',v=>{spec=v;upd()});

    const p95=util>=1?Infinity:(comp+fill)*(1+1.4*util/(1-util)*.35)+10;return{comp,thr,util,p95,cost}};
  const best=()=>{let m=Infinity;for(const q of[false,true])for(let b=1;b<=32;b*=2)for(let r=1;r<=12;r++){const c=calc(b,r,q);if(c.p95<=slo&&c.util<=.85)m=Math.min(m,c.cost)}return m};

  o.draw=()=>{const C=colors(),{ctx,W,H}=o,c=calc(batch,rep,quant);ctx.clearRect(0,0,W,H);ctx.font='12px '+css('--body');
    const bar=(y,l,v,mx,col,t)=>{ctx.fillStyle=C.muted;ctx.fillText(l,4,y+12);const w0=110,bw=Math.max(0,Math.min(1,v/mx))*(W-w0-70);ctx.fillStyle=col;ctx.fillRect(w0,y,bw,16);ctx.fillStyle=C.ink;ctx.fillText(t,w0+bw+6,y+12)};
    bar(14,'latency (p95)',isFinite(c.p95)?c.p95:1200,1200,c.p95<=slo?C.ok:C.bad,isFinite(c.p95)?c.p95.toFixed(0)+' ms':'queue grows');
    ctx.strokeStyle=C.ink;ctx.setLineDash([4,3]);const xs=110+slo/1200*(W-180);ctx.beginPath();ctx.moveTo(xs,8);ctx.lineTo(xs,40);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=C.muted;ctx.fillText('limit '+slo,xs+4,50);
    bar(66,'busy',Math.min(c.util,1.2),1.2,c.util<=.85?C.c1:C.bad,Math.round(c.util*100)+'%');bar(96,'capacity (req/s)',c.thr,rate*3,C.c0,c.thr.toFixed(0));bar(126,'cost per 1000',c.cost,.5,C.c1,'$'+c.cost.toFixed(3))};
  const s0=slider('Incoming requests per second',50,600,10,rate,v=>v+' req/s',v=>{rate=v;upd()}),s1=slider('Batch size (requests handled together)',1,32,1,batch,v=>v,v=>{batch=v;upd()}),s2=slider('Servers',1,12,1,rep,v=>v,v=>{rep=v;upd()});
  root.append(stats(sL,sU,sC),el('div',{class:'ctl'},s0.node,s1.node,s2.node,mkSeg([['0','Full-precision model'],['1','Quantised model (smaller, faster)']],quant?'1':'0',k=>{quant=k==='1';upd()})),el('p',{class:'note'},'A simple model of serving, not a benchmark. Batching raises throughput but makes each request wait.'));upd();

/* ---- Agents: reliability compounds ---- */
function demoAgent(root){
  let calc=false,search=false,verify=false,maxSteps=10,seed=1;
  const STEPS=[['look up a fact','s'],['do arithmetic','c'],['look up another fact','s'],['do more arithmetic','c']];
  const rel=k=>k==='s'?(search?.95:.6):(calc?.99:.85);
  const sim=()=>{const R=rng(seed*313);let ok=0,steps=0;const N=500;for(let n=0;n<N;n++){let used=0,good=true;for(const [,k] of STEPS){let r=rel(k);let succeeded=false;for(let tr=0;tr<(verify?2:1);tr++){used++;if(used>maxSteps)break;if(R()<r){succeeded=true;break}else if(!verify||R()>.85){/* wrong and not noticed */break}}
      if(used>maxSteps){good=false;break}if(!succeeded){good=false;break}}
      if(good)ok++;steps+=Math.min(used,maxSteps)}return{succ:ok/N,steps:steps/N}};
  const box=el('div',{class:'stage'});root.append(box);const o=mkCanvas(.4);o.attach(box);
  const sS=stat('tasks done right'),sT=stat('average steps used'),sR=stat('chance each step works');
  let R0;const upd=()=>{R0=sim();o.draw();sS.set(Math.round(R0.succ*100)+'%');sT.set(R0.steps.toFixed(1));sR.set(Math.round(rel('s')*100)+'% / '+Math.round(rel('c')*100)+'%')};
  o.draw=()=>{const C=colors(),{ctx,W,H}=o;ctx.clearRect(0,0,W,H);ctx.font='12px '+css('--body');const n=STEPS.length,bw=(W-20)/n;let p=1;
    STEPS.forEach(([t,k],i)=>{const r=rel(k),eff=verify?r+(1-r)*.85*r:r;p*=eff;const x=10+i*bw;

  const tg=(l,get,set)=>{const b=btn(l,()=>{set(!get());b.classList.toggle('on',get());upd()},'small'+(get()?' on':''));return b};

function makeLib(emitLog,emitPlot){
  let s=1;
  const seed=n=>{s=(n>>>0)||1};
  const rand=()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
  const randn=()=>{let u=0;while(!u)u=rand();const v=rand();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
  const fmt=v=>typeof v==='number'?(Number.isInteger(v)?String(v):(Math.abs(v)>=1e5||(Math.abs(v)<1e-3&&v!==0))?v.toExponential(3):v.toFixed(4)):Array.isArray(v)?'['+v.map(fmt).join(', ')+']':(typeof v==='object'&&v!==null)?JSON.stringify(v,(k,x)=>typeof x==='number'?+x.toFixed(4):x):String(v);
  const print=(...a)=>emitLog(a.map(fmt).join(' '));
  const range=n=>Array.from({length:n},(_,i)=>i);
  const linspace=(a,b,n)=>range(n).map(i=>a+(b-a)*i/(n-1));
  const zeros=n=>new Array(n).fill(0);
  const sum=a=>a.reduce((x,y)=>x+y,0);
  const mean=a=>sum(a)/a.length;
  const std=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)*(x-m))))};
  const dot=(a,b)=>a.reduce((t,x,i)=>t+x*b[i],0);
  const sigmoid=z=>1/(1+Math.exp(-z));
  const solve=(A,y)=>{const n=y.length,M=A.map((r,i)=>[...r,y[i]]);for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;const tmp=M[c];M[c]=M[p];M[p]=tmp;const d=M[c][c]||1e-12;for(let r=c+1;r<n;r++){const f=M[r][c]/d;for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k]}}
    const x=new Array(n).fill(0);for(let i=n-1;i>=0;i--){let t=M[i][n];for(let j=i+1;j<n;j++)t-=M[i][j]*x[j];x[i]=t/(M[i][i]||1e-12)}return x};
  const plot=spec=>emitPlot(JSON.parse(JSON.stringify(spec)));
  return{seed,rand,randn,print,range,linspace,zeros,sum,mean,std,dot,sigmoid,solve,plot};
}


let activeRun=null;
function runCode(code,h){
  if(activeRun){activeRun();activeRun=null}
  let finished=false,worker=null,timer=0,ready=false,rt=0;
  const finish=msg=>{if(finished)return;finished=true;clearTimeout(timer);clearTimeout(rt);if(worker){worker.terminate();worker=null}activeRun=null;h.done(msg)};
  const exec=(lib)=>{new Function(...Object.keys(lib),'return (function(){\n'+code+'\n})()')(...Object.values(lib))};
  const mainThread=()=>{if(finished)return;clearTimeout(timer);clearTimeout(rt);if(worker){worker.terminate();worker=null}
    h.note('Running on the page itself, so avoid infinite loops.');
    setTimeout(()=>{try{exec(makeLib(h.log,h.plot));finish()}catch(e){finish(String(e&&e.message||e))}},30)};
  try{
    const src='const makeLib='+makeLib.toString()+';onmessage=function(e){var lib=makeLib(function(t){postMessage({t:"log",v:t})},function(d){postMessage({t:"plot",v:d})});try{new Function(...Object.keys(lib),"return (function(){\\n"+e.data+"\\n})()")(...Object.values(lib));postMessage({t:"done"})}catch(err){postMessage({t:"err",v:String(err&&err.message||err)})}};postMessage({t:"ready"});';
    worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
    worker.onmessage=e=>{const m=e.data;if(m.t==='ready')ready=true;else if(m.t==='log')h.log(m.v);else if(m.t==='plot')h.plot(m.v);else if(m.t==='done')finish();else if(m.t==='err')finish(m.v)};
    worker.onerror=ev=>{if(!ready)mainThread();else finish((ev&&ev.message)||'Error while running')};
    worker.postMessage(code);
    rt=setTimeout(()=>{if(!ready)mainThread()},2500);
    timer=setTimeout(()=>finish('Stopped after 8 seconds. Is there an infinite loop, or too many iterations?'),8000);
  }catch(e){worker=null;mainThread()}
  activeRun=()=>{finished=true;clearTimeout(timer);clearTimeout(rt);if(worker)worker.terminate()};
}
function drawPlot(host,spec){
  const box=el('div',{class:'stage'});host.append(box);
  const w=box.clientWidth||host.clientWidth||320,h=Math.round(w*.62),d=window.devicePixelRatio||1;
  const c=el('canvas',{class:'cv'});c.width=Math.round(w*d);c.height=Math.round(h*d);c.style.height=h+'px';box.append(c);
  const ctx=c.getContext('2d');ctx.scale(d,d);const C=colors(),pal=[C.c0,C.c1,C.c2,C.bad];
  const S=(spec.series||[]).filter(s=>s&&s.y&&s.y.length);
  const ty=v=>spec.logy?Math.log10(Math.max(v,1e-12)):v;
  const xv=(s,i)=>s.x?s.x[i]:(spec.x?spec.x[i]:i);
  const xs=[],ys=[];S.forEach(s=>s.y.forEach((v,i)=>{const a=xv(s,i),b=ty(v);if(isFinite(a)&&isFinite(b)){xs.push(a);ys.push(b)}}));
  ctx.font='12px '+css('--body');ctx.fillStyle=C.ink;ctx.fillText(spec.title||'',10,17);
  if(!xs.length){ctx.fillStyle=C.muted;ctx.fillText('nothing to plot',10,40);return}
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);if(x1===x0)x1=x0+1;if(y1===y0){y1=y0+1;y0-=1}const pad=(y1-y0)*.06;y0-=pad;y1+=pad;
  const L=50,R=12,T=28,B=26,X=v=>L+(v-x0)/(x1-x0)*(w-L-R),Y=v=>h-B-(v-y0)/(y1-y0)*(h-T-B);
  const nf=v=>{const a=Math.abs(v);return(a>=10000||(a<.01&&a!==0))?v.toExponential(0):String(+v.toFixed(a<1?3:a<100?2:0))};
  ctx.strokeStyle=C.grid;ctx.lineWidth=1;ctx.fillStyle=C.muted;
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4,yy=Y(v);ctx.beginPath();ctx.moveTo(L,yy);ctx.lineTo(w-R,yy);ctx.stroke();ctx.fillText(spec.logy?'1e'+v.toFixed(1):nf(v),4,yy+4)}
  for(let i=0;i<=4;i++){const v=x0+(x1-x0)*i/4;ctx.fillText(nf(v),X(v)-8,h-8)}
  S.forEach((s,k)=>{const col=pal[k%pal.length];ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2.5;ctx.beginPath();let first=true;
    s.y.forEach((v,i)=>{const a=xv(s,i),b=ty(v);if(!isFinite(a)||!isFinite(b))return;first?ctx.moveTo(X(a),Y(b)):ctx.lineTo(X(a),Y(b));first=false});ctx.stroke();
    if(s.y.length<=40)s.y.forEach((v,i)=>{const a=xv(s,i),b=ty(v);if(!isFinite(a)||!isFinite(b))return;ctx.beginPath();ctx.arc(X(a),Y(b),3,0,7);ctx.fill()});
    ctx.fillText(s.name||('series '+(k+1)),w-R-70,T+14*k+2)});
}

  const run=()=>{out.textContent='';plots.innerHTML='';lines=0;status.textContent='Running...';status.className='res no';runBtn.disabled=true;t0=performance.now();runCode(ta.value,h)};

{id:'start',title:'What is machine learning?',sub:'The big picture',tint:'sun',
hook:'Teach a computer by showing it examples, like teaching a puppy.',
kid:`<p>Say you want a robot to tell apples from bananas. You could write rules: "If it is yellow and long, it is a banana." That works until the robot meets a green banana or a yellow apple. Rules break all the time.</p>
<p>There is another way. Show the robot hundreds of fruits, each with a name tag. After a while it spots the pattern on its own. <b>That is machine learning:</b> a computer learns patterns from examples, and nobody has to write the rules.</p>
<div class="callout"><b>Three ways to learn</b>
<ul><li><b>With an answer key</b> (supervised). Flash cards: here is the picture, here is the answer.</li>
<li><b>Without answers</b> (unsupervised). Sorting a pile of toys into groups that look alike, with nobody telling you the group names.</li>
<li><b>By trying things</b> (reinforcement). A video game. You try moves, get points, and slowly learn what wins.</li></ul></div>
<p>Below, Bolt is learning to tell apples from bananas. Show it examples one at a time and watch its score on fruit it has never seen.</p>`,
look:`Each shape is a fruit Bolt has been shown. The big X marks are the average apple and the average banana. The dashed line splits the map into "apple side" and "banana side". The score tile tests Bolt on 300 fruits it has never seen.`,
tries:['Press <b>Show Bolt 1 example</b> three times. With only one or two examples Bolt is mostly guessing.','Keep going to about 10. The line settles and the score jumps.','Press <b>Show hidden test fruit</b> to see the new fruits Bolt is graded on.','Press <b>New fruit basket</b> and start over. A different basket, the same idea.'],
deep:`<h2>AI, machine learning and deep learning</h2>
<p>People mix these words up. Think of three circles, one inside the next.</p>
<ul><li><b>Artificial intelligence (AI)</b> is the big goal: machines doing things that seem smart.</li>
<li><b>Machine learning (ML)</b> is one way to get there: learn from data instead of writing every rule.</li>
<li><b>Deep learning</b> is one kind of ML that uses many-layered neural networks. Today's image tools and chat assistants are deep learning.</li></ul>
<h2>The learning loop</h2>
<p>Almost every ML project follows the same loop.</p>
<ol><li><b>Collect data</b> that matches the real problem.</li><li><b>Choose a model</b>, a function with adjustable settings called <b>parameters</b>.</li><li><b>Define a loss</b>, one number that says how wrong the model is.</li><li><b>Train</b>: adjust the parameters to lower the loss.</li><li><b>Test</b> on data the model never saw.</li><li><b>Deploy and watch</b> it, because the world keeps changing.</li></ol>
<p>The demo above is that loop in small. Its "model" is just two average points and a dividing line. Its "training" is computing the averages. Its "test" is the score on new fruit.</p>
<h2>Kinds of questions ML answers</h2>
<div class="eg"><table>
<tr><th>task</th><th>the question</th><th>example</th></tr>
<tr><td>classification</td><td>which group?</td><td>spam or not spam</td></tr>
<tr><td>regression</td><td>how much?</td><td>tomorrow's temperature</td></tr>
<tr><td>clustering</td><td>what groups exist?</td><td>types of shoppers</td></tr>
<tr><td>ranking</td><td>what order?</td><td>search results</td></tr>
<tr><td>generation</td><td>what could come next?</td><td>a reply to your message</td></tr>
<tr><td>control</td><td>what action now?</td><td>a robot picking up a cup</td></tr>
</table></div>
<h2>When NOT to use ML</h2>
<ul><li>A short list of clear rules solves it. Computing a tip needs arithmetic, not learning.</li>
<li>You have no data, or the data does not match the real situation.</li>
<li>A mistake would be costly and nobody can check the answer.</li>
<li>You cannot measure what "good" means.</li></ul>
<h2>Words that sound alike</h2>
<ul><li><b>Algorithm</b>: the recipe for learning, such as gradient descent. <b>Model</b>: the thing that comes out, the trained settings.</li>
<li><b>Parameters</b> are learned by the computer. <b>Hyperparameters</b> (like how many neighbours to ask) are chosen by you before training.</li></ul>
<h2>Key takeaways</h2>
<ul><li>ML finds patterns in examples, so the examples matter most.</li><li>Always judge a model on data it has not seen.</li><li>There are three families: answer key, no answers, and trial and error.</li></ul>`,
then:[['Spam filters','Hand-written keyword lists such as "FREE MONEY".','Models trained on huge numbers of messages and updated as spammers change their tricks.'],['Translation','Phrase books and grammar rules typed in by language experts.','Neural models that learn from large amounts of text in many languages, built into phones and browsers.'],['Recommendations','One "top 10" list shown to everyone.','Feeds personalised for each person from what they watched, played or bought.'],['Asking a computer for help','Phone menus: "press 1 for billing".','Chat assistants that handle typed or spoken questions in plain language.']],
words:[['Machine learning','A computer learns patterns from examples instead of following hand-written rules.'],['Model','The trained thing that turns inputs into answers.'],['Training','Adjusting the model to make fewer mistakes on examples.'],['Supervised','Learning from examples that come with answers.'],['Unsupervised','Finding structure when there are no answers.'],['Reinforcement','Learning from rewards for actions.']]},

{id:'data',title:'Data: the food of learning',sub:'Features, labels and splits',tint:'coral',
hook:'A model is only as good as the examples it learns from.',
kid:`<p>A computer cannot learn from nothing. It learns from <b>data</b>: lots of examples. Each example has two parts.</p>
<ul><li><b>Features</b> are the clues. For a house: how big it is, how many bedrooms, which street.</li>
<li><b>Label</b> is the answer you want the model to learn. For a house: its price.</li></ul>
<p>If the clues are poor, or the answers are wrong, the computer learns the wrong thing. People say <b>garbage in, garbage out</b>. A student who studied from a book full of typos would make the same typos.</p>
<div class="callout"><b>Three piles of data.</b> The <i>practice pile</i> (training) is for learning. The <i>mock exam pile</i> (validation) is for choosing settings. The <i>real exam pile</i> (test) stays hidden until the very end, so the score is honest.</div>
<p>Play with the demo. Change how many examples Bolt gets, how many labels are wrong, and how many neighbours Bolt asks before deciding. Find out what hurts, and what helps.</p>`,
look:`Circles and squares are the examples Bolt studies. A red ring means the label on that example is wrong. The background shows how Bolt would label any new point by letting its nearest neighbours vote. The report card shows its score on 300 fresh points.`,
tries:['Start with the defaults: 40 examples, 0% wrong, 3 neighbours. Note the score.','Drag <b>wrong labels</b> to 20%. Red rings appear, the colour map gets messy and the score drops.','Now raise <b>examples</b> to 200 and <b>neighbours</b> to 15. Bolt averages over many examples, so a few wrong labels matter much less.','Set wrong labels back to 0 and drag <b>examples</b> down to 6. This is an easy problem, so Bolt copes. Real problems are harder and need far more examples.','Press <b>Shuffle the data</b> a few times. The score moves a little each time, because luck matters.'],
deep:`<h2>A table of examples</h2>
<div class="eg"><table>
<tr><th>size (m²)</th><th>bedrooms</th><th>street</th><th>price</th></tr>
<tr><td>70</td><td>2</td><td>Oak Lane</td><td>210,000</td></tr>
<tr><td>120</td><td>4</td><td>Oak Lane</td><td>340,000</td></tr>
<tr><td>90</td><td>3</td><td>Mill Road</td><td>?</td></tr>
</table></div>
<p>The first three columns are <b>features</b>, the last one is the <b>label</b>. The last row is a new house, and the model must fill in the question mark.</p>
<h2>Splitting the data</h2>
<p>With 1,000 rows, a common split is 700 for training, 150 for validation and 150 for testing. The model learns from the 700. You compare settings on the 150 validation rows. You open the final 150 once, to report an honest score. If you keep peeking at the test pile, it stops being a fair exam.</p>
<h2>Getting data ready</h2>
<ul>
<li><b>Missing values.</b> Fill gaps with a typical value, or add a column that says "this was missing", or drop the row if few are missing.</li>
<li><b>Categories to numbers.</b> A street name is not a number. One-hot encoding makes one yes/no column per street.</li>
<li><b>Scaling.</b> Put features on similar ranges so one big-number feature does not drown out the rest. Compute the scaling numbers from the training pile only.</li>
<li><b>Outliers.</b> A house listed at 1 euro is probably a typo. Check before you train on it.</li>
</ul>
<h2>Sneaky problems</h2>
<ul>
<li><b>Data leakage.</b> A feature that secretly contains the answer. Predicting "will this customer leave?" with a column called "account closed date" gives a perfect score and a useless model.</li>
<li><b>Imbalance.</b> If 99 of 100 examples are one class, a model that always guesses that class looks great. Level 9 shows how to judge such models.</li>
<li><b>Label noise.</b> People disagree and make mistakes when labelling. The demo shows how quickly that hurts.</li>
<li><b>Unfair samples.</b> If a group is missing from the data, the model will work worse for that group. The last level returns to this.</li>
</ul>
<h2>More data or better data?</h2>
<p>Both help, but clean, relevant data often beats a larger pile of messy data. Many teams now spend more time improving their data than changing their model. This habit is called <b>data-centric AI</b>.</p>
<h2>Key takeaways</h2>
<ul><li>Features are clues, the label is the answer.</li><li>Keep a test pile untouched until the end.</li><li>Wrong labels and leaked answers are the most common ways to fool yourself.</li></ul>`,
then:[['Where data comes from','Surveys and hand-typed spreadsheets.','Apps, sensors, cameras and the web, often millions of records a day.'],['Labelling','Experts tag every example by hand.','People and models share the work. Large language models draft labels and people check them.'],['Quality checks','Looking over the table by eye.','Automatic tests for missing values, odd ranges and changes over time.'],['Privacy','Rarely discussed.','Consent, anonymising and laws such as the EU GDPR shape what data can be used and for what.']],
words:[['Feature','One clue about an example.'],['Label','The answer the model should learn.'],['Training set','Examples the model learns from.'],['Validation set','Examples used to choose settings.'],['Test set','Examples kept hidden for the final score.'],['Data leakage','A clue that secretly gives away the answer.']]},

{id:'gd',title:'Guess, check, improve',sub:'Linear regression and gradient descent',tint:'mint',
hook:'Find the best line by rolling downhill, one small step at a time.',
kid:`<p>Play the <b>hot and cold</b> game. A friend hides a toy. You take a step. "Warmer!" Another step. "Colder!" You turn around. Soon you find it, and nobody told you where it was.</p>
<p>A computer can learn the same way. It makes a guess, measures how wrong it is, then nudges its guess in the direction that makes it less wrong. Do that a few hundred times and the guess gets very good.</p>
<div class="callout"><b>Picture it.</b> You are blindfolded on a hill and want to reach the valley. You cannot see, but you can feel which way the ground slopes. Take a small step downhill, feel again, and repeat. That is <b>gradient descent</b>. The valley is the place where the model is least wrong.</div>
<p>The demo fits a straight line through dots. The size of your step is the <b>learning rate</b>. Too small is slow. Too big and you jump right over the valley.</p>`,
then:[['Predicting a number','Statisticians fit a line by hand or with a formula.','Still the first model to try for forecasting, pricing and science. It is quick and easy to explain.'],['Training big models','Small models on a single computer.','Gradient descent, with smarter versions such as Adam, trains networks with billions of weights on thousands of chips.'],['Speed','Hours for a small table.','Data is cut into mini-batches and spread across many chips working at the same time.']],
words:[['Loss','One number for how wrong the model is.'],['Gradient','The direction the loss rises fastest. We go the other way.'],['Learning rate','How big each step is.'],['Epoch','One full pass through the training data.'],['Regression','Predicting a number.'],['Convergence','When steps stop making things better.']]},

{id:'logreg',title:'Yes or no, with a percentage',sub:'Logistic regression',tint:'sky',
hook:'Turn evidence into a probability, then draw a line between two groups.',
kid:`<p>The weather app does not just say "rain". It says <b>70% chance of rain</b>. That is much more useful. You can bring an umbrella if you hate getting wet and leave it if you do not mind.</p>
<p>Logistic regression works like that. It adds up the clues for "yes", for example the number of links and the word "free" in an email. Lots of evidence gives a high score. Then it squeezes the score into a percentage between 0 and 100 using an S-shaped curve called the <b>sigmoid</b>.</p>
<div class="callout"><b>The line in the middle.</b> Somewhere between the two groups is a spot where the model says "50-50". Draw all of those spots and you get the <b>decision boundary</b>. On one side is yes, on the other is no.</div>
<p>In the demo, slide the classes closer together. When groups overlap, even a perfect model cannot be right every time, because some points really are ambiguous.</p>`,
then:[['Credit and medical risk','Paper score sheets built by experts.','Logistic models are still common where rules require clear explanations, now with extra checks for fairness.'],['Ads and clicks','Hand-tuned rules.','Large systems predict the chance of a click with models descended from this idea. Many now use deep networks.'],['Inside bigger models','Not used.','The last step of many classifiers is this same sigmoid or its multi-class cousin, softmax.']],
words:[['Sigmoid','An S-shaped curve that turns any number into a value between 0 and 1.'],['Probability','A number from 0 to 1 for how likely something is.'],['Decision boundary','Where the model switches its answer.'],['Log-loss','The score that punishes confident wrong answers.'],['Classification','Choosing between groups.']]},

{id:'knn',title:'Ask your neighbours',sub:'k-nearest neighbours',tint:'sun',
hook:'To label something new, look at the most similar things you already know.',
kid:`<p>You move to a new town and wonder if people there like pizza or tacos. You ask the five people living next door. Three say pizza. So you guess "pizza" for the whole street. You have just done <b>k-nearest neighbours</b> with k = 5.</p>
<p>The computer does not learn rules ahead of time. It simply keeps all the examples. When a new one arrives, it finds the <b>k</b> closest examples and lets them vote.</p>
<div class="callout"><b>How many neighbours?</b> If you ask only one, a single odd neighbour can fool you. If you ask the whole town, you lose the local flavour. Picking k is a balancing act.</div>
<p>Drag the big circle around the map in the demo. Watch the neighbours light up and vote.</p>`,
then:[['Recommendations','"People like you" matched with simple statistics.','Songs, videos and people become lists of numbers called embeddings. Systems search for the nearest ones among millions.'],['Search','Match the exact words you typed.','Meaning-based search compares embeddings, and special vector databases make the nearest-neighbour step fast.'],['Chat with your documents','Not possible.','Retrieval-augmented generation finds the closest passages and hands them to a language model to write the answer.']],
words:[['Neighbour','One of the stored examples closest to a new point.'],['k','How many neighbours get a vote.'],['Distance','How far apart two examples are.'],['Embedding','A list of numbers that describes an item so similar items sit close together.'],['Hyperparameter','A setting you choose, like k.']]}
];

const LB=[
{id:'trees',title:'The 20 Questions game',sub:'Decision trees and random forests',tint:'coral',
hook:'Ask a smart series of yes/no questions, and let a crowd of trees vote.',
kid:`<p>Have you played <b>20 Questions</b>? "Is it an animal?" Yes. "Does it have four legs?" Yes. "Does it bark?" Yes. "A dog!" Every question cuts the list of possibilities in half or better.</p>
<p>A <b>decision tree</b> is a computer playing that game. It looks at the examples and works out which question separates the groups best, such as "Is the size at most 2.5?" Then it asks the next best question for each branch, and so on. The finished tree is a flowchart you can read.</p>
<div class="callout"><b>One tree can be too eager.</b> If it keeps asking questions until every example has its own tiny box, it has memorised the examples, including the mistakes. The fix is to grow a whole <b>forest</b>: many trees, each trained on a slightly different shuffle of the data, all voting. Like guessing the jelly beans in a jar, the crowd's average is usually closer than any one person.</div>
<p>In the demo the real pattern is a staircase, but a few labels are wrong. See what one tree does, then try a forest.</p>`,
look:`Squares and circles are the training examples, and a few carry a wrong label. The hidden pattern is a staircase: points above it are squares. The background shows what the tree or forest predicts at every spot. Rectangles appear because every question is "is this number below that line?". The test score is measured on clean points the model never saw.`,
tries:['Depth 1: one question only. The map is two big blocks. Too simple.','Raise depth to 4. The staircase appears and the test score peaks for a single tree.','Raise depth to 10. Small islands pop up around wrong labels. The train score hits 100% but the test score slips.','Now set depth to 5 and slide <b>Trees</b> up to 40. The edge smooths out and the test score climbs. That is the power of a crowd.'],
deep:`<h2>How a tree picks a question</h2>
<p>A good question leaves each side with mostly one answer. We measure how mixed a box is with <b>Gini impurity</b>: 1 minus the sum of each class share squared. Pure box = 0. A 50-50 box = 0.5.</p>
<div class="eg"><table>
<tr><th>box</th><th>yes / no</th><th>Gini</th></tr>
<tr><td>before the question</td><td>6 / 4</td><td>1 − (0.6² + 0.4²) = 0.480</td></tr>
<tr><td>left branch</td><td>5 / 1</td><td>1 − (0.833² + 0.167²) = 0.278</td></tr>
<tr><td>right branch</td><td>1 / 3</td><td>1 − (0.25² + 0.75²) = 0.375</td></tr>
</table></div>
<div class="math">weighted Gini after = (6 × 0.278 + 4 × 0.375) / 10 = 0.317
gain = 0.480 − 0.317 = 0.163</div>
<p>The tree tries every feature and every cut point, keeps the one with the biggest gain, then repeats inside each branch. It stops at a maximum depth, when a box is pure, or when too few examples are left.</p>
<h2>Why single trees overfit</h2>
<p>A tree can keep splitting until it classifies the training data perfectly. It then fits noise. Two cures: limit the depth (or prune the tree afterwards), or combine many trees.</p>
<h2>Random forests: bagging</h2>
<ul><li><b>Bootstrap:</b> make each tree's training set by drawing examples at random with replacement. Each tree sees a slightly different version of the data.</li>
<li><b>Random features:</b> at each split, consider only a random subset of features. This makes the trees less alike.</li>
<li><b>Vote:</b> average the trees. Errors that are random cancel out, so variance falls while bias stays low.</li></ul>
<h2>Boosting: learning from mistakes</h2>
<p>A forest builds trees side by side. <b>Gradient boosting</b> builds them in a line. Each new small tree is trained to fix the errors the previous trees left. Libraries such as XGBoost, LightGBM and CatBoost do this very fast and are workhorses for table-shaped data.</p>
<h2>Strengths and limits</h2>
<ul><li><b>Strong:</b> works on mixed data with little preparation, no feature scaling needed, easy to see which features matter.</li>
<li><b>Weak:</b> trees cut along one feature at a time, so smooth diagonal boundaries need many splits. They cannot extrapolate beyond the range they saw, and they are not the best choice for images or text.</li></ul>
<h2>Common mistakes</h2>
<ul><li>Judging a deep tree by its training score.</li><li>Trusting "feature importance" blindly: it can favour features with many distinct values.</li><li>Forgetting that data leakage fools trees just as easily as other models.</li></ul>
<h2>Key takeaways</h2>
<ul><li>A tree is a learned flowchart. Depth controls how complicated it gets.</li><li>Forests average many different trees to cut overfitting.</li><li>Boosted trees are a top tool for spreadsheet-style data.</li></ul>`,
then:[['Doctor flowcharts','Printed flowcharts written by experts.','Trees learned from patient records are still used for risk scores because a person can read every step.'],['Spreadsheet-style (tabular) data','Single trees and hand-built rules.','Gradient-boosted trees such as XGBoost and LightGBM remain a common first choice, and often beat neural networks on tables.'],['Competitions','Rare.','Boosted trees have been a frequent winner in public data-science contests on tabular data.'],['Fraud and credit','Fixed rule lists.','Ensembles of trees are widely used, often next to neural networks, with thresholds chosen by cost.']],
words:[['Decision tree','A flowchart of yes/no questions learned from data.'],['Gini impurity','How mixed a box of examples is. Zero means pure.'],['Pruning','Cutting a tree back so it does not memorise.'],['Random forest','Many trees trained on shuffled data that vote.'],['Boosting','Adding small trees one by one, each fixing the last one\'s errors.'],['Bagging','Training models on random re-draws of the data and averaging them.']]},

{id:'kmeans',title:'Sorting without answers',sub:'Clustering with k-means',tint:'mint',
hook:'Find natural groups in data when nobody tells you the groups.',
kid:`<p>Dump a big box of toys on the floor. Nobody tells you the categories, but you start making piles: cars here, dolls there, blocks over there. You grouped things that <i>look alike</i> without anyone giving you labels. That is <b>unsupervised learning</b>.</p>
<p>K-means does it with a simple trick. Pick K spots on the map to be pile centres. Every point joins the nearest centre. Then each centre slides to the middle of its pile. Points re-pick their nearest centre, centres slide again. Keep going until nothing changes.</p>
<div class="callout"><b>You choose K.</b> How many piles? The demo draws an <b>elbow chart</b> to help. It falls steeply until you reach the right number of piles, then flattens like a bent arm. The bend is your best guess.</div>
<p>Press <b>One step</b> and notice that it alternates between "assign points" and "move centres".</p>`,
extra:`<h2>More tools for unlabelled data</h2>
<ul><li><b>PCA</b> (principal component analysis) squashes many features into a few that keep most of the variation. It helps you plot data, remove noise and speed up other models.</li>
<li><b>t-SNE and UMAP</b> turn high-dimensional data into a 2D map where similar items sit near each other. Great for looking at embeddings, not for measuring distances exactly.</li>
<li><b>DBSCAN</b> finds clusters as dense regions, copes with odd shapes, and marks lonely points as noise.</li>
<li><b>Gaussian mixture models</b> give each point a probability of belonging to each cluster instead of a hard choice.</li>
<li><b>Anomaly detection</b> flags points far from any cluster. It is used for unusual machine readings and suspicious activity.</li>
<li><b>Hierarchical clustering</b> builds a family tree of groups, so you can choose how coarse to cut it.</li></ul>`,
then:[['Customer groups','Marketers split people by age and postcode.','Groups come from behaviour: how recently, how often and how much people buy.'],['Photo organising','Folders sorted by date.','Phones group similar faces, places and objects automatically.'],['News and documents','Editors filed stories by hand.','Text is turned into embeddings and clustered into topics.'],['Machines and sensors','A person watches a dial.','Models learn what normal looks like and flag odd readings.']],
words:[['Cluster','A group of points that are close together.'],['Centroid','The centre of a cluster.'],['Inertia','Total squared distance from points to their centres. Smaller is tighter.'],['Elbow method','Pick K where the curve stops dropping quickly.'],['Unsupervised','Learning without labelled answers.']]},

{id:'biasvar',title:'Memorising versus understanding',sub:'Overfitting and the bias-variance trade-off',tint:'sky',
hook:'A perfect score on practice questions can hide a model that has learned nothing useful.',
kid:`<p>Two students prepare for a maths test. One memorises last year's exact questions and answers. The other learns how to solve problems. On last year's paper, the memoriser gets 100%. On this year's paper with new numbers, the memoriser fails.</p>
<p>A model can do the same thing. If it is too flexible, it memorises the examples, even the mistakes. This is <b>overfitting</b>. If it is too simple, it never learns the pattern at all. This is <b>underfitting</b>. We want the student who understands.</p>
<div class="callout"><b>The honest test.</b> The only way to tell is to grade the model on examples it has never seen. If the practice score is great and the new-example score is poor, you have a memoriser.</div>
<p>In the demo the real pattern is a gentle wave. Slide the flexibility and watch the orange (new data) score.</p>`,
then:[['Checking a model','Hold back a test set, or use cross-validation.','The same ideas, plus automated experiment tracking so teams do not accidentally tune on the test set.'],['Huge models','Rule of thumb: too many settings means overfitting.','Very large networks can fit training data perfectly and still work well on new data when trained on lots of data with care. The classic U-curve is where you start, not the whole story.'],['Fighting overfitting','Fewer features and simpler models.','Weight decay, dropout, early stopping and data augmentation are standard tools.'],['Chat models','Not applicable.','Test questions can leak into training data and inflate scores, so people build fresh, private tests.']],
words:[['Overfitting','Memorising the training data, including noise.'],['Underfitting','A model too simple to capture the pattern.'],['Bias','Error from being too simple.'],['Variance','Error from being too sensitive to the exact training set.'],['Regularisation','A penalty that keeps the model from getting too complicated.'],['Cross-validation','Rotating which slice of data is held out to get a steadier estimate.']]},

{id:'metrics',title:'How good is good?',sub:'Precision, recall and thresholds',tint:'sun',
hook:'Why 98% accuracy can still be a useless model, and how to pick the right cut-off.',
kid:`<p>Remember the story of the boy who cried wolf? Suppose he shouts "wolf!" every five minutes. The villagers soon stop listening, because most alarms are false. That is a problem of <b>precision</b>: when you raise the alarm, how often are you right?</p>
<p>Now suppose he never shouts. No false alarms, but the wolf eats the sheep. That is a problem of <b>recall</b>: of all the real wolves, how many did you catch?</p>
<div class="callout"><b>You cannot max out both.</b> A very jumpy alarm catches every wolf but cries wolf too often. A very calm alarm is right when it rings but misses wolves. The slider that sets "how jumpy" is the <b>threshold</b>, and the best setting depends on what mistakes cost.</div>
<p>In the demo, a fraud detector scores each payment. Slide the threshold and watch the money add up.</p>`,
then:[['Fraud detection','A fixed rule: block any payment over a set amount.','A model scores every payment within a fraction of a second. The cut-off is chosen by comparing the cost of missed fraud with the cost of annoying real customers.'],['Medical screening','One doctor reads each scan.','Software can act as a second reader tuned to miss little, and a person checks every alert.'],['Content moderation','Banned-word lists.','Classifiers flag items for human reviewers, with thresholds set per kind of harm.'],['Chat model quality','A single accuracy number.','Human ratings, side-by-side comparisons and large test suites, because one number rarely captures quality.']],
words:[['Precision','Of the cases flagged, the share that were truly positive.'],['Recall','Of the true positives, the share that got flagged.'],['Threshold','The score above which we raise the alarm.'],['False alarm','Flagged but actually fine.'],['Base rate','How common the thing is in the first place.'],['F1','One number that balances precision and recall.']]},

{id:'nn',title:'A team of tiny deciders',sub:'Neural networks',tint:'coral',
hook:'Stack lots of simple units and they can learn shapes no straight line could.',
kid:`<p>Imagine a huge team of tiny workers. Each one does one very simple job: it listens to a few friends, decides how much to trust each one, adds up what it heard, and passes a message on if the total is big enough. That worker is a <b>neuron</b>.</p>
<p>One worker is not very clever. But put them in rows, so each row listens to the row before, and something magical happens. The first row notices simple things. The next row combines them into bigger things. By the last row the team can recognise a ring, a spiral or even a face.</p>
<div class="callout"><b>How it learns.</b> At first the workers trust each other at random, so the answers are bad. After each wrong answer, the network works out which connections made things worse and adjusts them a tiny bit. That blame-sharing step is called <b>backpropagation</b>. Repeat thousands of times and the team gets good.</div>
<p>Pick <b>Spiral</b> in the demo. A straight line cannot separate it, but a network can learn the curl.</p>`,
then:[['Beginnings','The perceptron (1958) was a single neuron. Backpropagation became popular in the 1980s.','Networks with many layers and billions of weights.'],['The big turning point','Small networks, little data.','In 2012 a deep network won an image contest by a large margin using graphics chips (GPUs). Deep learning took off after that.'],['Hardware','Ordinary computer chips.','GPUs, TPUs and other special AI chips, in huge data centres.'],['Uses','Reading digits on cheques.','Speech, translation, photos, recommendations, and the chat assistants you use today.']],
words:[['Neuron','A tiny unit: weighted sum, then a bend.'],['Layer','A row of neurons.'],['Activation function','The bend that lets networks learn curves (tanh, ReLU).'],['Backpropagation','Passing blame backward to update every weight.'],['Epoch','One pass through the training data.'],['Deep learning','Neural networks with many layers.']]}
];

const LC=[
{id:'cnn',title:'How computers see',sub:'Convolutions and deep learning for images',tint:'mint',
hook:'A picture is just a grid of numbers. A sliding filter finds the patterns inside it.',
