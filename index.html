kid:`<p>When you look at a photo you see a cat. A computer sees a giant grid of numbers, one for the brightness of each tiny dot. Those dots are called <b>pixels</b>. How can numbers turn into "cat"?</p>
<p>Picture a small magnifying glass, only 3 dots wide, sliding across the picture. At every spot it asks one simple question, like "is there an edge going up and down here?" The answers make a new picture that glows wherever the pattern appears. This sliding magnifier is called a <b>filter</b>, and the sliding is a <b>convolution</b>.</p>
<div class="callout"><b>Stacking filters.</b> The first layer finds edges. The next layer combines edges into corners and curves. The next combines curves into eyes and ears. A few layers later the network can say "cat". Nobody writes the filters by hand. The network <i>learns</i> them.</div>
<p>Draw something in the demo, pick a filter, and watch which parts light up.</p>`,
look:`The left grid is your picture (tap or drag to draw). The right grid is the filter's answer. Orange means the filter found its pattern, blue means the opposite pattern, and blank means nothing there. The 3 x 3 numbers under the picture are the filter itself.`,
tries:['Press <b>Box</b> and choose <b>Horizontal edges</b>. Only the top and bottom light up.','Choose <b>Vertical edges</b>. Now the left and right sides glow.','Choose <b>Outline</b> to light up every edge, and <b>Blur</b> to smooth the picture.','Press <b>Clear</b>, draw your own letter, and try each filter on it.','Press <b>Watch the filter scan</b> and see the 3 x 3 window slide across, one position at a time.'],
deep:`<h2>Pictures are numbers</h2>
<p>A grayscale photo stores one brightness number per pixel, often from 0 (black) to 255 (white). A colour photo stores three numbers per pixel: red, green and blue. A phone photo can hold millions of these numbers, which is why vision models are big.</p>
<h2>What a convolution does</h2>
<p>Lay a small grid of numbers (the <b>kernel</b>) on top of a patch of the picture. Multiply each pair of numbers that sit on top of each other, then add everything up. The result is one number in the output picture. Slide one pixel over and repeat.</p>
<div class="eg"><table>
<tr><th>patch (left to right)</th><th>kernel (vertical edge)</th><th>result</th></tr>
<tr><td>0 0 1 / 0 0 1 / 0 0 1</td><td>−1 0 1 / −1 0 1 / −1 0 1</td><td>3 × (1 × 1) = <b>3</b>, a strong edge</td></tr>
<tr><td>1 1 1 / 1 1 1 / 1 1 1</td><td>−1 0 1 / −1 0 1 / −1 0 1</td><td>−3 + 3 = <b>0</b>, nothing to see</td></tr>
</table></div>
<p>The kernel is a question: "dark on the left, bright on the right?" A positive answer means yes, a negative one means the opposite.</p>
<h2>Learned filters</h2>
<p>A convolutional neural network (CNN) starts with random kernel numbers and uses backpropagation, as in level 10, to improve them. After training on millions of images, early kernels look like edge and colour detectors, and deeper ones respond to textures, parts and whole objects.</p>
<h2>The usual recipe</h2>
<ul><li><b>Convolution layer:</b> slide many filters, producing many output pictures.</li><li><b>Activation (ReLU):</b> keep only positive responses so the network can bend.</li><li><b>Pooling:</b> shrink the picture by keeping the strongest response in each small block, so small shifts do not matter.</li><li><b>Classifier:</b> after several rounds, a regular network turns the final features into class scores.</li></ul>
<p>One filter is reused at every position. This <b>weight sharing</b> means a cat in the corner is recognised just like a cat in the middle, and it keeps the number of settings manageable.</p>
<h2>Milestones</h2>
<ul><li>1990s: small CNNs (LeNet) read handwritten digits on cheques and mail.</li><li>2012: AlexNet won the ImageNet contest by a large gap, using GPUs, and deep learning took off.</li><li>2015: ResNet showed how to train very deep networks using shortcut connections.</li><li>2020 onward: Vision Transformers apply the attention idea from level 12 to image patches. Many modern vision models mix both ideas.</li></ul>
<h2>Beyond "what is in the picture"</h2>
<ul><li><b>Detection</b> draws boxes around objects. <b>Segmentation</b> labels every pixel.</li><li><b>Transfer learning:</b> start from a model trained on millions of images and fine-tune it on a few hundred of yours. This is the usual way to build a practical vision tool.</li><li><b>Data augmentation:</b> flip, crop and brighten training pictures to make more varied examples.</li></ul>
<h2>Limits to remember</h2>
<ul><li>Models can be fooled by tiny, deliberate changes to a picture (adversarial examples).</li><li>They work worse in conditions they never saw, such as a new camera or a different hospital.</li><li>If the training photos lack certain people or places, accuracy falls for them.</li></ul>
<h2>Key takeaways</h2>
<ul><li>A filter is a small grid of numbers that finds one pattern.</li><li>Stacked filters build from edges to objects, and the network learns them.</li><li>Fine-tuning a pretrained model is usually the best start.</li></ul>`,
then:[['Reading text','Postal and bank-cheque readers in the 1990s used small CNNs for digits.','Phones read text in any photo and translate signs live.'],['Photos','Face detection built on hand-designed filters (early 2000s).','Face unlock, searching your photos by what is in them, and background blur.'],['Medicine','A specialist reads each scan alone.','Software can highlight suspicious spots as a second reader. Tested carefully, and a doctor makes the decision.'],['Cars','Simple sensors and fixed rules.','Vision models spot lanes, signs and people for driver assistance. Fully driverless driving in all conditions is still hard.'],['Model design','CNNs dominated.','Vision Transformers and hybrids are common, and many models now handle pictures and text together.']],
words:[['Pixel','One tiny dot of a picture, stored as a number.'],['Filter (kernel)','A small grid of numbers that looks for one pattern.'],['Convolution','Sliding a filter across a picture.'],['Pooling','Shrinking a picture by keeping the strongest responses.'],['Transfer learning','Starting from a model that already learned from lots of images.'],['CNN','Convolutional neural network.']]},

{id:'llm',title:'The world\'s biggest autocomplete',sub:'Language models and transformers',tint:'sky',
hook:'Chat assistants work by predicting the next small piece of text, over and over.',
kid:`<p>When you type a message on your phone, it suggests the next word. After "see you" it offers "soon". That is a small <b>language model</b>: it has seen lots of text and learned which words tend to follow which.</p>
<p>A large language model is the same idea, grown huge. It read a gigantic amount of text, and its network is big enough to notice not just the last word but the whole sentence, the topic and the style. To answer a question it writes one small piece at a time, each time asking "what is the most sensible next piece?"</p>
<div class="callout"><b>How does it know which words matter?</b> Read "The cat chased the mouse because <i>it</i> was hungry." What does "it" mean? You look back at "cat". A transformer does this with <b>attention</b>: every word looks at all the other words and decides which ones to pay attention to.</div>
<p>Remember that the model predicts likely text. It is not looking up facts in a book, so it can sound sure and still be wrong. Always check important answers.</p>
<p>In the demo, Bolt has read only 12 tiny sentences, so it can write only about robots, cats and dogs. Real models work on the same principle with far more reading.</p>`,
look:`The big text is the story Bolt is writing. The bars list the words Bolt thinks could come next and how likely each one is, based only on the last two words. Tap a bar to choose that word, or let Bolt choose.`,
tries:['Press <b>Let Bolt pick a word</b> a few times. Look at how the bars change after each word.','Slide <b>Creativity</b> to "wild" and press <b>Let Bolt finish</b> a few times. Stories get odd.','Slide Creativity to "careful". Now Bolt almost always picks the most likely word, so stories repeat.','Take control: choose the words yourself and try to write a sentence Bolt never read.'],
deep:`<h2>Step 1: break text into tokens</h2>
<p>Models do not read letters or whole words. They read <b>tokens</b>, pieces such as "learn", "ing" or "robot". Each token has an ID number.</p>
<h2>Step 2: turn tokens into embeddings</h2>
<p>Each token ID becomes a long list of numbers called an <b>embedding</b>. Tokens with similar meanings end up with similar lists. This is the same idea as the neighbours in level 5.</p>
<h2>Step 3: attention</h2>
<p>For each token the model builds three lists: a <b>query</b> (what am I looking for?), a <b>key</b> (what do I offer?) and a <b>value</b> (what I will pass on). A token compares its query with every key to get scores, turns the scores into percentages, and mixes the values by those percentages.</p>
<div class="math">attention = softmax( Q · Kᵀ / √d ) · V</div>
<p>Many attention "heads" run side by side, each noticing different relationships. Attention layers alternate with ordinary neural-network layers, and the whole stack repeated dozens of times is a <b>transformer</b> (introduced in 2017).</p>
<h2>Step 4: predict the next token</h2>
<p>At the end, the model gives a score to every possible next token. <b>Softmax</b> turns the scores into probabilities. The program then picks one, adds it to the text, and repeats.</p>
<p><b>Temperature</b> is the creativity slider in the demo. It raises each probability to the power 1/T and re-normalises.</p>
<div class="eg"><table>
<tr><th>next word</th><th>T = 0.5 (careful)</th><th>T = 1</th><th>T = 2 (wild)</th></tr>
<tr><td>sleeps</td><td>66%</td><td>50%</td><td>42%</td></tr>
<tr><td>likes</td><td>24%</td><td>30%</td><td>32%</td></tr>
<tr><td>runs</td><td>11%</td><td>20%</td><td>26%</td></tr>
</table></div>
<h2>How a chat assistant is made</h2>
<ol><li><b>Pretraining.</b> Learn to predict the next token on a huge amount of text. The loss is the same log-loss you met in level 4. This stage costs most of the computing power.</li>
<li><b>Instruction tuning.</b> Train further on examples of questions with good answers, so it follows requests.</li>
<li><b>Preference tuning.</b> People compare pairs of answers. A model learns what people prefer and the assistant is tuned toward it (often using ideas from level 13).</li>
<li><b>Tools and retrieval.</b> The assistant can search documents, run code or call other software, then write the answer.</li></ol>
<h2>Why models "hallucinate"</h2>
<p>The training goal is to produce likely-sounding text, not to check truth. When it does not know something, the likeliest-sounding continuation can still be made up. Retrieval (look up real sources and quote them), tools, and human checking all reduce this, none removes it.</p>
<h2>Limits and good habits</h2>
<ul><li>Knowledge stops at the training date unless it can search.</li><li>It can repeat biases found in its training text.</li><li>It can fail at careful multi-step reasoning or arithmetic unless it uses a tool or works step by step.</li><li>Do not paste private information into tools you do not trust.</li><li>Ask for sources, then open them.</li></ul>
<h2>Key takeaways</h2>
<ul><li>A language model predicts the next token, many times in a row.</li><li>Attention lets each word look at the others. Transformers stack attention layers.</li><li>Chat assistants add tuning from examples and from human preferences. They are useful, and they can be wrong.</li></ul>`,
then:[['Phone suggestions','Counted which word usually followed the last one or two words, like Bolt in the demo.','Neural models that read the whole sentence and can finish your thought.'],['Search','Match the words you typed.','Meaning-based search, and answers that summarise sources with links so you can check.'],['Writing and coding help','Spell check and templates.','Assistants that draft, summarise, explain and write code. People review the result.'],['Customer support','Scripted menus.','Assistants handle routine questions and pass hard ones to people.'],['Model design','Recurrent networks read one word at a time.','Transformers read all the words at once with attention, which is easier to run on GPUs.']],
words:[['Token','A small piece of text a model reads and writes.'],['Embedding','A list of numbers that stands for a token or a whole item.'],['Attention','Each word deciding which other words to focus on.'],['Transformer','A network built from attention layers.'],['Temperature','A dial for how adventurous the next-word choice is.'],['Hallucination','A confident answer that is made up.'],['Fine-tuning','Training a pretrained model further for a task.']]},

{id:'rl',title:'Learning by trying',sub:'Reinforcement learning',tint:'sun',
hook:'No answer key, only rewards. Bolt learns which moves lead to treasure.',
kid:`<p>How do you train a puppy to sit? You do not hand it a manual. When it sits, you give a treat. When it does something else, no treat. After enough tries it works out what earns treats.</p>
<p>Video games work the same way. Nobody tells you the right move. You try things, the score goes up or down, and you slowly get good. <b>Reinforcement learning</b> lets a computer do that. The learner is called an <b>agent</b>, the place it lives is the <b>environment</b>, and the points are <b>rewards</b>.</p>
<div class="callout"><b>Try new things, or stick with what works?</b> If you always order your favourite dish, you may never find a better one. If you always try new dishes, you may keep getting bad ones. The agent must balance <b>exploring</b> and <b>exploiting</b>. In the demo this is the "curiosity" slider.</div>
<p>In the demo, Bolt must walk from the bottom-left corner to the gold star. Each move costs 1 point, the star gives 20, and the dark holes cost 20. Bolt starts knowing nothing.</p>`,
look:`Bolt is the blue face. The gold star is the treasure and the dark circles are holes. After practice, blue arrows appear in each square. An arrow shows the move Bolt now thinks is best from there, and brighter arrows mean Bolt is more sure.`,
tries:['Press <b>Practice 1 round</b> a few times. Bolt wanders and the first arrows appear near where it got rewards or punishments.','Press <b>Practice 200 rounds</b>, then <b>Watch Bolt go</b>. It should head for the star and avoid holes.','Set curiosity to 0% and press <b>Forget everything</b>, then practice. Without trying new things Bolt may never find the star.','Set curiosity to 90%. Bolt keeps making random moves, so training is noisy.'],
deep:`<h2>The pieces</h2>
<ul><li><b>State:</b> where the agent is now. <b>Action:</b> what it can do. <b>Reward:</b> the score it gets after an action.</li>
<li><b>Policy:</b> the agent's rule for picking an action in each state. <b>Value:</b> how much total reward it expects from here on.</li>
<li>The goal is to find a policy that collects the most total reward over time, not the most reward right now.</li></ul>
<h2>Q-learning: a table of scores</h2>
<p>Bolt keeps a table <b>Q(state, action)</b>: how good is this action here? After every move, it nudges one table entry toward what it just learned.</p>
<div class="math">Q(s, a) ← Q(s, a) + α · [ r + γ · max Q(s', a') − Q(s, a) ]</div>
<ul><li><b>α (alpha)</b> is the learning rate, how far to move.</li><li><b>r</b> is the reward just received.</li><li><b>γ (gamma)</b> is the discount, a number below 1 that makes later rewards worth a little less. It makes Bolt prefer a short path.</li><li><b>max Q(s', a')</b> is the best score available from the next square. Good news about the next square flows backward, one square at a time.</li></ul>
<div class="eg"><table>
<tr><th>quantity</th><th>value</th></tr>
<tr><td>current Q(s, a)</td><td>0</td></tr><tr><td>reward r</td><td>−1 (a step)</td></tr><tr><td>best next Q</td><td>5</td></tr><tr><td>α, γ</td><td>0.5, 0.9</td></tr>
<tr><td>new Q</td><td>0 + 0.5 × (−1 + 0.9 × 5 − 0) = <b>1.75</b></td></tr>
</table></div>
<p>That is exactly what the demo does after every move.</p>
<h2>Exploring: epsilon-greedy</h2>
<p>With probability ε the agent picks a random action. Otherwise it picks the action with the best Q. Many systems start with a high ε and lower it as they learn.</p>
<h2>When there are too many states</h2>
<p>A chess board has far too many positions for a table. <b>Deep reinforcement learning</b> replaces the table with a neural network that estimates Q (the DQN, which learned many Atari games from raw pixels) or directly outputs the policy (policy-gradient methods). AlphaGo combined such networks with search.</p>
<h2>Hard parts</h2>
<ul><li><b>Sample hunger:</b> millions of tries may be needed. Simulators help, but the real world differs from a simulator.</li>
<li><b>Sparse rewards:</b> if the reward only arrives at the very end, learning is slow.</li>
<li><b>Reward hacking:</b> agents exploit loopholes in a badly written reward, like a boat in a racing game that spins in circles collecting bonus points instead of finishing.</li>
<li><b>Safety:</b> trying random things is fine in a game, risky with a real robot or patient.</li></ul>
<h2>Key takeaways</h2>
<ul><li>An agent learns from rewards, with no answer key.</li><li>Q-learning updates a table of action scores using the reward and the best next score.</li><li>Balance exploring and exploiting, and write rewards carefully.</li></ul>`,
then:[['Games','A 1990s backgammon program learned by playing itself.','AlphaGo beat a top Go professional in 2016. Related methods now learn many games from scratch.'],['Robots','Movements programmed by hand.','Controllers are often trained in simulation first, then tested on real robots. Still slow and delicate.'],['Chat assistants','Not used.','Rewards from human preferences, and from answers that can be checked automatically, are used to tune assistants and to train step-by-step reasoning.'],['Recommendations and ads','Fixed rules.','Systems try options, learn which work, and balance trying new things with showing proven ones. This is the explore/exploit idea in a simpler form.']],
words:[['Agent','The learner that makes choices.'],['Environment','The world the agent acts in.'],['Reward','A score for what just happened.'],['Policy','The agent\'s rule for choosing actions.'],['Exploration','Trying something new to learn more.'],['Q-value','How good an action is in a given state.'],['Discount','A factor that makes later rewards count a bit less.']]},

{id:'ops',title:'Keeping robots fair and fresh',sub:'Responsible ML and MLOps',tint:'coral',
hook:'Real models need care after launch: they must treat people fairly and stay up to date.',
kid:`<p>Building a smart robot is only the start. Two promises matter after that.</p>
<p><b>Be fair.</b> A robot learns from examples. If some kinds of people are missing or treated badly in those examples, the robot will treat them worse too. Imagine a robot that learned to recognise voices mostly from adults. It might mishear children. Nobody meant harm, but the result is unfair. So we test a robot on each group, not just on everyone together.</p>
<p><b>Stay fresh.</b> Milk goes off. Models go off too, because the world keeps changing: new slang, new gadgets, new scams. A model trained last year may be out of date today. So teams keep watching the score and <b>retrain</b> when it slips.</p>
<div class="callout"><b>A good ML team asks four things before launch.</b> Is the data fair? Can someone explain the answers? Is private information safe? Who checks the model once it is running?</div>
<p>In the demo, the world drifts a little every month. Place retrains to keep accuracy above the red line.</p>`,
look:`The top chart shows today's customers, and the dashed line is where the model separates "yes" from "no". The lower chart shows accuracy for each month. Green triangles are months when you retrained the model. The red dashed line is the alarm level.`,
tries:['Drag <b>Month</b> from 0 to 24 with no retrains. The blue and orange hills slide to the right while the dashed line stays put. Accuracy falls.','Move to a month where accuracy is close to the red alarm line and press <b>Retrain Bolt this month</b>. The dashed line jumps to the new middle.','Slow the world down to "slowly". You need fewer retrains.','Speed it up to "fast". Now you need to retrain often, which is why teams monitor automatically.'],
deep:`<h2>Fairness</h2>
<p>An overall score can hide an unfair gap. Suppose a model is correct 90% of the time for 1,000 people in Group A and 70% for 100 people in Group B.</p>
<div class="eg"><table>
<tr><th>group</th><th>people</th><th>correct</th><th>accuracy</th></tr>
<tr><td>A</td><td>1,000</td><td>900</td><td>90%</td></tr><tr><td>B</td><td>100</td><td>70</td><td>70%</td></tr>
<tr><td>everyone</td><td>1,100</td><td>970</td><td>88%</td></tr>
</table></div>
<p>88% sounds fine. Group B is getting a much worse deal. Good practice is to report scores per group.</p>
<ul><li><b>Where bias comes from:</b> missing groups in the data, labels that reflect past human bias, and features that act as stand-ins (proxies) for sensitive ones, such as postcode.</li>
<li><b>How to measure:</b> compare error rates across groups, for example the share of qualified people each group gets wrongly rejected (equal opportunity).</li>
<li><b>No single fairness number:</b> different fairness definitions can conflict, so teams decide, with the people affected, which matters most in their setting.</li>
<li><b>What helps:</b> collect better data, rebalance, test on realistic groups, keep humans in the loop for big decisions, and allow appeals.</li></ul>
<h2>Explainability</h2>
<p>Simple models (a short tree, logistic regression) can be read directly. For complicated models, tools such as feature importance and SHAP values estimate which inputs pushed an answer up or down. These are helpful aids, not perfect proofs.</p>
<h2>Privacy and safety</h2>
<ul><li>Use only data you have the right to use, and keep as little as you need.</li><li><b>Federated learning</b> trains on people's own devices without collecting raw data. <b>Differential privacy</b> adds carefully measured noise so no single person can be picked out.</li><li>Think about misuse: fake images and voices, scams, and models tricked by clever prompts.</li></ul>
<h2>MLOps: running models for real</h2>
<ul><li><b>Version everything:</b> data, code and models, so you can reproduce and roll back.</li><li><b>Test before launch:</b> shadow mode (run quietly next to the old system), then a small A/B test.</li><li><b>Monitor after launch:</b> inputs (has the data changed?), outputs, and real outcomes when they arrive.</li><li><b>Drift:</b> <i>data drift</i> means the inputs change. <i>Concept drift</i> means the right answer for the same inputs changes, such as new fraud tricks.</li><li><b>Retrain on a schedule or on a trigger</b> such as a score falling below an alarm line.</li><li><b>Document:</b> model cards say what a model is for, how it was tested, and where it is weak.</li></ul>
<h2>Rules and standards</h2>
<p>Governments and standards bodies are catching up. The EU AI Act sets duties that grow with a system's risk level, and phases in over several years. The US NIST AI Risk Management Framework offers voluntary guidance. Rules differ by country and change, so check the current version for your region.</p>
<h2>Key takeaways</h2>
<ul><li>Test on every group, not only on average.</li><li>Models age, so monitor and retrain.</li><li>Document what a model is for and where it fails, and keep a person in the loop for important decisions.</li></ul>`,
then:[['Shipping a model','A one-off script on one laptop.','Pipelines with tests, version history, monitoring and rollback.'],['Checking fairness','Rarely done.','Per-group reports, audits and documents such as model cards.'],['Rules','Few rules specific to AI.','Laws and standards are taking effect, such as the EU AI Act, and frameworks such as the NIST AI Risk Management Framework.'],['Privacy','Collect first, ask later.','Data minimising, consent, federated learning and differential privacy.'],['Quality checks','Tested once at the start.','Continuous monitoring, because inputs and behaviour change after launch.']],
words:[['Data drift','The inputs the model sees change over time.'],['Concept drift','The right answer for the same inputs changes.'],['Retraining','Training again on newer data.'],['Bias','A systematic unfair difference in results.'],['Model card','A short document saying what a model is for and where it is weak.'],['Human in the loop','A person reviews or can override the model.'],['MLOps','The practice of running ML systems reliably.']]}
];

const LD=[
{id:'nb',title:'Spam filters and Naive Bayes',sub:'Weighing many small clues',tint:'sun',
hook:'How a computer can add up lots of weak clues and still make a strong guess.',
kid:`<p>Imagine you are a detective and an email lands on your desk. You spot the word <b>"winner"</b>. That is one clue. Honest emails say "winner" now and then, so it proves nothing yet. Then you spot <b>"free"</b>, then <b>"prize"</b>. Each clue alone is weak. Together they are loud.</p>
<p>A <b>Naive Bayes</b> filter works like that detective. It remembers how often each word showed up in spam and in normal mail. For a new email it asks, word by word, "which pile does this word make more likely?", and it keeps a running score.</p>
<div class="callout"><b>Why "naive"?</b> The filter pretends every word is an independent clue, as if seeing "free" told you nothing about whether "prize" is nearby. That is not really true, but the shortcut is so cheap and works so well that people still use it.</div>
<p>Below, pick words for an email and watch Bolt change its mind.</p>`,
look:`The chips are words you can put in an email. The bar shows how sure Bolt is that the email is spam. Below it, each word you picked gets a bar: orange bars push towards spam, green bars push towards a normal email. The slider sets how common spam is before reading anything.`,
tries:['Press <b>winner</b>. One strong clue moves the bar a lot, but not all the way.','Add <b>prize</b> and <b>free</b>. The clues stack and the bar races to the right.','Clear the email and pick <b>meeting</b>, <b>tomorrow</b> and <b>report</b>. Now the bar drops towards zero.','Put <b>winner</b> back with those three and see who wins the tug of war. Then move the slider for how common spam is.'],
deep:`<h2>The idea in plain words</h2>
<p>We want to know <b>how likely it is that this email is spam, given the words it contains</b>. What we can count from old mail is the reverse: how often each word appears in spam. Bayes' rule is the bridge between the two.</p>
<div class="math">P(spam | words) = P(words | spam) x P(spam) / P(words)</div>
<ul><li><b>P(spam)</b> is the <b>prior</b>: how common spam is before you read anything.</li>
<li><b>P(words | spam)</b> is the <b>likelihood</b>: how normal this set of words looks inside spam.</li>
<li><b>P(spam | words)</b> is the <b>posterior</b>: what we want, our updated belief.</li></ul>
<h2>A worked example with odds</h2>
<p>Say 40% of mail is spam. The word "winner" appears in 30% of spam but only 1% of normal mail.</p>
<div class="eg"><table>
<tr><th>step</th><th>working</th><th>result</th></tr>
<tr><td>prior odds</td><td>0.40 / 0.60</td><td>0.667</td></tr>
<tr><td>clue strength</td><td>0.30 / 0.01</td><td>x 30</td></tr>
<tr><td>new odds</td><td>0.667 x 30</td><td>20</td></tr>
<tr><td>new probability</td><td>20 / (20 + 1)</td><td>0.952</td></tr>
</table></div>
<p>One word moved the belief from 40% to about 95%. Each new word multiplies the odds again. That is the whole trick. It is also why the demo bars show a strength as a power of two: it is the size of the multiplier.</p>
<h2>What the "naive" assumption buys</h2>
<p>If words were allowed to depend on each other, you would need the chance of every possible combination, which is far too many to count. Pretending they are independent turns the problem into one small table, one row per word. Training is just counting, so it is extremely fast and works with very little data.</p>
<h2>Details that matter in practice</h2>
<ul><li><b>Smoothing.</b> A word never seen in spam would get probability zero and wipe out every other clue. Adding a small count to everything (Laplace smoothing) avoids that.</li>
<li><b>Logs.</b> Multiplying hundreds of tiny numbers underflows to zero, so real code adds logarithms instead. The demo does this.</li>
<li><b>Absent words count too.</b> In the version in the demo, a missing word is also a (weaker) clue. Another popular version counts only words that appear, and how many times.</li>
<li><b>Probabilities can be over-confident.</b> Because correlated words get counted twice, the scores are usually too extreme. The ranking is good, the exact percentage less so.</li></ul>
<h2>Where it is used and where it is not</h2>
<p>Naive Bayes is a strong first model for text such as spam, topics and simple sentiment. It is a quick baseline that is hard to be embarrassed by. It cannot learn that "not good" means the opposite of "good", because it ignores word order and word combinations. Modern language models handle that, but a Naive Bayes baseline still tells you whether a fancy model is worth the cost.</p>`,
then:[['Spam filtering','Hand-written rules such as "block mail containing a banned word".','Learned models trained on huge amounts of mail, plus sender reputation, links, images and user reports. Naive Bayes ideas are one ingredient among many.'],['Text topics','People read and filed documents by hand.','Models sort support tickets, news and legal documents automatically. Simple word-count models are often the first baseline.'],['Medicine and diagnosis','Doctors weighed test results mentally.','Probabilistic reasoning is used for decision support. A good model gives a probability, and a person still decides.'],['Speed and cost','Training on big data needed big machines.','Naive Bayes still trains in seconds on a laptop, which makes it a handy yardstick for newer models.'],['Clues beyond words','Only the text was examined.','Models combine text with sender history, links and behaviour.']],
words:[['Prior','What you believe before seeing the evidence.'],['Likelihood','How expected the evidence is if a guess is true.'],['Posterior','Your updated belief after seeing the evidence.'],['Bayes\' rule','The formula that flips "evidence given guess" into "guess given evidence".'],['Independence','Two things do not affect each other. Naive Bayes assumes it, even when it is not quite true.'],['Smoothing','Adding a tiny count so nothing has probability exactly zero.'],['Baseline','A simple model you must beat before a complicated one is worth it.']]},

{id:'svm',title:'The widest road: support vector machines',sub:'Margins and kernels',tint:'sky',
hook:'Do not just split two groups. Split them with the widest possible gap.',
kid:`<p>Two groups of kids stand in a playground, one group on the left and one on the right. You want to lay down a rope to divide them. Many ropes work. Which one is best?</p>
<p>A <b>support vector machine (SVM)</b> picks the rope that leaves the <b>widest empty road</b> on both sides. A wide road means that if a kid wobbles a little, they still land on the right side. The few kids standing right at the edge of the road are the <b>support vectors</b>, because they alone hold the road in place. Move any other kid and nothing changes.</p>
<div class="callout"><b>What if a straight rope cannot work?</b> Imagine one group standing in a ring around the other. No straight rope separates them. The SVM trick is to lift the picture into a higher view where a flat sheet <i>can</i> separate them, then look back down. The lifted picture gives a curvy boundary. That is the <b>kernel trick</b>.</div>`,
look:`Blue and orange dots are two classes. Filled dots are practice dots, hollow dots are hidden test dots. The background colour is Bolt's guess for each spot, paler near the border. Dots with a ring around them are the support vectors.`,
tries:['Keep <b>Two blobs</b> with the <b>Straight line</b>. Notice how few dots have rings. Only they decide the line.','Slide <b>how strict about mistakes (C)</b> low and high. Low allows a wide, forgiving road. High punishes every mistake and the road shrinks.','Switch to <b>Rings</b> with the straight line. It cannot do better than guessing.','Pick <b>Curvy (RBF kernel)</b>. Now try gamma from small to large. Very large gamma draws tiny islands around each dot: it memorises.'],
deep:`<h2>The margin</h2>
<p>For a straight boundary w.x + b = 0, the distance from the boundary to the nearest dot on each side is the <b>margin</b>. SVM chooses w and b to make the margin as big as possible.</p>
<div class="math">margin width = 2 / |w|
minimise   (1/2)|w|^2  +  C x sum of slack
subject to every dot being on its side of the road,
           except for allowed "slack"</div>
<ul><li>Maximising the margin is the same as minimising |w|. Small |w| means a wide road.</li>
<li><b>Slack</b> lets some dots be on the wrong side or inside the road. Real data is messy, so we must allow some.</li>
<li><b>C</b> is the price of slack. High C means "mistakes are costly" and gives a narrow road that fits the practice dots tightly. Low C gives a wide, relaxed road. This is the bias-variance trade-off again.</li></ul>
<h2>Why only a few dots matter</h2>
<p>The solution depends only on the support vectors: dots on or inside the road, or on the wrong side. Delete any other dot and the boundary does not move. That makes the model compact, and it explains why the SVM can work well with few examples.</p>
<h2>The kernel trick</h2>
<p>A model that only uses <b>dot products</b> between examples can be made curvy without ever computing the lifted coordinates. A <b>kernel</b> k(a, b) is a shortcut that returns what the dot product would be in a very high-dimensional space.</p>
<div class="math">linear kernel:  k(a,b) = a . b
RBF kernel:     k(a,b) = exp( -gamma x |a - b|^2 )</div>
<p>The RBF kernel says "two points are similar if they are close". <b>Gamma</b> sets what close means. Big gamma means only very near neighbours count, so the boundary gets wiggly and can overfit. Small gamma means smooth, wide influence and a boundary that is almost straight.</p>
<h2>How it is trained</h2>
<p>This demo uses a simplified version of an algorithm called SMO. It repeatedly picks two dots and adjusts their weights while keeping the constraints true. You do not have to know the details. Production libraries use well-tested versions of it.</p>
<h2>Strengths and limits</h2>
<ul><li><b>Good for</b> small and medium tabular data, text with many features, and cases with a clear margin.</li>
<li><b>Less good for</b> very large datasets (training cost grows quickly with the number of examples), and for raw images or audio, where neural networks learn better features.</li>
<li><b>Scale your inputs.</b> The RBF kernel uses distance, so a feature measured in thousands drowns out one measured in tenths.</li>
<li>It outputs a side of the road, not a probability. Extra steps can turn scores into probabilities.</li></ul>`,
then:[['Handwritten digits and text','Hand-built features and rules.','SVMs were a top method in the 1990s and 2000s. Deep networks now win on images and long text.'],['Small data problems','Rules from experts.','SVMs and tree ensembles are still strong choices when you have hundreds or a few thousand rows.'],['Biology and chemistry','Manual analysis of measurements.','Kernels designed for sequences and molecules let SVMs compare proteins and compounds.'],['Choosing a model','Teams often tried SVMs first.','Teams often start with gradient boosting for tables and neural networks for images, text and audio. SVMs remain a useful tool to know.'],['Ideas that lived on','Margins were a special topic.','The ideas of maximising a margin, regularising with a penalty, and comparing items with a similarity function show up in many modern methods.']],
words:[['Margin','The width of the empty road between the two classes.'],['Support vector','A dot on the edge of the road that holds it in place.'],['C','How costly mistakes are. High C: strict. Low C: forgiving.'],['Kernel','A shortcut that measures similarity as if the data lived in a richer space.'],['RBF kernel','A kernel that says near things are similar. Gamma sets how near.'],['Slack','Permission to break the rules a little on noisy data.'],['Hyperplane','The flat dividing surface. A line in 2D, a sheet in 3D.']]},

{id:'boost',title:'Teams that fix each other\'s mistakes',sub:'Boosting and gradient boosting',tint:'mint',
hook:'Start with a weak guess, then add small helpers that each repair what is still wrong.',
kid:`<p>Picture a group project where the first kid draws a very rough sketch. The second kid looks at the sketch and only fixes the biggest mistakes. The third kid fixes what is <i>still</i> wrong. Pass it down the line and, after dozens of tiny fixes, the picture is excellent.</p>
<p>That is <b>boosting</b>. Each helper is a very simple model (below, a <b>stump</b>: one cut that says "left of here, answer this; right of here, answer that"). Alone a stump is silly. A hundred of them, each trained on the leftover mistakes, can draw a very good curve.</p>
<div class="callout"><b>Compare with a random forest.</b> A forest asks many trees at the same time and averages them. Boosting asks them one at a time, and each one focuses on what the team has got wrong so far.</div>`,
look:`Black dots are training data and the dashed line is the true pattern behind them. The blue line is what the team of helpers predicts. The lower chart shows practice error (blue) and test error on unseen data (orange) for every team size.`,
tries:['Start at <b>0 rounds</b>: the prediction is a flat line at the average. Drag the slider up to 5. One helper at a time bends the line.','Turn on <b>Show mistakes</b>. The red lines are what is left to fix. Watch them shrink as you add rounds.','Keep adding rounds past the best point. Practice error keeps falling but test error turns around. That is overfitting.','Lower the <b>learning rate</b> to 0.1. Each helper counts less, so you need more of them, but the result is often smoother.'],
deep:`<h2>The recipe</h2>
<ol><li>Start with a simple prediction, such as the average of all answers.</li>
<li>Measure the <b>residuals</b>: answer minus current prediction, for every example.</li>
<li>Train a small tree to predict those residuals.</li>
<li>Add a fraction of that tree to the prediction. The fraction is the <b>learning rate</b>.</li>
<li>Repeat steps 2 to 4 many times.</li></ol>
<div class="math">F0(x) = mean of y
residual_i = y_i - F(x_i)
F(x) <- F(x) + learning_rate x tree(x)</div>
<h2>Why it is called gradient boosting</h2>
<p>For squared error, the residual is exactly the negative gradient of the loss with respect to the current prediction. So each new tree takes one step of <b>gradient descent</b>, but the step is taken in the space of functions rather than in the space of a few numbers. For other losses (for example log-loss for classification) you use that loss's gradient instead of the plain residual. Level 3 gave you the downhill idea. This is the same idea with trees as the "step".</p>
<h2>The knobs that matter</h2>
<ul><li><b>Number of rounds.</b> Too few underfit and too many overfit. Real projects use <b>early stopping</b>: watch the error on a validation set and stop when it stops improving.</li>
<li><b>Learning rate.</b> Small rates need more rounds but usually generalise better.</li>
<li><b>Tree depth.</b> Shallow trees (depth 3 to 8) keep each helper weak, which is what boosting wants.</li>
<li><b>Subsampling and regularisation.</b> Using only part of the rows or columns per tree, and penalising complex trees, reduces overfitting.</li></ul>
<h2>The famous libraries</h2>
<p>Gradient boosted trees are packaged in XGBoost, LightGBM and CatBoost. They add speed tricks, missing-value handling, and special treatment of categories. For ordinary tables with rows and columns (customer records, transactions, sensor readings), they are often the most accurate and the quickest to train. They are a common winner in data-science competitions on tabular data.</p>
<h2>Strengths and limits</h2>
<ul><li><b>Strengths:</b> strong accuracy on tables, little preprocessing, handles mixed feature types, gives feature importance.</li>
<li><b>Limits:</b> cannot extrapolate beyond the range of the training data, can overfit noisy labels if run too long, and for images, audio and language a neural network is usually better.</li></ul>`,
then:[['Tabular predictions','Hand-built scorecards and a single tree.','Gradient boosted trees power much of credit scoring, ad ranking, demand forecasting and fraud detection.'],['Web search ranking','Hand-tuned formulas.','Boosted trees were a major ranking tool for years. Neural rankers now often join them.'],['Competitions','Many teams used one model.','Winners on table-shaped data commonly blend boosted trees with other models.'],['Interpretability','Single trees were easy to read.','Ensembles are hard to read, so teams use feature importance and explanation tools such as SHAP.'],['Speed','Training took hours on big tables.','Histogram-based methods and GPUs train on millions of rows in minutes.']],
words:[['Weak learner','A simple model that is only a little better than guessing, such as a stump.'],['Residual','What is left over: the real answer minus the current prediction.'],['Boosting','Adding weak learners one after another, each fixing the last team\'s errors.'],['Learning rate','How much of each new helper to add.'],['Early stopping','Stop adding helpers when validation error stops improving.'],['Ensemble','A team of models whose answers are combined.'],['Stump','A tree with a single split.']]},

{id:'pca',title:'Squashing data without losing the story',sub:'PCA and dimensionality reduction',tint:'coral',
hook:'Find the few directions that carry most of the information in a messy cloud of numbers.',
kid:`<p>Shine a torch on a pencil and look at its shadow. If the pencil lies across the beam, the shadow is long and tells you a lot. If the pencil points straight at the torch, the shadow is a tiny dot and you cannot tell it was a pencil at all.</p>
<p>Data is like that pencil. Real data often has dozens or thousands of columns, but most of the interesting variety lives along a few directions. <b>Principal component analysis (PCA)</b> finds the direction where the shadows are <b>longest</b>, which keeps the most information, then the next best direction, and so on. You can then keep the top few and drop the rest.</p>
<div class="callout"><b>Why bother?</b> Fewer numbers means faster models, less storage, less noise, and pictures you can actually draw. A table with 100 columns cannot be plotted, but its first two principal components can.</div>`,
look:`Blue dots are the original data. The black line is the direction you pick. Orange dots are the shadows of the blue dots on that line, and the red segments show what each shadow loses. The curve below shows how much information is kept for every angle.`,
tries:['Start with the line pointing the wrong way (try 120 degrees). Many long red segments mean the shadows lose a lot.','Slowly turn the angle. Watch the information kept number rise and fall.','Press <b>Let PCA find it</b>. The line snaps to the long direction of the cloud. This is the first principal component.','Press <b>New cloud of dots</b> and find the best angle by hand again before pressing the button.'],
deep:`<h2>What "information" means here</h2>
<p>PCA treats <b>variance</b>, how spread out the data is, as information. A direction where the points are spread out separates them well. A direction where they all look the same tells you nothing. The "information kept" number in the demo is the share of total variance that the shadows still carry.</p>
<h2>How PCA finds the best directions</h2>
<ol><li><b>Centre</b> the data by subtracting each column's average.</li>
<li>(Usually) <b>scale</b> the columns so a column measured in thousands does not dominate.</li>
<li>Build the <b>covariance matrix</b>, which records how every pair of columns varies together.</li>
<li>Find its <b>eigenvectors</b> and <b>eigenvalues</b>. Each eigenvector is a direction, and its eigenvalue is the variance along it.</li>
<li>Sort by eigenvalue, biggest first. Keep the top k directions. These are the <b>principal components</b>.</li></ol>
<h2>A tiny worked example</h2>
<p>Three points after centring: (-1, -1), (0, 0), (1, 1). They all lie on the 45 degree line.</p>
<div class="eg"><table>
<tr><th>quantity</th><th>value</th></tr>
<tr><td>covariance matrix</td><td>[[1, 1], [1, 1]]</td></tr>
<tr><td>eigenvalues</td><td>2 and 0</td></tr>
<tr><td>first component</td><td>direction (1, 1) / sqrt 2, which is 45 degrees</td></tr>
<tr><td>variance explained</td><td>2 / (2 + 0) = 100%</td></tr>
</table></div>
<p>All the information lives on one line. Keeping only that line loses nothing, and two numbers per point became one.</p>
<h2>How many components to keep?</h2>
<ul><li>Look at the <b>explained variance</b> curve and keep enough to reach a target such as 90% or 95%.</li>
<li>Or look for an "elbow" where adding components stops helping much.</li>
<li>Or choose by what makes your final model score best on validation data.</li></ul>
<h2>Limits to remember</h2>
<ul><li>PCA is <b>linear</b>. It cannot unroll a curled-up shape such as a spiral. Tools such as t-SNE and UMAP draw non-linear maps for visualising, but their distances should not be over-read.</li>
<li>It ignores the labels. The direction with the most variance is not always the one that best separates your classes.</li>
<li>The new axes are blends of the old columns, so they are harder to explain to a person.</li>
<li>Fit it on training data only, then apply the same transform to test data, to avoid leakage.</li></ul>
<h2>Where it appears</h2>
<p>Compressing images and signals, removing noise, speeding up other models, drawing a 2D picture of high-dimensional data, and finding the main "modes" of variation in biology, finance and sensor data. Related ideas such as autoencoders learn non-linear compressions with neural networks.</p>`,
then:[['Looking at big data','Plot two columns at a time and hope.','Reduce hundreds of columns to a 2D or 3D map with PCA, t-SNE or UMAP to spot groups and outliers.'],['Compression','Hand-designed formats.','Learned compressions such as autoencoders and neural codecs extend the PCA idea to non-linear shapes.'],['Genetics','Compare a few genes by hand.','PCA of genetic variation across thousands of markers shows population structure on a single plot.'],['Embeddings','Features were designed by experts.','Models output vectors with hundreds of numbers. PCA-like tools reduce them for storage, search and plotting.'],['Preprocessing','Dropped columns by hunch.','PCA is a quick, principled way to cut dimensions, though many deep models now learn their own features.']],
words:[['Dimension','One column or feature. A table with 50 columns has 50 dimensions.'],['Variance','How spread out the values are.'],['Principal component','A direction that carries a lot of the data\'s variance.'],['Eigenvector','A special direction a matrix only stretches, never turns.'],['Eigenvalue','How much the matrix stretches along its eigenvector. In PCA, the variance.'],['Explained variance','The share of the spread that your kept components still carry.'],['Curse of dimensionality','With many dimensions, data gets sparse and distances lose meaning.']]},

{id:'embed',title:'Turning words into points on a map',sub:'Embeddings',tint:'sky',
hook:'Computers like numbers, so we give every word a spot on a map where similar words sit close together.',
kid:`<p>A computer cannot see that "puppy" and "dog" are related. To it, they are just different strings of letters. So we give each word an address on a map. Words that mean similar things get addresses that are close together: "cat" lives near "kitten", far from "volcano".</p>
<p>An address made of several numbers is called an <b>embedding</b> or <b>vector</b>. Our map has only two numbers per word, so you can see it. Real embeddings have hundreds or thousands.</p>
<p>The fun part: on a good map, <i>directions mean things</i>. The step from "cat" to "kitten" (grown-up to baby) is the same step as from "dog" to "puppy". So <b>dog + (kitten - cat) lands near puppy</b>.</p>
<div class="callout"><b>Honest note.</b> This map was drawn by hand so the idea is easy to see. Real embeddings are learned from huge piles of text, and their directions are messier. The famous "king - man + woman = queen" works roughly, not perfectly.</div>`,
look:`Each dot is a word. Pick A, B and C. The blue arrow goes from A to B. The dashed orange arrow is the same move starting from C. The green dot is the nearest word to where it lands, which is the machine's answer. Tap any word to see its closest friends.`,
tries:['Press the <b>man : king = woman : ?</b> preset. The machine answers queen.','Press the <b>france : paris = italy : ?</b> preset. Country to capital is another direction.','Tap words like <b>lion</b> and <b>cub</b> to see their closest friends in the right-hand stat tile.','Break it on purpose: try <b>man : paris = woman : ?</b>. Nonsense questions give nonsense answers, but the machine still answers.'],
deep:`<h2>Why not just number the words?</h2>
<p>If "cat" is 1,042 and "dog" is 7,019, the numbers say nothing about meaning. A bare list where each word has its own slot ("one-hot") is just as bad, because every word is equally far from every other. An embedding squeezes each word into a short list of numbers where <b>distance reflects meaning</b>.</p>
<h2>How embeddings are learned</h2>
<p>The key idea is that <b>you know a word by the company it keeps</b>. A model is trained on a simple guessing game, such as predicting a missing word from the words around it. To play well it must give words that appear in similar contexts similar vectors. Nobody labels meanings by hand. The map emerges from the game. Early methods such as word2vec and GloVe did this at scale, and today the vectors come from inside large neural networks.</p>
<h2>Measuring closeness</h2>
<div class="math">cosine similarity(a, b) = (a . b) / (|a| x |b|)
 +1  pointing the same way (very similar)
  0  unrelated
 -1  pointing opposite ways</div>
<p>Cosine similarity compares directions and ignores length, which is why it is the usual choice for text embeddings.</p>
<h2>From words to everything</h2>
<ul><li><b>Contextual embeddings.</b> In "river bank" and "bank loan" the word has the same letters but different meanings. Modern models give each word occurrence its own vector depending on the sentence.</li>
<li><b>Sentence and document embeddings.</b> A whole paragraph becomes one vector. This powers semantic search and the retrieval in level 21.</li>
<li><b>Images, audio, products, users.</b> Anything can get an embedding. Models such as CLIP put pictures and sentences on the same map, so a caption lands near its photo.</li>
<li><b>Vector databases</b> store millions of embeddings and quickly find the nearest ones.</li></ul>
<h2>Bias warning</h2>
<p>Embeddings learn from human writing, so they also learn human stereotypes. Early word maps placed certain jobs closer to one gender than another. Teams test for this and apply debiasing methods, though it is difficult to remove entirely. This is one reason to check models on every group they affect (see level 24).</p>`,
then:[['Search','Match the exact words you typed.','Semantic search finds pages about the same idea even when words differ, often combined with keyword search.'],['Recommendations','Rules such as "people who bought X".','Songs, videos, products and users all get embeddings. Near neighbours become candidates for recommendation.'],['Translation','Phrase tables built by hand.','Words and sentences from different languages share a space inside neural translation models.'],['Images and text','Separate systems.','Models like CLIP learn pictures and captions in one shared space, which powers image search and many generators.'],['Storing meaning','Plain databases of text.','Vector databases and indexes for fast nearest neighbour search are a standard building block of AI apps.']],
words:[['Embedding','A list of numbers that stands for a word, picture or anything else.'],['Vector','A list of numbers. Also thought of as an arrow or a point.'],['Cosine similarity','A score for how closely two arrows point the same way.'],['Nearest neighbour','The item whose vector is closest to yours.'],['word2vec','An early, famous method for learning word vectors.'],['Contextual embedding','A vector that changes with the sentence around the word.'],['Vector database','A store built to find nearest vectors fast.']]}
];

const LE=[
{id:'attn',title:'Paying attention: how chatbots read',sub:'Attention and transformers',tint:'sun',
hook:'Every word decides which other words to look at, and that is how the model works out what a sentence means.',
kid:`<p>Read this sentence: <i>"The cat chased the mouse because <b>it</b> was hungry."</i> Who was hungry? You know it was the cat. Now change the end: <i>"...because <b>it</b> was scared."</i> Now "it" means the mouse. The word "it" did not change. Your eyes simply looked back at a different word.</p>
<p>A <b>transformer</b>, the design behind today's chat assistants, does exactly this. Every word gets to look at every other word and decide <b>how much attention</b> to pay to each one. A word that needs context, like "it", can borrow meaning from the word it points to.</p>
<div class="callout"><b>Many heads are better than one.</b> A model runs many attention "heads" at once. One head may watch the neighbouring words, another may link pronouns to nouns, another may link verbs to their objects. Their findings are combined.</div>`,
look:`Pick which word is asking. The bars show how its attention is shared across the whole sentence. They always add up to 100%. Switch the head to see a different style of looking. The attention numbers here are set by hand to show the idea. In a trained model they are learned.`,
tries:['With <b>Head 1: next-door words</b>, tap different words. This head mostly looks one word back.','Switch to <b>Head 2: meaning</b> and tap <b>chased</b>. It now looks at the cat and the mouse, who did the chasing and who got chased.','Tap <b>it</b> in the meaning head. Then change the last word from hungry to scared and watch the attention swap animals.','Move the <b>Focus</b> slider. Low focus spreads attention thin and blurry. High focus picks a favourite.'],
deep:`<h2>The three roles: query, key and value</h2>
<p>A helpful picture is a library. Each word writes three short notes about itself:</p>
<ul><li>a <b>query</b>: "here is what I am looking for",</li>
<li>a <b>key</b>: "here is what I contain, in case you are looking for it",</li>
<li>a <b>value</b>: "here is the information I will hand over if you pick me".</li></ul>
<p>To update one word, compare its query with every key. Good matches get high scores. Turn the scores into percentages with softmax, then take that mix of the values.</p>
<div class="math">scores  = Q x K^T / sqrt(d)
weights = softmax(scores)        (each row sums to 1)
output  = weights x V</div>
<p>Dividing by the square root of d (the size of the vectors) keeps the scores from becoming huge, which would make softmax too sharp. The demo's Focus slider plays with that sharpness.</p>
<h2>A transformer block</h2>
<ol><li>Words become embeddings (level 19), plus a signal for position, since attention alone does not know word order.</li>
<li>Several attention heads run in parallel and their outputs are combined.</li>
<li>A small neural network processes each position.</li>
<li>Shortcuts (residual connections) and normalisation keep training stable.</li>
<li>Stack dozens of these blocks. Early blocks tend to capture simple patterns, later ones more abstract ones.</li></ol>
<h2>Why it took over</h2>
<ul><li><b>Parallel.</b> Older models (recurrent networks) read one word at a time. Attention looks at all words at once, which suits GPUs and made it practical to train on enormous text collections.</li>
<li><b>Long-range links.</b> A word can connect directly to one far away, with no chain of steps between.</li>
<li><b>It scales.</b> Bigger models trained on more data kept getting better.</li></ul>
<h2>How a chat model uses it</h2>
<p>Most chat assistants are <b>decoder-only</b> transformers. A "causal mask" stops each word from looking at words after it, so the model can be trained to predict the next piece of text, exactly the game from level 12. When it writes, it adds one piece at a time and attends to everything so far.</p>
<h2>Costs and limits</h2>
<ul><li>Comparing every word with every other costs time and memory that grow with the <b>square</b> of the length. Long documents are expensive, so there is a limit called the <b>context window</b>. Many efficiency tricks exist to push it further.</li>
<li>Attention weights are a useful clue to what a model uses, but they are not a complete explanation of its behaviour.</li>
<li>Transformers are used well beyond language: for images (vision transformers), audio, proteins and video.</li></ul>`,
then:[['Reading text','Models read one word at a time and tended to forget the start of long sentences.','Transformers attend across the whole passage, within the context window.'],['Translation','Statistical phrase matching.','Neural translation with attention became a standard approach and handles word order and context much better.'],['Images','Convolutions only.','Vision transformers split pictures into patches and let patches attend to each other. Many modern systems mix both.'],['Long documents','A few paragraphs at a time.','Context windows have grown a great deal, and models can handle whole books or large codebases, with cost and accuracy trade-offs.'],['Training','Small models, small data.','Very large models trained on huge amounts of text are fine-tuned afterwards for chat, code and tools.']],
words:[['Attention','A way for each word to weigh how much to look at every other word.'],['Query, key, value','The three notes each word writes: what it seeks, what it offers, what it hands over.'],['Softmax','A function that turns scores into percentages that add up to 100%.'],['Head','One attention pattern. Models run many at the same time.'],['Transformer','A network built from attention blocks. The core of modern language models.'],['Context window','How much text the model can look at at once.'],['Positional encoding','A signal telling the model where each word sits in the order.']]},

{id:'rag',title:'Giving chat assistants a notebook',sub:'Retrieval, RAG and prompts',tint:'mint',
hook:'A chat assistant does not know your school, your company or yesterday\'s news. So we let it look things up first.',
kid:`<p>Imagine a very clever friend who has read a huge library but stopped reading a while ago. Ask about last week or about your own school and they might guess, and sometimes guess wrongly while sounding sure. That mistake is called a <b>hallucination</b>.</p>
<p>The fix is simple. Before answering, your friend <b>flips through a notebook</b> of trusted notes, picks the right pages, reads them, and answers from those pages. This is <b>retrieval-augmented generation</b>, or <b>RAG</b>.</p>
<p>Finding the right page is the clever part. If you ask "What time do we build bots?" and the notebook says "The <i>robot</i> club meets...", the words do not match. Matching by <b>meaning</b>, using embeddings, solves that.</p>`,
look:`The cards are the notebook. Type a question or tap a button. The notes are ranked by how well they match, with the best ones highlighted. The box at the bottom shows what Bolt would actually read: the chosen notes pasted in front of your question. You can switch between matching exact words and matching meaning. The meaning mode here uses a small hand-made word list as a stand-in for real embeddings.`,
tries:['Tap <b>When does the robot club meet?</b> and notice the notes found by exact words.','Tap <b>What time do we build bots?</b> in exact-word mode. Nothing matches, because the question and the note share no words.','Switch to <b>Meaning</b>. The robot club note jumps to the top.','Ask <b>Can I borrow books?</b> and raise <b>k</b> to 3. More notes means more chances to include the answer, and more clutter to read.'],
deep:`<h2>Why models need help</h2>
<ul><li><b>Old knowledge.</b> A model only knows what was in its training data, up to a cutoff date.</li>
<li><b>Private knowledge.</b> It has never seen your company's documents.</li>
<li><b>Overconfident guesses.</b> When it does not know, it may still produce a fluent, wrong answer.</li></ul>
<p>RAG addresses all three by supplying the facts at the moment of the question.</p>
<h2>The RAG pipeline</h2>
<ol><li><b>Prepare once.</b> Split documents into chunks of a few paragraphs. Turn each chunk into an embedding (level 19) and store them in a vector index.</li>
<li><b>Retrieve.</b> Embed the user's question and fetch the k closest chunks. Many systems also use keyword search (such as BM25) and combine both results, called hybrid search.</li>
<li><b>Re-rank.</b> A second, more careful model can reorder the candidates.</li>
<li><b>Build the prompt.</b> Paste the best chunks, the instructions and the question into one message.</li>
<li><b>Generate.</b> The language model writes an answer using those chunks, ideally with citations to them.</li>
<li><b>Check.</b> Verify that the answer is supported by the retrieved text, and say "I don't know" when it is not.</li></ol>
<div class="eg"><table>
<tr><th>prompt part</th><th>example</th></tr>
<tr><td>instructions</td><td>Use only these notes. If the answer is not here, say so.</td></tr>
<tr><td>context</td><td>- The robot club meets every Tuesday at 4 pm in room 12.</td></tr>
<tr><td>question</td><td>What time do we build bots?</td></tr>
</table></div>
<h2>Where it goes wrong</h2>
<ul><li><b>Bad retrieval.</b> If the right chunk is not fetched, the model cannot use it. Most RAG failures are retrieval failures.</li>
<li><b>Chunking.</b> Chunks that are too small lose context. Chunks that are too big dilute the match.</li>
<li><b>Too much context.</b> Stuffing in many chunks can bury the key fact.</li>
<li><b>Untrusted text.</b> Retrieved web pages or files can contain instructions aimed at the model (prompt injection). Treat retrieved text as data, not as commands.</li></ul>
<h2>Prompting, RAG and fine-tuning</h2>
<div class="eg"><table>
<tr><th>tool</th><th>best for</th></tr>
<tr><td>better prompts</td><td>style, format, step-by-step instructions</td></tr>
<tr><td>RAG</td><td>facts that change or are private; answers that must cite sources</td></tr>
<tr><td>fine-tuning</td><td>a consistent tone, a special format, or skills that prompts cannot teach</td></tr>
<tr><td>tools and agents</td><td>doing things: search, run code, call an API, then continue</td></tr>
</table></div>
<p>Teams often combine them. Start with a good prompt, add retrieval for knowledge, and fine-tune only when the others are not enough.</p>
<h2>Measuring it</h2>
<p>Evaluate retrieval and generation separately. For retrieval, check whether the right chunk appears in the top k for a set of test questions. For answers, check faithfulness (is every claim backed by the text?) and usefulness. This connects to the monitoring ideas in level 14.</p>`,
then:[['Finding answers','Keyword search over documents. You had to guess the right words.','Semantic search finds the idea, and an assistant reads the results and writes a short answer with sources.'],['Company knowledge','Staff searched wikis and asked colleagues.','Assistants answer from internal documents, with access rules deciding who can see what.'],['Staying current','Models went stale after training.','Retrieval and web search give models fresh information without retraining.'],['Trust','Fluent answers with no way to check.','Citations and "answer only from these notes" instructions let people verify, though errors still happen.'],['Beyond text','Only documents.','Assistants call tools, query databases, run code and retrieve images and tables. These are often called agents.']],
words:[['RAG','Retrieval-augmented generation: look things up, then write the answer.'],['Hallucination','A confident answer that is not true.'],['Chunk','A small piece of a document stored and searched on its own.'],['Vector index','A store that finds the closest embeddings quickly.'],['Hybrid search','Keyword matching and meaning matching combined.'],['Prompt','The message handed to the model, including instructions and context.'],['Prompt injection','Hidden instructions in retrieved text that try to hijack the model.']]},

{id:'rec',title:'Movies you might like',sub:'Recommender systems',tint:'coral',
hook:'Find people with a taste like yours, then borrow their opinions.',
kid:`<p>You love space films and you hate cooking shows. A friend with the same taste says, "You have to watch <i>Mars Kids</i>!" You trust them, because in the past they liked what you liked.</p>
<p>A <b>recommender system</b> does that for millions of people. It looks at who rated what, finds users whose ratings look like yours, and suggests things they enjoyed that you have not seen. This is <b>collaborative filtering</b>: people collaborate without knowing it.</p>
<div class="callout"><b>Cold start.</b> What if you are new and have rated nothing? The system has no clue about you. That is called the <b>cold-start problem</b>. Try it below: with no ratings, Bolt has nothing to say.</div>`,
look:`Each row is a person and each column a film. Numbers are ratings from 1 to 5. Blank means not seen. The bottom row is yours: tap a cell to rate. Bolt finds people whose ratings move up and down like yours and lists the films they liked that you have not rated.`,
tries:['Rate <b>Robot Pals</b> 5 and <b>Bake Off</b> 1. With two ratings, Bolt can already see your leaning.','Add <b>Star Trip</b> 5 and <b>Pizza Quest</b> 1. The top suggestion should be a space film.','Press <b>Clear my ratings</b> and flip it: love cooking, dislike space. The list flips too.','Set neighbours to 1. Now one person decides everything. Set it to 6 and everyone has a say, even people who are not like you.'],
deep:`<h2>The two big families</h2>
<ul><li><b>Collaborative filtering</b> uses only the pattern of who liked what. It needs no knowledge of what the items are. It can surprise you with things you would never have searched for.</li>
<li><b>Content-based</b> methods use the properties of items (genre, actors, words in the description) and match them to what you liked before. They work for brand new items but tend to stay inside your comfort zone.</li></ul>
<p>Real systems blend both.</p>
<h2>User-based collaborative filtering, step by step</h2>
<ol><li>People rate on different scales, so subtract each person's average rating first.</li>
<li>Compare you with each other person on the films you both rated, using a correlation score between -1 and +1.</li>
<li>Keep the most similar people with a positive score (your <b>neighbours</b>).</li>
<li>For a film you have not seen, average the neighbours' adjusted ratings, weighted by similarity, then add your own average back.</li></ol>
<div class="math">predicted(you, film) = your_average
   + sum( sim(you,u) x (u_rating - u_average) ) / sum( sim(you,u) )</div>
<h2>Matrix factorisation: hidden tastes</h2>
<p>With millions of users and items, comparing people one by one is too slow, and most of the table is empty. A better idea: learn a short list of hidden "taste factors" for each user and each film (for example, how much action, how much comedy). A user's score for a film is the dot product of the two lists. The factors are learned by gradient descent (level 3) so that the predicted scores match the known ratings. Large systems use deep neural versions of this idea.</p>
<h2>How big systems really work</h2>
<ol><li><b>Candidate generation.</b> Quickly narrow millions of items to a few hundred using embeddings and nearest-neighbour search.</li>
<li><b>Ranking.</b> A heavier model scores those candidates using many signals: your history, the time of day, the device.</li>
<li><b>Re-ranking.</b> Adjust for variety, freshness, and business or safety rules.</li></ol>
<h2>Hard problems</h2>
<ul><li><b>Cold start</b> for new users and new items. Common fixes: ask a few questions, or use item content.</li>
<li><b>Implicit feedback.</b> Most people never rate. Systems learn from clicks, watch time and purchases, which are noisy: a click is not always a like.</li>
<li><b>Feedback loops.</b> If you only see what you already like, your taste narrows, and the system learns from that narrower data. Designers add variety on purpose.</li>
<li><b>Fairness.</b> Popular items get more exposure and so become more popular. Small creators can be hidden.</li>
<li><b>Measuring success.</b> Offline numbers such as precision at k or NDCG are a start. The real test is a live A/B experiment, and even then "more clicks" is not always "better for people".</li></ul>`,
then:[['Shopping','Staff recommendations and shelf placement.','Personal suggestions on product pages and in emails. Embeddings and ranking models are common.'],['Video and music','Charts and schedules.','Personalised home screens and playlists built from your history and from similar listeners.'],['News and social feeds','Editors chose the front page.','Ranking models decide the order of a feed, which raises questions about filter bubbles and fairness.'],['Cold start','New items were hidden until popular.','Content features and exploration strategies give new things a fair first chance.'],['Evaluation','Sales totals.','Teams run A/B tests and track long-term satisfaction, not only clicks.']],
words:[['Collaborative filtering','Recommending using the ratings of people with similar taste.'],['Content-based','Recommending using the properties of the items themselves.'],['Neighbours','The most similar users, whose opinions we borrow.'],['Cold start','Not enough information about a new user or item.'],['Implicit feedback','Signals like clicks and watch time instead of ratings.'],['Matrix factorisation','Learning hidden taste factors for users and items.'],['Feedback loop','What the system shows shapes the data it learns from next.']]},

{id:'gen',title:'Making new pictures out of noise',sub:'Generative models and diffusion',tint:'sun',
hook:'To paint something new, the model starts from pure static and cleans it up a little at a time.',
kid:`<p>Pour sand on a table and it looks like random fuzz. Now imagine a magic brush that, with each stroke, removes a bit of the fuzz and makes the sand look a little more like a heart, or a star. After enough strokes, a clear picture appears.</p>
<p>That is a <b>diffusion model</b>. During training it is shown clear pictures that are slowly buried in noise, and learns to undo one small step of the burying. To create something new, it starts from fresh random noise and repeats the clean-up step again and again.</p>
<div class="callout"><b>Where does the surprise come from?</b> The random noise. Different noise leads to different pictures. A text <b>prompt</b> nudges the clean-up towards pictures that match the words. In the toy below, Bolt only knows four pictures: heart, star, smiley and house.</div>`,
look:`The row of eight small squares shows one picture being made, from pure noise on the left to the finished picture on the right. Press Make a picture to watch it. The prompt buttons tell Bolt what to aim for. No prompt lets the noise decide. This toy follows the same step-by-step recipe as a real diffusion model, but its denoiser knows only four pictures instead of millions.`,
tries:['Choose <b>heart</b> as the prompt and press <b>Make a picture</b>. Watch the fuzz firm up into a heart.','Set <b>No prompt</b> and press <b>New noise, then make</b> several times. Different noise, different picture.','Drop the <b>denoising steps</b> to 2, then raise them to 30 and compare the filmstrips. With many steps the fuzz fades gradually. With few steps it jumps. This tiny toy still ends up clean, but real models need more steps to avoid rough pictures.','Pick a prompt, then set <b>how hard the prompt pulls</b> to 0. The prompt is ignored and the noise decides again.'],
deep:`<h2>Three ways to generate</h2>
<ul><li><b>Autoregressive.</b> Produce one piece at a time, each depending on the earlier pieces. This is how chat models write text.</li>
<li><b>GANs (generative adversarial networks).</b> A forger network makes fakes and a detective network tries to spot them. Both improve. GANs are fast but can be hard to train and tend to cover only part of the variety in the data.</li>
<li><b>Diffusion.</b> Learn to remove noise step by step. Training is stable and results are varied and detailed, but making one picture needs many steps.</li></ul>
<p>There are also <b>VAEs</b> (variational autoencoders), which compress data into a small code and learn to decode it. Several modern systems combine ideas.</p>
<h2>The forward process: burying the picture</h2>
<p>Take a clean image x0 and mix it with random noise. How much noise depends on the time t.</p>
<div class="math">x_t = sqrt(a_t) x x0  +  sqrt(1 - a_t) x noise
a_t goes from 1 (clean) down to 0 (pure noise)</div>
<h2>The reverse process: cleaning it up</h2>
<p>A neural network is trained to look at a noisy picture and the time t, then <b>predict the noise</b> (or equivalently the clean picture). To generate:</p>
<ol><li>Start with pure noise.</li>
<li>Ask the network for its best guess of the clean picture.</li>
<li>Move a small step towards that guess, leaving some noise.</li>
<li>Repeat until the noise is gone.</li></ol>
<p>Early on, with only noise to go on, the guess is a blurry average of everything the model knows. As the picture firms up, the guess gets sharper and commits to a single outcome. You can see this in the filmstrip.</p>
<h2>Steering with text</h2>
<p>To follow a prompt, the text is turned into an embedding (level 19) and fed to the network at every step. A technique called <b>classifier-free guidance</b> exaggerates the difference between "with the prompt" and "without the prompt". The demo's guidance slider is a simple version of that dial. Too little and the prompt is ignored. Too much and pictures get unnatural.</p>
<h2>Making it practical</h2>
<ul><li><b>Latent diffusion.</b> Do the denoising in a small compressed space (like the PCA idea in level 18) instead of on full pixels, then decode to a big image. This is much cheaper.</li>
<li><b>Fewer steps.</b> Better samplers and distilled models can make decent pictures in a handful of steps.</li>
<li><b>Other media.</b> The same recipe is used for audio, video and 3D shapes.</li></ul>
<h2>Using it responsibly</h2>
<ul><li>Generated pictures and voices can be used to deceive. Watermarks and provenance labels help, but are not a complete answer.</li>
<li>Questions about the data these models learn from, and about who owns the results, are still being argued in courts and in policy.</li>
<li>Models copy biases from their training data. Check what they make for different groups of people.</li></ul>`,
then:[['Making images','Artists and photographers, or hand-built graphics software.','Text-to-image tools make pictures from a sentence. Artists use them for drafts, ideas and finished work, and many debate the effects on their profession.'],['Photo editing','Manual retouching.','Models fill in missing parts, remove objects, extend images and restyle them from short instructions.'],['Video and audio','Hard to fake convincingly.','Generated video, music and voices have improved quickly, which raises concerns about deepfakes and consent.'],['Science and design','Trial and error in the lab.','Diffusion-style models are used to propose molecules, proteins and materials, which are then tested for real.'],['Speed and cost','Many seconds or minutes per image on big machines.','Latent models and distilled samplers are much faster, and some run on a phone or laptop.']],
words:[['Generative model','A model that makes new examples that look like its training data.'],['Diffusion','Making data by learning to remove noise step by step.'],['Noise','Random static mixed into a picture.'],['Denoising step','One small clean-up move towards a clear picture.'],['Guidance','A dial for how strongly the prompt steers the result.'],['GAN','A forger and a detective network that train each other.'],['Latent space','A small compressed space where the heavy work is done.']]},

{id:'fair',title:'Fair decisions and explaining models',sub:'Fairness, bias and explainability',tint:'mint',
hook:'A model can be accurate overall and still treat some people worse. Learn to measure that and decide what to do about it.',
kid:`<p>Suppose a bank uses a robot to decide who gets a loan. The robot gives each person a score. Everyone above a cut-off line gets a yes. That sounds fair, because it is the same line for everybody.</p>
<p>But look closer. What if the past data came from a time when one group had fewer chances, so their scores are lower even for people who would pay the loan back just as reliably? Then the same cut-off line quietly says "no" to more good people from that group.</p>
<p>Fairness is not one magic number. It is a set of different questions, and you cannot always answer all of them at once. In the toy below you will set the cut-offs and see what changes.</p>`,
look:`Two panels show two groups of people. Orange hills are people who would repay and blue hills are people who would not. The black line is the cut-off: scores to its right are approved. The tiles show how many of each group are approved, how many of the people who would really repay are approved, and how many decisions are right overall.`,
tries:['Leave <b>One cut-off for everyone</b> on and move the slider. Compare the two "good applicants approved" tiles. One group is always lower.','Turn the single cut-off off. Now lower Group B\'s cut-off a little and watch its good applicants rise.','Look at the "approved" tiles for A and B. Even after equalising good applicants, the overall approval rates still differ. Why?','Push Group B\'s cut-off too low. More people from B who would not repay are approved, and the overall correct rate falls.'],
deep:`<h2>Where bias comes from</h2>
<ul><li><b>Data.</b> Some groups are missing or under-represented, or the labels reflect past human prejudice. A hiring model trained on past hires can copy past hiring habits.</li>
<li><b>Measurement.</b> The thing you can measure may be a poor stand-in for what you care about. "Arrests" is not the same as "crimes".</li>
<li><b>Proxies.</b> Even if you remove a sensitive column such as gender or race, other columns such as postcode can reveal it.</li>
<li><b>Feedback.</b> A model's decisions change the world and so the next batch of data.</li>
<li><b>Use.</b> A good model deployed on the wrong population, or ignored by the humans around it, still causes harm.</li></ul>
<h2>Some ways to measure fairness</h2>
<div class="eg"><table>
<tr><th>idea</th><th>asks</th></tr>
<tr><td>demographic parity</td><td>Are approval rates equal across groups?</td></tr>
<tr><td>equal opportunity</td><td>Among people who would succeed, are approval rates equal? (equal true positive rates)</td></tr>
