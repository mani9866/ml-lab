<p>డెమో ఆడండి. బోల్ట్‌కి ఇచ్చే ఉదాహరణల సంఖ్యను, తప్పు లేబుళ్ల శాతాన్ని, నిర్ణయం తీసుకునే ముందు బోల్ట్ అడిగే పక్కవాళ్ల సంఖ్యను మార్చండి. ఏది నష్టం చేస్తుందో, ఏది మేలు చేస్తుందో కనుక్కోండి.</p>`,
look:'వృత్తాలు, చతురస్రాలు బోల్ట్ చదివే ఉదాహరణలు. ఎర్ర వలయం అంటే ఆ ఉదాహరణ లేబుల్ తప్పు అని అర్థం. కొత్త బిందువుకి దగ్గరి పక్కవాళ్లు ఓటు వేసి లేబుల్ చెప్పినప్పుడు బోల్ట్ ఏం చెబుతుందో వెనుక రంగులు చూపిస్తాయి. రిపోర్ట్ కార్డ్ 300 కొత్త బిందువులపై స్కోర్ చూపిస్తుంది.',
tries:['మొదట డిఫాల్ట్‌లతో మొదలుపెట్టండి: 40 ఉదాహరణలు, 0% తప్పులు, 3 పక్కవాళ్లు. స్కోర్ గమనించండి.','<b>wrong labels</b> ని 20% కి లాగండి. ఎర్ర వలయాలు కనిపిస్తాయి, రంగుల మ్యాప్ గందరగోళంగా అవుతుంది, స్కోర్ తగ్గుతుంది.','ఇప్పుడు <b>examples</b> ని 200 కి, <b>neighbours</b> ని 15 కి పెంచండి. బోల్ట్ చాలా ఉదాహరణల సగటు తీసుకుంటుంది, అందుకే కొన్ని తప్పు లేబుళ్లు పెద్దగా నష్టం చేయవు.','తప్పు లేబుళ్లను మళ్లీ 0 చేసి <b>examples</b> ని 6 కి తగ్గించండి. ఇది సులువైన సమస్య కాబట్టి బోల్ట్ తట్టుకుంటుంది. నిజమైన సమస్యలు కష్టం, చాలా ఎక్కువ ఉదాహరణలు కావాలి.','<b>Shuffle the data</b> ని కొన్ని సార్లు నొక్కండి. ప్రతిసారీ స్కోర్ కొద్దిగా మారుతుంది, ఎందుకంటే అదృష్టం కూడా పాత్ర పోషిస్తుంది.']},

gd:{title:'ఊహించు, చూడు, మెరుగుపరుచు',sub:'లీనియర్ రిగ్రెషన్, గ్రేడియంట్ డిసెంట్',hook:'చిన్న చిన్న అడుగులతో కిందికి దిగుతూ ఉత్తమమైన గీతను కనుక్కోవడం.',
kid:`<p><b>వేడి, చల్లా</b> ఆట ఆడండి. స్నేహితుడు ఒక బొమ్మను దాచాడు. మీరు ఒక అడుగు వేశారు. "వేడిగా ఉంది!" ఇంకో అడుగు. "చల్లగా ఉంది!" మీరు వెనక్కి తిరిగారు. కొద్దిసేపట్లో బొమ్మ దొరుకుతుంది, అది ఎక్కడ ఉందో ఎవరూ చెప్పలేదు.</p>
<p>కంప్యూటర్ కూడా ఇలాగే నేర్చుకుంటుంది. ఒక ఊహ చేస్తుంది, ఎంత తప్పో కొలుస్తుంది, తప్పు తగ్గే దిశలో ఊహను కొద్దిగా జరుపుతుంది. వందల సార్లు ఇలా చేస్తే ఊహ చాలా మంచిగా అవుతుంది.</p>
<div class="callout"><b>ఊహించుకోండి.</b> కళ్లకి గంతలు కట్టి ఒక కొండ మీద నిలబడ్డారు, లోయకి చేరాలి. కనిపించదు, కానీ నేల ఏ వైపు వాలుగా ఉందో కాళ్లకి తెలుస్తుంది. కిందికి ఒక చిన్న అడుగు వేయండి, మళ్లీ తడిమి చూడండి, మళ్లీ వేయండి. ఇదే <b>గ్రేడియంట్ డిసెంట్</b>. లోయ అంటే మోడల్ తప్పు అతి తక్కువగా ఉండే చోటు.</div>
<p>డెమోలో చుక్కల గుండా ఒక సరళ రేఖను అమరుస్తాం. మీరు వేసే అడుగు పరిమాణమే <b>లెర్నింగ్ రేట్</b>. చాలా చిన్నదైతే నెమ్మదిగా వెళ్తుంది. చాలా పెద్దదైతే లోయను దాటి దూకేస్తుంది.</p>`,
look:'చుక్కలు డేటా. నీలం గీత మోడల్ ప్రస్తుత ఊహ, బూడిద రంగు చుక్కల గీత సాధ్యమైనంత ఉత్తమ గీత, ఎర్ర భాగాలు తప్పులు. కింది చార్ట్ ప్రతి అడుగు తర్వాత లాస్ (loss) చూపిస్తుంది.',
tries:['డిఫాల్ట్ రేట్‌తో <b>Play</b> నొక్కండి. ఎర్ర తప్పులు చిన్నవి అవుతాయి, లాస్ గీత వేగంగా పడిపోయి, తర్వాత చదునుగా అవుతుంది.','<b>Reset</b> నొక్కి, రేట్‌ని 0.005 చేసి ఆడండి. గమ్యం అదే, కానీ చాలా ఎక్కువ అడుగులు.','Reset చేసి రేట్‌ని 0.12 పైకి పెంచండి. ప్రతి అడుగు లోయను దాటి దూకడం వల్ల లాస్ పేలిపోతుంది.','Reset చేసి <b>One step</b> ని మళ్లీ మళ్లీ నొక్కండి. గీత చుక్కల గీతకి దగ్గరయ్యే కొద్దీ అడుగులు చిన్నవి అవుతాయి. రేట్ మార్చలేదు, వాలు చదునవుతోంది అంతే.']},

logreg:{title:'అవును లేదా కాదు, శాతంతో',sub:'లాజిస్టిక్ రిగ్రెషన్',hook:'ఆధారాలను సంభావ్యతగా మార్చి, రెండు గుంపుల మధ్య గీత గీయడం.',
kid:`<p>వాతావరణ యాప్ "వర్షం" అని మాత్రమే చెప్పదు. <b>70% వర్షం పడే అవకాశం</b> అని చెబుతుంది. ఇది చాలా ఉపయోగకరం. తడవడం ఇష్టం లేకపోతే గొడుగు తీసుకెళ్లొచ్చు, పట్టింపు లేకపోతే వదిలేయొచ్చు.</p>
<p>లాజిస్టిక్ రిగ్రెషన్ ఇలాగే పనిచేస్తుంది. "అవును" అనడానికి ఉన్న ఆధారాలను కూడుతుంది, ఉదాహరణకు ఈమెయిల్‌లో లింకుల సంఖ్య, "free" అనే పదం. ఎక్కువ ఆధారాలుంటే స్కోర్ ఎక్కువ. తర్వాత ఆ స్కోర్‌ని <b>సిగ్మాయిడ్</b> అనే S ఆకారపు వంపుతో 0 నుంచి 100 మధ్య శాతంగా మారుస్తుంది.</p>
<div class="callout"><b>మధ్యలో ఉండే గీత.</b> రెండు గుంపుల మధ్య ఎక్కడో మోడల్ "50-50" అనే చోటు ఉంటుంది. అలాంటి చోట్లన్నీ కలిపి గీస్తే వచ్చేది <b>డెసిషన్ బౌండరీ</b>. ఒక వైపు అవును, ఇంకో వైపు కాదు.</div>
<p>డెమోలో రెండు తరగతులను దగ్గరగా జరపండి. గుంపులు కలిసిపోతే, ఎంత మంచి మోడల్ అయినా ప్రతిసారీ సరిగ్గా చెప్పలేదు, ఎందుకంటే కొన్ని బిందువులు నిజంగానే అస్పష్టంగా ఉంటాయి.</p>`,
look:'నీలం వృత్తాలు, నారింజ చతురస్రాలు రెండు తరగతులు. వెనుక రంగు నారింజ తరగతికి మోడల్ చెప్పే సంభావ్యత. నల్ల గీత సరిగ్గా 50/50 ఉన్న చోటు.',
tries:['<b>Play</b> నొక్కండి. గీత మొదట నిర్వచించబడదు (అన్ని వెయిట్లు సున్నా), తర్వాత లాస్ తగ్గే కొద్దీ సరైన చోటుకి తిరుగుతుంది.','<b>Class separation</b> ని 0.5 కి తగ్గించి, <b>Reset weights</b> నొక్కి ఆడండి. ఎంత సేపు నేర్పినా accuracy 100% కి చాలా కింద ఆగిపోతుంది. ఆ పరిమితినే Bayes error అంటారు.','లెర్నింగ్ రేట్ 2 పెట్టి, తర్వాత 0.05 పెట్టి చూడండి. accuracy ఎంత వేగంగా స్థిరపడుతుందో పోల్చండి.','<b>New data</b> ని కొన్ని సార్లు నొక్కండి. ప్రతిసారీ accuracy కొద్దిగా మారుతుంది. ఇది నమూనా శబ్దం (sampling noise). అందుకే ఒక్క టెస్ట్ స్కోర్ మొత్తం కథ చెప్పదు.']},

knn:{title:'పక్కవాళ్లని అడగండి',sub:'k-nearest neighbours',hook:'కొత్తదానికి పేరు పెట్టాలంటే, మనకు తెలిసిన అతి సమానమైన వాటిని చూడండి.',
kid:`<p>మీరు ఒక కొత్త ఊరికి వచ్చారు. అక్కడివాళ్లకి పిజ్జా ఇష్టమా, టాకోస్ ఇష్టమా అని తెలుసుకోవాలి. పక్కనే ఉండే ఐదుగురిని అడిగారు. ముగ్గురు పిజ్జా అన్నారు. అంటే ఈ వీధి మొత్తానికి "పిజ్జా" అని ఊహిస్తారు. మీరు ఇప్పుడే k = 5 తో <b>k-nearest neighbours</b> చేశారు.</p>
<p>కంప్యూటర్ ముందే నియమాలు నేర్చుకోదు. అది ఉదాహరణలన్నింటినీ దాచుకుంటుంది. కొత్తది వచ్చినప్పుడు అతి దగ్గరి <b>k</b> ఉదాహరణలను వెతికి, వాటికి ఓటు వేయమంటుంది.</p>
<div class="callout"><b>ఎంతమంది పక్కవాళ్లని అడగాలి?</b> ఒక్కరినే అడిగితే, వింతగా ఉండే ఒక్క మనిషి మిమ్మల్ని తప్పుదారి పట్టించొచ్చు. ఊరంతా అడిగితే స్థానిక ప్రత్యేకత పోతుంది. k ని ఎంచుకోవడం సమతుల్యతతో చేసే పని.</div>
<p>డెమోలో పెద్ద వృత్తాన్ని మ్యాప్ మీద లాగండి. పక్కవాళ్లు వెలిగి ఓటు వేయడం చూడండి.</p>`,
look:'వృత్తాలు, చతురస్రాలు, త్రిభుజాలు మూడు తరగతులు. పెద్ద వృత్తాన్ని లాగండి. చుక్కల వలయంలో దాని k దగ్గరి పక్కవాళ్లు ఉంటారు, సన్నని గీతలు వాటిని కలుపుతాయి, అవి ఓటు వేస్తాయి. లేత వెనుక రంగు మ్యాప్‌లో ప్రతి చోటుకి ఏ తరగతి వస్తుందో చూపిస్తుంది.',
tries:['regions ఆన్ చేసి <b>k = 1</b> పెట్టండి. మ్యాప్ మొత్తం ముక్కలు ముక్కలుగా అవుతుంది: ప్రతి ఒక్క బిందువూ తన సొంత ప్రాంతాన్ని తీసుకుంటుంది, శబ్దం ఉన్నవి కూడా.','k ని 25 కి పెంచండి. ప్రాంతాలు నునుపుగా అవుతాయి, చిన్న ద్వీపాలు మాయమవుతాయి.','query బిందువుని రెండు గుంపుల అంచు వెంట లాగండి. ఓట్లు చీలి, జవాబు మారడం చూడండి.','regions ఆఫ్ చేసి, query ని ఎక్కడైనా ఉంచి, టైల్స్ చూసే ముందే జవాబు ఊహించండి.']},

trees:{title:'20 ప్రశ్నల ఆట',sub:'డెసిషన్ ట్రీలు, రాండమ్ ఫారెస్ట్',hook:'తెలివిగా అవును/కాదు ప్రశ్నలు అడగండి, చెట్ల గుంపుని ఓటు వేయనివ్వండి.',
kid:`<p><b>20 ప్రశ్నలు</b> ఆట ఆడారా? "ఇది జంతువా?" అవును. "దీనికి నాలుగు కాళ్లా?" అవును. "ఇది మొరుగుతుందా?" అవును. "కుక్క!" ప్రతి ప్రశ్న సాధ్యమైన జవాబుల జాబితాని సగానికి లేదా అంతకంటే తక్కువకి తగ్గిస్తుంది.</p>
<p><b>డెసిషన్ ట్రీ</b> అంటే ఆ ఆట ఆడే కంప్యూటర్. ఉదాహరణలను చూసి, గుంపులను బాగా వేరు చేసే ప్రశ్న ఏదో కనుక్కుంటుంది, ఉదాహరణకు "సైజు 2.5 కంటే తక్కువా?" తర్వాత ప్రతి కొమ్మకీ తర్వాతి మంచి ప్రశ్న అడుగుతుంది. ఇలా కొనసాగుతుంది. పూర్తయిన చెట్టు మీరు చదవగలిగే ఫ్లోచార్ట్.</p>
<div class="callout"><b>ఒక్క చెట్టు అతిగా ఉత్సాహపడొచ్చు.</b> ప్రతి ఉదాహరణకీ ఒక చిన్న పెట్టె వచ్చే వరకు ప్రశ్నలు అడుగుతూనే ఉంటే, అది ఉదాహరణలను, తప్పులతో సహా, బట్టీ పట్టేసినట్టే. దీనికి పరిష్కారం మొత్తం ఒక <b>అడవి</b> (forest) పెంచడం: చాలా చెట్లు, ప్రతిదీ డేటాని కొద్దిగా వేరేగా కలిపి నేర్చుకుంటుంది, అన్నీ ఓటు వేస్తాయి. జాడీలో ఎన్ని జెల్లీ బీన్స్ ఉన్నాయో ఊహించే ఆట లాగా, గుంపు సగటు సాధారణంగా ఏ ఒక్కరి కంటే దగ్గరగా ఉంటుంది.</div>
<p>డెమోలో అసలు నమూనా ఒక మెట్ల వరుస, కానీ కొన్ని లేబుళ్లు తప్పు. ఒక్క చెట్టు ఏం చేస్తుందో చూడండి, తర్వాత అడవిని ప్రయత్నించండి.</p>`,
look:'చతురస్రాలు, వృత్తాలు ట్రైనింగ్ ఉదాహరణలు, కొన్నింటికి తప్పు లేబుల్ ఉంది. దాగి ఉన్న నమూనా ఒక మెట్ల వరుస: దాని పైన ఉన్న బిందువులు చతురస్రాలు. వెనుక రంగు చెట్టు లేదా అడవి ప్రతి చోట ఏం చెబుతుందో చూపిస్తుంది. ప్రతి ప్రశ్న "ఈ సంఖ్య ఆ గీత కంటే తక్కువా?" అయినందున దీర్ఘచతురస్రాలు వస్తాయి. టెస్ట్ స్కోర్ మోడల్ చూడని శుభ్రమైన బిందువులపై కొలుస్తారు.',
tries:['Depth 1: ఒక్క ప్రశ్న మాత్రమే. మ్యాప్ రెండు పెద్ద బ్లాకులు. చాలా సరళం.','Depth ని 4 కి పెంచండి. మెట్ల వరుస కనిపిస్తుంది, ఒక్క చెట్టుకి టెస్ట్ స్కోర్ అత్యున్నతంగా ఉంటుంది.','Depth ని 10 కి పెంచండి. తప్పు లేబుళ్ల చుట్టూ చిన్న ద్వీపాలు వస్తాయి. ట్రైన్ స్కోర్ 100% అవుతుంది కానీ టెస్ట్ స్కోర్ జారుతుంది.','ఇప్పుడు depth 5 పెట్టి <b>Trees</b> ని 40 కి పెంచండి. అంచు నునుపుగా అవుతుంది, టెస్ట్ స్కోర్ పెరుగుతుంది. గుంపు శక్తి అంటే ఇదే.']},

kmeans:{title:'జవాబులు లేకుండా విభజించడం',sub:'k-means తో క్లస్టరింగ్',hook:'గుంపులు ఏవో ఎవరూ చెప్పకపోయినా డేటాలో సహజమైన గుంపులను కనుక్కోవడం.',
kid:`<p>ఒక పెద్ద బొమ్మల పెట్టెను నేల మీద కుమ్మరించండి. ఎవరూ తరగతులు చెప్పరు, కానీ మీరు కుప్పలు చేయడం మొదలుపెడతారు: కార్లు ఇక్కడ, బొమ్మలు అక్కడ, బ్లాకులు ఇంకో చోట. ఎవరూ లేబుళ్లు ఇవ్వకుండానే <i>ఒకేలా కనిపించే</i> వాటిని కలిపారు. ఇదే <b>unsupervised learning</b>.</p>
<p>K-means ఒక సులువైన చిట్కాతో ఇది చేస్తుంది. మ్యాప్ మీద కుప్పల కేంద్రాలుగా K చోట్లను ఎంచుకోండి. ప్రతి బిందువు దగ్గరి కేంద్రంలో చేరుతుంది. తర్వాత ప్రతి కేంద్రం తన కుప్ప మధ్యకి జరుగుతుంది. బిందువులు మళ్లీ తమ దగ్గరి కేంద్రాన్ని ఎంచుకుంటాయి, కేంద్రాలు మళ్లీ జరుగుతాయి. ఏమీ మారని వరకు ఇలా సాగుతుంది.</p>
<div class="callout"><b>K ని మీరే ఎంచుకోవాలి.</b> ఎన్ని కుప్పలు? దీనికి సహాయంగా డెమో <b>elbow చార్ట్</b> గీస్తుంది. సరైన కుప్పల సంఖ్య వరకు అది వేగంగా పడిపోతుంది, తర్వాత వంగిన చేయి లాగా చదునవుతుంది. ఆ వంపే మీ ఉత్తమ ఊహ.</div>
<p><b>One step</b> నొక్కి, అది "బిందువులను కేటాయించడం", "కేంద్రాలను జరపడం" మధ్య మారుతూ ఉండటం గమనించండి.</p>`,
look:'ప్రతి ఖండన గుర్తు ఒక సెంట్రాయిడ్ (గుంపు కేంద్రం). బిందువులు తమ దగ్గరి సెంట్రాయిడ్ రంగు, ఆకారం తీసుకుంటాయి, బూడిద రంగు అంటే "ఇంకా కేటాయించలేదు". కింది చార్ట్ ప్రతి K కి సాధ్యమైన అతి తక్కువ inertia ని చూపిస్తుంది, అదే elbow వంపు.',
tries:['K = 3 ఉంచి <b>One step</b> ని మళ్లీ మళ్లీ నొక్కండి. అడుగులు <i>బిందువులను కేటాయించడం</i>, <i>కేంద్రాలను జరపడం</i> మధ్య మారుతూ ఉంటాయి.','<b>Re-initialise</b> ని కొన్ని సార్లు నొక్కి, స్థిరపడే వరకు నడపండి. చివరి inertia మారుతుంది, దాన్ని "best for this K" తో పోల్చండి. చెడు ఆరంభాలు ఇరుక్కుపోతాయి.','K = 4 పెట్టి నడపండి. కింది చార్ట్‌లో elbow తో సరిపోల్చండి.','K = 8 పెట్టండి. inertia తక్కువగా ఉంటుంది, కానీ క్లస్టర్లు నిజమైన గుంపులను అర్థం లేకుండా ముక్కలు చేసినవి అవుతాయి. తక్కువ inertia అంటే మంచి క్లస్టర్లు అని కాదు.']},

nb:{title:'స్పామ్ ఫిల్టర్లు, నైవ్ బేస్',sub:'చాలా చిన్న ఆధారాలను తూకం వేయడం',hook:'చాలా బలహీనమైన ఆధారాలను కూడి కూడా కంప్యూటర్ బలమైన ఊహ ఎలా చేయగలదు.',
kid:`<p>మీరు డిటెక్టివ్ అనుకోండి, ఒక ఈమెయిల్ మీ టేబుల్ మీదకి వచ్చింది. అందులో <b>"winner"</b> అనే పదం కనిపించింది. అది ఒక ఆధారం. నిజాయితీ గల ఈమెయిళ్లలో కూడా అప్పుడప్పుడు "winner" ఉంటుంది, కాబట్టి ఇంకా ఏమీ నిరూపణ కాలేదు. తర్వాత <b>"free"</b>, తర్వాత <b>"prize"</b> కనిపించాయి. ప్రతి ఆధారం ఒక్కటిగా బలహీనం. కలిస్తే గట్టిగా వినిపిస్తాయి.</p>
<p><b>నైవ్ బేస్</b> ఫిల్టర్ ఈ డిటెక్టివ్ లాగే పనిచేస్తుంది. స్పామ్‌లో, మామూలు మెయిళ్లలో ప్రతి పదం ఎంత తరచుగా వచ్చిందో గుర్తుంచుకుంటుంది. కొత్త ఈమెయిల్‌కి, పదం పదం చొప్పున "ఈ పదం ఏ కుప్ప అవకాశాన్ని పెంచుతోంది?" అని అడుగుతూ స్కోర్ కూడుతూ వెళ్తుంది.</p>
<div class="callout"><b>"నైవ్" ఎందుకు?</b> ఈ ఫిల్టర్ ప్రతి పదాన్ని స్వతంత్ర ఆధారంగా భావిస్తుంది, అంటే "free" కనిపిస్తే "prize" దగ్గరలో ఉందా అనే దానిపై అది ఏమీ చెప్పదన్నట్టు. నిజానికి అది నిజం కాదు, కానీ ఈ షార్ట్‌కట్ చాలా చౌక, చాలా బాగా పనిచేస్తుంది, అందుకే ఇప్పటికీ వాడతారు.</div>
<p>కింద ఒక ఈమెయిల్‌కి పదాలను ఎంచుకుని బోల్ట్ ఎలా మనసు మార్చుకుంటుందో చూడండి.</p>`,
look:'చిప్స్ మీరు ఈమెయిల్‌లో పెట్టగల పదాలు. బార్ ఈమెయిల్ స్పామ్ అని బోల్ట్‌కి ఎంత నమ్మకమో చూపిస్తుంది. దాని కింద, మీరు ఎంచుకున్న ప్రతి పదానికి ఒక బార్: నారింజ బార్లు స్పామ్ వైపు నెడతాయి, ఆకుపచ్చ బార్లు మామూలు ఈమెయిల్ వైపు నెడతాయి. స్లైడర్ ఏమీ చదవక ముందే స్పామ్ ఎంత సాధారణమో నిర్ణయిస్తుంది.',
tries:['<b>winner</b> నొక్కండి. ఒక బలమైన ఆధారం బార్‌ని చాలా కదుపుతుంది, కానీ పూర్తిగా కాదు.','<b>prize</b>, <b>free</b> కూడా చేర్చండి. ఆధారాలు పోగుపడతాయి, బార్ కుడి వైపుకి దూసుకెళ్తుంది.','ఈమెయిల్‌ని ఖాళీ చేసి <b>meeting</b>, <b>tomorrow</b>, <b>report</b> ఎంచుకోండి. ఇప్పుడు బార్ సున్నా వైపు పడిపోతుంది.','ఆ మూడింటితో పాటు <b>winner</b> ని మళ్లీ పెట్టి, తాడు లాగుడులో ఎవరు గెలుస్తారో చూడండి. తర్వాత స్పామ్ ఎంత సాధారణమో చెప్పే స్లైడర్ కదపండి.']},

biasvar:{title:'బట్టీ పట్టడం vs అర్థం చేసుకోవడం',sub:'ఓవర్‌ఫిట్టింగ్, బయాస్-వేరియన్స్',hook:'ప్రాక్టీస్ ప్రశ్నల్లో పూర్తి మార్కులు వచ్చినా, మోడల్ ఏమీ ఉపయోగకరంగా నేర్చుకోలేదని దాగి ఉండొచ్చు.',
kid:`<p>ఇద్దరు విద్యార్థులు లెక్కల పరీక్షకి సిద్ధమవుతున్నారు. ఒకరు గత సంవత్సరం ప్రశ్నలు, జవాబులు అలాగే బట్టీ పట్టాడు. ఇంకొకరు లెక్కలు ఎలా చేయాలో నేర్చుకున్నాడు. గత సంవత్సరం పేపర్‌లో బట్టీ పట్టినవాడికి 100% వస్తుంది. ఈ సంవత్సరం కొత్త అంకెలతో వచ్చిన పేపర్‌లో అతను ఫెయిల్ అవుతాడు.</p>
<p>మోడల్ కూడా ఇదే చేయగలదు. అది చాలా వంగే స్వభావం ఉంటే, తప్పులతో సహా ఉదాహరణలను బట్టీ పట్టేస్తుంది. దీన్ని <b>ఓవర్‌ఫిట్టింగ్</b> అంటారు. మరీ సరళంగా ఉంటే నమూనాను అస్సలు నేర్చుకోదు. దీన్ని <b>అండర్‌ఫిట్టింగ్</b> అంటారు. మనకు కావాల్సింది అర్థం చేసుకునే విద్యార్థి.</p>
<div class="callout"><b>నిజాయితీ పరీక్ష.</b> తేడా తెలుసుకోవడానికి ఒకే మార్గం: మోడల్ ఎప్పుడూ చూడని ఉదాహరణలపై దాన్ని పరీక్షించడం. ప్రాక్టీస్ స్కోర్ బాగుండి, కొత్త ఉదాహరణల స్కోర్ చెడ్డగా ఉంటే, మీ దగ్గర బట్టీ పట్టేది ఉన్నట్టే.</div>
<p>డెమోలో అసలు నమూనా ఒక మెల్లని అల. flexibility స్లైడర్ కదిపి, నారింజ (కొత్త డేటా) స్కోర్ ఎలా మారుతుందో చూడండి.</p>`,
look:'ముదురు చుక్కలు 15 ట్రైనింగ్ బిందువులు. మసక నారింజ చుక్కలు 200 చూడని టెస్ట్ బిందువులు. చుక్కల గీత అసలు నమూనా, నీలం వంపు మీ మోడల్. కింది చార్ట్ ప్రతి degree కి ట్రైనింగ్ ఎర్రర్ (నీలం), టెస్ట్ ఎర్రర్ (నారింజ) ని log స్కేల్‌లో చూపిస్తుంది.',
tries:['degree ని 1 పెట్టండి. గీత చాలా బిగుతుగా ఉంది: రెండు ఎర్రర్లూ ఎక్కువ. ఇది <b>అండర్‌ఫిట్టింగ్</b> (high bias).','Degree 3 లేదా 4 అసలు వంపుని చక్కగా అనుసరిస్తుంది. టెస్ట్ ఎర్రర్ అతి తక్కువకి చేరుతుంది.','Degree 12 దాదాపు ప్రతి ముదురు చుక్క గుండా వెళ్తుంది కానీ వాటి మధ్య విపరీతంగా ఊగుతుంది. ట్రైనింగ్ ఎర్రర్ తగ్గుతూనే ఉంటుంది, టెస్ట్ ఎర్రర్ పేలిపోతుంది: <b>ఓవర్‌ఫిట్టింగ్</b> (high variance).','Degree 12 వద్ద <b>Regularisation strength</b> ని 10^-2 కి పెంచండి. వంపు శాంతిస్తుంది, టెస్ట్ ఎర్రర్ కోలుకుంటుంది.','<b>New training sample</b> ని చాలా సార్లు నొక్కండి. Degree 1 దాదాపు కదలదు (స్థిరం కానీ తప్పు), degree 12 ప్రతిసారీ బాగా మారుతుంది (అస్థిరం). ఆ అస్థిరతే variance.']},

metrics:{title:'ఎంత మంచిది అంటే మంచిది?',sub:'ప్రెసిషన్, రీకాల్, థ్రెషోల్డ్',hook:'98% accuracy ఉన్నా మోడల్ ఎందుకు పనికిరాకుండా ఉండొచ్చు, సరైన కటాఫ్ ఎలా ఎంచుకోవాలి.',
kid:`<p>తోడేలు వచ్చిందని అరిచే కుర్రాడి కథ గుర్తుందా? అతను ప్రతి ఐదు నిమిషాలకు "తోడేలు!" అని అరుస్తున్నాడనుకోండి. చాలా హెచ్చరికలు తప్పు కాబట్టి ఊరివాళ్లు వినడం మానేస్తారు. ఇది <b>ప్రెసిషన్</b> సమస్య: మీరు హెచ్చరిక ఇచ్చినప్పుడు, ఎంత తరచుగా మీరు సరైనవారు?</p>
<p>ఇప్పుడు అతను అసలు అరవడు అనుకోండి. తప్పుడు హెచ్చరికలు ఉండవు, కానీ తోడేలు గొర్రెలను తినేస్తుంది. ఇది <b>రీకాల్</b> సమస్య: నిజమైన తోడేళ్లలో మీరు ఎన్నింటిని పట్టుకున్నారు?</p>
<div class="callout"><b>రెండింటినీ పూర్తిగా పెంచలేరు.</b> చాలా తొందరపడే అలారం ప్రతి తోడేలునూ పట్టుకుంటుంది కానీ చాలా సార్లు తప్పుగా అరుస్తుంది. చాలా నెమ్మదైన అలారం మోగినప్పుడు సరిగ్గా ఉంటుంది కానీ తోడేళ్లను వదిలేస్తుంది. "ఎంత తొందర" అని నిర్ణయించే స్లైడరే <b>థ్రెషోల్డ్</b>, తప్పులకు ఎంత ఖర్చు అవుతుందో దాన్ని బట్టి ఉత్తమ సెట్టింగ్ ఉంటుంది.</div>
<p>డెమోలో ఒక మోసం పట్టే డిటెక్టర్ ప్రతి చెల్లింపుకి స్కోర్ ఇస్తుంది. థ్రెషోల్డ్ కదిపి డబ్బు ఎలా కూడుతుందో చూడండి.</p>`,
look:'పై చార్ట్: మోడల్ నిజమైన లావాదేవీలకు (నీలం), మోసపు వాటికి (నారింజ) ఇచ్చే స్కోర్లు. అవి కలిసిపోతాయి కాబట్టి ఏ థ్రెషోల్డ్ పరిపూర్ణం కాదు. నల్ల గీతకి కుడివైపున ఉన్నవన్నీ ఫ్లాగ్ అవుతాయి. టేబుల్ ప్రతి 10,000 లావాదేవీలకు ఫలితాలు చూపిస్తుంది, కింది చార్ట్ ప్రతి థ్రెషోల్డ్ వద్ద మొత్తం ఖర్చు చూపిస్తుంది.',
tries:['2% మోసంతో threshold 0.50 వద్ద <b>precision</b> చూడండి. మోడల్ బలంగా కనిపించినా, ఎక్కువ అలర్టులు తప్పుడు అలారాలే.','Threshold ని 0.80 కి జరపండి. Precision పెరుగుతుంది, కానీ recall కుప్పకూలుతుంది: చాలా మోసం తప్పించుకుంటుంది.','మోసం వాటాను 10% కి పెంచి, మళ్లీ 0.50 కి రండి. అదే మోడల్, కానీ precision దూకుతుంది. Precision అనేది ఆ విషయం ఎంత సాధారణమో దానిపై ఆధారపడుతుంది.','పట్టుకోలేని మోసం ఖర్చును $500 కి పెంచండి. అతి చౌక threshold ఎడమ వైపుకి జరుగుతుంది, ఎందుకంటే ఇప్పుడు వదిలేయడం ఎక్కువ బాధిస్తుంది.']}
};

const TE_B={
prob:{title:'అవకాశం, ఆధారం, ఆశ్చర్యం',sub:'ML కోసం ప్రాబబిలిటీ, బేయస్, గణాంకాలు',hook:'మెషిన్ లెర్నింగ్ అంటే ఎక్కువగా అనిశ్చితిలో జాగ్రత్తగా ఆలోచించడం. కొత్త ఆధారం మన అభిప్రాయాన్ని ఎంత మార్చాలో బేయస్ నియమం చెబుతుంది.',
kid:`<p>100 మంది పిల్లల్లో ఒకరికి అరుదైన "తుమ్ము జబ్బు" ఉందనుకోండి. జబ్బు ఉన్న పిల్లవాడికి టెస్ట్ 10 సార్లలో 9 సార్లు "పాజిటివ్" అంటుంది. కానీ ఆరోగ్యంగా ఉన్న 10 మందిలో ఒకరికి కూడా తప్పుగా "పాజిటివ్" అంటుంది. మీ టెస్ట్ పాజిటివ్ వచ్చింది. మీరు ఎంత కంగారు పడాలి?</p>
<p>1000 మంది పిల్లలను ఊహించుకోండి. దాదాపు <b>10</b> మందికి జబ్బు ఉంది, వాళ్లలో 9 మందికి పాజిటివ్ వస్తుంది. ఆరోగ్యంగా ఉన్న <b>990</b> మందిలో 99 మందికి తప్పుగా పాజిటివ్ వస్తుంది. అంటే పాజిటివ్ వచ్చిన వాళ్లందరిలో (108) నిజంగా జబ్బు ఉన్నవాళ్లు 9 మందే. అది <b>10 లో ఒకరి</b> కంటే తక్కువ.</p>
<div class="callout"><b>ఆశ్చర్యం:</b> టెస్ట్ మంచిదైనంత మాత్రాన పాజిటివ్ ఫలితం బహుశా సరైనదని కాదు. మీరు వెతికే విషయం అరుదైనప్పుడు, చాలా అలారాలు తప్పుడు అలారాలే.</div>`,
look:'వెయ్యి మంది మనుషులు, చుక్కలుగా. ఎర్ర చుక్కలు జబ్బు ఉన్నవాళ్లు. పాజిటివ్ టెస్ట్ వచ్చిన వాళ్లకి వలయం ఉంటుంది. జబ్బు ఎంత సాధారణమో, టెస్ట్ ఎంత మంచిదో మార్చి, నిజంగా జబ్బు ఉండే అవకాశం ఎలా మారుతుందో చూడండి.',
tries:['సెట్టింగులను అలాగే వదిలేసి, అవకాశం చదవండి. ఆశ్చర్యకరంగా తక్కువగా ఉంటుంది.','జబ్బు ఎంత సాధారణమో పెంచండి. అప్పుడు పాజిటివ్ ఫలితానికి చాలా ఎక్కువ అర్థం ఉంటుంది.','<b>Test positive again</b> ని కొన్ని సార్లు నొక్కండి. ప్రతి కొత్త పాజిటివ్ ఇంకొంత ఆధారం కలుపుతుంది.','టెస్ట్ నాణ్యతను 99.9% వైపు పెంచి పోల్చండి.']},

feat:{title:'ఆధారాలను ఎంచుకోవడం, తీర్చిదిద్దడం',sub:'ఫీచర్ ఇంజనీరింగ్, స్కేలింగ్',hook:'మోడల్ మనం ఇచ్చిన ఆధారాల నుంచే నేర్చుకోగలదు. వాటిని ఎంచుకుని సిద్ధం చేయడం, తరచూ ఇంకా ఫ్యాన్సీ మోడల్ ఎంచుకోవడం కంటే ఎక్కువ విలువైనది.',
kid:`<p>ఒక కస్టమర్ సంతోషంగా ఉంటాడో లేదో ఊహించాలి అనుకోండి. వారి చెప్పుల సైజు చూడొచ్చు, లేదా సహాయం కోసం ఎంత సేపు ఎదురుచూశారో చూడొచ్చు. వీటిలో ఒకటి చాలా మంచి ఆధారం. ఆధారాలను ఎంచుకోవడం, తీర్చిదిద్దడాన్ని <b>ఫీచర్ ఇంజనీరింగ్</b> అంటారు.</p>
<p>తీర్చిదిద్దడం కూడా ముఖ్యమే. ఒక ఆధారం వేలల్లో కొలిస్తే (ఆదాయం), ఇంకోటి చిన్న సంఖ్యల్లో ఉంటే (వయసు తేడా), పెద్ద సంఖ్యలు చిన్నవాటిపై అరుస్తాయి. <b>స్కేలింగ్</b> ప్రతి ఆధారాన్ని ఒకే స్థాయికి తెస్తుంది, అప్పుడు ప్రతిదానికి న్యాయంగా మాట్లాడే అవకాశం వస్తుంది.</p>
<div class="callout"><b>మోసం చేసే ఆధారం జాగ్రత్త.</b> కొన్ని ఆధారాలు రహస్యంగా జవాబునే కలిగి ఉంటాయి. ఉదాహరణకు అసంతృప్త కస్టమర్లను ఊహిస్తున్నప్పుడు "refund issued" అనే కాలమ్. మోడల్ టెస్టింగ్‌లో అద్భుతంగా కనిపిస్తుంది, కానీ నిజ జీవితంలో పనికిరాదు. దీన్ని <b>లీకేజ్</b> (leakage) అంటారు.</div>`,
look:'ఆధారాలను ఆన్/ఆఫ్ చేయండి, స్కేలింగ్ ఎంచుకోండి, పక్కవాళ్లు ఓటు వేసే సరళ మోడల్ ఖచ్చితత్వాన్ని చూడండి. ఒక ఆధారం మోసగాడు: ఫలితం వచ్చాకే అది తెలుస్తుంది. ఇంకోటి కేవలం శబ్దం.',
tries:['ప్రతి ఆధారాన్ని ఒక్కొక్కటిగా ఆన్ చేసి, ప్రతిసారి accuracy చూడండి.','<b>noise</b> ఆధారాన్ని చేర్చండి. సహాయం చేస్తుందా? సాధారణంగా కొద్దిగా నష్టం చేస్తుంది, ఎందుకంటే పక్కవాళ్ల దృష్టి చెదురుతుంది.','స్కేలింగ్‌ని None నుంచి Standardise కి మార్చండి. పెద్ద సంఖ్యల ఆధారాలు చిన్నవాటిని ముంచేయడం ఆగిపోతుంది.','లీక్ చేసే <b>refund issued</b> ఆధారాన్ని ఆన్ చేయండి. accuracy దూకుతుంది, ఆ దూకుడు గెలుపు కాదు, హెచ్చరిక.']},

cv:{title:'నిష్పక్షపాతంగా, చాలా సార్లు పరీక్షించడం',sub:'క్రాస్-వాలిడేషన్, మోడల్ ఎంపిక',hook:'ఒక్క పరీక్ష అదృష్టం కొద్దీ మంచిగా లేదా చెడుగా రావచ్చు. వేర్వేరు ముక్కలపై పరీక్షిస్తే నమ్మదగిన స్కోర్ వస్తుంది.',
kid:`<p>ఒక్క స్పెల్లింగ్ పరీక్షలో మీకు తెలిసిన పదాలే రావచ్చు. న్యాయంగా అంచనా వేయాలంటే, వేర్వేరు పదాలతో చాలా పరీక్షలు రాసి మార్కుల సగటు తీస్తారు.</p>
<p><b>క్రాస్-వాలిడేషన్</b> మోడల్స్ కోసం ఇదే చేస్తుంది. డేటాని <b>ఫోల్డ్స్</b> అనే ముక్కలుగా విభజించండి. ఒక ఫోల్డ్ తప్ప మిగతావన్నిటిపై నేర్పించి, ఆ పక్కన పెట్టిన ఫోల్డ్‌పై పరీక్షించండి. ప్రతి ఫోల్డ్‌కి ఒకసారి ఇలా చేసి సగటు తీయండి. స్కోర్ ఎంత <i>ఊగుతోందో</i> కూడా కనిపిస్తుంది, అది దాన్ని ఎంత నమ్మాలో చెబుతుంది.</p>
<div class="callout"><b>చివరి పరీక్షను చూసి ఎంచుకోకండి.</b> సెట్టింగులను (ఎంతమంది పక్కవాళ్లను అడగాలి అనేవి) క్రాస్-వాలిడేషన్‌తో ఎంచుకోండి. ముట్టని టెస్ట్ సెట్‌ని చివరలో ఒక్కసారే వాడండి.</div>`,
look:'పక్కవాళ్లు ఓటు వేసే మోడల్‌కి k అనే సెట్టింగ్ ఉంది, అంటే ఎంతమంది ఓటు వేస్తారు. నీలం గీత ప్రతి k కి క్రాస్-వాలిడేషన్ స్కోర్. నారింజ గీత ఒక పెద్ద దాచిన టెస్ట్ సెట్, ఇది మీకు సాధారణంగా ఉండదు.',
tries:['<b>k</b> ని కదిపి క్రాస్-వాలిడేషన్ స్కోర్‌ని, దాని ఊగిసలాటని చదవండి.','<b>Shuffle the folds</b> నొక్కండి. నీలం గీత కొద్దిగా కదులుతుంది. ఆ ఊగిసలాట నిజమైన అనిశ్చితి.','ఫోల్డ్స్ సంఖ్యను పెంచండి. స్కోర్లు తక్కువ పక్షపాతంగా ఉంటాయి కానీ ఎక్కువ కంప్యూటింగ్ ఖర్చు అవుతుంది.','నీలం శిఖరాన్ని నారింజ శిఖరంతో పోల్చండి. అవి అరుదుగా సరిగ్గా సరిపోతాయి, కానీ దగ్గరగా ఉంటాయి.']},

reg:{title:'మోడల్స్‌ని వినయంగా ఉంచడం',sub:'రెగ్యులరైజేషన్: L1, L2',hook:'పెద్ద వెయిట్లపై జరిమానా, మోడల్ ఏదో ఒక ఆధారాన్ని అతిగా నమ్మకుండా ఆపుతుంది. ఒక రకం జరిమానా పనికిరాని ఆధారాలను పూర్తిగా ఆఫ్ కూడా చేయగలదు.',
kid:`<p>ఒక టీమ్‌లో ఒక్క గొంతు పెద్ద ఆటగాడే అన్ని నిర్ణయాలు తీసుకుంటే అది ప్రమాదం. మంచి కోచ్ ఇలా అంటాడు: <i>"పని పంచుకోండి, నిజంగా సంపాదించుకుంటేనే ఎవరైనా చాలా ముఖ్యం అవుతారు"</i>.</p>
<p><b>రెగ్యులరైజేషన్</b> ఆ కోచ్ లాంటిది. పెద్ద వెయిట్లకు చిన్న ఖర్చు కలుపుతాం. అప్పుడు మోడల్ <i>డేటాకి సరిపోవడం</i>, <i>సరళంగా ఉండడం</i> మధ్య సమతుల్యత చూసుకోవాలి.</p>
<p>రెండు ప్రసిద్ధ కోచ్‌లు ఉన్నారు. <b>L2</b> ప్రతి వెయిట్‌ని మెల్లగా సున్నా వైపు కుదిస్తుంది. <b>L1</b> ఇంకా కఠినం: బలహీన వెయిట్లను సరిగ్గా సున్నా వరకు నెట్టేయగలదు, అంటే ఆ ఆధారాలు పూర్తిగా తొలగిపోతాయి.</p>`,
look:'మ్యాప్ రెండు వెయిట్లను చూపిస్తుంది. నీలం వలయాలు ఎర్రర్: మధ్య బుల్స్‌ఐ అత్యుత్తమ సరిపోలిక. ఆకుపచ్చ ఆకారం జరిమానా నిర్ణయించిన అనుమతించిన ప్రాంతం. చుక్క ఆ రెండూ కలిసే చోటు. జరిమానా పెంచి అది జారడం చూడండి.',
tries:['జరిమానా 0 తో మొదలుపెట్టండి. చుక్క బుల్స్‌ఐ దగ్గర, అంటే అత్యుత్తమ సరిపోలిక వద్ద ఉంటుంది.','<b>L2</b> తో జరిమానా పెంచండి. రెండు వెయిట్లూ నునుపుగా కుంచించుకుంటాయి కానీ సున్నాను తాకవు.','<b>L1</b> కి మారి పెంచండి. బలహీన వెయిట్ ఒక్కసారిగా సరిగ్గా సున్నాకి అతుక్కుంటుంది.','కింది చార్ట్ చూడండి: L1 దారులు సున్నాకి పడి అక్కడే ఉంటాయి, L2 దారులు దాని దగ్గరకి మాత్రమే వెళ్తాయి.']},

svm:{title:'అతి వెడల్పైన రోడ్డు: సపోర్ట్ వెక్టర్ మెషిన్లు',sub:'మార్జిన్లు, కెర్నెల్స్',hook:'రెండు గుంపులను విడదీయడమే కాదు, వీలైనంత వెడల్పైన ఖాళీతో విడదీయండి.',
kid:`<p>ఆటస్థలంలో రెండు గుంపుల పిల్లలు నిలబడి ఉన్నారు, ఒక గుంపు ఎడమ వైపు, ఇంకోటి కుడి వైపు. వారిని విడదీయడానికి ఒక తాడు వేయాలి. చాలా తాళ్లు పనిచేస్తాయి. ఏది ఉత్తమం?</p>
<p><b>సపోర్ట్ వెక్టర్ మెషిన్ (SVM)</b> రెండు వైపులా <b>అతి వెడల్పైన ఖాళీ రోడ్డు</b> మిగిల్చే తాడును ఎంచుకుంటుంది. రోడ్డు వెడల్పుగా ఉంటే, ఒక పిల్లవాడు కొంచెం తూలినా సరైన వైపే పడతాడు. రోడ్డు అంచున నిలబడిన కొద్దిమంది పిల్లలే <b>సపోర్ట్ వెక్టర్లు</b>, ఎందుకంటే రోడ్డును నిలబెట్టేది వాళ్లే. మిగతా ఏ పిల్లవాడిని కదిపినా ఏమీ మారదు.</p>
<div class="callout"><b>సరళ తాడు పనిచేయకపోతే?</b> ఒక గుంపు ఇంకో గుంపు చుట్టూ వలయంగా నిలబడిందనుకోండి. ఏ సరళ తాడూ వారిని విడదీయదు. SVM చిట్కా: బొమ్మను ఒక ఎత్తైన దృశ్యంలోకి ఎత్తడం, అక్కడ ఒక చదునైన పలక వారిని <i>విడదీయగలదు</i>, తర్వాత మళ్లీ కిందికి చూడటం. ఎత్తిన బొమ్మ వంకర సరిహద్దు ఇస్తుంది. దీన్నే <b>కెర్నెల్ ట్రిక్</b> అంటారు.</div>`,
look:'నీలం, నారింజ చుక్కలు రెండు తరగతులు. నిండు చుక్కలు ప్రాక్టీస్ చుక్కలు, ఖాళీ చుక్కలు దాచిన టెస్ట్ చుక్కలు. వెనుక రంగు ప్రతి చోటికి బోల్ట్ ఊహ, అంచు దగ్గర లేతగా ఉంటుంది. చుట్టూ వలయం ఉన్న చుక్కలు సపోర్ట్ వెక్టర్లు.',
tries:['<b>Two blobs</b> ని <b>Straight line</b> తో ఉంచండి. ఎన్ని చుక్కలకే వలయాలు ఉన్నాయో గమనించండి. గీతను నిర్ణయించేవి అవే.','<b>how strict about mistakes (C)</b> ని తక్కువకి, ఎక్కువకి కదపండి. తక్కువ అయితే వెడల్పైన, క్షమించే రోడ్డు. ఎక్కువ అయితే ప్రతి తప్పుకు శిక్ష, రోడ్డు కుంచించుకుపోతుంది.','సరళ గీతతో <b>Rings</b> కి మారండి. అది ఊహించడం కంటే బాగా చేయలేదు.','<b>Curvy (RBF kernel)</b> ఎంచుకోండి. gamma ని చిన్నదాని నుంచి పెద్దదానికి మార్చి చూడండి. చాలా పెద్ద gamma ప్రతి చుక్క చుట్టూ చిన్న ద్వీపాలు గీస్తుంది: అది బట్టీ పట్టేస్తోంది.']},

boost:{title:'ఒకరి తప్పులను ఒకరు సరిదిద్దే టీమ్‌లు',sub:'బూస్టింగ్, గ్రేడియంట్ బూస్టింగ్',hook:'బలహీనమైన ఊహతో మొదలుపెట్టి, ఇంకా తప్పుగా ఉన్నదాన్ని సరిచేసే చిన్న సహాయకులను ఒక్కొక్కటిగా చేర్చండి.',
kid:`<p>ఒక గ్రూప్ ప్రాజెక్ట్ ఊహించుకోండి. మొదటి పిల్లవాడు చాలా కఠినమైన స్కెచ్ గీస్తాడు. రెండో పిల్లవాడు ఆ స్కెచ్ చూసి పెద్ద తప్పులను మాత్రమే సరిచేస్తాడు. మూడో పిల్లవాడు <i>ఇంకా</i> తప్పుగా ఉన్నదాన్ని సరిచేస్తాడు. వరుసలో అందించుకుంటూ వెళ్తే, డజన్ల చిన్న సవరణల తర్వాత బొమ్మ అద్భుతంగా తయారవుతుంది.</p>
<p>ఇదే <b>బూస్టింగ్</b>. ప్రతి సహాయకుడు చాలా సరళమైన మోడల్ (కింద <b>స్టంప్</b>: "ఇక్కడికి ఎడమ వైపైతే ఈ జవాబు, కుడి వైపైతే ఆ జవాబు" అనే ఒక్క కోత). ఒక్క స్టంప్ తెలివి తక్కువది. కానీ వందల స్టంప్‌లు, ప్రతిదీ మిగిలిన తప్పులపై నేర్చుకుంటూ, చాలా మంచి వంపును గీయగలవు.</p>
<div class="callout"><b>రాండమ్ ఫారెస్ట్‌తో పోల్చండి.</b> ఫారెస్ట్ చాలా చెట్లను ఒకే సమయంలో అడిగి సగటు తీస్తుంది. బూస్టింగ్ వాటిని ఒక్కొక్కటిగా అడుగుతుంది, ప్రతి చెట్టు టీమ్ ఇప్పటి వరకు తప్పు చేసిన దానిపై దృష్టి పెడుతుంది.</div>`,
look:'నల్ల చుక్కలు ట్రైనింగ్ డేటా, చుక్కల గీత వాటి వెనుక ఉన్న అసలు నమూనా. నీలం గీత సహాయకుల టీమ్ ఊహ. కింది చార్ట్ ప్రతి టీమ్ సైజుకి ప్రాక్టీస్ ఎర్రర్ (నీలం), చూడని డేటాపై టెస్ట్ ఎర్రర్ (నారింజ) చూపిస్తుంది.',
tries:['<b>0 rounds</b> వద్ద మొదలుపెట్టండి: ఊహ సగటు వద్ద ఒక చదునైన గీత. స్లైడర్‌ని 5 వరకు లాగండి. ఒక్కొక్క సహాయకుడు గీతను వంచుతాడు.','<b>Show mistakes</b> ఆన్ చేయండి. ఎర్ర గీతలు సరిచేయాల్సినవి. రౌండ్లు చేర్చే కొద్దీ అవి కుంచించుకుపోవడం చూడండి.','ఉత్తమ స్థానం దాటి రౌండ్లు చేర్చుతూ ఉండండి. ప్రాక్టీస్ ఎర్రర్ తగ్గుతూనే ఉంటుంది కానీ టెస్ట్ ఎర్రర్ తిరిగి పెరుగుతుంది. అదే ఓవర్‌ఫిట్టింగ్.','<b>learning rate</b> ని 0.1 కి తగ్గించండి. ప్రతి సహాయకుడి ప్రభావం తగ్గుతుంది, కాబట్టి ఎక్కువ మంది కావాలి, కానీ ఫలితం తరచూ నునుపుగా ఉంటుంది.']},

pca:{title:'కథను కోల్పోకుండా డేటాను కుదించడం',sub:'PCA, డైమెన్షనాలిటీ రిడక్షన్',hook:'గందరగోళంగా ఉన్న సంఖ్యల మేఘంలో ఎక్కువ సమాచారం ఉండే కొన్ని దిశలను కనుక్కోండి.',
kid:`<p>ఒక పెన్సిల్‌కి టార్చ్ వెలుగు వేసి దాని నీడను చూడండి. పెన్సిల్ వెలుగుకి అడ్డంగా ఉంటే నీడ పొడవుగా ఉండి చాలా చెబుతుంది. పెన్సిల్ నేరుగా టార్చ్ వైపు చూపిస్తే నీడ ఒక చిన్న చుక్క, అది పెన్సిల్ అని కూడా తెలియదు.</p>
<p>డేటా ఆ పెన్సిల్ లాంటిది. నిజమైన డేటాలో డజన్ల లేదా వేల కాలమ్‌లు ఉండొచ్చు, కానీ ఆసక్తికరమైన వైవిధ్యం చాలా వరకు కొన్ని దిశల్లోనే ఉంటుంది. <b>ప్రిన్సిపల్ కాంపోనెంట్ అనాలిసిస్ (PCA)</b> నీడలు <b>అతి పొడవుగా</b> ఉండే దిశను కనుక్కుంటుంది, అది ఎక్కువ సమాచారం ఉంచుతుంది, తర్వాత ఆ తర్వాతి మంచి దిశ, ఇలా. అప్పుడు పై కొన్నింటిని ఉంచి మిగతావి వదిలేయొచ్చు.</p>
<div class="callout"><b>ఇదంతా ఎందుకు?</b> తక్కువ సంఖ్యలు అంటే వేగమైన మోడల్స్, తక్కువ స్టోరేజ్, తక్కువ శబ్దం, నిజంగా గీయగలిగే బొమ్మలు. 100 కాలమ్‌ల టేబుల్‌ని ప్లాట్ చేయలేము, కానీ దాని మొదటి రెండు ప్రిన్సిపల్ కాంపోనెంట్లను చేయగలం.</div>`,
look:'నీలం చుక్కలు అసలు డేటా. నల్ల గీత మీరు ఎంచుకున్న దిశ. నారింజ చుక్కలు ఆ గీతపై నీలం చుక్కల నీడలు, ఎర్ర భాగాలు ప్రతి నీడ ఎంత కోల్పోతుందో చూపిస్తాయి. కింద వంపు ప్రతి కోణానికి ఎంత సమాచారం మిగులుతుందో చూపిస్తుంది.',
tries:['గీతను తప్పు వైపు చూపిస్తూ మొదలుపెట్టండి (120 డిగ్రీలు ప్రయత్నించండి). చాలా పొడవైన ఎర్ర భాగాలు అంటే నీడలు చాలా కోల్పోతున్నాయి.','మెల్లగా కోణాన్ని తిప్పండి. మిగిలిన సమాచారం సంఖ్య పెరగడం, తగ్గడం గమనించండి.','<b>Let PCA find it</b> నొక్కండి. గీత మేఘం పొడవు దిశకి తగిలి కూర్చుంటుంది. ఇదే మొదటి ప్రిన్సిపల్ కాంపోనెంట్.','<b>New cloud of dots</b> నొక్కి, బటన్ నొక్కే ముందు చేతితో ఉత్తమ కోణాన్ని మళ్లీ కనుక్కోండి.']},

anom:{title:'తేడాగా ఉండేదాన్ని పట్టుకోవడం',sub:'అనామలీ డిటెక్షన్',hook:'మోసం, చెడిపోయిన యంత్రాలు, సైబర్ దాడులు అరుదు. అవి ఎలా ఉంటాయో నేర్చుకునే బదులు, మామూలు ఎలా ఉంటుందో నేర్చుకుని, దానికి దూరంగా ఉన్నదాన్ని ఫ్లాగ్ చేయండి.',
kid:`<p>క్లాస్ ఫొటోలో అందరూ చక్కగా వరుసల్లో నిలబడ్డారు, కానీ ఒక పిల్లవాడు పైకప్పు మీద నిలబడ్డాడు. పైకప్పుల గురించి మీకు ఏ నియమాలూ తెలియాల్సిన పని లేదు. అతను కేవలం <b>మిగతావారికి చాలా దూరంగా</b> ఉన్నాడు అంతే.</p>
<p>ఇదే <b>అనామలీ డిటెక్షన్</b>. చెడ్డ సందర్భాలు చాలా అరుదుగా, రకరకాలుగా ఉంటాయి కాబట్టి, సాధారణ క్లాసిఫైయర్‌కి నేర్పేందుకు సరిపడా ఉదాహరణలు సేకరించలేము. అందుకే ఇది ఉపయోగకరం.</p>
<div class="callout"><b>తప్పు చేసే రెండు మార్గాలు.</b> ఎక్కువ ఫ్లాగ్ చేస్తే ప్రజలకు చిరాకు కలిగించే తప్పుడు అలారాలు వస్తాయి. తక్కువ ఫ్లాగ్ చేస్తే నిజమైన సమస్యలను వదిలేస్తాం. ప్రెసిషన్, రీకాల్ (లెవల్ 10) ఏది జరుగుతోందో చెబుతాయి.</div>`,
look:'మేఘం మామూలు ప్రవర్తన. నిజమైన తేడా ఉన్నవాటికి మీరు చెక్ చేసినప్పుడు మాత్రమే వలయం కనిపిస్తుంది. ఒక పద్ధతి ఎంచుకుని, ఎంత శాతం బిందువులను ఫ్లాగ్ చేయాలో నిర్ణయించండి.',
tries:['<b>per-feature z-score</b> వాడండి. ఇది ప్రతి అక్షాన్ని విడిగా చూస్తుంది, అక్షాల మధ్య "ఖాళీ" స్థలంలో ఉండే తేడా బిందువులను వదిలేస్తుంది.','<b>Mahalanobis distance</b> కి మారండి. మేఘం వాలుగా ఉందని అది తెలుసుకుంటుంది.','<b>Isolation forest</b> ప్రయత్నించండి. ఇది అక్షాల వెంట యాదృచ్ఛికంగా కోతలు వేస్తుంది, కాబట్టి ఈ వాలు మేఘంపై Mahalanobis కంటే తక్కువ బాగా చేస్తుంది. ప్రతి పద్ధతికి గుడ్డి మచ్చలు ఉంటాయి.','ఫ్లాగ్ శాతాన్ని మార్చండి. ఎక్కువ ఫ్లాగ్‌లు ఎక్కువ తేడా బిందువులను పట్టుకుంటాయి కానీ precision తగ్గిస్తాయి.']},

ts:{title:'కాలంలో తర్వాత ఏమి వస్తుందో ఊహించడం',sub:'టైమ్ సిరీస్, ఫోర్కాస్టింగ్',hook:'అమ్మకాలు, వాతావరణం, ట్రాఫిక్‌కి ధోరణులు, రుతువులు ఉంటాయి. మంచి ఫోర్కాస్ట్ వాటిని వాడి, భవిష్యత్తుపైనే పరీక్షించబడుతుంది.',
kid:`<p>ఐస్‌క్రీమ్ ప్రతి వేసవిలో ఎక్కువ అమ్ముడవుతుంది, ఏటా కొద్దిగా పెరుగుతుంది. <b>ధోరణి</b> (సంవత్సరాలుగా పెరగడం), <b>రుతువు</b> (ప్రతి వేసవిలో శిఖరం) రెండూ తెలిస్తే, వచ్చే జూలై గురించి చాలా బాగా ఊహించవచ్చు.</p>
<p>ఫోర్కాస్టింగ్‌కి ఒకే కఠిన నియమం ఉంది: <b>భవిష్యత్తులోకి తొంగి చూడొద్దు</b>. గతం నుంచి నేర్చుకుని, తర్వాత వచ్చే దానిపై పరీక్షించబడతారు. అందుకే టైమ్-సిరీస్ డేటాని ఫ్లాష్ కార్డుల లాగా కలపలేము.</p>
<div class="callout"><b>సోమరి ఊహను ఎప్పుడూ దాటండి.</b> అతి సరళమైన ఫోర్కాస్ట్ "గత సంవత్సరం లాగే". ఒక ఫ్యాన్సీ మోడల్ దాన్ని దాటలేకపోతే, దాన్ని వాడే విలువ లేదు.</div>`,
look:'గీత నెలవారీ అమ్మకాలు. మోడల్ మొదటి పదేళ్ల నుంచి నేర్చుకుని చివరి రెండేళ్లను ఊహిస్తుంది. మొదట సరళమైన పద్ధతులు ప్రయత్నించి, తర్వాత ధోరణి, రుతువు నేర్చుకునేవి ప్రయత్నించండి.',
tries:['<b>Same as last month</b> ఎంచుకోండి. సులువే, కానీ సంవత్సర తరంగాన్ని వదిలేస్తుంది.','<b>Same as last year</b> ఎంచుకోండి. ఇదే రుతు ఆధారిత బేస్‌లైన్, దాన్ని దాటాలి.','<b>Moving average</b> ప్రయత్నించి దాని విండోని మార్చండి. ఇది నునుపు చేస్తుంది కానీ ధోరణి కంటే వెనకబడుతుంది.','<b>Smoothing with trend and season</b> ప్రయత్నించి స్లైడర్లను సరిచేయండి.']},

nn:{title:'చిన్న నిర్ణేతల టీమ్',sub:'న్యూరల్ నెట్‌వర్క్స్',hook:'చాలా సరళమైన యూనిట్లను పేర్చండి, ఏ సరళ రేఖ నేర్చుకోలేని ఆకారాలనూ అవి నేర్చుకోగలవు.',
kid:`<p>చిన్న పనివాళ్ల పెద్ద టీమ్ ఊహించుకోండి. ప్రతి ఒక్కరూ చాలా సులువైన ఒక పని చేస్తారు: కొందరు స్నేహితుల మాట వింటారు, ప్రతి ఒక్కరిని ఎంత నమ్మాలో నిర్ణయిస్తారు, విన్నదంతా కూడుతారు, మొత్తం సరిపడా పెద్దగా ఉంటే సందేశాన్ని ముందుకు పంపుతారు. ఆ పనివాడే <b>న్యూరాన్</b>.</p>
<p>ఒక్క పనివాడు పెద్ద తెలివైనవాడు కాదు. కానీ వాళ్లను వరుసల్లో పెట్టండి, ప్రతి వరుస ముందు వరుస మాట వింటుంది, అప్పుడు అద్భుతం జరుగుతుంది. మొదటి వరుస సరళమైన విషయాలు గమనిస్తుంది. తర్వాతి వరుస వాటిని పెద్ద విషయాలుగా కలుపుతుంది. చివరి వరుస వచ్చేసరికి టీమ్ ఒక వలయాన్ని, స్పైరల్‌ని, ఒక ముఖాన్ని కూడా గుర్తుపట్టగలదు.</p>
<div class="callout"><b>అది ఎలా నేర్చుకుంటుంది.</b> మొదట పనివాళ్లు యాదృచ్ఛికంగా ఒకరినొకరు నమ్ముతారు, కాబట్టి జవాబులు చెడ్డవి. ప్రతి తప్పు జవాబు తర్వాత, నెట్‌వర్క్ ఏ కనెక్షన్లు పరిస్థితిని చెడగొట్టాయో లెక్కించి, వాటిని కొంచెం సర్దుతుంది. ఈ బాధ్యత పంచే అడుగే <b>బ్యాక్‌ప్రాపగేషన్</b>. వేల సార్లు చేస్తే టీమ్ బాగా నేర్చుకుంటుంది.</div>
<p>డెమోలో <b>Spiral</b> ఎంచుకోండి. సరళ రేఖ దాన్ని విడదీయలేదు, కానీ నెట్‌వర్క్ ఆ చుట్టను నేర్చుకోగలదు.</p>`,
look:'ప్రతి చుక్క ఒక ట్రైనింగ్ ఉదాహరణ (నిండు) లేదా పక్కన పెట్టిన టెస్ట్ ఉదాహరణ (ఖాళీ). వెనుక రంగు ప్రతి చోట నెట్‌వర్క్ ఏం ఊహిస్తోందో చూపిస్తుంది. Play నొక్కి, రెండు తరగతులను వేరు చేయడానికి సరిహద్దు వంగడం చూడండి.',
tries:['<b>Circle</b> ఎంచుకుని Play నొక్కండి. సరళ రేఖ దీన్ని ఎప్పటికీ విడదీయలేదు, కానీ నెట్‌వర్క్ సెకన్లలో వలయాన్ని నేర్చుకుంటుంది.','న్యూరాన్లను 2 కి, లేయర్లను 1 కి పెట్టి, reset చేసి Circle పై నేర్పండి. 8 న్యూరాన్లతో పోల్చండి. సామర్థ్యం ముఖ్యం.','<b>XOR</b> ప్రయత్నించండి, ఒక్క గీత పరిష్కరించలేని క్లాసిక్ సమస్య.','<b>Spiral</b> ప్రయత్నించండి. దీనికి ఎక్కువ న్యూరాన్లు లేదా లేయర్లు, ఎక్కువ epochs కావాలి. కేవలం ట్రైనింగ్ accuracy కాదు, టెస్ట్ accuracy చూడండి.','లెర్నింగ్ రేట్‌ని 0.1 కి పెంచి లాస్ ఎలా ఎగురుతుందో చూడండి. 0.005 కి తగ్గిస్తే అది ఎలా పాకుతుందో చూడండి.']}
};

const TE_C={
cnn:{title:'కంప్యూటర్లు ఎలా చూస్తాయి',sub:'కన్వల్యూషన్స్, ఇమేజ్‌ల కోసం డీప్ లెర్నింగ్',hook:'ఒక బొమ్మ అంటే సంఖ్యల గ్రిడ్ మాత్రమే. జారుతూ వెళ్లే ఫిల్టర్ దానిలోని నమూనాలను కనుక్కుంటుంది.',
kid:`<p>మీరు ఫొటో చూసినప్పుడు పిల్లి కనిపిస్తుంది. కంప్యూటర్‌కి కనిపించేది సంఖ్యల పెద్ద గ్రిడ్, ప్రతి చిన్న చుక్కకీ ఒక వెలుగు సంఖ్య. ఆ చుక్కలను <b>పిక్సెల్స్</b> అంటారు. సంఖ్యలు "పిల్లి" ఎలా అవుతాయి?</p>
<p>కేవలం 3 చుక్కల వెడల్పు ఉన్న ఒక చిన్న భూతద్దం బొమ్మ మీద జారుతూ వెళ్తుందనుకోండి. ప్రతి చోట అది ఒక సులువైన ప్రశ్న అడుగుతుంది, ఉదాహరణకు "ఇక్కడ పైకి కిందికి వెళ్లే అంచు ఉందా?" జవాబులు ఒక కొత్త బొమ్మను చేస్తాయి, నమూనా ఎక్కడ ఉంటే అక్కడ అది మెరుస్తుంది. ఈ జారే భూతద్దాన్ని <b>ఫిల్టర్</b> అంటారు, జారడాన్ని <b>కన్వల్యూషన్</b> అంటారు.</p>
<div class="callout"><b>ఫిల్టర్లను పేర్చడం.</b> మొదటి లేయర్ అంచులను కనుక్కుంటుంది. తర్వాతి లేయర్ అంచులను మూలలు, వంపులుగా కలుపుతుంది. ఆ తర్వాతది వంపులను కళ్లు, చెవులుగా కలుపుతుంది. కొన్ని లేయర్ల తర్వాత నెట్‌వర్క్ "పిల్లి" అనగలదు. ఫిల్టర్లను ఎవరూ చేతితో రాయరు. నెట్‌వర్క్ వాటిని <i>నేర్చుకుంటుంది</i>.</div>
<p>డెమోలో ఏదైనా గీయండి, ఒక ఫిల్టర్ ఎంచుకోండి, ఏ భాగాలు మెరుస్తాయో చూడండి.</p>`,
look:'ఎడమ గ్రిడ్ మీ బొమ్మ (గీయడానికి నొక్కండి లేదా లాగండి). కుడి గ్రిడ్ ఫిల్టర్ జవాబు. నారింజ అంటే ఫిల్టర్ తన నమూనాను కనుగొంది, నీలం అంటే వ్యతిరేక నమూనా, ఖాళీ అంటే అక్కడ ఏమీ లేదు. బొమ్మ కింద ఉన్న 3 x 3 సంఖ్యలే ఫిల్టర్.',
tries:['<b>Box</b> నొక్కి <b>Horizontal edges</b> ఎంచుకోండి. పైన, కింద మాత్రమే మెరుస్తాయి.','<b>Vertical edges</b> ఎంచుకోండి. ఇప్పుడు ఎడమ, కుడి వైపులు మెరుస్తాయి.','ప్రతి అంచును వెలిగించడానికి <b>Outline</b>, బొమ్మను నునుపు చేయడానికి <b>Blur</b> ఎంచుకోండి.','<b>Clear</b> నొక్కి, మీ సొంత అక్షరం గీసి, దానిపై ప్రతి ఫిల్టర్ ప్రయత్నించండి.','<b>Watch the filter scan</b> నొక్కి, 3 x 3 కిటికీ ఒక్కో చోటు చొప్పున జారడం చూడండి.']},

rec:{title:'మీకు నచ్చే సినిమాలు',sub:'సిఫార్సు వ్యవస్థలు',hook:'మీ లాంటి అభిరుచి ఉన్నవాళ్లను కనుక్కుని, వాళ్ల అభిప్రాయాలను అప్పు తీసుకోండి.',
kid:`<p>మీకు అంతరిక్షం సినిమాలు ఇష్టం, వంట షోలు అస్సలు ఇష్టం లేదు. అదే అభిరుచి ఉన్న ఒక స్నేహితుడు, "నువ్వు <i>Mars Kids</i> తప్పకుండా చూడాలి!" అంటాడు. గతంలో మీకు నచ్చినవే అతనికీ నచ్చాయి కాబట్టి మీరు అతన్ని నమ్ముతారు.</p>
<p><b>సిఫార్సు వ్యవస్థ</b> లక్షల మందికి ఇదే చేస్తుంది. ఎవరు దేనికి రేటింగ్ ఇచ్చారో చూసి, మీ రేటింగ్‌ల లాంటి రేటింగ్‌లు ఉన్న వాళ్లను కనుక్కుని, మీరు ఇంకా చూడని, వాళ్లకి నచ్చిన వాటిని సూచిస్తుంది. దీన్ని <b>collaborative filtering</b> అంటారు: ప్రజలు తెలియకుండానే కలిసి పనిచేస్తారు.</p>
<div class="callout"><b>కోల్డ్ స్టార్ట్.</b> మీరు కొత్తవారై, ఏమీ రేట్ చేయకపోతే? సిస్టమ్‌కి మీ గురించి ఏమీ తెలియదు. దీన్ని <b>cold-start సమస్య</b> అంటారు. కింద ప్రయత్నించండి: రేటింగ్‌లు లేకపోతే బోల్ట్ ఏమీ చెప్పలేదు.</div>`,
look:'ప్రతి అడ్డు వరుస ఒక మనిషి, ప్రతి నిలువు వరుస ఒక సినిమా. సంఖ్యలు 1 నుంచి 5 వరకు రేటింగ్‌లు. ఖాళీ అంటే చూడలేదు. అడుగున ఉన్న వరుస మీది: రేట్ చేయడానికి గడిని నొక్కండి. మీలాగే రేటింగ్‌లు ఎక్కువ తక్కువగా ఇచ్చే వాళ్లను బోల్ట్ కనుక్కుని, మీరు ఇంకా రేట్ చేయని, వాళ్లకి నచ్చిన సినిమాల జాబితా ఇస్తుంది.',
tries:['<b>Robot Pals</b> కి 5, <b>Bake Off</b> కి 1 ఇవ్వండి. రెండు రేటింగ్‌లతోనే మీ మొగ్గు బోల్ట్‌కి కనిపిస్తుంది.','<b>Star Trip</b> కి 5, <b>Pizza Quest</b> కి 1 ఇవ్వండి. పై సూచన ఒక అంతరిక్షం సినిమా అయి ఉండాలి.','<b>Clear my ratings</b> నొక్కి, తిప్పి చూడండి: వంట ఇష్టం, అంతరిక్షం ఇష్టం లేదు. జాబితా కూడా తిరుగుతుంది.','neighbours ని 1 కి పెట్టండి. ఇప్పుడు ఒక్క మనిషే అన్నీ నిర్ణయిస్తాడు. 6 కి పెడితే అందరికీ మాట ఉంటుంది, మీలా లేని వాళ్లకి కూడా.']},

rl:{title:'ప్రయత్నించి నేర్చుకోవడం',sub:'రీఇన్‌ఫోర్స్‌మెంట్ లెర్నింగ్',hook:'జవాబుల పుస్తకం లేదు, బహుమతులు మాత్రమే. నిధికి దారి తీసే ఎత్తులను బోల్ట్ నేర్చుకుంటుంది.',
kid:`<p>కుక్కపిల్లకి "కూర్చో" అని ఎలా నేర్పిస్తారు? మీరు దానికి మాన్యువల్ ఇవ్వరు. అది కూర్చున్నప్పుడు ట్రీట్ ఇస్తారు. వేరేది చేస్తే ట్రీట్ ఇవ్వరు. సరిపడా ప్రయత్నాల తర్వాత ఏది ట్రీట్ తెచ్చిపెడుతుందో అది తెలుసుకుంటుంది.</p>
<p>వీడియో గేమ్స్ కూడా ఇలాగే. సరైన ఎత్తు ఏదో ఎవరూ చెప్పరు. మీరు ప్రయత్నిస్తారు, స్కోర్ పెరుగుతుంది లేదా తగ్గుతుంది, నెమ్మదిగా నైపుణ్యం వస్తుంది. <b>రీఇన్‌ఫోర్స్‌మెంట్ లెర్నింగ్</b> కంప్యూటర్‌కి ఇది చేయనిస్తుంది. నేర్చుకునేవాడిని <b>ఏజెంట్</b> అంటారు, అది ఉండే చోటు <b>environment</b>, పాయింట్లు <b>rewards</b>.</p>
<div class="callout"><b>కొత్తవి ప్రయత్నించాలా, పనిచేసేదాన్నే పట్టుకోవాలా?</b> మీరు ఎప్పుడూ మీ ఇష్టమైన వంటకమే ఆర్డర్ చేస్తే, మంచిదాన్ని ఎప్పటికీ కనుక్కోకపోవచ్చు. ఎప్పుడూ కొత్త వంటకాలే ప్రయత్నిస్తే, చెడ్డవి దొరుకుతూ ఉండొచ్చు. ఏజెంట్ <b>అన్వేషించడం</b> (exploring), <b>వాడుకోవడం</b> (exploiting) మధ్య సమతుల్యత చూసుకోవాలి. డెమోలో ఇది "curiosity" స్లైడర్.</div>
<p>డెమోలో బోల్ట్ కింది ఎడమ మూల నుంచి బంగారు నక్షత్రం వరకు నడవాలి. ప్రతి కదలికకి 1 పాయింట్ ఖర్చు, నక్షత్రం 20 ఇస్తుంది, ముదురు గుంతలు 20 తీసేస్తాయి. బోల్ట్‌కి మొదట ఏమీ తెలియదు.</p>`,
look:'బోల్ట్ నీలం ముఖం. బంగారు నక్షత్రం నిధి, ముదురు వృత్తాలు గుంతలు. సాధన తర్వాత ప్రతి గడిలో నీలం బాణాలు కనిపిస్తాయి. ఒక బాణం అక్కడి నుంచి ఇప్పుడు బోల్ట్ ఉత్తమమని అనుకునే కదలికను చూపిస్తుంది, ప్రకాశవంతమైన బాణాలు అంటే బోల్ట్‌కి ఎక్కువ నమ్మకం.',
tries:['<b>Practice 1 round</b> ని కొన్ని సార్లు నొక్కండి. బోల్ట్ తిరుగుతుంది, బహుమతులు లేదా శిక్షలు వచ్చిన చోట్ల మొదటి బాణాలు కనిపిస్తాయి.','<b>Practice 200 rounds</b> నొక్కి, తర్వాత <b>Watch Bolt go</b> నొక్కండి. అది నక్షత్రం వైపు వెళ్తూ గుంతలను తప్పించుకోవాలి.','curiosity ని 0% కి పెట్టి, <b>Forget everything</b> నొక్కి, సాధన చేయండి. కొత్తవి ప్రయత్నించకపోతే బోల్ట్ నక్షత్రాన్ని ఎప్పటికీ కనుక్కోకపోవచ్చు.','curiosity ని 90% కి పెట్టండి. బోల్ట్ యాదృచ్ఛికంగా కదులుతూనే ఉంటుంది, కాబట్టి నేర్చుకోవడం గందరగోళంగా ఉంటుంది.']},

ops:{title:'రోబోట్లను న్యాయంగా, తాజాగా ఉంచడం',sub:'బాధ్యతాయుతమైన ML, MLOps',hook:'నిజమైన మోడల్స్‌కి లాంచ్ తర్వాత కూడా జాగ్రత్త కావాలి: అవి ప్రజలను న్యాయంగా చూడాలి, కాలానికి తగ్గట్టు ఉండాలి.',
kid:`<p>తెలివైన రోబోట్‌ని తయారు చేయడం మొదలు మాత్రమే. ఆ తర్వాత రెండు వాగ్దానాలు ముఖ్యం.</p>
<p><b>న్యాయంగా ఉండండి.</b> రోబోట్ ఉదాహరణల నుంచి నేర్చుకుంటుంది. ఆ ఉదాహరణల్లో కొన్ని రకాల వ్యక్తులు లేకపోయినా, లేదా చెడుగా చూపించినా, రోబోట్ వారిని అలాగే చూస్తుంది. స్వరాలను ఎక్కువగా పెద్దవాళ్ల నుంచి నేర్చుకున్న రోబోట్‌ని ఊహించండి. అది పిల్లల మాటను తప్పుగా వినొచ్చు. ఎవరూ హాని చేయాలనుకోలేదు, కానీ ఫలితం అన్యాయం. అందుకే అందరిపై కలిపి కాకుండా, ప్రతి గుంపుపై రోబోట్‌ని పరీక్షిస్తాం.</p>
<p><b>తాజాగా ఉండండి.</b> పాలు చెడిపోతాయి. మోడల్స్ కూడా చెడిపోతాయి, ఎందుకంటే ప్రపంచం మారుతూనే ఉంటుంది: కొత్త యాస, కొత్త గాడ్జెట్లు, కొత్త మోసాలు. గత సంవత్సరం నేర్పిన మోడల్ ఈ రోజు పాతబడి ఉండొచ్చు. అందుకే టీమ్‌లు స్కోర్‌ని గమనిస్తూ ఉంటాయి, అది జారినప్పుడు <b>మళ్లీ నేర్పిస్తాయి</b> (retrain).</p>
<div class="callout"><b>మంచి ML టీమ్ లాంచ్ ముందు నాలుగు ప్రశ్నలు అడుగుతుంది.</b> డేటా న్యాయంగా ఉందా? ఎవరైనా జవాబులను వివరించగలరా? ప్రైవేట్ సమాచారం భద్రంగా ఉందా? మోడల్ నడుస్తున్నప్పుడు ఎవరు తనిఖీ చేస్తారు?</div>
<p>డెమోలో ప్రపంచం ప్రతి నెలా కొంచెం మారుతూ ఉంటుంది. accuracy ఎర్ర గీతకి పైన ఉండేలా retrain చేయడం ఎప్పుడు చేయాలో ఎంచుకోండి.</p>`,
look:'పై చార్ట్ ఈ రోజు కస్టమర్లను చూపిస్తుంది, చుక్కల గీత మోడల్ "అవును"ని "కాదు" నుంచి వేరు చేసే చోటు. కింది చార్ట్ ప్రతి నెల accuracy చూపిస్తుంది. ఆకుపచ్చ త్రిభుజాలు మీరు మోడల్‌కి మళ్లీ నేర్పించిన నెలలు. ఎర్ర చుక్కల గీత అలారం స్థాయి.',
tries:['retrain లేకుండా <b>Month</b> ని 0 నుంచి 24 కి లాగండి. నీలం, నారింజ కొండలు కుడి వైపుకి జారతాయి, కానీ చుక్కల గీత అక్కడే ఉంటుంది. accuracy పడిపోతుంది.','accuracy ఎర్ర అలారం గీతకి దగ్గరగా ఉన్న నెలకి వెళ్లి <b>Retrain Bolt this month</b> నొక్కండి. చుక్కల గీత కొత్త మధ్యకి దూకుతుంది.','ప్రపంచాన్ని "slowly" కి తగ్గించండి. తక్కువ retrain లు చాలు.','"fast" కి పెంచండి. ఇప్పుడు తరచుగా retrain చేయాలి, అందుకే టీమ్‌లు ఆటోమేటిక్‌గా గమనిస్తాయి.']},

deploy:{title:'నోట్‌బుక్ నుంచి నిజమైన ప్రొడక్ట్ వరకు',sub:'డిప్లాయ్‌మెంట్, సర్వింగ్, మానిటరింగ్',hook:'నోట్‌బుక్‌లో పనిచేసే మోడల్ మొదలు మాత్రమే. నిజమైన వినియోగదారులకు అది వేగంగా, చౌకగా, నమ్మదగినదిగా, గమనించబడేదిగా ఉండాలి.',
kid:`<p>ఒక మంచి పిజ్జా రెసిపీ అంటే పిజ్జా రెస్టారెంట్ కాదు. రెస్టారెంట్‌కి ఓవెన్లు (సర్వర్లు), ఒకేసారి చాలా పిజ్జాలు వండే పద్ధతి (బ్యాచింగ్), లంచ్ రష్‌కి సరిపడా సిబ్బంది, పిజ్జాలు బాగుంటున్నాయో చూసే ఒకరు కావాలి.</p>
<p>మోడల్‌ను <b>డిప్లాయ్</b> చేయడం కూడా ఇలాగే. జనం అభ్యర్థనలు పంపుతారు, ప్రతిదానికి త్వరగా జవాబు కావాలి. చాలా వాటిని కలిపి వండితే చౌక, కానీ ప్రతి ఒక్కరూ కొంచెం ఎక్కువ సేపు ఎదురుచూడాలి. ఎక్కువ సర్వర్లు ఎక్కువ డబ్బు ఖర్చు. చిన్న మోడల్ (లెవల్ 39) వేగంగా, చౌకగా ఉంటుంది.</p>`,
look:'బార్లు జవాబులు ఎంత వేగంగా వస్తున్నాయో (latency), సర్వర్లు ఎంత బిజీగా ఉన్నాయో, ఎంత తట్టుకోగలవో, ఎంత ఖర్చవుతుందో చూపిస్తాయి. చుక్కల గీత మీరు వినియోగదారులకు వాగ్దానం చేసిన వేగ పరిమితి.',
tries:['సర్వర్లు ఓవర్‌లోడ్ అయ్యే వరకు ట్రాఫిక్ పెంచండి.','బ్యాచ్ సైజు పెంచండి. సామర్థ్యం పెరుగుతుంది, కానీ ఎదురుచూసే సమయం కూడా పెరుగుతుంది.','బిజీ మీటర్ తగ్గే వరకు సర్వర్లను చేర్చండి. ఖర్చును గమనించండి.','quantised మోడల్‌కి మారి వేగం, ఖర్చు రెండూ మెరుగవడం చూడండి.']},

fair:{title:'న్యాయమైన నిర్ణయాలు, మోడల్స్‌ని వివరించడం',sub:'ఫెయిర్‌నెస్, బయాస్, ఎక్స్‌ప్లెయినబిలిటీ',hook:'ఒక మోడల్ మొత్తంగా ఖచ్చితంగా ఉన్నా, కొందరిని ఇంకా దారుణంగా చూడొచ్చు. దాన్ని కొలవడం, దాని గురించి ఏం చేయాలో నిర్ణయించడం నేర్చుకోండి.',
kid:`<p>ఒక బ్యాంక్ ఎవరికి లోన్ ఇవ్వాలో నిర్ణయించడానికి రోబోట్‌ని వాడుతోందనుకోండి. రోబోట్ ప్రతి మనిషికి ఒక స్కోర్ ఇస్తుంది. కటాఫ్ గీత పైన ఉన్న అందరికీ "అవును". అందరికీ ఒకే గీత కాబట్టి ఇది న్యాయంగా అనిపిస్తుంది.</p>
<p>కానీ దగ్గరగా చూడండి. గతంలో ఒక గుంపుకి తక్కువ అవకాశాలు ఉన్న కాలం నుంచి డేటా వచ్చి ఉంటే, లోన్ అంతే నమ్మకంగా తిరిగి చెల్లించే వాళ్లకి కూడా వారి స్కోర్లు తక్కువగా ఉంటాయి. అప్పుడు అదే కటాఫ్ గీత ఆ గుంపులోని ఎక్కువ మంది మంచి వాళ్లకి నిశ్శబ్దంగా "కాదు" అంటుంది.</p>
<p>న్యాయం ఒక్క మాయా సంఖ్య కాదు. అది వేర్వేరు ప్రశ్నల సమూహం, వాటన్నిటికీ ఒకేసారి జవాబు ఇవ్వడం ఎప్పుడూ సాధ్యం కాదు. కింది బొమ్మలో మీరు కటాఫ్‌లు పెట్టి ఏం మారుతుందో చూడండి.</p>`,
look:'రెండు ప్యానెళ్లు రెండు గుంపుల మనుషులను చూపిస్తాయి. నారింజ కొండలు తిరిగి చెల్లించే వాళ్లు, నీలం కొండలు చెల్లించని వాళ్లు. నల్ల గీత కటాఫ్: దాని కుడివైపు స్కోర్లు ఆమోదం పొందుతాయి. టైల్స్ ప్రతి గుంపులో ఎందరికి ఆమోదం వచ్చిందో, నిజంగా చెల్లించే వాళ్లలో ఎందరికి వచ్చిందో, మొత్తం మీద ఎన్ని నిర్ణయాలు సరైనవో చూపిస్తాయి.',
tries:['<b>One cut-off for everyone</b> ని ఆన్‌లో ఉంచి స్లైడర్ కదపండి. రెండు "good applicants approved" టైల్స్‌ని పోల్చండి. ఒక గుంపు ఎప్పుడూ తక్కువగా ఉంటుంది.','ఒకే కటాఫ్‌ని ఆఫ్ చేయండి. ఇప్పుడు Group B కటాఫ్‌ని కొద్దిగా తగ్గించి, దాని మంచి దరఖాస్తుదారులు పెరగడం చూడండి.','A, B కి "approved" టైల్స్ చూడండి. మంచి దరఖాస్తుదారులను సమం చేసినా, మొత్తం ఆమోద శాతాలు ఇంకా వేరుగానే ఉన్నాయి. ఎందుకు?','Group B కటాఫ్‌ని మరీ తక్కువకి నెట్టండి. తిరిగి చెల్లించని B వాళ్లు ఎక్కువమంది ఆమోదం పొందుతారు, మొత్తం సరైన శాతం తగ్గుతుంది.']},

info:{title:'ఆశ్చర్యాన్ని కొలవడం',sub:'ఎంట్రోపీ, క్రాస్-ఎంట్రోపీ, KL డైవర్జెన్స్',hook:'ఇన్ఫర్మేషన్ థియరీ ప్రపంచం ఎంత ఆశ్చర్యకరమో చెప్పే ఒక సంఖ్య ఇస్తుంది, తప్పు ఊహకి ఎంత ఖర్చో చెప్పే ఇంకో సంఖ్య ఇస్తుంది. చాలా క్లాసిఫికేషన్ లాస్‌ల వెనుక ఉన్న గణితం ఇదే.',
kid:`<p>నేను "ఈ రోజు సూర్యుడు ఉదయించాడు" అని చెబితే మీకు దాదాపు ఏమీ తెలియదు. "ఎడారిలో మంచు కురిసింది" అని చెబితే చాలా తెలుస్తుంది. <b>ఆశ్చర్యం</b> అంటే ఏదైనా ఎంత అసంభవమో. అరుదైన విషయాలు ఎక్కువ సమాచారాన్ని మోస్తాయి.</p>
<p><b>ఎంట్రోపీ</b> అంటే ఒక మూలం యొక్క సగటు ఆశ్చర్యం. న్యాయమైన నాణెం అత్యంత ఆశ్చర్యకరమైన రకం నాణెం. ఎప్పుడూ బొమ్మే పడే నాణేనికి ఆశ్చర్యం సున్నా.</p>
<p>ఇప్పుడు మీరు అవకాశాలను తప్పుగా ఊహించారనుకోండి. మీరు ఉండాల్సిన దానికంటే ఎక్కువ ఆశ్చర్యపోతారు. ఆ అదనపు ఆశ్చర్యమే మీ తప్పు నమ్మకాలకు చెల్లించే వెల, మోడల్‌కి నేర్పడం అంటే ఆ వెలను తగ్గించడం.</p>`,
look:'లేత బార్లు నాలుగు రకాల వాతావరణం యొక్క నిజమైన అవకాశాలు. గాఢమైన బార్లు నాలుగు స్కోర్ స్లైడర్లతో చేసిన మోడల్ ఊహ. సంఖ్యలు ఆశ్చర్యాన్ని బిట్లలో చూపిస్తాయి.',
tries:['<b>All equal</b> నొక్కండి. మోడల్‌కి ఏమీ తెలియదు, కాబట్టి బిట్లు వృథా చేస్తుంది.','<b>Confidently wrong</b> నొక్కండి. వృథా బిట్లు ఎగసిపోతాయి. నమ్మకంగా తప్పుగా ఉండటం ఖరీదైనది.','ఒక్కో స్లైడర్‌ని, దాని బార్ లేత బార్‌తో సరిపోయే వరకు కదపండి.','క్రాస్-ఎంట్రోపీ ఎప్పుడూ నిజమైన దాని ఎంట్రోపీ కంటే కిందికి వెళ్లదని గమనించండి.']},

opt:{title:'కిందికి దొర్లడానికి తెలివైన మార్గాలు',sub:'ఆప్టిమైజర్లు: మొమెంటం, RMSprop, Adam',hook:'సాధారణ గ్రేడియంట్ డిసెంట్ సన్నని లోయల్లో అటూ ఇటూ జిగ్-జాగ్ అవుతుంది. మంచి ఆప్టిమైజర్లు ఏ వైపు వెళ్తున్నాయో గుర్తుంచుకుని, ప్రతి దిశకి తమ అడుగును సర్దుకుంటాయి.',
kid:`<p>పొడవైన, సన్నని లోయలో ఒక బంతి దొర్లుతున్నట్టు ఊహించండి. గోడలు నిటారుగా ఉన్నాయి, నేల దాదాపు చదునుగా ఉంది. సాధారణ అడుగులు గోడ నుంచి గోడకి ఎగురుతాయి, నేల వెంట దాదాపు కదలవు.</p>
<p>తెలివైన బంతికి <b>మొమెంటం</b> ఉంటుంది: అది తన వేగంలో కొంత ఉంచుకుంటుంది, కాబట్టి పక్కపక్కకి ఎగరడం రద్దవుతుంది, ముందుకు కదలిక పెరుగుతుంది. <b>RMSprop</b>, <b>Adam</b> లాంటి ఇతర పద్ధతులు ప్రతి దిశకి దాని సొంత అడుగు సైజు కూడా ఇస్తాయి: నిటారుగా ఉన్న చోట చిన్నది, చదునుగా ఉన్న చోట పెద్దది.</p>`,
look:'ప్రారంభ స్థానం ఎంచుకోవడానికి మ్యాప్‌ని నొక్కండి. ఒక ఆప్టిమైజర్ ఎంచుకుని Play నొక్కండి. ముదురు రంగు అంటే తక్కువ లాస్. ఆకుపచ్చ X అతి తక్కువ చోటు.',
tries:['పొడవైన లోయపై <b>plain gradient descent</b> నడపండి. అది ఎగరడం మొదలయ్యే వరకు learning rate పెంచండి.','<b>Momentum</b> కి మారండి. అది నేల వెంట చాలా వేగంగా దొర్లుతుంది.','<b>RMSprop</b>, <b>Adam</b> ప్రయత్నించండి. ఎక్కువ ట్యూనింగ్ లేకుండా అవి అడుగు సైజులను సర్దుకుంటాయి.','<b>banana valley</b> కి మారి, వేర్వేరు ప్రారంభ స్థానాలను నొక్కండి.']},

bp:{title:'నెట్‌వర్క్ తన తప్పుల నుంచి ఎలా నేర్చుకుంటుంది',sub:'బ్యాక్‌ప్రాపగేషన్',hook:'బ్యాక్‌ప్రాపగేషన్ నెట్‌వర్క్ వెనుక వైపుకి నిందను అందిస్తుంది, తద్వారా ప్రతి వెయిట్ ఎలా మారాలో నేర్చుకుంటుంది. ఇది chain rule ని జాగ్రత్తగా వాడటం.',
kid:`<p>రిలే టీమ్ రేసు ఓడిపోయింది. ఎవరు నెమ్మదిగా ఉన్నారు? మీరు ముగింపు గీత నుంచి వెనక్కి పని చేస్తారు: చివరి రన్నర్ కొంచెం నెమ్మది, కానీ మూడో రన్నర్ బ్యాటన్ సరిగా అందించలేదు, అదే తర్వాత అంతా నెమ్మదించడానికి కారణం.</p>
<p>నెట్‌వర్క్ సంఖ్యలను లేయర్ల గుండా <b>ముందుకు</b> పంపి జవాబు ఇస్తుంది. జవాబు తప్పైతే, <b>నిందను వెనక్కి</b> పంపుతాం. ప్రతి వెయిట్ ఎర్రర్‌కి తాను ఎంత కారణమయ్యిందో తెలుసుకుని, సహాయపడే దిశలో తనను తాను కొంచెం సర్దుకుంటుంది.</p>
<div class="callout"><b>ఇది పనిచేస్తుందనడానికి రుజువు.</b> డెమో ఒక వెయిట్‌ని చాలా కొద్దిగా కదిపి, ఎర్రర్‌లో మార్పును కొలిచి తన నిందను పరీక్షిస్తుంది. రెండు సంఖ్యలూ సరిపోతాయి.</div>`,
look:'ఒక చిన్న నెట్‌వర్క్ XOR ని నేర్చుకుంటుంది, ఏ సరళ రేఖా విడదీయలేని నమూనా. టేబుల్ ఒక ఉదాహరణ ముందుకు కదలడం, నింద వెనక్కి కదలడం చూపిస్తుంది. పరిశీలించడానికి ఒక మూలను ఎంచుకోండి.',
tries:['<b>One step</b> ని కొన్ని సార్లు నొక్కి లాస్, రంగులు కదలడం చూడండి.','వేరే మూలను (A నుంచి D) ఎంచుకుని నింద సంఖ్యలను పోల్చండి.','<b>Play</b> నొక్కి, వెనుక రంగు మూలలను విడదీసే ఆకారంలోకి వంగడం చూడండి.','ఇరుక్కుపోతే <b>New random start</b> నొక్కండి.']},

rnn:{title:'వరుసలో గుర్తుంచుకోవడం',sub:'రికరెంట్ నెట్‌వర్క్స్, LSTM, వానిషింగ్ గ్రేడియంట్స్',hook:'అటెన్షన్ రాకముందు, నెట్‌వర్క్‌లు టెక్స్ట్‌ని ఒక్కో పదంగా చదివి జ్ఞాపకాన్ని ముందుకు తీసుకెళ్లేవి. ఆ జ్ఞాపకం మసకబారడానికి కారణాన్ని మీరు లెక్కించవచ్చు.',
kid:`<p>పిల్లల వరుసలో ఒక సందేశాన్ని గుసగుసగా అందించండి. చివరికి అది మెల్లగా, గందరగోళంగా అవుతుంది. ప్రతి ఒక్కరూ దానిలో కొంచెం తక్కువ అందిస్తారు.</p>
<p><b>రికరెంట్ నెట్‌వర్క్</b> ఒక్కో పదం చదివి, ఒక జ్ఞాపకాన్ని తర్వాతి అడుగుకి ఇస్తుంది. మనం దానికి నేర్పినప్పుడు, నింద ప్రతి అడుగు గుండా వెనక్కి ప్రయాణిస్తుంది, ప్రతి అడుగులో ఒక సంఖ్యతో గుణించబడుతుంది. 0.8 తో ముప్పై సార్లు గుణిస్తే దాదాపు ఏమీ మిగలదు.</p>
<p><b>గేటెడ్</b> సెల్ (LSTM లాంటిది) మార్చడానికి మంచి కారణం ఉంటే తప్ప, జ్ఞాపకాన్ని దాదాపు మార్చకుండా, 1 కి దగ్గరి కారకంతో, పట్టుకోవడం నేర్చుకుంటుంది.</p>`,
look:'చార్ట్ log స్కేల్‌లో గీయబడింది: ప్రతి గ్రిడ్ గీత పైన ఉన్న దానికంటే పదింతలు చిన్నది. ఎర్ర గీత సాధారణ సెల్, ఆకుపచ్చ గీత గేటెడ్ సెల్. నిలువు గీత సీక్వెన్స్ పొడవును సూచిస్తుంది.',
tries:['సాధారణ కారకాన్ని 0.8 వద్ద ఉంచి T ని కదపండి. గ్రేడియంట్ కుప్పకూలుతుంది.','కారకాన్ని 1 పైకి పెంచండి. ఇప్పుడు బదులుగా అది <b>పేలిపోతుంది</b>.','గేటెడ్ సెల్ forget gate ని 0.99 కి కదిపి జ్ఞాపకం బతికి ఉండటం చూడండి.','సాధారణ సెల్‌కి 1.0 దగ్గర కత్తి అంచు లాంటి కారకాన్ని కనుక్కోండి.']}
};

const TE_D={
embed:{title:'పదాలను మ్యాప్ మీద చుక్కలుగా మార్చడం',sub:'ఎంబెడ్డింగ్స్',hook:'కంప్యూటర్లకు సంఖ్యలు ఇష్టం, అందుకే ప్రతి పదానికి మ్యాప్ మీద ఒక చోటు ఇస్తాం. ఒకేలా ఉండే పదాలు దగ్గర దగ్గరగా ఉంటాయి.',
kid:`<p>"puppy", "dog" ఒకదానితో ఒకటి సంబంధం ఉన్నవని కంప్యూటర్ చూడలేదు. దానికి అవి వేర్వేరు అక్షరాల వరుసలు మాత్రమే. అందుకే ప్రతి పదానికి మ్యాప్ మీద ఒక చిరునామా ఇస్తాం. ఒకే అర్థం ఉన్న పదాలకు దగ్గర దగ్గర చిరునామాలు వస్తాయి: "cat" పక్కన "kitten" ఉంటుంది, "volcano" నుంచి దూరంగా.</p>
<p>చాలా సంఖ్యలతో చేసిన చిరునామాను <b>ఎంబెడ్డింగ్</b> లేదా <b>వెక్టర్</b> అంటారు. మన మ్యాప్‌లో ప్రతి పదానికి రెండే సంఖ్యలు, అందుకే మీరు చూడగలరు. నిజమైన ఎంబెడ్డింగ్స్‌లో వందల లేదా వేల సంఖ్యలు ఉంటాయి.</p>
<p>సరదా విషయం: మంచి మ్యాప్‌లో <i>దిశలకు అర్థం ఉంటుంది</i>. "cat" నుంచి "kitten" కి అడుగు (పెద్దది నుంచి పిల్ల), "dog" నుంచి "puppy" కి అడుగుతో సమానం. అందుకే <b>dog + (kitten - cat)</b> puppy దగ్గర వస్తుంది.</p>
<div class="callout"><b>నిజాయితీ మాట.</b> ఈ మ్యాప్ ఆలోచన సులువుగా కనిపించేలా చేతితో గీసినది. నిజమైన ఎంబెడ్డింగ్స్ చాలా పెద్ద టెక్స్ట్ కుప్పల నుంచి నేర్చుకుంటారు, వాటి దిశలు ఇంకా గజిబిజిగా ఉంటాయి. ప్రసిద్ధ "king - man + woman = queen" దాదాపుగా పనిచేస్తుంది, పూర్తిగా కాదు.</div>`,
look:'ప్రతి చుక్క ఒక పదం. A, B, C ఎంచుకోండి. నీలం బాణం A నుంచి B కి వెళ్తుంది. చుక్కల నారింజ బాణం అదే కదలిక C నుంచి మొదలవుతుంది. ఆకుపచ్చ చుక్క అది చేరిన చోటికి అతి దగ్గరి పదం, అదే యంత్రం జవాబు. ఏ పదాన్నైనా నొక్కి దాని దగ్గరి స్నేహితులను చూడండి.',
tries:['<b>man : king = woman : ?</b> ప్రీసెట్ నొక్కండి. యంత్రం queen అని జవాబిస్తుంది.','<b>france : paris = italy : ?</b> ప్రీసెట్ నొక్కండి. దేశం నుంచి రాజధాని ఇంకో దిశ.','<b>lion</b>, <b>cub</b> లాంటి పదాలను నొక్కి, కుడివైపు టైల్‌లో వాటి దగ్గరి స్నేహితులను చూడండి.','కావాలని పాడు చేయండి: <b>man : paris = woman : ?</b> ప్రయత్నించండి. అర్థం లేని ప్రశ్నలకు అర్థం లేని జవాబులు వస్తాయి, అయినా యంత్రం జవాబు ఇస్తుంది.']},

attn:{title:'శ్రద్ధ పెట్టడం: చాట్‌బాట్లు ఎలా చదువుతాయి',sub:'అటెన్షన్, ట్రాన్స్‌ఫార్మర్లు',hook:'ప్రతి పదం మిగతా పదాల్లో దేన్ని చూడాలో నిర్ణయించుకుంటుంది, ఇలాగే మోడల్ వాక్యం అర్థాన్ని తెలుసుకుంటుంది.',
kid:`<p>ఈ వాక్యం చదవండి: <i>"The cat chased the mouse because <b>it</b> was hungry."</i> ఎవరికి ఆకలి? పిల్లికే అని మీకు తెలుసు. ఇప్పుడు చివర మార్చండి: <i>"...because <b>it</b> was scared."</i> ఇప్పుడు "it" అంటే ఎలుక. "it" అనే పదం మారలేదు. మీ కళ్లు వేరే పదం వైపు వెనక్కి చూశాయి అంతే.</p>
<p><b>ట్రాన్స్‌ఫార్మర్</b>, నేటి చాట్ అసిస్టెంట్ల వెనుక ఉన్న డిజైన్, సరిగ్గా ఇదే చేస్తుంది. ప్రతి పదం మిగతా ప్రతి పదాన్ని చూసి, ప్రతిదానిపై <b>ఎంత శ్రద్ధ</b> పెట్టాలో నిర్ణయిస్తుంది. "it" లాంటి సందర్భం కావాల్సిన పదం, అది చూపే పదం నుంచి అర్థాన్ని అప్పు తీసుకోగలదు.</p>
<div class="callout"><b>ఒక్క తల కంటే చాలా తలలు మేలు.</b> మోడల్ ఒకేసారి చాలా అటెన్షన్ "తలలు" నడుపుతుంది. ఒక తల పక్క పదాలను చూడొచ్చు, ఇంకోటి సర్వనామాలను నామవాచకాలతో కలపొచ్చు, మరొకటి క్రియలను వాటి కర్మలతో కలపొచ్చు. వాటి కనుగొన్నవి కలుపుతారు.</div>`,
look:'ఏ పదం అడుగుతోందో ఎంచుకోండి. బార్లు దాని శ్రద్ధ మొత్తం వాక్యంలో ఎలా పంచబడిందో చూపిస్తాయి. అవి ఎప్పుడూ 100% కి కూడుతాయి. వేరే రకం చూపు కోసం head ని మార్చండి. ఇక్కడ అటెన్షన్ సంఖ్యలు ఆలోచన చూపడానికి చేతితో పెట్టినవి. నేర్పిన మోడల్‌లో అవి నేర్చుకోబడతాయి.',
tries:['<b>Head 1: next-door words</b> తో వేర్వేరు పదాలను నొక్కండి. ఈ తల ఎక్కువగా ఒక పదం వెనక్కి చూస్తుంది.','<b>Head 2: meaning</b> కి మారి <b>chased</b> నొక్కండి. ఇప్పుడది పిల్లిని, ఎలుకను చూస్తుంది: ఎవరు తరిమారు, ఎవరిని తరిమారు.','meaning head లో <b>it</b> నొక్కండి. తర్వాత చివరి పదాన్ని hungry నుంచి scared కి మార్చి, శ్రద్ధ జంతువుల మధ్య మారడం చూడండి.','<b>Focus</b> స్లైడర్ కదపండి. తక్కువ focus శ్రద్ధను పలుచగా, మసకగా పంచుతుంది. ఎక్కువ focus ఒక ఇష్టమైన దాన్ని ఎంచుకుంటుంది.']},

llm:{title:'ప్రపంచంలో అతి పెద్ద ఆటోకంప్లీట్',sub:'లాంగ్వేజ్ మోడల్స్, ట్రాన్స్‌ఫార్మర్లు',hook:'చాట్ అసిస్టెంట్లు తర్వాతి చిన్న టెక్స్ట్ ముక్కను మళ్లీ మళ్లీ ఊహిస్తూ పనిచేస్తాయి.',
kid:`<p>మీ ఫోన్‌లో సందేశం టైప్ చేస్తున్నప్పుడు, అది తర్వాతి పదాన్ని సూచిస్తుంది. "see you" తర్వాత "soon" అని చూపిస్తుంది. ఇది ఒక చిన్న <b>లాంగ్వేజ్ మోడల్</b>: అది చాలా టెక్స్ట్ చూసి, ఏ పదాల తర్వాత ఏ పదాలు వస్తాయో నేర్చుకుంది.</p>
<p>పెద్ద లాంగ్వేజ్ మోడల్ అదే ఆలోచన, భారీగా పెరిగింది. అది విపరీతమైన టెక్స్ట్ చదివింది, దాని నెట్‌వర్క్ చివరి పదాన్ని మాత్రమే కాక, మొత్తం వాక్యాన్ని, అంశాన్ని, శైలిని గమనించేంత పెద్దది. ప్రశ్నకు జవాబు ఇవ్వడానికి అది ఒక్కో చిన్న ముక్క రాస్తుంది, ప్రతిసారీ "తర్వాత అత్యంత సరైన ముక్క ఏది?" అని అడుగుతుంది.</p>
<div class="callout"><b>ఏ పదాలు ముఖ్యమో అది ఎలా తెలుసుకుంటుంది?</b> "The cat chased the mouse because <i>it</i> was hungry." చదవండి. "it" అంటే ఏమిటి? మీరు "cat" వైపు వెనక్కి చూస్తారు. ట్రాన్స్‌ఫార్మర్ దీన్ని <b>అటెన్షన్</b> తో చేస్తుంది: ప్రతి పదం మిగతా పదాలన్నిటినీ చూసి, ఏవి గమనించాలో నిర్ణయిస్తుంది.</div>
<p>గుర్తుంచుకోండి, మోడల్ ఎక్కువ అవకాశం ఉన్న టెక్స్ట్‌ని ఊహిస్తుంది. అది పుస్తకంలో నిజాలు వెతకడం లేదు, కాబట్టి నమ్మకంగా మాట్లాడుతూనే తప్పుగా ఉండొచ్చు. ముఖ్యమైన జవాబులను ఎప్పుడూ సరిచూసుకోండి.</p>
<p>డెమోలో బోల్ట్ కేవలం 12 చిన్న వాక్యాలు చదివింది, కాబట్టి అది రోబోట్లు, పిల్లులు, కుక్కల గురించి మాత్రమే రాయగలదు. నిజమైన మోడల్స్ అదే సూత్రంతో, చాలా ఎక్కువ చదివి పనిచేస్తాయి.</p>`,
look:'పెద్ద టెక్స్ట్ బోల్ట్ రాస్తున్న కథ. బార్లు, చివరి రెండు పదాల ఆధారంగా మాత్రమే, తర్వాత రావచ్చని బోల్ట్ అనుకునే పదాలను, ప్రతిదాని అవకాశాన్ని చూపుతాయి. ఆ పదాన్ని ఎంచుకోవడానికి ఒక బార్‌ని నొక్కండి, లేదా బోల్ట్‌నే ఎంచుకోనివ్వండి.',
tries:['<b>Let Bolt pick a word</b> ని కొన్ని సార్లు నొక్కండి. ప్రతి పదం తర్వాత బార్లు ఎలా మారుతున్నాయో చూడండి.','<b>Creativity</b> ని "wild" కి జరిపి <b>Let Bolt finish</b> ని కొన్ని సార్లు నొక్కండి. కథలు విచిత్రంగా అవుతాయి.','Creativity ని "careful" కి జరపండి. ఇప్పుడు బోల్ట్ దాదాపు ఎప్పుడూ అత్యంత సంభావ్య పదాన్ని ఎంచుకుంటుంది, కాబట్టి కథలు పునరావృతమవుతాయి.','నియంత్రణ మీ చేతిలోకి తీసుకోండి: పదాలను మీరే ఎంచుకుని, బోల్ట్ ఎప్పుడూ చదవని వాక్యం రాయడానికి ప్రయత్నించండి.']},

rag:{title:'చాట్ అసిస్టెంట్లకు ఒక నోట్‌బుక్ ఇవ్వడం',sub:'రిట్రీవల్, RAG, ప్రాంప్ట్‌లు',hook:'చాట్ అసిస్టెంట్‌కి మీ స్కూల్, మీ కంపెనీ, నిన్నటి వార్తలు తెలియవు. అందుకే మొదట వెతకనిస్తాం.',
kid:`<p>ఒక పెద్ద గ్రంథాలయం చదివిన, కానీ కొంతకాలం క్రితం చదవడం ఆపేసిన చాలా తెలివైన స్నేహితుడిని ఊహించండి. గత వారం గురించి, లేదా మీ సొంత స్కూల్ గురించి అడిగితే అతను ఊహించవచ్చు, కొన్నిసార్లు నమ్మకంగా చెబుతూ తప్పు చెప్పవచ్చు. ఆ తప్పును <b>హాల్యూసినేషన్</b> అంటారు.</p>
<p>పరిష్కారం సులువు. జవాబు ఇచ్చే ముందు, మీ స్నేహితుడు నమ్మదగిన నోట్స్ ఉన్న <b>నోట్‌బుక్ తిరగేసి</b>, సరైన పేజీలను ఎంచుకుని, చదివి, ఆ పేజీల నుంచి జవాబు ఇస్తాడు. దీన్నే <b>రిట్రీవల్-ఆగ్మెంటెడ్ జనరేషన్</b>, లేదా <b>RAG</b> అంటారు.</p>
<p>సరైన పేజీని కనుక్కోవడమే తెలివైన పని. "What time do we build bots?" అని అడిగి, నోట్‌బుక్‌లో "The <i>robot</i> club meets..." అని ఉంటే, పదాలు సరిపోలవు. ఎంబెడ్డింగ్స్ వాడి <b>అర్థం</b> ఆధారంగా సరిపోల్చడం దీన్ని పరిష్కరిస్తుంది.</p>`,
look:'కార్డులు నోట్‌బుక్. ఒక ప్రశ్న టైప్ చేయండి లేదా బటన్ నొక్కండి. నోట్స్ ఎంత బాగా సరిపోయాయో బట్టి ర్యాంక్ చేయబడతాయి, ఉత్తమమైనవి హైలైట్ అవుతాయి. అడుగున ఉన్న బాక్స్ బోల్ట్ నిజంగా ఏం చదువుతుందో చూపిస్తుంది: ఎంచుకున్న నోట్స్ మీ ప్రశ్న ముందు అతికించబడతాయి. ఖచ్చితమైన పదాల సరిపోలిక, అర్థం సరిపోలిక మధ్య మారవచ్చు. ఇక్కడ అర్థం మోడ్ నిజమైన ఎంబెడ్డింగ్స్‌కి బదులు ఒక చిన్న చేతితో చేసిన పదాల జాబితాను వాడుతుంది.',
tries:['<b>When does the robot club meet?</b> నొక్కి, ఖచ్చితమైన పదాలతో దొరికిన నోట్స్ గమనించండి.','exact-word మోడ్‌లో <b>What time do we build bots?</b> నొక్కండి. ఏదీ సరిపోలదు, ఎందుకంటే ప్రశ్నకు, నోట్‌కి ఒక్క పదం కూడా ఉమ్మడి కాదు.','<b>Meaning</b> కి మారండి. robot club నోట్ పైకి దూకుతుంది.','<b>Can I borrow books?</b> అడిగి <b>k</b> ని 3 కి పెంచండి. ఎక్కువ నోట్స్ అంటే జవాబు చేర్చే అవకాశాలు ఎక్కువ, చదవాల్సిన చెత్త కూడా ఎక్కువ.']},

tfm:{title:'ఒక ట్రాన్స్‌ఫార్మర్, అడుగడుగునా',sub:'ఒక చిన్న ట్రాన్స్‌ఫార్మర్‌ను మొదటి నుంచి నిర్మించడం',hook:'భాగాలను విడదీయండి: ఎంబెడ్డింగ్స్, స్థాన సంకేతం, స్కోర్లు, మాస్క్, సాఫ్ట్‌మాక్స్. లాంగ్వేజ్ మోడల్ అంటే ఇవే మళ్లీ మళ్లీ.',
kid:`<p>పదాలు ఇతర పదాలను చూస్తాయని ఇంతకు ముందు చూశారు. ఇప్పుడు పెట్టె తెరిచి సంఖ్యలను అనుసరిద్దాం. ప్రతి పదం ఒక చిన్న బాణం (వెక్టర్). ఒకే వైపు చూపే రెండు పదాలకు ఎక్కువ స్కోర్ వస్తుంది: అవి సరిపోతాయి.</p>
<p>స్కోర్లు శాతాలుగా మారతాయి. టెక్స్ట్ రాసే మోడల్‌కి ఒక ముఖ్యమైన నియమం ఉంది: తర్వాతి పదాన్ని ఊహిస్తున్నప్పుడు <b>ముందుకి తొంగి చూడకూడదు</b>. <b>మాస్క్</b> భవిష్యత్తును దాస్తుంది, పేజీలో మిగతా భాగాన్ని మీ చేతితో కప్పినట్టు.</p>
<p>పదం స్థానం కూడా ముఖ్యం, ఎందుకంటే "dog bites man", "man bites dog" ఒకే పదాలు వాడతాయి. అందుకే ప్రతి పదానికి ఒక చిన్న <b>స్థాన సంకేతం</b> కలుపుతాం.</p>`,
look:'గ్రిడ్ ప్రతి పదం (అడ్డు వరుస) తన శ్రద్ధను పదాలపై (నిలువు వరుసలు) ఎలా పంచుతుందో చూపిస్తుంది. ఒక పదాన్ని ఎంచుకుని స్లైడర్లతో దాని బాణాన్ని కదపండి. మాస్క్, స్థాన సంకేతాన్ని ఆన్/ఆఫ్ చేయండి.',
tries:['మాస్క్ ఆన్‌లో ఉండగా మొదటి వరుస చూడండి. మొదటి పదం తనను తాను మాత్రమే చూడగలదు.','ఒక పదాన్ని ఎంచుకుని కదపండి. దాని వరుస, ఇతర వరుసలు మారడం చూడండి.','మాస్క్ ఆఫ్ చేయండి. ఇప్పుడు ప్రతి పదం భవిష్యత్తును కూడా చూస్తుంది.','స్థాన సంకేతాన్ని కలపండి. అవే పదాలు ఇప్పుడు ఎక్కడ ఉన్నాయో బట్టి వేరే స్కోర్ పొందుతాయి.']},

agent:{title:'టూల్స్ వాడే అసిస్టెంట్లు',sub:'ఏజెంట్లు, టూల్ వాడకం, నమ్మకం',hook:'ఏజెంట్ అంటే ప్లాన్ చేసి, టూల్స్‌ని పిలిచి, ఫలితాలను చూడగల లాంగ్వేజ్ మోడల్. దాని అతి పెద్ద సవాలు: చిన్న తప్పులు గుణించుకోవడం.',
kid:`<p>కేవలం మాట్లాడే చాట్ అసిస్టెంట్ లెక్కల్లో, నిజాల్లో తప్పు చేయవచ్చు. <b>ఏజెంట్</b> టూల్స్ కూడా వాడగలదు: కూడికల కోసం కాలిక్యులేటర్, నిజాల కోసం సెర్చ్, జ్ఞాపకం కోసం నోట్‌బుక్. అది ప్లాన్ చేస్తుంది, ఒక టూల్ వాడుతుంది, తిరిగి వచ్చినదాన్ని చదువుతుంది, తర్వాత ఏం చేయాలో నిర్ణయిస్తుంది.</p>
<p>ఇక్కడ చిక్కు ఏమిటంటే, నాలుగు అడుగుల పని ఊహించండి, ప్రతి అడుగు 90% సార్లు పనిచేస్తుంది. నాలుగూ పనిచేసేది దాదాపు 66% సార్లు మాత్రమే (0.9 × 0.9 × 0.9 × 0.9). పొడవైన గొలుసుల్లో చిన్న తప్పులు కూడుకుపోతాయి.</p>`,
look:'నాలుగు అడుగుల పని: ఒక నిజం వెతకడం, కొంత లెక్క చేయడం, ఇంకో నిజం వెతకడం, ఇంకొంత లెక్క చేయడం. టూల్స్, చెకింగ్‌ని ఆన్/ఆఫ్ చేసి, మొత్తం పని ఎంత తరచుగా సరిగ్గా వస్తుందో చూడండి.',
tries:['టూల్స్ లేకుండా మొదలుపెట్టండి. నాలుగు అడుగులూ సరిగ్గా రావడానికి అవకాశం తక్కువ.','<b>Calculator</b> ఆన్ చేయండి. లెక్కల అడుగులు నమ్మదగినవి అవుతాయి.','<b>Search</b> ఆన్ చేయండి. నిజాల అడుగులు కూడా నమ్మదగినవి అవుతాయి.','<b>Check each result</b> ఆన్ చేయండి. అది కొన్ని పొరపాట్లను పట్టుకుంటుంది కానీ అదనపు అడుగులు ఖర్చవుతాయి.']},

gen:{title:'గందరగోళం నుంచి కొత్త బొమ్మలు తయారు చేయడం',sub:'జనరేటివ్ మోడల్స్, డిఫ్యూజన్',hook:'కొత్తదాన్ని గీయడానికి, మోడల్ స్వచ్ఛమైన గరగర (static) తో మొదలుపెట్టి, కొంచెం కొంచెంగా శుభ్రం చేస్తుంది.',
kid:`<p>బల్ల మీద ఇసుక పోయండి, అది యాదృచ్ఛిక దుమ్ములా కనిపిస్తుంది. ఇప్పుడు ఒక మాయా కుంచె ఊహించండి, ప్రతి గీతతో కొంత దుమ్మును తీసేసి, ఇసుకను కొద్దిగా గుండెలా లేదా నక్షత్రంలా కనిపించేలా చేస్తుంది. సరిపడా గీతల తర్వాత స్పష్టమైన బొమ్మ కనిపిస్తుంది.</p>
<p>అదే <b>డిఫ్యూజన్ మోడల్</b>. నేర్చుకునేటప్పుడు దానికి స్పష్టమైన బొమ్మలు చూపిస్తారు, అవి నెమ్మదిగా శబ్దంలో కప్పబడతాయి, కప్పే ఒక చిన్న అడుగును తిరిగి తీసేయడం అది నేర్చుకుంటుంది. కొత్తది సృష్టించడానికి, అది కొత్త యాదృచ్ఛిక శబ్దంతో మొదలుపెట్టి, శుభ్రం చేసే అడుగును మళ్లీ మళ్లీ చేస్తుంది.</p>
<div class="callout"><b>ఆశ్చర్యం ఎక్కడి నుంచి వస్తుంది?</b> యాదృచ్ఛిక శబ్దం నుంచి. వేర్వేరు శబ్దం వేర్వేరు బొమ్మలకు దారి తీస్తుంది. టెక్స్ట్ <b>ప్రాంప్ట్</b>, పదాలకు సరిపోయే బొమ్మల వైపు శుభ్రం చేయడాన్ని నెడుతుంది. కింది బొమ్మలో బోల్ట్‌కి నాలుగు బొమ్మలే తెలుసు: heart, star, smiley, house.</div>`,
look:'ఎనిమిది చిన్న చతురస్రాల వరుస ఒక బొమ్మ తయారవడాన్ని చూపుతుంది, ఎడమ వైపు స్వచ్ఛమైన శబ్దం నుంచి కుడి వైపు పూర్తయిన బొమ్మ వరకు. చూడటానికి Make a picture నొక్కండి. ప్రాంప్ట్ బటన్లు బోల్ట్‌కి లక్ష్యం ఏమిటో చెబుతాయి. ప్రాంప్ట్ లేకపోతే శబ్దమే నిర్ణయిస్తుంది. ఈ బొమ్మ నిజమైన డిఫ్యూజన్ మోడల్ లాంటి అదే అడుగు అడుగు విధానాన్ని అనుసరిస్తుంది, కానీ దీని డినాయిజర్‌కి లక్షల బొమ్మలకు బదులు నాలుగే తెలుసు.',
tries:['ప్రాంప్ట్‌గా <b>heart</b> ఎంచుకుని <b>Make a picture</b> నొక్కండి. గరగర గుండెగా గట్టిపడటం చూడండి.','<b>No prompt</b> పెట్టి <b>New noise, then make</b> ని చాలా సార్లు నొక్కండి. వేరే శబ్దం, వేరే బొమ్మ.','<b>denoising steps</b> ని 2 కి తగ్గించి, తర్వాత 30 కి పెంచి ఫిల్మ్‌స్ట్రిప్‌లను పోల్చండి. ఎక్కువ అడుగులతో గరగర క్రమంగా మసకబారుతుంది. తక్కువతో అది దూకుతుంది. ఈ చిన్న బొమ్మ అయినా శుభ్రంగా ముగుస్తుంది, కానీ నిజమైన మోడల్స్‌కి కరుకు బొమ్మలు రాకుండా ఎక్కువ అడుగులు కావాలి.','ఒక ప్రాంప్ట్ ఎంచుకుని, <b>how hard the prompt pulls</b> ని 0 కి పెట్టండి. ప్రాంప్ట్ పట్టించుకోబడదు, మళ్లీ శబ్దమే నిర్ణయిస్తుంది.']},

ft:{title:'పెద్ద మోడల్‌కి కొత్త ట్రిక్ చౌకగా నేర్పడం',sub:'ఫైన్-ట్యూనింగ్, LoRA',hook:'ఒక భారీ మోడల్‌ని మళ్లీ నేర్పడం ఖరీదైనది. మీకు కావాల్సిన మార్పు తరచూ చిన్నదీ, సరళమైనదీ, కాబట్టి ఒక పలుచని ప్యాచ్ మాత్రమే నేర్చుకోవచ్చు.',
kid:`<p>మీ దగ్గర ఒక భారీ వంటల పుస్తకం ఉంది. మీ కుటుంబానికి ఇష్టమైన వంటలను వండేలా చేయాలి. ప్రతి పేజీని మళ్లీ రాయరు. ముఖ్యమైన పేజీల మీద కొన్ని చిన్న నోట్స్ అతికిస్తారు.</p>
<p><b>ఫైన్-ట్యూనింగ్</b> ముందే నేర్చుకున్న మోడల్‌ని మీ పనికి తగ్గట్టు సర్దుతుంది. <b>LoRA</b> దీన్ని చౌకగా చేస్తుంది: పెద్ద వెయిట్లను స్తంభింపజేసి, రెండు సన్నని మ్యాట్రిక్స్‌లను మాత్రమే నేర్పుతారు, వాటి లబ్ధం మార్పు అవుతుంది. మార్పు సరిపడా సరళమైనదైతే, చాలా చిన్న ప్యాచ్ దాదాపు అంతా పట్టుకుంటుంది.</p>`,
look:'ఎడమ గ్రిడ్ ఒక వెయిట్ మ్యాట్రిక్స్. మధ్య గ్రిడ్ కొన్ని భాగాల (దాని rank) నుంచే చేసిన కాపీ. కుడి బార్లు ప్రతి భాగం ఎంత ముఖ్యమో చూపిస్తాయి. పొడవైనవాటిని ఉంచండి.',
tries:['Rank 1 నుంచి మొదలుపెట్టి ఒక్కొక్కటిగా పెంచండి. కాపీ దగ్గరవుతుంది.','బార్లు చూడండి: కొన్ని పొడవైనవి, చాలా పొట్టివాటి తోక.','నిల్వ చేయాల్సిన సంఖ్యల లెక్కను చూడండి. Rank 4 కి పూర్తి గ్రిడ్ కంటే చాలా తక్కువ కావాలి.','<b>New matrix</b> నొక్కి జవాబు ఎలా మారుతుందో చూడండి.']},

quant:{title:'పెద్ద మోడల్స్‌ని చిన్నవిగా చేయడం',sub:'క్వాంటైజేషన్, సమర్థత',hook:'పెద్ద మోడల్స్ ఎక్కువగా పెద్ద సంఖ్యల పట్టికలే. ఆ సంఖ్యలను తక్కువ బిట్లకు రౌండ్ చేస్తే అవి చిన్నవి, వేగమైనవి అవుతాయి, జాగ్రత్తగా రౌండ్ చేస్తే చాలు.',
kid:`<p>మీరు ఒక కొలతను 3.14159265 అని రాస్తారనుకోండి. బదులుగా 3.14 అని రాసినా ఎవరూ పెద్దగా పట్టించుకోరు. తక్కువ అంకెలతో తక్కువ కాగితం చాలు.</p>
<p><b>క్వాంటైజేషన్</b> మోడల్ సంఖ్యలకు ఇదే చేస్తుంది. ప్రతి వెయిట్‌కి 16 బిట్లకు బదులు 8 లేదా 4 వాడతారు. మోడల్ నాలుగో వంతు చోటు తీసుకుంటుంది, ఫోన్‌లో కూడా నడుస్తుంది.</p>

/* ============ demo 1: gradient descent ============ */
function demoGD(root){
  const r=rng(7),pts=[];for(let i=0;i<30;i++){const x=-5+10*r();pts.push([x,1.5*x+2+gauss(r)*1.8])}
  const n=pts.length,mx=pts.reduce((s,p)=>s+p[0],0)/n,my=pts.reduce((s,p)=>s+p[1],0)/n;
  let sxy=0,sxx=0;pts.forEach(p=>{sxy+=(p[0]-mx)*(p[1]-my);sxx+=(p[0]-mx)**2});
  const wS=sxy/sxx,bS=my-wS*mx;
  const mse=(w,b)=>pts.reduce((s,p)=>s+(w*p[0]+b-p[1])**2,0)/n;
  const best=mse(wS,bS);
  let w,b,step,hist,lr=0.02,dead=false;
  const box=el('div',{class:'stage'});root.append(box);
  const main=mkCanvas(.72),lc=mkCanvas(.3);main.attach(box);lc.attach(box);
  const sStep=stat('step'),sW=stat('slope w'),sB=stat('intercept b'),sL=stat('loss (MSE)');
  const upd=()=>{sStep.set(step);sW.set(isFinite(w)?w.toFixed(2):'NaN');sB.set(isFinite(b)?b.toFixed(2):'NaN');sL.set(dead?'diverged':hist[hist.length-1].toFixed(2))};
  const reset=()=>{w=-1.5;b=-6;step=0;dead=false;hist=[mse(w,b)];draw();upd()};
  const once=()=>{let gw=0,gb=0;for(const p of pts){const e=w*p[0]+b-p[1];gw+=e*p[0];gb+=e}w-=lr*2*gw/n;b-=lr*2*gb/n;step++;const L=mse(w,b);hist.push(L);if(!isFinite(L)||L>1e9)dead=true};
  const dl=(ctx,v,ww,bb,col,dash,lw)=>{if(!isFinite(ww)||!isFinite(bb))return;ctx.beginPath();ctx.setLineDash(dash);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.moveTo(v.X(-5.5),v.Y(-5.5*ww+bb));ctx.lineTo(v.X(5.5),v.Y(5.5*ww+bb));ctx.stroke();ctx.setLineDash([])};
  main.draw=()=>{const C=colors(),{ctx,W,H}=main;ctx.clearRect(0,0,W,H);grid(ctx,W,H,C);const v=mkView(main,-5.5,5.5,-13,14);
    ctx.strokeStyle=C.bad;ctx.globalAlpha=.4;ctx.lineWidth=1;pts.forEach(p=>{const yy=w*p[0]+b;if(!isFinite(yy))return;ctx.beginPath();ctx.moveTo(v.X(p[0]),v.Y(p[1]));ctx.lineTo(v.X(p[0]),v.Y(yy));ctx.stroke()});ctx.globalAlpha=1;
    dl(ctx,v,wS,bS,C.muted,[6,5],1.5);dl(ctx,v,w,b,C.accent,[],3);
    pts.forEach(p=>{ctx.beginPath();ctx.arc(v.X(p[0]),v.Y(p[1]),4,0,7);ctx.fillStyle=C.ink;ctx.fill()});
    ctx.fillStyle=C.muted;ctx.font='12px '+css('--body');ctx.fillText('dashed: best possible line. red: errors',10,H-10)};
  lc.draw=()=>{const C=colors(),{ctx,W,H}=lc;ctx.clearRect(0,0,W,H);grid(ctx,W,H,C);const h=hist.slice(-300);
    const vals=h.map(x=>Math.log10(Math.min(Math.max(x,best*.9),1e8)));const lo=Math.log10(best*.9),hi=Math.max(lo+.5,...vals);
    const X=i=>10+i/Math.max(1,h.length-1)*(W-20),Y=y=>H-10-(y-lo)/(hi-lo)*(H-30);
    ctx.setLineDash([4,4]);ctx.strokeStyle=C.muted;ctx.beginPath();ctx.moveTo(10,Y(Math.log10(best)));ctx.lineTo(W-10,Y(Math.log10(best)));ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle=C.accent;ctx.lineWidth=2.5;ctx.beginPath();vals.forEach((y,i)=>i?ctx.lineTo(X(i),Y(y)):ctx.moveTo(X(i),Y(y)));ctx.stroke();
    ctx.fillStyle=C.muted;ctx.font='12px '+css('--body');ctx.fillText('loss over steps (log scale)',10,16)};
  const draw=()=>{main.draw();lc.draw()};
  const run=runner(()=>{once();once();draw();upd();if(dead||step>2500)run.stop()});
  const sl=slider('Learning rate',0.005,0.15,0.005,lr,v=>v.toFixed(3),v=>{lr=v});
  root.append(stats(sStep,sW,sB,sL),el('div',{class:'ctl'},sl.node,el('div',{class:'row'},run.btn,btn('One step',()=>{if(!dead){once();draw();upd()}}),btn('Reset',()=>{run.stop();reset()}))));
  reset();
  taskCard(root,'Get within 5% of the best possible loss in 60 steps or fewer. Reset, pick a learning rate, run, pause, then check.',()=>{
    if(dead)return{ok:false,msg:'The loss blew up. That learning rate is too high. Reset and lower it.'};
    const L=hist[hist.length-1],near=L<=best*1.05;
    if(near&&step<=60)return{ok:true,msg:'Done. Loss '+L.toFixed(2)+' after '+step+' steps (best possible '+best.toFixed(2)+').'};
    if(near)return{ok:false,msg:'Close enough, but it took '+step+' steps. Reset and try a larger learning rate.'};
    return{ok:false,msg:'Loss is '+L.toFixed(2)+' vs best '+best.toFixed(2)+' at step '+step+'. Keep going, or reset and raise the learning rate.'}});
}

/* ============ demo 2: logistic regression ============ */
function demoLR(root){
  let sep=1.6,lr=.5,seed=2,pts,w1,w2,b,step;
  const gen=()=>{const r=rng(seed*13+5);pts=[];for(let c=0;c<2;c++)for(let i=0;i<50;i++){const s=c?1:-1;pts.push({x:s*sep+gauss(r)*1.1,y:s*sep*.6+gauss(r)*1.1,c})}};
  const sig=z=>1/(1+Math.exp(-z));
  const box=el('div',{class:'stage'});root.append(box);const o=mkCanvas(.75);o.attach(box);
  const sStep=stat('step'),sAcc=stat('accuracy'),sLoss=stat('log-loss');
  const met=()=>{let L=0,ok=0;for(const p of pts){const q=sig(w1*p.x+w2*p.y+b);L-=p.c?Math.log(q+1e-9):Math.log(1-q+1e-9);if((q>.5)===(p.c===1))ok++}return{loss:L/pts.length,acc:ok/pts.length}};
  const upd=()=>{const m=met();sStep.set(step);sAcc.set((m.acc*100).toFixed(0)+'%');sLoss.set(m.loss.toFixed(3))};
  const reset=()=>{w1=0;w2=0;b=0;step=0;o.draw();upd()};
  const once=()=>{let g1=0,g2=0,gb=0;for(const p of pts){const e=sig(w1*p.x+w2*p.y+b)-p.c;g1+=e*p.x;g2+=e*p.y;gb+=e}const n=pts.length;w1-=lr*g1/n;w2-=lr*g2/n;b-=lr*gb/n;step++};
  o.draw=()=>{const C=colors(),{ctx,W,H}=o;ctx.clearRect(0,0,W,H);const v=mkView(o,-6,6,-4.5,4.5,0);
    const nx=32,ny=24,cw=W/nx,ch=H/ny,c0=rgb(C.c0),c1=rgb(C.c1);
    for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){const x=v.ix((i+.5)*cw),y=v.iy((j+.5)*ch),p=sig(w1*x+w2*y+b),c=p>.5?c1:c0;ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(.08+.34*Math.abs(2*p-1))+')';ctx.fillRect(i*cw,j*ch,cw+1,ch+1)}
    ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.beginPath();
    if(Math.abs(w2)>1e-6){ctx.moveTo(v.X(-6),v.Y(-(w1*-6+b)/w2));ctx.lineTo(v.X(6),v.Y(-(w1*6+b)/w2))}else if(Math.abs(w1)>1e-6){const x=-b/w1;ctx.moveTo(v.X(x),0);ctx.lineTo(v.X(x),H)}ctx.stroke();
    pts.forEach(p=>marker(ctx,p.c,v.X(p.x),v.Y(p.y),5,p.c?C.c1:C.c0,C.panel));
    ctx.fillStyle=C.muted;ctx.font='12px '+css('--body');ctx.fillText('shading: predicted probability. line: p = 0.5',10,H-10)};
  const run=runner(()=>{for(let i=0;i<3;i++)once();o.draw();upd();if(step>3000)run.stop()});
  gen();
  const s1=slider('Class separation (lower = more overlap)',0.5,3,0.1,sep,v=>v.toFixed(1),v=>{sep=v;gen();reset()});
  const s2=slider('Learning rate',0.05,2,0.05,lr,v=>v.toFixed(2),v=>{lr=v});
  root.append(stats(sStep,sAcc,sLoss),el('div',{class:'ctl'},s1.node,s2.node,el('div',{class:'row'},run.btn,btn('One step',()=>{once();o.draw();upd()}),btn('Reset weights',()=>{run.stop();reset()}),btn('New data',()=>{run.stop();seed++;gen();reset()}))));
  reset();
}

/* ============ demo 3: kNN ============ */
function demoKNN(root){
  const r=rng(11),pts=[];[[-2.2,-1.3],[2.3,-1.5],[0,2.4]].forEach((c,k)=>{for(let i=0;i<25;i++)pts.push({x:c[0]+gauss(r)*1.25,y:c[1]+gauss(r)*1.25,k})});
  let q={x:.4,y:.2},K=5,regions=true;const NAMES=['A','B','C'];
  const pred=(x,y,k)=>{const d=pts.map(p=>({p,d:(p.x-x)**2+(p.y-y)**2})).sort((a,b)=>a.d-b.d).slice(0,k);const votes=[0,0,0];d.forEach(e=>votes[e.p.k]++);const mv=Math.max(...votes);const best=d.find(e=>votes[e.p.k]===mv).p.k;return{votes,best,nn:d}};
  const box=el('div',{class:'stage'});root.append(box);const o=mkCanvas(.75);o.attach(box);o.c.style.touchAction='none';
  const sK=stat('k'),sP=stat('prediction'),sV=stat('votes A / B / C'),sC=stat('k=1 vs k=15');
  o.draw=()=>{const C=colors(),{ctx,W,H}=o;ctx.clearRect(0,0,W,H);grid(ctx,W,H,C);const v=mkView(o,-6,6,-4.5,4.5,0);const cols=[C.c0,C.c1,C.c2];
    if(regions){const nx=36,ny=27,cw=W/nx,ch=H/ny;for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){const c=rgb(cols[pred(v.ix((i+.5)*cw),v.iy((j+.5)*ch),K).best]);ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+',.2)';ctx.fillRect(i*cw,j*ch,cw+1,ch+1)}}
    const pr=pred(q.x,q.y,K);const far=pr.nn[pr.nn.length-1];
    ctx.strokeStyle=C.muted;ctx.setLineDash([5,4]);ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(v.X(q.x),v.Y(q.y),Math.sqrt(far.d)*(W/12),0,7);ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle=C.ink;ctx.globalAlpha=.5;pr.nn.forEach(e=>{ctx.beginPath();ctx.moveTo(v.X(q.x),v.Y(q.y));ctx.lineTo(v.X(e.p.x),v.Y(e.p.y));ctx.stroke()});ctx.globalAlpha=1;
    pts.forEach(p=>marker(ctx,p.k,v.X(p.x),v.Y(p.y),5,cols[p.k],C.panel));
    ctx.beginPath();ctx.arc(v.X(q.x),v.Y(q.y),11,0,7);ctx.fillStyle=cols[pr.best];ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=C.ink;ctx.stroke();
    ctx.fillStyle=C.muted;ctx.font='12px '+css('--body');ctx.fillText('drag the large circle',10,H-10);
    sK.set(K);sP.set(NAMES[pr.best]);sV.set(pr.votes.join(' / '));sC.set(NAMES[pred(q.x,q.y,1).best]+' vs '+NAMES[pred(q.x,q.y,15).best])};
  let drag=false;const mv=e=>{const rc=o.c.getBoundingClientRect(),v=mkView(o,-6,6,-4.5,4.5,0);q={x:Math.max(-6,Math.min(6,v.ix(e.clientX-rc.left))),y:Math.max(-4.5,Math.min(4.5,v.iy(e.clientY-rc.top)))};o.draw()};
  o.c.addEventListener('pointerdown',e=>{drag=true;o.c.setPointerCapture(e.pointerId);mv(e)});o.c.addEventListener('pointermove',e=>{if(drag)mv(e)});o.c.addEventListener('pointerup',()=>drag=false);o.c.addEventListener('pointercancel',()=>drag=false);
  const sl=slider('k (number of neighbours)',1,25,1,K,v=>v,v=>{K=v;o.draw()});
  const tg=btn('Regions: on',()=>{regions=!regions;tg.textContent='Regions: '+(regions?'on':'off');o.draw()});
  root.append(stats(sK,sP,sV,sC),el('div',{class:'ctl'},sl.node,el('div',{class:'row'},tg)));o.draw();
  taskCard(root,'Drag the query point to a spot where k=1 and k=15 give different answers (see the last tile). That is the bias-variance trade-off in one picture.',()=>{
    const a=pred(q.x,q.y,1).best,c=pred(q.x,q.y,15).best;
    return a!==c?{ok:true,msg:'Yes: k=1 says '+NAMES[a]+', k=15 says '+NAMES[c]+'. One noisy neighbour can flip a small-k vote.'}:{ok:false,msg:'Both say '+NAMES[a]+'. Try the borders between clusters or near an isolated point.'}});
}

/* ============ demo 4: k-means ============ */
function demoKM(root){
  let dseed=5,K=3,iseed=1,pts,cent,asg,phase,conv,iters,bestK;

  const gen=()=>{const r=rng(dseed*7+3);pts=[];[[-3,-2],[3,-2.5],[-2.5,2.5],[3.2,2.2]].forEach(c=>{for(let i=0;i<40;i++)pts.push([c[0]+gauss(r)*.85,c[1]+gauss(r)*.85])});

    ctx.font='12px '+css('--body');for(let d=1;d<=12;d++){ctx.fillStyle=C.muted;ctx.fillText(d,X(d)-3,H-6)}

/* ============ demo 6: neural network ============ */
function makeData(kind,seed){const r=rng(seed),P=[];
  for(let i=0;i<280;i++){let x,y,c;
    if(kind==='circle'){c=i%2;const a=r()*6.2832,rad=c?r()*1.4:2.4+r()*1.2;x=rad*Math.cos(a)+gauss(r)*.15;y=rad*Math.sin(a)+gauss(r)*.15}

function makeNet(sizes,seed){const r=rng(seed),L=sizes.length-1,W=[],B=[],mW=[],vW=[],mB=[],vB=[];let t=0;

    mW.push(Array.from({length:no},()=>new Float64Array(ni)));vW.push(Array.from({length:no},()=>new Float64Array(ni)));mB.push(new Float64Array(no));vB.push(new Float64Array(no))}

    for(const s of D){const a=fwd([s.x/3,s.y/3]),p=a[L][0];loss-=s.c?Math.log(p+1e-9):Math.log(1-p+1e-9);let d=new Float64Array([p-s.c]);
      for(let l=L-1;l>=0;l--){for(let j=0;j<d.length;j++){for(let i=0;i<a[l].length;i++)gW[l][j][i]+=d[j]*a[l][i];gB[l][j]+=d[j]}

  const gi=(c,n)=>{const p=c/n;return 2*p*(1-p)};
  const build=(D,d,maxD)=>{const n=D.length,c1=D.reduce((s,p)=>s+p.c,0);const leaf={leaf:1,p:n?c1/n:.5};if(d>=maxD||c1===0||c1===n||n<2)return leaf;let best=null;
    for(const f of['x','y']){const S=[...D].sort((a,b)=>a[f]-b[f]);let lc=0;for(let i=0;i<n-1;i++){lc+=S[i].c;if(S[i][f]===S[i+1][f])continue;const ln=i+1,rn=n-ln,g=(ln*gi(lc,ln)+rn*gi(c1-lc,rn))/n;if(!best||g<best.g)best={g,f,t:(S[i][f]+S[i+1][f])/2}}}
    if(!best)return leaf;return{f:best.f,t:best.t,l:build(D.filter(p=>p[best.f]<=best.t),d+1,maxD),r:build(D.filter(p=>p[best.f]>best.t),d+1,maxD)}};
  const pt=(t,x,y)=>t.leaf?t.p:((t.f==='x'?x:y)<=t.t?pt(t.l,x,y):pt(t.r,x,y));

    ctx.font='600 12px '+css('--body');ctx.fillStyle=C.muted;ctx.fillText('The hidden pattern is a staircase. 10% of the examples carry a wrong label.',10,H-10);
    const sc=D=>D.filter(p=>(prob(p.x,p.y)>=.5?1:0)===p.c).length/D.length,tr=sc(train),te=sc(test);
    sD.set(depth);sT.set(T);sTr.set(Math.round(tr*100)+'%');sTe.set(Math.round(te*100)+'%');const q=forest[0];sQ.set(T>1?'many trees vote':q.leaf?'none':'is '+q.f+' <= '+q.t.toFixed(1)+'?');return te};
  const s1=slider('Depth: how many questions in a row',1,10,1,depth,v=>v,v=>{depth=v;grow();o.draw()});
  const s2=slider('Trees in the forest',1,40,1,T,v=>v===1?'1 (single tree)':v,v=>{T=v;grow();o.draw()});

  gen();grow();o.draw();

/* ============ new demo: reinforcement learning ============ */
function demoRL(root){
  const COLS=6,ROWS=4,start=[0,3],goal=[5,0],pits=[[2,2],[4,1],[3,3]],D=[[0,-1],[1,0],[0,1],[-1,0]];
  const isPit=(c,r)=>pits.some(p=>p[0]===c&&p[1]===r),isGoal=(c,r)=>c===goal[0]&&r===goal[1],idx=(c,r)=>r*COLS+c;
  let Q,ep=0,eps=.3,bolt=start.slice(),timer=0,msg='';
  const reset=()=>{Q=Array.from({length:ROWS*COLS},()=>[0,0,0,0]);ep=0;bolt=start.slice();msg=''};
  const step=(c,r,a)=>{const nc=Math.max(0,Math.min(COLS-1,c+D[a][0])),nr=Math.max(0,Math.min(ROWS-1,r+D[a][1]));let rew=-1,term=false;if(isGoal(nc,nr)){rew=20;term=true}else if(isPit(nc,nr)){rew=-20;term=true}return{c:nc,r:nr,rew,term}};

  const episode=()=>{let c=start[0],r=start[1];for(let n=0;n<60;n++){const s=idx(c,r),a=Math.random()<eps?Math.floor(Math.random()*4):best(s),t=step(c,r,a),fut=t.term?0:Math.max(...Q[idx(t.c,t.r)]);Q[s][a]+=.5*(t.rew+.9*fut-Q[s][a]);c=t.c;r=t.r;if(t.term)break}ep++};

  const box=el('div',{class:'stage'});root.append(box);const o=mkCanvas(.7);o.attach(box);
  const sE=stat('practice rounds'),sP=stat('what Bolt would do now');
  const star=(ctx,x,y,R,col)=>{ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?R*.45:R;ctx.lineTo(x+rr*Math.cos(a),y+rr*Math.sin(a))}ctx.closePath();ctx.fillStyle=col;ctx.fill()};
  o.draw=()=>{const C=colors(),{ctx,W,H}=o,cs=Math.min(W/COLS,H/ROWS),ox=(W-cs*COLS)/2,oy=(H-cs*ROWS)/2;ctx.clearRect(0,0,W,H);ctx.lineWidth=1;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=ox+c*cs,y=oy+r*cs;ctx.fillStyle=C.panel;ctx.fillRect(x,y,cs,cs);ctx.strokeStyle=C.line;ctx.strokeRect(x+.5,y+.5,cs,cs);const cx=x+cs/2,cy=y+cs/2;

      const q=Q[idx(c,r)],m=Math.max(...q),mn=Math.min(...q);if(m!==0||mn!==0){const a=best(idx(c,r)),dx=D[a][0],dy=D[a][1],L=cs*.3;ctx.save();ctx.translate(cx,cy);ctx.rotate(Math.atan2(dy,dx));ctx.beginPath();ctx.moveTo(L,0);ctx.lineTo(-L*.4,-L*.65);ctx.lineTo(-L*.4,L*.65);ctx.closePath();ctx.fillStyle=C.accent;ctx.globalAlpha=Math.min(1,.25+Math.abs(m)/12);ctx.fill();ctx.restore();ctx.globalAlpha=1}}
    const bx=ox+bolt[0]*cs+cs/2,by=oy+bolt[1]*cs+cs/2,R=cs*.27;ctx.fillStyle=C.c0;ctx.beginPath();ctx.arc(bx,by,R,0,7);ctx.fill();ctx.strokeStyle=C.panel;ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#FFFFFF';[-1,1].forEach(s=>{ctx.beginPath();ctx.arc(bx+s*R*.38,by-R*.1,R*.2,0,7);ctx.fill()});ctx.fillStyle='#1B2340';[-1,1].forEach(s=>{ctx.beginPath();ctx.arc(bx+s*R*.38,by-R*.1,R*.09,0,7);ctx.fill()});

}

  const modelFor=m=>Math.max(...[...rt].filter(r=>r<=m));

    [[0,C.c0],[1,C.c1]].forEach(([k,col])=>{const c=rgb(col);h[k].forEach((n,i)=>{const ht=n/mx*(H-40);ctx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+',.45)';ctx.fillRect(8+i*bw,H-14-ht,bw-1,ht)})});

  ac.draw=()=>{const C=colors(),{ctx,W,H}=ac;ctx.clearRect(0,0,W,H);grid(ctx,W,H,C);const L=40,R=10,T=26,B=24,X=m=>L+m/MONTHS*(W-L-R),Y=a=>H-B-(a-.5)/.5*(H-T-B);const a=[];for(let m=0;m<=MONTHS;m++)a.push(acc(m));
    ctx.font='12px '+css('--body');ctx.fillStyle=C.muted;[.5,.6,.7,.8,.9,1].forEach(v=>ctx.fillText(Math.round(v*100)+'%',4,Y(v)+4));[0,6,12,18,24].forEach(m=>ctx.fillText(m,X(m)-4,H-6));
    ctx.setLineDash([5,5]);ctx.strokeStyle=C.bad;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(L,Y(.88));ctx.lineTo(W-R,Y(.88));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=C.bad;ctx.fillText('alarm: 88%',W-R-72,Y(.88)-5);

    [...rt].forEach(m=>{ctx.beginPath();ctx.moveTo(X(m),H-B-2);ctx.lineTo(X(m)-6,H-B+10);ctx.lineTo(X(m)+6,H-B+10);ctx.closePath();ctx.fillStyle=C.ok;ctx.fill()});
