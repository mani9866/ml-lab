<li><b>Transfer learning</b>: start from a model pretrained on a large dataset and fine-tune. This is the default for small image datasets.</li></ul>
<h3>In practice</h3>
<ul><li>Augment images (flip, crop, colour jitter) to fight overfitting.</li>
<li>Check for shortcut learning: models may use background or watermarks instead of the object.</li>
<li>Vision transformers (level [[attn]]) now compete with CNNs, especially with lots of data.</li></ul>
<h3>Check yourself</h3>
<ol><li>How many weights does a 3x3 conv from 64 to 128 channels have (ignoring bias)?</li><li>Why is a convolution a poor fit for tabular data?</li></ol>`,

rec:`<h3>Models</h3>
<div class="math">neighbourhood:   r_hat(u,i) = mean_u + sum_v sim(u,v) (r_vi - mean_v) / sum |sim(u,v)|
matrix factorisation:  r_hat(u,i) = mu + b_u + b_i + p_u . q_i
objective: sum over observed (r_ui - r_hat)^2 + lambda (|p_u|^2 + |q_i|^2 + b_u^2 + b_i^2)</div>
<p>Factorisation learns k-dimensional vectors for users and items so a dot product predicts affinity. It is trained with SGD or alternating least squares. For implicit feedback (clicks, plays) use losses designed for it, such as weighted ALS or pairwise ranking (BPR).</p>
<h3>Production shape</h3>
<ul><li><b>Two-tower</b> models embed users and items separately, so item vectors can be indexed for fast nearest-neighbour retrieval. A heavier <b>ranker</b> then reorders a few hundred candidates.</li>
<li>Offline metrics: recall at k, NDCG, coverage, diversity. The decisive test is an online A/B experiment.</li></ul>
<h3>Common pitfalls</h3>
<ul><li>Evaluating with a random split. Use a time-based split, because the system predicts the future.</li><li>Popularity bias and feedback loops. Log exposure and add exploration.</li></ul>
<h3>Check yourself</h3>
<ol><li>Why do we subtract each user's mean rating in the neighbourhood formula?</li><li>How would you recommend to a brand new item?</li></ol>`,

rl:`<h3>Formal setting</h3>
<p>A Markov decision process has states S, actions A, transition probabilities P, rewards R and discount gamma. The goal is a policy that maximises expected discounted return.</p>
<div class="math">G_t = r_t + gamma r_(t+1) + gamma^2 r_(t+2) + ...
Q(s,a) <- Q(s,a) + alpha [ r + gamma max_a' Q(s',a') - Q(s,a) ]      (Q-learning)
policy gradient:  grad J = E[ grad log pi(a|s) * G_t ]</div>
<p>Q-learning is <b>off-policy</b> and <b>bootstrapped</b>: it updates one estimate using another. Deep Q-networks replace the table with a neural network and add a replay buffer and a slowly updated target network for stability.</p>
<h3>In practice</h3>
<ul><li>Balance <b>exploration and exploitation</b>: epsilon-greedy, entropy bonuses, or optimism under uncertainty.</li>
<li>Reward design is the hardest part. Agents exploit loopholes ("reward hacking"). Test the reward with simple agents first.</li>
<li>Sample efficiency is poor, so train in simulation when you can and plan the sim-to-real gap.</li>
<li>Modern methods: PPO, SAC, and model-based approaches. RLHF applies policy optimisation to language models (level [[ft]]).</li></ul>
<h3>Check yourself</h3>
<ol><li>What does gamma near 0 versus near 1 change about behaviour?</li><li>Why is on-policy learning often more stable but less sample efficient?</li></ol>`,

ops:`<h3>The lifecycle</h3>
<ol><li><b>Data</b>: versioned, validated, with schemas and checks.</li><li><b>Training</b>: reproducible code, seeds, tracked experiments.</li><li><b>Evaluation</b>: fixed test sets plus slices (by group, region, device).</li><li><b>Release</b>: staged rollout (shadow, canary, A/B) with rollback.</li><li><b>Monitoring</b>: data quality, drift, latency, cost and outcome metrics.</li></ol>
<h3>Detecting drift</h3>
<div class="math">PSI = sum_b (p_b - q_b) * ln(p_b / q_b)         (population stability index, per feature)
Also: KS test, KL / JS divergence, and rising error when labels arrive
Data drift: p(x) changes.   Concept drift: p(y | x) changes.</div>
<h3>In practice</h3>
<ul><li>Labels often arrive late. Monitor input and prediction distributions meanwhile.</li>
<li>Retrain on a schedule and on triggers, and keep the previous model ready.</li>
<li>Guard against training-serving skew: compute features with the same code in both places (feature stores help).</li>
<li>Track cost and latency per request. A slightly better model that is 10x slower may not be worth it.</li></ul>
<h3>Check yourself</h3>
<ol><li>Give an example of concept drift without any data drift.</li><li>What would you alert on if ground-truth labels take 30 days to arrive?</li></ol>`,

fair:`<h3>Definitions</h3>
<div class="math">Demographic parity:  P(y_hat=1 | A=a) equal for all groups a
Equal opportunity:   P(y_hat=1 | y=1, A=a) equal            (equal TPR)
Equalised odds:      equal TPR and equal FPR
Calibration within groups: P(y=1 | score=s, A=a) = s for every a</div>
<p>When base rates differ between groups and the classifier is imperfect, calibration and equalised odds cannot both hold (the Kleinberg et al. and Chouldechova impossibility results). This is a mathematical fact, so the choice of criterion is a policy decision.</p>
<h3>Mitigation</h3>
<ul><li><b>Pre-processing</b>: reweigh or resample data, fix labels.</li><li><b>In-training</b>: add a fairness constraint or penalty.</li><li><b>Post-processing</b>: group-specific thresholds, as in the lab. Check the legal position first, because using protected attributes in decisions is restricted in some domains.</li></ul>
<h3>Practice</h3>
<ul><li>Evaluate on slices and intersections, with confidence intervals. Small groups give noisy estimates.</li>
<li>Remember proxies: removing the protected column rarely removes the information.</li>
<li>Document with model cards and datasheets, and plan for appeals and monitoring.</li></ul>
<h3>Check yourself</h3>
<ol><li>Why can equal true positive rates still give unequal approval rates?</li><li>Name one proxy variable that could leak a protected attribute.</li></ol>`,

embed:`<h3>Objectives</h3>
<div class="math">skip-gram with negative sampling:
  maximise  log sigma(u_c . v_w) + sum_(k negatives) log sigma(-u_k . v_w)
cosine similarity: cos(a,b) = a.b / (|a||b|)
contrastive (InfoNCE):  -log  exp(s(q,p+)/t) / sum_j exp(s(q,p_j)/t)</div>
<p>Static word vectors (word2vec, GloVe) have one vector per word. Contextual models give each occurrence its own vector. Sentence encoders and retrieval models are trained contrastively: matching pairs are pulled together and others pushed apart.</p>
<h3>In practice</h3>
<ul><li>Normalise vectors so dot product equals cosine. Pick the dimension by quality against cost.</li>
<li>Use an approximate nearest-neighbour index (HNSW, IVF-PQ) beyond a few hundred thousand vectors.</li>
<li>Evaluate on your task: retrieval recall at k on labelled queries, not on generic benchmarks alone.</li>
<li>Embeddings encode biases of the training text, and different models are not interchangeable. Re-embed everything if you change the model.</li></ul>
<h3>Common pitfalls</h3>
<ul><li>Trusting analogy demos as proof that directions are clean. They are partial.</li><li>Mixing vectors from different models in one index.</li></ul>
<h3>Check yourself</h3>
<ol><li>Why is cosine preferred to Euclidean distance for text embeddings?</li><li>What does the temperature t do in a contrastive loss?</li></ol>`,

attn:`<h3>Scaled dot-product attention</h3>
<div class="math">Attention(Q,K,V) = softmax( Q K^T / sqrt(d_k) ) V
multi-head: concat( head_1..head_h ) W_O,   head_i = Attention(Q W_Qi, K W_Ki, V W_Vi)
causal mask: set scores for j > i to -infinity before softmax</div>
<p>Dividing by sqrt(d_k) keeps score variance near 1 when query and key entries have unit variance; otherwise softmax saturates and gradients vanish. Self-attention has no sense of order, so position information is added (sinusoidal, learned, or rotary embeddings).</p>
<h3>Cost</h3>
<ul><li>Time and memory scale as O(n^2 d) in sequence length n. FlashAttention computes the same result with far less memory traffic.</li>
<li>At generation, the <b>KV cache</b> stores keys and values for earlier tokens so each new token costs O(n d) rather than recomputing everything.</li>
<li>Variants: multi-query and grouped-query attention shrink the KV cache. Sparse and sliding-window attention reduce the quadratic term.</li></ul>
<h3>Common pitfalls</h3>
<ul><li>Treating attention maps as explanations. They show where information flows, not necessarily why.</li><li>Ignoring context length cost in latency estimates.</li></ul>
<h3>Check yourself</h3>
<ol><li>What shape is the attention matrix for a sequence of 1,000 tokens?</li><li>Why does a decoder need a causal mask during training?</li></ol>`,

llm:`<h3>Training objective</h3>
<div class="math">maximise  sum_t log p(x_t | x_1 .. x_(t-1))        (next-token prediction)
perplexity = exp( average negative log-likelihood per token )
sampling: p_T(i) = softmax(z_i / T);  top-k and top-p (nucleus) truncate the tail</div>
<p>Low temperature approaches greedy decoding (predictable, repetitive). High temperature spreads probability over more tokens (varied, riskier). The text is split into <b>tokens</b> (word pieces), so models see sub-word units, which explains odd behaviour on spelling and arithmetic.</p>
<h3>From base model to assistant</h3>
<ol><li><b>Pre-training</b> on a very large text corpus.</li><li><b>Supervised fine-tuning</b> on example conversations.</li><li><b>Preference tuning</b> (RLHF or direct preference optimisation) to align answers with human judgements. See level [[ft]].</li></ol>
<h3>In practice</h3>
<ul><li>Scaling laws relate loss to parameters, data and compute, and guide how to budget them.</li>
<li>Evaluate with task-specific test sets, human review and automated graders, and watch for contamination (test items in training data).</li>
<li>Models can state falsehoods fluently. Ground answers with retrieval (level [[rag]]) and verify high-stakes claims.</li></ul>
<h3>Check yourself</h3>
<ol><li>What happens to output diversity as temperature approaches 0?</li><li>Why might a model that is good at next-token prediction still need preference tuning?</li></ol>`,

rag:`<h3>Design decisions</h3>
<ul><li><b>Chunking</b>: size and overlap (for example a few hundred tokens). Respect document structure (headings, paragraphs). Store metadata for filtering and citation.</li>
<li><b>Retrieval</b>: dense (embeddings), sparse (BM25) or hybrid with reciprocal rank fusion. A cross-encoder re-ranker improves precision at the top.</li>
<li><b>Prompting</b>: delimit retrieved text, tell the model to answer only from it, to cite sources and to say when the answer is missing.</li></ul>
<div class="math">BM25 score(q,d) = sum over terms t in q of  IDF(t) * f(t,d)(k1+1) / ( f(t,d) + k1 (1 - b + b |d|/avgdl) )
reciprocal rank fusion:  score(d) = sum over rankers 1 / (k + rank(d))</div>
<h3>Evaluating</h3>
<ul><li><b>Retrieval</b>: recall at k and MRR on questions with known source passages.</li>
<li><b>Generation</b>: faithfulness (is each claim supported by retrieved text?), answer relevance, and refusal behaviour.</li>
<li>Version the index and log retrieved chunks so failures can be traced.</li></ul>
<h3>Risks</h3>
<ul><li><b>Prompt injection</b> via retrieved content. Treat documents as untrusted data.</li><li>Access control: filter retrieval by the asker's permissions before generation.</li></ul>
<h3>Check yourself</h3>
<ol><li>Why can hybrid retrieval beat dense retrieval alone on part numbers and names?</li><li>How would you tell whether a bad answer came from retrieval or from generation?</li></ol>`,

gen:`<h3>Diffusion in equations</h3>
<div class="math">forward:  x_t = sqrt(abar_t) x_0 + sqrt(1 - abar_t) eps,   eps ~ N(0, I)
train:    minimise  E || eps - eps_theta(x_t, t, c) ||^2
DDIM step: x_(t-1) = sqrt(abar_(t-1)) x0_hat + sqrt(1 - abar_(t-1)) eps_theta,
           x0_hat = ( x_t - sqrt(1 - abar_t) eps_theta ) / sqrt(abar_t)
classifier-free guidance:  eps = eps(x_t,t,null) + s * ( eps(x_t,t,c) - eps(x_t,t,null) )</div>
<p>The lab uses the exact Bayes-optimal denoiser for four known pictures, so you can see the same sampling loop without a trained network. Real models learn eps_theta with a U-Net or transformer.</p>
<h3>In practice</h3>
<ul><li><b>Latent diffusion</b> runs the process in the compressed space of an autoencoder, cutting cost sharply.</li>
<li>Guidance scale trades prompt fidelity against diversity and realism. Too high gives saturated, artifact-prone images.</li>
<li>Fewer sampling steps need better samplers or distilled models. Consistency and flow-matching methods target few-step generation.</li>
<li>Evaluation is hard: FID and CLIP score are common but imperfect, so include human review.</li></ul>
<h3>Responsible use</h3>
<ul><li>Provenance metadata and watermarks help but are not foolproof. Consent and licensing of training data are open legal questions.</li></ul>
<h3>Check yourself</h3>
<ol><li>Why does a model predicting noise also predict a clean image?</li><li>What happens at guidance scale 0, and why?</li></ol>`
};

  c.box=ok?Math.min(6,Math.max(1,c.box)+1):1;c.due=today()+SRS_GAP[c.box];c.last=today();P.srs[k]=c;saveP()}

const IVQ=[
['Basics','What is the bias-variance trade-off?','Bias is error from a model that is too simple to capture the pattern, variance is error from a model that is too sensitive to the particular training sample. Making a model more flexible lowers bias and raises variance. You aim for the point where validation error is lowest.'],
['Basics','How do you detect overfitting?','Training performance keeps improving while validation performance stalls or worsens. Learning curves, cross-validation and a gap between train and validation scores show it. Fixes include more data, regularisation, simpler models, early stopping and augmentation.'],
['Basics','Why keep a separate test set?','Choosing models and settings on the validation data leaks information into the choice. A test set used once at the end gives an honest estimate of performance on new data.'],
['Basics','What is data leakage and how can it happen?','Using information at training time that will not exist at prediction time. Examples: features derived from the label, preprocessing fitted on all data, the same user in train and test, and using future data to predict the past.'],
['Metrics','When is accuracy a bad metric?','With imbalanced classes. A model that always predicts the majority class can be 99% accurate and useless. Use precision, recall, F1, PR-AUC, or a cost-based metric.'],
['Metrics','Explain precision and recall, and when you would favour each.','Precision is the share of flagged items that are correct, recall is the share of real positives found. Favour precision when false alarms are costly (spam into the inbox), recall when misses are costly (disease screening).'],
['Metrics','What does ROC-AUC mean?','The probability that a random positive is scored higher than a random negative. It ignores the threshold and can look good on very imbalanced data, so PR curves are often more informative there.'],
['Metrics','What is calibration?','Whether predicted probabilities match observed frequencies: of the cases predicted at 70%, about 70% should be positive. It matters when probabilities drive decisions. Check with a reliability plot and fix with Platt scaling or isotonic regression.'],
['Models','Compare a decision tree with gradient-boosted trees.','A single tree is easy to explain but unstable and prone to overfit. Boosting builds many shallow trees in sequence, each correcting the errors of the last, giving strong accuracy on tabular data at the cost of interpretability and more tuning.'],
['Models','How does a random forest differ from boosting?','A forest trains many deep trees independently on random samples and features and averages them, which reduces variance. Boosting trains shallow trees sequentially to reduce bias.'],
['Models','What does the kernel trick do in an SVM?','It lets the model act as if the data were mapped into a higher-dimensional space where a straight boundary works, without computing that mapping, by using a kernel function that gives the inner products directly.'],
['Models','Why does k-nearest neighbours suffer in high dimensions?','Distances become similar for all points, so "nearest" loses meaning, and you need exponentially more data to cover the space. Feature selection, scaling and dimension reduction help.'],
['Models','How does k-means work and what are its limits?','Assign each point to the nearest centre, move each centre to the mean of its points, repeat. It needs k chosen in advance, assumes roundish similar-sized clusters, is sensitive to scale and initialisation, and finds only a local optimum.'],
['Models','What does PCA do?','It finds orthogonal directions of greatest variance and projects data onto the top few. It reduces dimensions and removes correlation, and it is sensitive to feature scale, so standardise first.'],
['Training','Explain regularisation and the difference between L1 and L2.','Regularisation adds a penalty on weights to discourage complexity. L2 shrinks all weights smoothly, L1 can set some exactly to zero and so selects features. Both are controlled by a strength chosen by cross-validation.'],
['Training','Why can gradient descent be slow in a narrow valley and what helps?','The gradient points mostly across the valley, so steps zig-zag. Momentum accumulates progress along the floor, and adaptive methods like RMSprop and Adam rescale each direction.'],
['Training','What is the vanishing gradient problem?','In deep or long networks, repeated multiplication by factors below one shrinks the gradient, so early layers barely learn. Remedies: ReLU-type activations, residual connections, good initialisation, normalisation and gated recurrent cells.'],
['Training','Explain backpropagation in a few sentences.','It applies the chain rule backwards from the loss through each layer, reusing the gradient flowing from later layers, so the gradient for every weight costs about as much as one forward pass.'],
['Training','Why use cross-entropy for classification?','It is the negative log-likelihood of the correct class, so it heavily penalises confident wrong predictions. With softmax its gradient is simply prediction minus truth, which trains smoothly.'],
['Training','What do dropout and batch normalisation do?','Dropout randomly silences units during training to reduce co-dependence and overfitting. Batch normalisation standardises activations within a batch, which stabilises and speeds training and has a mild regularising effect.'],
['Training','How do you choose a learning rate?','Run a range test and watch the loss, then use a schedule with warm-up and decay. Too high diverges or oscillates, too low is slow. Adam-type optimisers are less sensitive but still need tuning.'],
['Deep learning','Why do convolutional networks suit images?','Local filters share weights across positions, so they detect a pattern anywhere with far fewer parameters, and stacking layers builds from edges to shapes to objects.'],
['Deep learning','Why did transformers replace recurrent networks for language?','Attention connects any two positions directly, so long-range links are easy, and all positions can be processed in parallel on GPUs, which makes training on huge data practical.'],
['Deep learning','What is the cost of self-attention and how is it reduced?','Time and memory grow with the square of the sequence length. Remedies include windowed or sparse attention, efficient kernels, key-value caching during generation and linear-attention or state-space alternatives.'],
['Deep learning','Explain query, key and value.','Each token produces a query (what it seeks), a key (what it offers) and a value (what it passes on). Attention weights come from query-key similarity, and the output is the weighted sum of values.'],
['Deep learning','What are embeddings and why are they useful?','Learned vectors that place similar items close together, turning words, users or products into numbers a model can compare. They enable search, recommendations and transfer to new tasks.'],
['LLMs','What is the difference between fine-tuning and retrieval-augmented generation?','Fine-tuning changes the model\'s weights to alter behaviour or style. RAG leaves the model unchanged and supplies relevant documents in the prompt, which keeps answers current and citable. Many systems combine them.'],
['LLMs','How does LoRA work and why use it?','It freezes the pretrained weights and learns a low-rank update as the product of two thin matrices. This cuts trainable parameters and memory by orders of magnitude, and adapters are small and swappable.'],
['LLMs','What is quantisation and what are its risks?','Storing weights (and sometimes activations) with fewer bits to save memory and speed up inference. Risks are quality loss, especially from outliers, so use group-wise scales and re-evaluate on your own tasks.'],
['LLMs','How would you evaluate a language-model application?','Build a representative test set with reference answers or rubrics, score automatically where possible and with human or model graders where not, track failures by category, and repeat on every change. Also measure cost, latency and safety.'],
['LLMs','What are hallucinations and how do you reduce them?','Fluent statements that are not supported by facts or sources. Reduce with retrieval and citation, allowing "I do not know", constrained outputs, verification steps and good evaluation.'],
['Production','What is training-serving skew?','A mismatch between how features are computed in training and in production, which silently degrades accuracy. Share code or a feature store between both paths and compare distributions.'],
['Production','How do you monitor a deployed model?','Track service health (latency, errors), input drift, prediction drift, and quality using delayed labels or sampled reviews. Alert on thresholds and keep rollback and retraining plans.'],
['Production','What is concept drift versus data drift?','Data drift is a change in the input distribution. Concept drift is a change in the relationship between inputs and the target. Both can hurt accuracy, and the second is harder to see without labels.'],
['Production','How do you serve a model within a latency budget?','Profile first, then batch requests, cache, use a smaller or quantised model, run on suitable hardware, and scale replicas while keeping utilisation below about 80%. Optimise the tail (p95, p99), not just the mean.'],
['Statistics','Explain Bayes\' rule with a screening example.','For a rare condition, even an accurate test gives mostly false positives, because posterior odds equal prior odds times the likelihood ratio. A 90% test on a 1% condition leaves roughly an 8% chance of being sick after one positive.'],
['Statistics','What is a p-value and what is it not?','The probability of seeing data at least this extreme if the null hypothesis were true. It is not the probability the hypothesis is true, nor the size or importance of an effect.'],
['Statistics','How do you run and read an A/B test?','Randomise users, fix the metric and sample size in advance, run for full cycles, and report the effect with a confidence interval. Beware peeking, many metrics and interference between users.'],
['Statistics','Why does correlation not imply causation?','A confounder can drive both variables, or the direction can be reversed. Randomised experiments or careful adjustment for confounders are needed to estimate a causal effect.'],
['Ethics','How would you check a model for fairness?','Measure error rates and outcomes by relevant groups, compare against the goal that fits the decision (equal opportunity, calibration and others, which can conflict), inspect the data and labels for bias, and monitor after launch.']
];

_P('house',0,'Predict house prices','About 25 min','A small agency wants a quick estimate of what a house will sell for. Plan the model and avoid the classic traps.',[
_S('Frame the problem','start','You have past sales with area, rooms, age and the final sale price.','What kind of problem is predicting the price?','Regression: the answer is a number on a scale','Classification into "cheap" and "expensive" only','Clustering: no answers are known','Reinforcement learning','The target is a number, so this is regression. Classification would throw away detail.'),
_S('Clean the data','data','One house shows a price ten times larger than similar houses in the same street.','What do you do first?','Check whether it is a typing mistake, then fix or remove it','Keep it, because models always ignore oddities','Delete a random half of the data','Multiply every other price by ten','Errors in the data teach the model wrong lessons. Investigate before training.'),

_S('Spot memorising','biasvar','A very flexible model has almost zero error on training houses but a large error on the test houses.','What is happening?','Overfitting: it memorised the training houses','Underfitting: it is too simple','The test set is broken by definition','The data has no pattern','A big gap between training and test error is the signature of overfitting.'),

_C('knn','Code: ask the neighbours','knn','Build the nearest-neighbour vote that labels a new digit.'),
_S('Pick k','knn','With k = 1 one badly drawn training digit sometimes decides the answer.','What helps?','Use a larger k such as 5 and let several neighbours vote','Always use k = 1','Remove all training digits','Use k equal to the whole data size','More voters smooth out noise, but a k that is too large blurs the classes.'),
_S('Judge the errors','metrics','Most mistakes are 4s read as 9s.','What do you do with that finding?','Collect more 4s and 9s, or add features that separate them','Ignore it, since accuracy is high','Switch to predicting only 9','Remove the 4s','Looking at which classes get confused shows where the data or features are weak.'),
_S('Handle neat vs messy writing','biasvar','The recognizer is great on the school\'s own forms but poor on forms from another town.','What explains this?','The new writing differs from the training data','The model is tired','Digits changed shape overnight','The test is unfair by rule','A model reflects the data it saw. Different writers need examples in training.')]);

/* ============ Step-by-step pipeline lab: core (data, cleaning, models, scores) ============ */
const PSPEC={};
const PIPE_STOP=new Set('the a an and or of to in is it this that for on with at by from as be are was were we you i my our your not no so if'.split(' '));
const pSum=a=>a.reduce((x,y)=>x+y,0);
const pMean=a=>a.length?pSum(a)/a.length:0;
const pQuant=(s,q)=>{if(!s.length)return 0;const p=(s.length-1)*q,i=Math.floor(p),f=p-i;return s[i]+(s[Math.min(i+1,s.length-1)]-s[i])*f};
const pRound=(v,d)=>{const m=Math.pow(10,d==null?1:d);return Math.round(v*m)/m};

/* ---------- make a practice dataset from a compact spec ---------- */
function pGen(sp){
  const r=rng(sp.seed||11),n=sp.n||300,D=Object.assign({miss:.05,dup:.03,out:.02,tidy:.2},sp.dirt||{});
  const pick=w=>{let u=r()*pSum(w);for(let i=0;i<w.length;i++){u-=w[i];if(u<=0)return i}return w.length-1};
  const cols=[],rows=[];
  if(sp.kind==='txt'){
    cols.push({name:'text',kind:'text'},{name:sp.target,kind:'target',levels:sp.classes.slice()});
    const C=sp.classes,pri=sp.pri||C.map(()=>1/C.length);
    for(let i=0;i<n;i++){const ci=pick(pri),len=7+Math.floor(r()*8),w=[];
      for(let k=0;k<len;k++){const u=r();let pool;if(u<(sp.own||.42))pool=sp.words[C[ci]];else if(u<.78)pool=sp.common;else{const oc=(ci+1+Math.floor(r()*(C.length-1)))%C.length;pool=sp.words[C[oc]]}w.push(pool[Math.floor(r()*pool.length)])}
      let t=w.join(' ');const u=r();
      if(u<D.tidy)t=t.charAt(0).toUpperCase()+t.slice(1)+(r()<.5?'!':'.');else if(u<D.tidy*1.5)t=t.toUpperCase()+'!!';
      rows.push([t,C[ci]])}
    return pDirty(sp,{cols,rows,kind:'txt',tName:sp.target},D,r);
  }
  const feats=sp.feats.slice();
  if(sp.time)feats.unshift(['day','t']);
  feats.forEach(f=>{const nm=f[0],t=f[1];cols.push({name:nm,kind:t==='n'||t==='t'||t==='l'?'num':'cat',levels:(t==='c')?f[2].slice():(t==='w'?['mon','tue','wed','thu','fri','sat','sun']:null),time:t==='t'})});
  if(sp.leak)cols.push({name:sp.leak,kind:'num',leak:true});
  if(sp.group)cols.push({name:sp.group[0],kind:'cat',levels:sp.group[1].slice(),group:true});
  cols.push({name:sp.target,kind:'target',levels:sp.kind==='reg'?null:sp.classes.slice()});
  const ti=cols.length-1,ys=[];
  for(let i=0;i<n;i++){
    const row=[];let ci=0,y=0;
    const gi=sp.group?pick([1,1]):0;
    if(sp.kind==='reg'){y=sp.base||0;
      sp.feats.forEach(f=>{const t=f[1];
        if(t==='n'){const z=gauss(r);let v=f[2]+f[3]*z;y+=f[4]*z;if(f[6]!=null&&v<f[6])v=f[6];row.push(pRound(v,f[5]==null?1:f[5]))}
        else if(t==='c'){const L=f[2].length,li=f[4]?pick(f[4]):Math.floor(r()*L);y+=f[3][li];row.push(f[2][li])}
        else if(t==='w'){const li=i%7;y+=f[2][li];row.push(['mon','tue','wed','thu','fri','sat','sun'][li])}
        else if(t==='l'){row.push(null)}});
      if(sp.time){y+=(sp.trend||0)*i;row.unshift(i)}
      y+=(sp.noise||1)*gauss(r);if(sp.min!=null&&y<sp.min)y=sp.min;y=pRound(y,sp.dec==null?1:sp.dec);ys.push(y);
      if(sp.leak)row.push(pRound(y*(1+.03*gauss(r)),1));
      if(sp.group)row.push(sp.group[1][gi]);
      row.push(y)}
    else{ci=pick(sp.pri||sp.classes.map(()=>1));const dec=sp.time?1-(sp.drift||0)*i/n:1;
      sp.feats.forEach(f=>{const t=f[1];
        if(t==='n'){let v=f[2]+f[3]*(f[4][ci]*dec+gauss(r));if(f[6]!=null&&v<f[6])v=f[6];row.push(pRound(v,f[5]==null?1:f[5]))}
        else if(t==='c'){const li=pick(f[3][ci]);row.push(f[2][li])}
        else if(t==='w'){row.push(['mon','tue','wed','thu','fri','sat','sun'][i%7])}});
      if(sp.time)row.unshift(i);
      if(sp.leak)row.push(Math.max(0,Math.round(ci*3+.4+gauss(r)*.7)));
      let lab=ci;if(sp.group){if(gi===1&&ci===1&&r()<(sp.bias||0))lab=0;row.push(sp.group[1][gi])}
      row.push(sp.classes[lab])}
    rows.push(row)}
  if(sp.kind==='reg'&&sp.time){ // last value: the value from the day before
    const li=cols.findIndex((c,j)=>sp.feats.some(f=>f[0]===c.name&&f[1]==='l')&&j>=0);
    if(li>=0)rows.forEach((row,i)=>{row[li]=i?rows[i-1][ti]:pRound(pMean(ys),1)})}
  return pDirty(sp,{cols,rows,kind:sp.kind,tName:sp.target},D,r);
}
function pDirty(sp,data,D,r){
  const {cols,rows}=data,ti=cols.length-1;
  // blanks, loud outliers, messy labels
  rows.forEach(row=>cols.forEach((c,j)=>{
    if(c.kind==='target'||c.time||c.leak)return;
    if(c.kind==='num'&&r()<D.miss)row[j]=null;
    else if(c.kind==='num'&&r()<D.out&&row[j]!=null)row[j]=pRound(row[j]*(4+r()*4),1);
    else if(c.kind==='cat'&&!c.group&&r()<D.miss*.6)row[j]='';
    else if(c.kind==='cat'&&!c.group&&row[j]&&r()<D.tidy){const u=r();row[j]=u<.4?row[j].charAt(0).toUpperCase()+row[j].slice(1):u<.7?' '+row[j]+' ':row[j].toUpperCase()}
    else if(c.kind==='text'&&r()<D.miss*.5)row[j]=r()<.5?'':'N/A'}));
  // repeated rows
  const out=[];rows.forEach(row=>{out.push(row);if(r()<D.dup)out.push(row.slice())});
  data.rows=out;data.ti=ti;data.n=out.length;
  data.numCols=cols.map((c,j)=>c.kind==='num'?j:-1).filter(j=>j>=0);
  return data;
}
/* ---------- what is wrong with the data? ---------- */
const pCanon=v=>typeof v==='string'?v.trim().toLowerCase():v;
const pBlank=v=>v==null||v===''||v==='N/A';
function pFences(vals){const s=vals.filter(v=>v!=null).sort((a,b)=>a-b),q1=pQuant(s,.25),q3=pQuant(s,.75),i=q3-q1;return[q1-1.5*i,q3+1.5*i]}
function pScan(data){
  const {cols,rows}=data,seen=new Set();let dup=0;
  rows.forEach(r=>{const k=JSON.stringify(r);if(seen.has(k))dup++;else seen.add(k)});
  const miss=cols.map((c,j)=>c.kind==='target'?0:rows.filter(r=>pBlank(r[j])).length);
  const out=cols.map((c,j)=>{if(c.kind!=='num'||c.time||c.leak)return 0;const [lo,hi]=pFences(rows.map(r=>r[j]));return rows.filter(r=>r[j]!=null&&(r[j]<lo||r[j]>hi)).length});
  const messy=cols.map((c,j)=>{if(c.kind!=='cat'||c.group)return 0;const raw=new Set(rows.map(r=>r[j]).filter(v=>v)),can=new Set([...raw].map(pCanon));return raw.size-can.size});
  const textBad=cols.some(c=>c.kind==='text')?rows.filter(r=>/[A-Z!.]/.test(r[0])).length:0;
  return{dup,miss,out,messy,textBad,missTotal:pSum(miss),outTotal:pSum(out),messyTotal:pSum(messy)}
}
/* ---------- turn raw rows into model-ready numbers (fit on train only) ---------- */
function pDefaultRecipe(data){return{dedupe:false,tidy:false,miss:'none',out:'none',use:Object.fromEntries(data.cols.filter(c=>c.kind!=='target').map(c=>[c.name,true])),enc:'none',scale:'none',vocab:150,stop:false,weight:'count',test:25,seed:7,method:'random',strat:false}}
function pTokens(s,rec){let t=String(s==null?'':s);if(rec.tidy)t=t.toLowerCase().replace(/[^a-z0-9\s]/g,' ');let w=t.split(/\s+/).filter(Boolean);if(rec.stop)w=w.filter(x=>!PIPE_STOP.has(x.toLowerCase()));return w}
function pSplit(data,rec){
  let rows=data.rows.map(r=>r.slice());const ti=data.ti,cols=data.cols,notes=[];
  if(rec.tidy)rows=rows.map(r=>r.map((v,j)=>cols[j].kind==='cat'||cols[j].kind==='target'?pCanon(v):v));
  if(rec.dedupe){const seen=new Set(),n0=rows.length;rows=rows.filter(r=>{const k=JSON.stringify(r);if(seen.has(k))return false;seen.add(k);return true});notes.push('Removed '+(n0-rows.length)+' repeated rows before splitting.')}
  rows=rows.filter(r=>!pBlank(r[ti]));
  const n=rows.length,nt=Math.max(5,Math.round(n*rec.test/100));let tr=[],te=[];
  if(rec.method==='time'){tr=rows.slice(0,n-nt);te=rows.slice(n-nt)}
  else{const rr=rng(rec.seed*7919+13),idx=rows.map((_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(rr()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
    if(rec.strat&&data.kind!=='reg'){const by={};idx.forEach(i=>{(by[rows[i][ti]]=by[rows[i][ti]]||[]).push(i)});Object.values(by).forEach(a=>{const k=Math.round(a.length*rec.test/100);a.forEach((i,q)=>(q<k?te:tr).push(rows[i]))})}
    else{idx.forEach((i,q)=>(q<nt?te:tr).push(rows[i]))}}
  return{tr,te,notes}
}
function pPrepare(data,rec,sp){
  const sd=pSplit(data,rec),cols=data.cols,ti=data.ti,notes=sd.notes.slice();let tr=sd.tr,te=sd.te;
  const isTxt=data.kind==='txt',cls=cols[ti].levels;
  const yOf=r=>data.kind==='reg'?r[ti]:cls.indexOf(r[ti]);
  if(isTxt){
    const doc=r=>pTokens(r[0],rec),df={};
    tr.forEach(r=>{new Set(doc(r)).forEach(w=>df[w]=(df[w]||0)+1)});
    const vocab=Object.keys(df).filter(w=>df[w]>=2).sort((a,b)=>df[b]-df[a]||(a<b?-1:1)).slice(0,rec.vocab),vi=new Map(vocab.map((w,i)=>[w,i]));
    const idf=vocab.map(w=>Math.log((1+tr.length)/(1+df[w]))+1);
    const vec=r=>{const v=new Array(vocab.length).fill(0);doc(r).forEach(w=>{if(vi.has(w))v[vi.get(w)]+=1});
      if(rec.weight==='binary')for(let i=0;i<v.length;i++)v[i]=v[i]?1:0;else if(rec.weight==='tfidf'){for(let i=0;i<v.length;i++)v[i]*=idf[i];const nm=Math.sqrt(pSum(v.map(x=>x*x)))||1;for(let i=0;i<v.length;i++)v[i]/=nm}return v};
    notes.push('Bag of words with '+vocab.length+' words.');
    return{Xtr:tr.map(vec),ytr:tr.map(yOf),Xte:te.map(vec),yte:te.map(yOf),names:vocab,trRows:tr,teRows:te,notes,vocab}
  }
  const use=cols.map((c,j)=>c.kind!=='target'&&rec.use[c.name]!==false&&!c.group?j:-1).filter(j=>j>=0);
  const gcol=cols.findIndex(c=>c.group);
  const nums=use.filter(j=>cols[j].kind==='num'),cats=use.filter(j=>cols[j].kind==='cat');
  if(!use.length)return{error:'Pick at least one column to learn from.'};
  // blanks
  const isB=v=>pBlank(v);
  if(rec.miss==='drop'){const n0=tr.length+te.length;const ok=r=>use.every(j=>!isB(r[j]));tr=tr.filter(ok);te=te.filter(ok);notes.push('Dropped '+(n0-tr.length-te.length)+' rows with blanks.')}
  const fill={};
  nums.forEach(j=>{const s=tr.map(r=>r[j]).filter(v=>!isB(v)).sort((a,b)=>a-b);fill[j]=rec.miss==='mean'?pMean(s):pQuant(s,.5)});
  const cfill={};cats.forEach(j=>{const cnt={};tr.forEach(r=>{if(!isB(r[j]))cnt[r[j]]=(cnt[r[j]]||0)+1});const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];cfill[j]=rec.miss==='mean'||rec.miss==='median'?top:'unknown'});
  let left=0;
  const fx=r=>r.map((v,j)=>{if(!use.includes(j))return v;if(isB(v)){if(rec.miss==='mean'||rec.miss==='median')return cols[j].kind==='num'?fill[j]:cfill[j];if(rec.miss==='drop')return v;left++;return v}return v});
  tr=tr.map(fx);te=te.map(fx);
  if(left>0&&rec.miss==='none')return{error:'blanks',left,notes};
  // outliers
  const fen={};nums.forEach(j=>{if(cols[j].time)return;fen[j]=pFences(tr.map(r=>r[j]))});
  if(rec.out==='cap'){const cap=r=>r.map((v,j)=>fen[j]&&typeof v==='number'?Math.min(fen[j][1],Math.max(fen[j][0],v)):v);tr=tr.map(cap);te=te.map(cap)}
  else if(rec.out==='remove'){const n0=tr.length;tr=tr.filter(r=>nums.every(j=>!fen[j]||(r[j]>=fen[j][0]&&r[j]<=fen[j][1])));notes.push('Removed '+(n0-tr.length)+' extreme rows from the practice rows.')}
  // build columns
  let names=[],getters=[];
  nums.forEach(j=>{names.push(cols[j].name);getters.push({j,t:'n'})});
  if(rec.enc==='onehot')cats.forEach(j=>{const lv=[...new Set(tr.map(r=>r[j]))].sort().slice(0,14);lv.forEach(l=>{names.push(cols[j].name+'='+l);getters.push({j,t:'c',l})})});
  else if(cats.length)notes.push('Left out text columns ('+cats.map(j=>cols[j].name).join(', ')+') because they are not encoded.');
  const raw=rows=>rows.map(r=>getters.map(g=>g.t==='n'?+r[g.j]:(r[g.j]===g.l?1:0)));
  let Xtr=raw(tr),Xte=raw(te);
  if(rec.scale!=='none'){const D=names.length;for(let c=0;c<D;c++){if(getters[c].t!=='n')continue;const v=Xtr.map(x=>x[c]);let a,b;
      if(rec.scale==='standard'){a=pMean(v);b=Math.sqrt(pMean(v.map(x=>(x-a)*(x-a))))||1}else{a=Math.min(...v);b=(Math.max(...v)-a)||1}
      Xtr.forEach(x=>x[c]=(x[c]-a)/b);Xte.forEach(x=>x[c]=(x[c]-a)/b)}}
  const out={Xtr,ytr:tr.map(yOf),Xte,yte:te.map(yOf),names,trRows:tr,teRows:te,notes,gcol};
  return out
}
/* ---------- models ---------- */
const pDist=(a,b)=>{let s=0;for(let i=0;i<a.length;i++){const d=a[i]-b[i];s+=d*d}return Math.sqrt(s)};
const pCos=(a,b)=>{let d=0,x=0,y=0;for(let i=0;i<a.length;i++){d+=a[i]*b[i];x+=a[i]*a[i];y+=b[i]*b[i]}return 1-d/((Math.sqrt(x*y))||1)};
function pTrain(kind,m,X,y,K,txt){
  const t0=performance.now(),D=X[0]?X[0].length:0;let M={};
  if(m.type==='knn'){const k=Math.max(1,m.k|0),df=txt?pCos:pDist;
    M.predict=Z=>Z.map(z=>{const ds=X.map((x,i)=>[df(z,x),i]).sort((a,b)=>a[0]-b[0]).slice(0,k);
      if(kind==='reg')return pMean(ds.map(d=>y[d[1]]));const v=new Array(K).fill(0);ds.forEach(d=>v[y[d[1]]]+=1/(1+d[0]));return v.indexOf(Math.max(...v))})}

_D('spamscale',0,'Spam filter for a mail service','25 min','Millions of inboxes, every email checked before it lands. Mistakes in either direction hurt.',[20,40,4,60,300,2,30],[
`A mail service wants to stop spam without losing real mail.~What do you pin down first?~What a mistake costs: a real email in spam is worse than a spam email in the inbox, so decide how careful to be~Which model is fanciest~How many servers to rent~What colour the spam folder is~The two mistakes cost different amounts. That choice sets your threshold and your metric.`,
`You must pick the number you will watch.~Which metric is most useful as the main one?~Precision on the spam label (how often "spam" is right) plus recall, tracked as a pair, with false positives watched closely~Plain accuracy~Number of emails processed per second~Training loss~Most mail is not spam, so accuracy looks great even for a bad filter. Precision and recall show the real trade-off.`,
`You have mail that users marked as spam or not spam.~How do you get trustworthy labels?~Use user reports plus a small team of reviewers, and check for users who mark newsletters as spam inconsistently~Trust every user report as truth~Label by sender name length~Use only the mail that was already blocked~User reports are noisy and biased. Mixed with reviewed samples they give cleaner labels. Using only blocked mail would never teach the filter what it missed.`,
`Spammers change their tricks all the time.~What is a sensible modelling plan?~Start with a simple model on text and sender features, add sender reputation and links, and retrain often on fresh data~Train once on last year's data and leave it~Use one rule: block the word "free"~Pick the largest language model you can afford~Simple models are fast and easy to debug. Fresh data and reputation signals matter more than size because spam keeps changing.`,
`Each email must be checked in a fraction of a second.~Where should the checks run?~In a cheap fast filter first (blocklists, rules, small model) with a heavier model only on the unsure middle~Run the heaviest model on every email~Check mail once a day in a batch~Let each user's phone decide~Most mail is clearly fine or clearly spam. A cheap first pass saves the expensive model for hard cases.`,
`Use the calculator: how many servers does the busiest hour need?~Which number should you size the system for?~Peak requests per second with some headroom~Average requests per second~Total users divided by 24~The number of spam emails per day~Capacity must cover the peak. Sizing for the average means slow mail whenever traffic spikes.`,
`The new filter is ready.~How do you launch safely?~Run it in shadow mode first, compare with the old filter, then send it to a small share of users and watch false positives before widening~Switch everyone on tonight~Ask users to test it~Only look at training accuracy~Shadow mode and a small rollout catch mistakes while they are cheap. False positives are the thing to watch.`,
`The filter is live.~What do you monitor?~The spam rate, user complaints about missing mail, score drift, and how fast new spam types are caught, with a one-click way to roll back~Only CPU use~Nothing, it is automatic~Only the model's size~Spam changes, so scores drift. Complaints are the early warning that you are blocking real mail.`]);
_D('notifsend',0,'Smart notifications','25 min','Choose who to nudge and when, without making people turn notifications off.',[10,3,6,2,2000,1,60],[
`An app wants to remind people about things they care about.~What is the real goal?~More long-term use without annoying people: success is people who stay and keep notifications on, not just opens~The most notifications sent~The highest open rate today~Using a neural network~Easy opens can come from annoying people. Long-term use and opt-out rate show if the nudge helps.`,
`You must measure if it works.~Which main metric with a guardrail?~Return visits over the next week, with opt-out rate and complaints as guardrails~Notifications sent per day~Open rate alone~Average length of the message~Open rate alone rewards loud messages. A guardrail on opt-outs keeps the system honest.`,
`You have a log of sent notifications and what happened.~What is the labelling trap?~The log only shows people we chose to nudge, so we do not know what would have happened without a nudge; keep a small random holdout~Everyone who opened is a success, so no trap~We should label by phone model~There is no trap~Past nudges were chosen by an older rule. A random holdout shows the true effect of nudging.`,
`You want to decide who to nudge and when.~Which approach fits first?~Start with simple rules and a model of how likely each person is to respond, then test send-time and frequency caps~Send to everyone at 9 am~Use reinforcement learning on day one~Guess the best hour by hand~A simple response model plus caps is easy to test. More complex methods can come after you have a baseline.`,
`Messages should go out at the right time for each person.~How is the system laid out?~A scheduled job scores users in batches, a queue sends messages at the chosen times, and a rule layer applies caps and quiet hours~The app asks the model on every tap~Send everything at once~Store a message per user forever~Batch scoring is cheap and enough here. Rules for quiet hours must sit outside the model so they are always respected.`,
`Use the calculator: sending is bursty.~Which number matters most when sizing the sender?~Peak sends per second, because many people share the same best hour~Average sends per day~Number of app screens~Training time~Everyone gets nudged near the same times. The queue must handle the burst or messages arrive late.`,
`You think the new model is better.~How do you check?~An A/B test with a holdout that gets no nudge, checking return visits and opt-outs for at least a week~Compare opens before and after launch~Trust the offline score~Ask the marketing team~Before-and-after comparisons mix in other changes. A holdout isolates the effect of the nudge.`,
`The system runs daily.~What do you watch?~Opt-out and complaint rates by segment, delivery delays, and a hard cap on messages per person per day~Only open rate~Only server cost~Nothing~A model that chases opens can slowly annoy people. Caps and opt-out tracking protect trust.`]);
_D('demandfc',0,'Demand forecasting for a store chain','30 min','Predict how much of each product each shop will sell next week so shelves are neither empty nor overstuffed.',[0.005,2000,2,5,500,1,730],[
`A chain wants to know how many items to order.~What do you clarify first?~How far ahead you forecast, how often orders are placed, and what hurts more: running out or having waste~Which library to use~How to draw the chart~The shop logo~The forecast horizon and the cost of the two errors set everything: the target, the metric and how careful to be.`,
`You must choose how to score forecasts.~Which main metric?~A percentage or absolute error per product-store, plus how often stock runs out, weighted by what each mistake costs~Training loss~Accuracy~Number of forecasts made~Business costs differ for different products. Error alone can hide empty shelves on important items.`,
`Sales history has gaps and spikes.~What data problem do you handle?~Days with no stock look like zero demand, so mark stock-outs; also add holidays, promotions and prices~Replace all zeros with the average~Delete weekends~Use only last month~A zero from an empty shelf is not zero demand. If you ignore stock-outs you under-forecast forever.`,
`You must predict next week for thousands of products.~How do you model it?~Begin with simple baselines (same week last year, moving average), then one model across all products using calendar, price and promo features~Train a separate deep network per product~Use a coin flip~Forecast only the total~Baselines are strong and set the bar. One shared model learns from products with little history.`,
`Orders go out once a day.~How is it built?~A nightly batch job reads fresh sales, builds features, writes forecasts to a table that the ordering system reads~Run the model each time a customer buys~Ask store managers by phone~Run it once a year~Daily decisions need a daily batch. Real-time serving would cost more and add nothing.`,
`Use the calculator: forecasts are small but history is long.~Which resource grows fastest?~Storage of sales history over the years, so plan retention and summaries~Number of servers at peak~Network bandwidth~Phone battery~Requests are few, but years of sales for many items add up. Decide how long to keep raw data.`,
`You want to trust the new forecasts.~How do you test them?~Backtest by pretending to forecast past weeks using only data available then, then run in a few stores before all~Test on shuffled rows~Compare on training data~Launch everywhere~Time-ordered backtests match real use. Shuffled tests leak the future.`,
`Forecasts are live.~What do you monitor?~Forecast error by product group, stock-outs and waste, and alerts when a new promotion or product breaks the pattern~Only server uptime~Number of forecasts~Nothing~New products and promos behave differently. Error tracking shows when the model needs help.`]);
_D('vidrec',1,'Video recommendations','35 min','Pick a handful of videos from millions for each person on the home screen.',[50,6,3,40,800,5,90],[
`A video app wants better suggestions on its home screen.~What do you pin down first?~What "better" means (people are satisfied, not just clicking) and what must not get worse~Which neural network to use~How many GPUs to buy~Which database holds the videos~Goals and guardrails come before models. Without them you will optimise clicks and get clickbait.`,
`You need one main metric.~Which one and what guardrails?~Satisfied watch time (watch time weighted by finishes or likes), guarded by variety and complaint rates~Click-through rate alone~Number of videos uploaded~Training loss~Clicks reward clickbait. A guardrail on variety stops a narrow feed.`,
`You have logs of what was shown and what was watched.~How do you build labels?~Shown videos are the examples: positive for a long watch or like, negative for shown but skipped; videos never shown are unknown, not negative~Label everything not watched as negative~Use only clicked videos~Label by title length~Treating "not shown" as negative teaches the model only what it already showed.`,
`There are ten million videos.~How is the model structured?~Two stages: fast candidate retrieval with embeddings to a few hundred videos, then a heavier ranker~One model scores all ten million per request~Show the most popular videos to all~Pick at random~Scoring everything is too slow. Two stages balance coverage with cost.`,
`The home screen must load in 300 ms.~Where do heavy computations go?~Precompute user and video embeddings offline; at request time do a nearest-neighbour lookup, rank a few hundred, and fall back to popular videos if anything fails~Compute embeddings fresh every request~Run all on the phone~Retrain on every click~Offline work keeps the request path short. A fallback keeps the page working.`,
`Use the calculator.~Which number do you size the servers for?~Peak requests per second with headroom~Average requests per second~Registered users~Videos uploaded per day~Capacity must cover spikes such as evenings and big releases.`,
`The new ranker beats the old one offline.~How do you launch?~A time-split offline check, then an A/B test with guardrails, then a slow rollout with an easy rollback~Launch to everyone~Ask friends~Compare training scores~Offline wins do not always carry to real users. An A/B test is the real test.`,
`The system is live.~What do you monitor?~Watch time and complaints by segment, feature freshness, latency, and how varied the videos are, with a fallback list ready~Server CPU only~Training loss~Nothing~Recommendation systems can quietly narrow what people see. Variety and freshness checks catch that early.`]);
_D('etaride',1,'Arrival time for a ride app','30 min','Tell riders how long the trip will take, and be right more often than not.',[5,8,5,3,1500,2,30],[
`A ride app shows an arrival time for each trip.~What does a good estimate mean?~Close to the real time, and rarely far too optimistic, because a late car upsets people more than an early one~The lowest possible time~The average time of all trips~A time that looks nice~A late ride hurts more than an early one, so the cost of error is not symmetric.`,
`You need to track quality.~Which metric?~Median and 90th-percentile absolute error, plus how often trips run more than five minutes late~Accuracy~Number of trips~Model size~Averages hide the bad cases. Percentiles show how the worst trips go.`,
`You have past trips with start, end and times.~What data trap should you avoid?~Using information that is only known after the trip, such as the actual route taken, when you only have the pickup and drop-off at prediction time~Using the date~Using the weather~Using the pickup place~Features must exist at the moment you predict. Using the final route would make the offline score look great and fail live.`,
`You need to predict a number.~How do you start?~A route-based baseline from map data, then a model that predicts the correction using time of day, weather and live traffic~A neural network from the first day~Always say ten minutes~Use the previous trip's time~A map baseline is strong. A model that learns the correction is simpler and safer than learning everything.`,
`Estimates must come back in a few tens of milliseconds.~How is it served?~Keep recent traffic in a fast store, compute features on the fly, call a small model, and fall back to the map time if anything is slow~Run a large model every time~Compute offline once a day~Call the driver~Speed matters. A small model plus a fallback keeps estimates fast and available.`,
`Use the calculator: rush hours.~What do you size for?~Peak requests per second during rush hour, since many riders ask at once~Average per second~Trips per year~Number of drivers~The busiest minutes decide capacity.`,
`A new model is ready.~How do you test it?~Compare error on recent unseen days, check by city and hour, then shadow-run live before showing riders~Test on random old rows~Compare training error~Launch everywhere~Time-based tests match reality. City and hour breakdowns find hidden failures.`,
`The system is live.~What do you monitor?~Error percentiles by city and hour, data freshness of traffic feeds, and alerts when a big event or storm changes patterns~Only server uptime~Number of requests~Nothing~Rare events break normal patterns. Freshness checks catch broken traffic feeds early.`]);
_D('modimg',1,'Image moderation','35 min','Keep harmful pictures off a photo-sharing app while letting normal photos through.',[30,2,3,300,100,4,30],[
`A photo app must stop harmful uploads.~What do you pin down first?~The categories to block, how strict each is, and what happens next: block, blur, or send to a human~Which image network~Where to store photos~How to compress photos~Policies decide what the model must learn and where humans stay in the loop.`,
`You need metrics.~What do you track?~Precision and recall for each harmful category, with extra weight on missing the worst kinds, and how many items need human review~Overall accuracy~Pixels per image~Upload speed~Harmful images are rare, so accuracy looks great even for a weak model. Per-category recall matters.`,
`Harmful examples are rare.~How do you get labels?~Reviewers label a sample, with extra sampling of uncertain and reported images, and a clear guide for hard cases~Label randomly and hope~Use no labels~Label by image size~Random samples contain almost no harmful images. Targeted sampling finds more with the same effort.`,
`You need a model.~What is a sensible plan?~Fine-tune a pretrained image model, add hash-matching for known harmful images, and score text in captions as well~Train a network from scratch~Block by file name~Use colour histograms~Pretrained models need far less data. Hash matching catches known bad images exactly.`,
`Uploads should be checked quickly.~How is it built?~Run a fast check at upload; send uncertain items to a slower model and a human queue; keep a way to re-scan old photos when rules change~Check every photo by hand~Check once a week~Skip big images~A tiered flow keeps cost down and puts humans where they add most value.`,
`Use the calculator: images are heavy.~What limits you first?~Model throughput per GPU server at peak uploads, so measure images per second per machine~Disk space only~Number of users~Screen size~Image models are costly. GPU capacity at peak is usually the bottleneck.`,
`A new threshold is proposed.~How do you test it?~Replay a labelled set with known tricky cases, then run in shadow mode and review the differences with humans~Change it in production~Ask users~Use training accuracy~Moderation mistakes are public. Shadow mode with human review catches them first.`,
`The system is live.~What do you monitor?~Block and appeal rates, reviewer disagreement, new abuse tactics, and fairness across groups and regions~Only latency~Only cost~Nothing~People try to evade filters, so tactics change. Appeal rates reveal over-blocking.`]);

_D('fraudrt',1,'Card fraud check in real time','35 min','Decide in milliseconds whether a card payment looks stolen, without blocking honest shoppers.',[10,3,4,2,500,3,365],[
`A bank must approve or block each card payment as it happens.~What do you clarify first?~The cost of each mistake and the time limit: a blocked honest payment annoys a customer, a missed theft costs money, and the answer is needed in under 100 ms~Which model library~The brand of card reader~Colour of the app~The costs and the time limit decide the metric, the threshold and the design.`,
`Fraud is very rare.~Which metric do you use?~Precision and recall at the chosen threshold, plus money saved versus money lost to false alarms~Accuracy~Number of payments~Model size~With 1 fraud in 1,000 payments, a model that says "fine" is 99.9% accurate and useless.`,
`Fraud labels arrive late.~How do you handle labels?~Wait for chargebacks to confirm fraud, train on older confirmed data, and treat the most recent weeks as not fully labelled~Treat unreported payments as honest right away~Use only today's data~Label every blocked payment as fraud~Fraud is reported weeks later. Recent payments look honest only because the label has not arrived yet.`,
`You need features and a model.~What is a sensible choice?~Features about the card's recent behaviour (spend in the last hour, new country, new shop), with a gradient-boosted trees model that handles tabular data well~A language model~Only the amount~A random guess~Behaviour over a recent window is the strongest fraud signal. Boosted trees are fast and strong on this kind of table.`,
`The decision must be made in a few milliseconds.~How is the system built?~A fast feature store with recent card activity, a small model call in the payment path, rules for obvious cases, and a safe default if the model is slow~Recompute all history for each payment~Run the model overnight~Ask the customer by email~Recent counts must be ready to read, not recomputed. A safe default keeps payments flowing.`,
`Use the calculator.~What do you size for?~Peak payments per second, such as holiday shopping hours, with headroom~Average per second~Number of customers~Fraud per year~Payments spike on holidays and the check cannot slow down.`,
`You want to roll out a better model.~How?~Replay past traffic offline, run the new model in shadow mode next to the old one, then let it decide for a small slice~Switch all at once~Test on training data~Ask the fraud team to decide~Shadow mode compares decisions without risking customers.`,
`The model is live.~What do you monitor?~Fraud caught and false alarm rates, score distribution shifts, feature freshness, and new fraud patterns, with a quick way to add rules~Only server uptime~Number of cards~Nothing~Fraudsters adapt. Shifts in scores and sudden spikes show it.`]);
_D('docqa',1,'Question answering over company documents','35 min','Employees ask questions and get answers with sources, from files that change every week.',[0.05,10,3,6,20,8,90],[
`A company wants an assistant that answers from its own documents.~What do you clarify first?~What counts as a good answer: correct, from the documents, with a source, and which documents each person may see~Which chat model is largest~The logo of the assistant~How fast typing is~Correctness, sources and access rules shape everything else.`,
`You need to know if it works.~How do you measure?~A test set of real questions with ideal answers; score whether retrieval found the right passage and whether the answer was correct, grounded and cited~Count how many questions were asked~Ask people if it feels smart~Measure tokens per second~Check retrieval and answer quality separately so you know which part to fix.`,
`The documents are PDFs, wiki pages and slides.~How do you prepare them?~Extract clean text, keep titles and headings, split into chunks with overlap, and store the source and permissions with every chunk~Paste everything into one prompt~Store each file as one chunk~Remove all headings~Chunks must be small enough to retrieve exactly, and need metadata for citations and access control.`,
`You need to find the right passages.~What is a good retrieval plan?~Combine keyword search and embedding search, rerank the top results, and filter by what the user may see~Embedding search only on the whole file~Return random chunks~Return the newest file~Keyword and embedding search catch different questions. Reranking improves precision.`,
`The assistant must answer with sources.~How do you design the answer step?~Give the model only the retrieved passages, ask for an answer with citations, and say "I do not know" when the passages do not contain it~Let the model answer from memory~Give all documents~Hide the sources~Grounding on retrieved text with an allowed "I do not know" reduces made-up answers.`,
`Use the calculator.~Which cost matters most here?~The cost and delay of the language model call per question, since it dominates over search~Disk space for the index~Network cables~Number of PDFs~Search is cheap. Each answer uses a large model, so cost per question and response time are the limits.`,
`You changed the chunking.~How do you test it?~Re-run the same test questions, compare retrieval hits and answer correctness, and read failures by hand before rolling out~Ask one person~Trust the demo~Compare tokens~A fixed question set shows if a change helps or hurts.`,
`The assistant is live.~What do you monitor?~Thumbs-down and "no answer" rates, stale documents, access-control checks, and a sample of answers reviewed each week~Only uptime~Only cost~Nothing~Documents change, so answers can go stale. Reviews catch silent failures.`]);
_D('supportbot',2,'Customer support agent with tools','40 min','An assistant that answers questions and takes actions like refunds, safely.',[0.5,2,4,10,15,12,90],[
`A shop wants an agent to resolve support chats.~What do you pin down first?~Which tasks it may do alone, which need human approval, and what counts as a solved chat~Which model name to use~What voice it speaks in~How many emoji to use~Autonomy limits matter more than model choice. Refunds and account changes need rules.`,
`You must measure success.~Which metrics?~Correct resolution rate, escalation rate, customer satisfaction, and a count of harmful or wrong actions~Messages per minute~Length of replies~Token count~Resolution and harmful actions show real value and risk.`,
`You have past chats and policies.~What do you use for knowledge?~Policy documents and past solved chats for retrieval, with rules kept up to date and versioned~Only the model's general knowledge~Chats from unrelated companies~Nothing~Policies change. Retrieval from current documents keeps answers right.`,
`The agent must act, not only talk.~How do you design the tools?~Small, well-described tools with strict inputs (look up order, issue refund up to a limit), checked by code before running~One tool that runs any command~Let the model write SQL freely~No limits~Strict tools with limits make mistakes small and traceable.`,
`Actions can cost money.~How do you build safety?~Code-enforced limits, human approval above a refund amount, logging of every call, and the ability to stop the agent at any step~Trust the prompt to say "be careful"~Allow unlimited refunds~Turn off logs~Prompts can be ignored. Limits must be enforced in code.`,
`Use the calculator.~What shapes cost and delay?~Number of model calls per chat, since an agent may call the model and tools several times~Database size~Image size~Disk speed~Each step is a call. Long loops multiply cost and waiting time.`,
`You change the prompt.~How do you test?~Replay a set of real chats with known good outcomes, check actions taken, and run a small live trial with human review~Test one example~Trust the demo~Ask the model if it is good~Agents fail in unexpected ways. A replay set catches regressions.`,
`The agent is live.~What do you monitor?~Resolution and escalation rates, action logs, odd refund patterns, customer complaints, and prompt-injection attempts~Only response time~Only token use~Nothing~Customers can try to trick it. Action logs and limits keep damage small.`]);
_D('autocomp',2,'Search autocomplete','35 min','Suggest the rest of a query after each keystroke, in a few milliseconds.',[100,30,3,1,3000,1,14],[
`A search box should suggest the rest of what you are typing.~What do you clarify?~What is being suggested (popular queries, personal history, products), the delay allowed per keystroke, and which suggestions must never appear~Which font to use~How many results per page~The keyboard layout~Latency and safety rules limit what is possible.`,
`You need metrics.~Which ones?~Acceptance rate of suggestions, keystrokes saved, and time to first suggestion, with a block-list violation rate as a guardrail~Number of queries~Model size~Page weight~Suggestions are good if people use them and they arrive fast. A guardrail handles harmful suggestions.`,
`You have a query log.~How do you build the data?~Count queries by prefix with recency weighting, remove personal or harmful queries, and keep location and language~Use every query raw~Keep only unique queries~Use the dictionary~Raw logs contain private and offensive text. Cleaning is essential.`,
`You need ranking.~What is a good start?~A prefix lookup of popular candidates, reranked with a light model using context such as time, place and the user's recent searches~A large language model for each keystroke~Alphabetical order~Random~A fast index finds candidates. Light reranking keeps the answer in milliseconds.`,
`Each keystroke needs an answer in about 50 ms.~Where do you put things?~An in-memory index near the user, cached popular prefixes, and a small model, with the request cancelled when the user types again~One central database far away~A big model each time~Compute on the phone only~Latency forces caching and nearby servers.`,
`Use the calculator: each keystroke is a request.~What multiplies the load?~Requests per search, since each keystroke is one, so peak requests per second is far higher than search count~Number of countries~Image count~Price~Each query triggers many requests, so size for peak keystrokes.`,
`A new reranker is ready.~How do you test it?~Replay logs offline, then an A/B test on acceptance rate and keystrokes saved with latency as a guardrail~Ask colleagues~Launch to all~Test on a dictionary~Latency is part of quality here. A/B checks both.`,
`The system is live.~What do you monitor?~Latency percentiles, acceptance rate, blocked-suggestion hits, and sudden trending queries that need review~Only average latency~Only CPU~Nothing~Trending news can surface bad suggestions quickly. Percentiles show the slowest users.`]);
_D('searchrank',2,'Search ranking for an online shop','40 min','Order millions of products so the best ones appear first for each search.',[80,5,3,25,400,4,60],[
`A shop wants better search results.~What do you clarify first?~What a good result is (found and bought something they wanted), which queries matter, and what must not suffer (variety, small sellers, price fairness)~Which algorithm~Which cloud~The size of the product images~You cannot rank well until you know what "good" means and who must not be harmed.`,
`You need metrics.~What do you track?~An offline ranking measure such as NDCG on judged queries, and online purchases and returns, with zero-result searches as a guardrail~Number of pages~Server cost~Title length~NDCG checks order quality. Online metrics show real behaviour.`,
`You have clicks and purchases.~What is the label trap?~Clicks are biased by position: top results get clicked just because they are on top; correct for this or use random exploration~Clicks are perfect labels~Use only purchases~Use product price~People click what they see. If you ignore position bias the model learns to repeat the old ranking.`,
`You must rank a few thousand matches fast.~What is a good model plan?~Retrieve with keywords and embeddings, then rerank with a learned ranking model using query, product and behaviour features~Rank alphabetically~Rank by price only~Use only popularity~Retrieval brings candidates. A learned reranker combines many signals.`,
`Search must answer in about 200 ms.~How is it laid out?~A search index with the first stage, a feature store for popularity and price, a reranker on the top few hundred, and caches for common queries~One huge database query~Compute rankings on the phone~Offline only~The first stage cuts the pool so the heavier model scores few items.`,
`Use the calculator.~What do you size for?~Peak searches per second and the reranker's cost per search~Number of products only~Number of sellers~Page colour~Peak load and cost per request decide servers.`,
`You trained a better ranker.~How do you launch?~Offline judgement tests, then an interleaved or A/B test with purchase, return and zero-result guardrails~Replace the old one~Ask the team~Compare click counts only~Clicks can rise while buying falls. Look at purchases and returns too.`,
`The system is live.~What do you monitor?~Zero-result queries, purchase rate by query type, index freshness for price and stock, and fairness across sellers~Only latency~Only revenue~Nothing~Stale prices and stock quietly hurt trust. Query-level tracking finds weak spots.`]);
_D('adsctr',2,'Ad click prediction','40 min','Estimate how likely each person is to click each ad, hundreds of thousands of times per second.',[200,25,3,5,2000,2,30],[
`An ad platform picks which ad to show.~What do you clarify first?~The goal (revenue and advertiser value), the quality limits for users, and that predicted probabilities must be accurate, not just ordered~The font size~Which GPU~The ad colour~Ads are chosen by expected value, so the click probability must be well calibrated.`,
`You need metrics.~Which ones?~Log loss and calibration offline, plus online revenue and user experience guardrails~Accuracy~Number of ads~Model size~Predicted probabilities feed auctions, so calibration matters as much as ranking.`,
`Clicks are rare.~How do you handle this?~Keep all clicks, sample non-clicks, and correct the probabilities afterwards so they remain calibrated~Drop all the non-clicks~Remove the clicks~Add fake clicks~Sampling saves cost but changes the base rate, so you must correct predictions.`,
`Features are mostly categories like user, ad and page.~What model suits?~A model that handles many sparse categories with embeddings plus crossing features, trained on fresh data~Linear regression on raw ids~A single rule~Random forest on text~Sparse categories need embeddings. Fresh data matters because ads change daily.`,
`Responses must arrive in about 10 ms per auction.~How do you design serving?~Precompute what you can, keep embeddings in memory, score many ads in a batch, and cap the time allowed with a fallback price~Train inside the request~Call a database for each feature~Score on the phone~Memory lookups and batching keep the model fast.`,
`Use the calculator.~What drives cost?~Peak requests per second times ads scored per request~Number of advertisers~Training days~Colours~Each request scores many ads, so total scoring load is what you size.`,
`A new model is trained.~How do you test it?~Offline log loss on a later day, then a small online experiment with strict spend and quality guardrails~Test on the same day~Launch to all~Test on training rows~Time-split offline tests prevent leakage. Small online tests limit financial risk.`,
`The model is live.~What do you monitor?~Calibration by segment, revenue, click-through trends, training data freshness, and sudden feature outages~Only accuracy~Only uptime~Nothing~A broken feature can silently ruin predictions, so monitor inputs as well as outputs.`]);
_D('driftmon',2,'Monitoring a language model app','40 min','Notice when a live language model starts giving worse answers, before users complain.',[0.01,5000,2,4,200,6,90],[
`A team runs a language model in production and wants to detect decline.~What do you clarify first?~What "worse" means for this app (wrong, unsafe, off-topic, slower) and who acts on an alert~Which model is the newest~Which dashboard colour~How many tokens to buy~You can only detect what you have defined. Each alert also needs an owner.`,
`You need signals.~Which do you combine?~Automatic checks (format, length, safety), a judge model or rules on sampled outputs, user feedback, and a small set of human reviews~Only latency~Only token count~Only complaints~No single signal is enough. A mix shows different failures.`,
`You need ground truth.~How do you get it?~Keep a fixed golden set of prompts with reviewed answers, plus a rolling sample of real traffic reviewed by people~Use the model's own opinion only~Skip ground truth~Use yesterday's answers~A golden set gives a stable yardstick. Sampled traffic shows the real distribution.`,
`You want to catch drift.~What do you compare?~Distributions of inputs, outputs and scores over time against a reference period, using simple statistics first~Only look at one chat~Compare file sizes~Count users~Comparing to a baseline shows change even when you lack labels.`,
`Monitoring must not slow the app.~How is it designed?~Log requests asynchronously, process them in batches, sample for expensive judge calls, and keep alerts separate from the user path~Run the judge in the user's request~Log nothing~Block users until checks pass~Heavy checks go off the critical path.`,
`Use the calculator.~What costs the most?~Judge-model calls and storage of logs, so sampling rate and retention are the main knobs~Disk colour~Phone memory~Number of dashboards~Judging every request is expensive. Sample smartly and decide how long to keep text.`,
`You change the prompt or model.~How do you check?~Run the golden set before and after, compare scores and a sample of outputs, then roll out slowly with a quick rollback~Change and hope~Ask the model~Compare cost only~A repeatable before-and-after test is the heart of safe change.`,
`The monitor is live.~How do you avoid alert fatigue?~Tune thresholds on past data, group related alerts, page people only for serious drops, and review weekly~Alert on every small change~Turn off alerts~Alert only monthly~Too many alerts are ignored. Thresholds and grouping keep trust in the alarm.`]);

  const upd=()=>{const [u,r,pk,kb,qs,ke,dy]=cur,avg=u*1e6*r/86400,peak=avg*pk,srv=Math.max(1,Math.ceil(peak/qs*1.5)),mbps=peak*kb*8/1000,tb=u*1e6*r*ke*dy/1e9;
    out.innerHTML='';[['average per second',nf(avg)],['busiest per second',nf(peak)],['servers with 50% spare',nf(srv)],['bandwidth (Mbps)',nf(mbps)],['data stored (TB)',nf(tb)]].forEach(([l,x])=>out.append(el('div',{class:'stat'},el('small',{},l),el('b',{},x))))};
  const wrap=el('div',{class:'popts'});
  rows.forEach(([l,val],j)=>{const lo=val/4,hi=val*4,step=Math.max(hi/200,j===2?.5:0)||1;const st=hi>=20?1:hi>=2?.1:Math.max(.001,hi/100);
    const s=slider(l,+lo.toFixed(4),+hi.toFixed(4),st,cur[j],x=>nf(x),x=>{cur[j]=x;d.calc=cur.slice();saveP();upd()});wrap.append(el('div',{class:'popt col'},s.node))});
  upd();return el('div',{},el('h4',{},'Back-of-the-envelope calculator'),el('p',{class:'pnote'},'Move the sliders. Real numbers will differ, but the habit is what counts: average, then busiest moment, then servers and storage.'),wrap,out)}

      if(!list.children.length)list.append(el('p',{style:'color:var(--muted)'},'No case matches that. Try another word.'))};

  const c=SDC.find(x=>x.id===id);if(!c){location.hash='#design';return}

  const box=el('section',{class:'pipe'}),chips=el('div',{class:'pchips',role:'tablist','aria-label':'Design steps'}),stage=el('div',{class:'pstage'}),prog=el('p',{class:'pprog'});
  box.append(el('p',{class:'kick'},'Do it step by step'),el('h2',{},'Design it in 8 steps'),el('p',{style:'color:var(--muted)'},'Each step unlocks when you get the one before. Think about your own answer first, then pick the best choice.'),chips,prog,stage);
  const un=i=>i===0||d.ok[i-1];
